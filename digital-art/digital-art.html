<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUMINOUS SANCTUARY - 光と情景のデジタルアート空間</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03050a;
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      color: #f8fafc;
      user-select: none;
    }
    input[type="text"] {
      user-select: text;
    }
    canvas#artCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas#artCanvas:active {
      cursor: grabbing;
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.45);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.7);
    }
    /* カスタムスライダー（つまみ専用ドラッグ操作） */
    .custom-slider-track {
      position: relative;
      height: 30px;
      display: flex;
      align-items: center;
      touch-action: pan-y;
    }
    .custom-slider-rail {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.16);
    }
    .custom-slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.8), rgba(56, 189, 248, 0.9));
      pointer-events: none;
    }
    .custom-slider-thumb {
      position: absolute;
      top: 50%;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background: #ffffff;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 2px 6px rgba(0, 0, 0, 0.65);
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .custom-slider-thumb.dragging {
      transform: translate(-50%, -50%) scale(1.22);
      background: #fef08a;
      border-color: #f59e0b;
      cursor: grabbing;
    }
    .glass-panel {
      background: rgba(10, 14, 26, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      transition: background-color 0.25s ease, max-height 0.3s ease, transform 0.3s ease;
    }
    .glass-panel.panel-translucent {
      background: rgba(10, 14, 26, 0.34);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    /* スリム表示（PC・スマホ共通で確実に高さを縮小） */
    #controlPanel.panel-slim {
      height: 27dvh !important;
      max-height: 27dvh !important;
      min-height: 155px;
    }
    /* パネル自由移動・リサイズ中のトランジション無効化 */
    #controlPanel.panel-interacting {
      transition: none !important;
      user-select: none;
    }
    /* パネル閉じ状態（カスタム位置でも確実に隠す） */
    #controlPanel.panel-closed {
      opacity: 0;
      pointer-events: none;
      transform: translateY(105%) !important;
    }
    @media (min-width: 768px) {
      #controlPanel.panel-closed {
        transform: translateX(120%) !important;
      }
    }
    /* パネルリサイズハンドル群（四辺・四隅） */
    .resize-handle {
      position: absolute;
      z-index: 30;
      touch-action: none;
    }
    .resize-n  { top: -4px; left: 14px; right: 14px; height: 10px; cursor: ns-resize; }
    .resize-s  { bottom: -4px; left: 14px; right: 14px; height: 10px; cursor: ns-resize; }
    .resize-w  { left: -4px; top: 14px; bottom: 14px; width: 10px; cursor: ew-resize; }
    .resize-e  { right: -4px; top: 14px; bottom: 14px; width: 10px; cursor: ew-resize; }
    .resize-nw { top: -5px; left: -5px; width: 18px; height: 18px; cursor: nwse-resize; }
    .resize-ne { top: -5px; right: -5px; width: 18px; height: 18px; cursor: nesw-resize; }
    .resize-sw { bottom: -5px; left: -5px; width: 18px; height: 18px; cursor: nesw-resize; }
    .resize-se { bottom: -5px; right: -5px; width: 22px; height: 22px; cursor: nwse-resize; }
    .glass-card {
      background: rgba(20, 27, 46, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.38);
      background: rgba(30, 41, 69, 0.8);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(139, 92, 246, 0.25);
    }
    .fade-transition {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

  <!-- メインアート描画用全画面Canvas -->
  <canvas id="artCanvas"></canvas>

  <!-- トースト通知（alert代替） -->
  <div id="toastMessage" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 glass-panel px-5 py-2.5 rounded-full text-xs sm:text-sm font-medium text-white shadow-lg flex items-center gap-2 max-w-[90vw]">
    <span class="w-2 h-2 rounded-full bg-amber-300 animate-ping shrink-0"></span>
    <span id="toastText" class="truncate">通知メッセージ</span>
  </div>

  <!-- 上部フローティングHUD（鑑賞中に表示） -->
  <header id="topHud" class="fixed top-0 left-0 right-0 z-30 p-3 sm:p-5 flex items-center justify-between gap-2 pointer-events-none fade-transition">
    <!-- 左側：メニューボタン＆現在の作品タイトル -->
    <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto min-w-0 flex-1">
      <button id="openMenuBtn" class="glass-panel hover:bg-white/15 active:scale-95 text-white px-3 py-2.5 sm:px-4 sm:py-2.5 rounded-2xl flex items-center gap-1.5 text-xs sm:text-sm font-medium transition shadow-lg shrink-0">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>作品一覧</span>
      </button>

      <div class="glass-panel px-3 py-2 sm:px-4 sm:py-2 rounded-2xl min-w-0 flex-1 max-w-md">
        <div class="flex items-center gap-2 min-w-0">
          <span id="hudCategoryBadge" class="hidden sm:inline-block shrink-0 text-[10px] px-2 py-0.5 rounded-full bg-white/15 text-amber-200 font-medium">デジタル空間</span>
          <h1 id="hudArtTitle" class="text-xs sm:text-sm font-semibold text-white truncate">1. 呼応するランプの森</h1>
        </div>
        <p id="hudArtHint" class="text-[10px] sm:text-xs text-slate-300 truncate mt-0.5">ドラッグ＆ドロップで好きな位置へ配置できます</p>
      </div>
    </div>

    <!-- 右側：各種クイックアクションボタン -->
    <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto shrink-0">
      <button id="screenshotBtn" title="現在の光景を静止画として保存" class="glass-panel hover:bg-white/15 active:scale-95 text-white p-2.5 rounded-2xl transition shadow-lg">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
      <button id="recordVideoBtn" title="光景を動画として録画・保存" class="glass-panel hover:bg-white/15 active:scale-95 text-white px-2.5 py-2.5 rounded-2xl transition shadow-lg flex items-center gap-1.5">
        <span id="recordDot" class="w-2.5 h-2.5 rounded-full bg-rose-400"></span>
        <span id="recordLabel" class="text-xs font-medium hidden sm:inline">録画</span>
      </button>
      <button id="hideUiBtn" title="UIを隠して純粋鑑賞" class="glass-panel hover:bg-white/15 active:scale-95 text-white p-2.5 rounded-2xl transition shadow-lg">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        </svg>
      </button>
      <button id="toggleControlsBtn" class="glass-panel hover:bg-white/15 active:scale-95 text-white px-3 py-2.5 sm:px-4 sm:py-2.5 rounded-2xl flex items-center gap-1.5 text-xs sm:text-sm font-medium transition shadow-lg">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
        </svg>
        <span>設定</span>
      </button>
    </div>
  </header>

  <!-- 純粋鑑賞モードからの復帰ボタン -->
  <button id="restoreUiBtn" class="fixed bottom-5 right-5 z-40 glass-panel px-4 py-2.5 rounded-full text-xs sm:text-sm text-white/95 hover:text-white flex items-center gap-2 shadow-xl opacity-0 pointer-events-none transition-opacity duration-300">
    <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
    </svg>
    <span>UIを表示</span>
  </button>

  <!-- パラメータ調整パネル（PC: 右サイド / スマホ: 下部ボトムシート＋自由移動・リサイズ・スリム表示対応） -->
  <aside id="controlPanel" class="panel-closed fixed z-30 bottom-0 left-0 right-0 md:top-20 md:bottom-5 md:left-auto md:right-5 md:w-[375px] glass-panel rounded-t-3xl md:rounded-3xl flex flex-col max-h-[66dvh] md:max-h-[calc(100dvh-6.5rem)]">
    <!-- リサイズ用ハンドル（四辺・四隅のドラッグで自由に大きさ変更） -->
    <div class="resize-handle resize-n" data-resize="n"></div>
    <div class="resize-handle resize-s" data-resize="s"></div>
    <div class="resize-handle resize-w" data-resize="w"></div>
    <div class="resize-handle resize-e" data-resize="e"></div>
    <div class="resize-handle resize-nw" data-resize="nw"></div>
    <div class="resize-handle resize-ne" data-resize="ne"></div>
    <div class="resize-handle resize-sw" data-resize="sw"></div>
    <div class="resize-handle resize-se flex items-end justify-end p-1" data-resize="se" title="ドラッグでサイズ変更">
      <svg class="w-3.5 h-3.5 text-white/45 pointer-events-none" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M5 14L14 5M9.5 14L14 9.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- パネルヘッダー（ここをドラッグしてパネル位置を移動可能） -->
    <div id="panelDragHeader" class="px-4 sm:px-5 pt-2.5 pb-2.5 border-b border-white/10 shrink-0 cursor-move select-none" style="touch-action: none;">
      <div class="w-10 h-1 rounded-full bg-white/25 mx-auto mb-2 pointer-events-none"></div>
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-amber-300 to-cyan-300 shrink-0"></span>
          <h2 class="text-xs sm:text-sm font-semibold tracking-wide text-white truncate">光のチューニング</h2>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button id="slimModeBtn" title="高さを小さくして画面を見ながら調整" class="px-2 py-1 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-[10px] sm:text-[11px] font-medium text-amber-200 transition">
            ⇕ スリム
          </button>
          <button id="translucentBtn" title="パネルを半透明にして背景を見やすくする" class="px-2 py-1 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-[10px] sm:text-[11px] font-medium text-cyan-200 transition">
            ◐ 透過
          </button>
          <button id="resetPanelLayoutBtn" title="設定欄の位置と大きさを初期状態に戻す" class="px-2 py-1 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-[10px] sm:text-[11px] font-medium text-slate-200 transition">
            ↺ 窓戻す
          </button>
          <button id="closeControlsBtn" class="p-1.5 rounded-xl hover:bg-white/10 text-slate-300 hover:text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      <p class="text-[10px] text-slate-300/80 mt-1">※ ヘッダーで移動・端ドラッグでサイズ変更／丸つまみで値調整</p>
    </div>

    <!-- スクロール領域（右端に指で安全にスクロールできる余白グリップ帯を確保） -->
    <div id="controlScrollArea" class="flex-1 overflow-y-auto pl-4 sm:pl-5 pr-8 md:pr-5 py-3.5 pb-[calc(1.75rem+env(safe-area-inset-bottom))] space-y-3 relative" style="touch-action: pan-y;">
      <!-- 右端スクロールガイドライン -->
      <div class="md:hidden pointer-events-none fixed right-1.5 top-1/2 -translate-y-1/2 w-1.5 h-14 rounded-full bg-white/20"></div>

      <!-- カテゴリ1：作品固有のメインパーツ別パラメータ（折りたたみ対応） -->
      <div class="bg-white/[0.04] border border-amber-300/25 rounded-2xl overflow-hidden">
        <button type="button" data-acc-target="accPartsBody" class="acc-header w-full px-3.5 py-2.5 flex items-center justify-between gap-2 text-left hover:bg-white/[0.04] transition">
          <span class="text-xs font-semibold text-amber-200 flex items-center gap-1.5 min-w-0">
            <span>🎛️</span>
            <span id="partSectionTitle" class="truncate">パーツ別サイズ・強さ調整</span>
          </span>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="text-[10px] text-slate-400">0〜500%</span>
            <span class="acc-chevron text-slate-300 text-xs transition-transform">▼</span>
          </div>
        </button>
        <div id="accPartsBody" class="px-3.5 pb-3.5 pt-1 space-y-3 text-xs border-t border-white/5">
          <div id="partControlsContainer" class="space-y-3"></div>
        </div>
      </div>

      <!-- カテゴリ2：カラー・色相バランス（折りたたみ対応） -->
      <div class="bg-white/[0.04] border border-pink-300/20 rounded-2xl overflow-hidden">
        <button type="button" data-acc-target="accColorBody" class="acc-header w-full px-3.5 py-2.5 flex items-center justify-between gap-2 text-left hover:bg-white/[0.04] transition">
          <span class="text-xs font-semibold text-pink-200 flex items-center gap-1.5">
            <span>🎨</span>
            <span>カラー・色相バランス</span>
          </span>
          <span class="acc-chevron text-slate-300 text-xs transition-transform">▼</span>
        </button>
        <div id="accColorBody" class="px-3.5 pb-3.5 pt-2 space-y-3 text-xs border-t border-white/5">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1.5">カラーパレット・雰囲気</label>
            <div id="paletteSelector" class="grid grid-cols-3 gap-1.5">
              <button data-palette="original" class="palette-btn active px-2 py-2 rounded-xl text-xs font-medium bg-white/20 border border-white/40 text-white transition">オリジナル</button>
              <button data-palette="golden" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-amber-200 hover:bg-white/15 transition">ゴールデン</button>
              <button data-palette="aurora" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-emerald-200 hover:bg-white/15 transition">オーロラ</button>
              <button data-palette="sakura" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-pink-200 hover:bg-white/15 transition">サクラ幻想</button>
              <button data-palette="deepblue" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-cyan-200 hover:bg-white/15 transition">ディープ海</button>
              <button data-palette="prism" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-purple-200 hover:bg-white/15 transition">プリズム虹</button>
            </div>
          </div>
          <div id="colorSlidersContainer" class="space-y-3"></div>
        </div>
      </div>

      <!-- カテゴリ3：光・空間・動きの全体調整（折りたたみ対応） -->
      <div class="bg-white/[0.04] border border-sky-300/20 rounded-2xl overflow-hidden">
        <button type="button" data-acc-target="accGlobalBody" class="acc-header w-full px-3.5 py-2.5 flex items-center justify-between gap-2 text-left hover:bg-white/[0.04] transition">
          <span class="text-xs font-semibold text-sky-200 flex items-center gap-1.5">
            <span>✨</span>
            <span>光・空間・動きの全体調整</span>
          </span>
          <span class="acc-chevron text-slate-300 text-xs transition-transform">▼</span>
        </button>
        <div id="accGlobalBody" class="px-3.5 pb-3.5 pt-2 space-y-3 text-xs border-t border-white/5">
          <div id="globalSlidersContainer" class="space-y-3"></div>
        </div>
      </div>

      <!-- カテゴリ4：操作履歴・パーツ位置・一括操作（折りたたみ対応） -->
      <div class="bg-white/[0.04] border border-cyan-300/25 rounded-2xl overflow-hidden">
        <button type="button" data-acc-target="accActionBody" class="acc-header w-full px-3.5 py-2.5 flex items-center justify-between gap-2 text-left hover:bg-white/[0.04] transition">
          <span class="text-xs font-semibold text-cyan-200 flex items-center gap-1.5">
            <span>🧭</span>
            <span>履歴・パーツ位置・一括操作</span>
          </span>
          <span class="acc-chevron text-slate-300 text-xs transition-transform">▼</span>
        </button>
        <div id="accActionBody" class="px-3.5 pb-3.5 pt-2 space-y-2.5 text-xs border-t border-white/5">
          <p class="text-[11px] text-cyan-100/85 leading-snug">🖐️ 画面上の光・太陽・中心核・雲などはドラッグ＆ドロップで好きな位置へ配置・固定できます</p>
          <div class="grid grid-cols-3 gap-1.5">
            <button id="undoBtn" disabled class="py-2 px-1.5 rounded-xl bg-white/10 hover:bg-white/20 disabled:opacity-35 disabled:pointer-events-none border border-white/15 text-[11px] font-medium text-white transition active:scale-95">
              ↩ 1個前に戻す
            </button>
            <button id="redoBtn" disabled class="py-2 px-1.5 rounded-xl bg-white/10 hover:bg-white/20 disabled:opacity-35 disabled:pointer-events-none border border-white/15 text-[11px] font-medium text-white transition active:scale-95">
              ↪ 1個先に進める
            </button>
            <button id="resetPositionsBtn" class="py-2 px-1.5 rounded-xl bg-cyan-400/20 hover:bg-cyan-400/30 border border-cyan-300/30 text-[11px] font-medium text-cyan-100 transition active:scale-95">
              📍 パーツ位置戻す
            </button>
          </div>
          <div class="grid grid-cols-3 gap-1.5">

    function getArtColor(defaultHue, sat = 85, light = 60, alpha = 1, seed = 0) {
      if (alpha <= 0.001) return 'rgba(0,0,0,0)';
      let h = defaultHue;
      let s = sat;
      let l = light;
      const pal = PALETTES[state.params.palette];
      if (pal) {
        if (state.params.palette === 'prism') {
          h = (state.time * 40 + seed * 137.5) % 360;
        } else {
          const offset = Math.sin(seed * 12.9898) * 0.5 + 0.5;
          h = pal.baseHue + (offset - 0.5) * pal.spread;
        }
        s = (s + pal.sat) * 0.5;
        l = (l + pal.light) * 0.5;
      }
      h = (h + state.params.hueShift + 360) % 360;
      return `hsla(${h.toFixed(1)}, ${s.toFixed(0)}%, ${l.toFixed(0)}%, ${Math.min(1, Math.max(0, alpha)).toFixed(3)})`;
    }

    function cloneCurrentSnapshot() {
      const art = ARTWORKS[state.currentArtIndex];
      const itemPositions = (sim.items || []).map(it => ({
        x: it.x, y: it.y, baseX: it.baseX, baseY: it.baseY,
        pinnedX: it.pinnedX, pinnedY: it.pinnedY
      }));
      return {
        artId: art.id,
        params: JSON.parse(JSON.stringify(state.params)),
        itemPositions,
        extraPos: sim.extra ? {
          sunX: sim.extra.sunX, sunY: sim.extra.sunY,
          originX: sim.extra.originX, originY: sim.extra.originY,
          coreX: sim.extra.coreX, coreY: sim.extra.coreY
        } : {}
      };
    }

    function pushHistory() {
      const snap = cloneCurrentSnapshot();
      const hist = state.history;
      if (hist.index < hist.stack.length - 1) {
        hist.stack = hist.stack.slice(0, hist.index + 1);
      }
      hist.stack.push(snap);
      if (hist.stack.length > 40) hist.stack.shift();
      hist.index = hist.stack.length - 1;
      updateHistoryButtons();
    }

    function applySnapshot(snap) {
      if (!snap) return;
      const prevDensity = state.params.density;
      state.params = JSON.parse(JSON.stringify(snap.params));
      if (prevDensity !== state.params.density) {
        initCurrentArtwork();
      }
      if (snap.itemPositions && sim.items) {
        snap.itemPositions.forEach((pos, idx) => {
          if (sim.items[idx]) {
            if (pos.x !== undefined) sim.items[idx].x = pos.x;
            if (pos.y !== undefined) sim.items[idx].y = pos.y;
            if (pos.baseX !== undefined) sim.items[idx].baseX = pos.baseX;
            if (pos.baseY !== undefined) sim.items[idx].baseY = pos.baseY;
            sim.items[idx].pinnedX = pos.pinnedX;
            sim.items[idx].pinnedY = pos.pinnedY;
          }
        });
      }
      if (snap.extraPos && sim.extra) {
        if (snap.extraPos.sunX !== undefined) sim.extra.sunX = snap.extraPos.sunX;
        if (snap.extraPos.sunY !== undefined) sim.extra.sunY = snap.extraPos.sunY;
        if (snap.extraPos.originX !== undefined) sim.extra.originX = snap.extraPos.originX;
        if (snap.extraPos.originY !== undefined) sim.extra.originY = snap.extraPos.originY;
        if (snap.extraPos.coreX !== undefined) sim.extra.coreX = snap.extraPos.coreX;
        if (snap.extraPos.coreY !== undefined) sim.extra.coreY = snap.extraPos.coreY;
      }
      buildControlSliders();
      updateHistoryButtons();
    }

    // ============================================================================

    // ============================================================================
    function createGuardedSliderRow({ id, label, min, max, step, value, unit, onChange, onCommit }) {
      const wrapper = document.createElement('div');
      wrapper.className = 'bg-black/25 border border-white/10 rounded-xl px-2.5 py-2';

      const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));

      wrapper.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-1">
          <span class="text-slate-200 font-medium text-[11px] sm:text-xs truncate">${label}</span>
          <span id="${id}_val" class="font-mono text-amber-200 font-semibold text-xs shrink-0">${value}${unit}</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" class="step-minus w-7 h-7 rounded-lg bg-white/10 hover:bg-white/20 active:scale-90 text-white font-bold text-sm flex items-center justify-center shrink-0">−</button>
          <div class="custom-slider-track flex-1">
            <div class="custom-slider-rail">
              <div class="custom-slider-fill" style="width: ${pct}%"></div>
              <div class="custom-slider-thumb" style="left: ${pct}%" role="slider" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${value}"></div>
            </div>
          </div>
          <button type="button" class="step-plus w-7 h-7 rounded-lg bg-white/10 hover:bg-white/20 active:scale-90 text-white font-bold text-sm flex items-center justify-center shrink-0">＋</button>
        </div>
      `;

      const rail = wrapper.querySelector('.custom-slider-rail');
      const fill = wrapper.querySelector('.custom-slider-fill');
      const thumb = wrapper.querySelector('.custom-slider-thumb');
      const valSpan = wrapper.querySelector(`#${id}_val`);
      let currentVal = value;

      function setVisualValue(newVal, triggerChange = true) {
        const clamped = Math.max(min, Math.min(max, Math.round(newVal / step) * step));
        currentVal = clamped;
        const p = ((clamped - min) / (max - min)) * 100;
        fill.style.width = `${p}%`;
        thumb.style.left = `${p}%`;
        thumb.setAttribute('aria-valuenow', clamped);
        valSpan.textContent = `${clamped}${unit}`;
        if (triggerChange && onChange) onChange(clamped);
      }

      let isDraggingThumb = false;
      function updateFromClientX(clientX) {
        const rect = rail.getBoundingClientRect();
        if (rect.width <= 0) return;
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const raw = min + ratio * (max - min);
        setVisualValue(raw, true);
      }

      thumb.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isDraggingThumb = true;
        thumb.classList.add('dragging');
        thumb.setPointerCapture(e.pointerId);
      });

      thumb.addEventListener('pointermove', (e) => {
        if (!isDraggingThumb) return;
        e.stopPropagation();
        updateFromClientX(e.clientX);
      });

      const endDrag = (e) => {
        if (!isDraggingThumb) return;
        isDraggingThumb = false;
        thumb.classList.remove('dragging');
        if (thumb.hasPointerCapture(e.pointerId)) {
          thumb.releasePointerCapture(e.pointerId);
        }
        if (onCommit) onCommit(currentVal);
      };
      thumb.addEventListener('pointerup', endDrag);
      thumb.addEventListener('pointercancel', endDrag);

      wrapper.querySelector('.step-minus').addEventListener('click', () => {
        setVisualValue(currentVal - step, true);
        if (onCommit) onCommit(currentVal);
      });
      wrapper.querySelector('.step-plus').addEventListener('click', () => {
        setVisualValue(currentVal + step, true);
        if (onCommit) onCommit(currentVal);
      });

      return wrapper;
    }

    // ============================================================================
    // フラクタルノイズ（fBm）による煙・水蒸気風のリアルな雲テクスチャ生成（#11, #12用）
    // ============================================================================
    const cloudSpriteCache = {
      bluesky: null,
      sunsetKey: '',
      sunset: null
    };

    function hash2D(ix, iy, seed) {
      let n = Math.sin(ix * 127.1 + iy * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, y, seed) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2D(ix, iy, seed);
      const b = hash2D(ix + 1, iy, seed);
      const c = hash2D(ix, iy + 1, seed);
      const d = hash2D(ix + 1, iy + 1, seed);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, seed, octaves = 5) {
      let val = 0;
      let amp = 0.52;
      let freq = 1.0;
      for (let o = 0; o < octaves; o++) {
        val += amp * valueNoise2D(x * freq, y * freq, seed + o * 19.3);
        freq *= 2.04;
        amp *= 0.5;
      }
      return val;
    }

    function hslToRgb(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s /= 100;
      l /= 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (h < 60)      { r = c; g = x; b = 0; }
      else if (h < 120){ r = x; g = c; b = 0; }
      else if (h < 180){ r = 0; g = c; b = x; }
      else if (h < 240){ r = 0; g = x; b = c; }
      else if (h < 300){ r = x; g = 0; b = c; }
      else             { r = c; g = 0; b = x; }
      return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }

    function getMappedHsl(defaultHue, sat, light, seed = 0) {
      let h = defaultHue;
      let s = sat;
      let l = light;
      const pal = PALETTES[state.params.palette];
      if (pal) {
        if (state.params.palette === 'prism') {
          h = (seed * 137.5) % 360;
        } else {
          const offset = Math.sin(seed * 12.9898) * 0.5 + 0.5;
          h = pal.baseHue + (offset - 0.5) * pal.spread;
        }
        s = (s + pal.sat) * 0.5;
        l = (l + pal.light) * 0.5;
      }
      h = (h + state.params.hueShift + 360) % 360;
      return [h, s, l];
    }

    function generateSmokyCloudSprite(mode, seed) {
      const cw = mode === 'sunset' ? 168 : 156;
      const ch = mode === 'sunset' ? 76 : 92;
      const off = document.createElement('canvas');
      off.width = cw;
      off.height = ch;
      const octx = off.getContext('2d');
      const img = octx.createImageData(cw, ch);
      const data = img.data;

      // 夕焼け雲の色味をパレット・色相シフトに連動
      const [hHi, sHi, lHi] = getMappedHsl(36, 98, 72, seed);
      const [hMid, sMid, lMid] = getMappedHsl(12, 92, 54, seed + 1);
      const [hTop, sTop, lTop] = getMappedHsl(288, 52, 26, seed + 2);
      const rgbHi = hslToRgb(hHi, sHi, lHi);
      const rgbMid = hslToRgb(hMid, sMid, lMid);
      const rgbTop = hslToRgb(hTop, sTop, lTop);

      for (let py = 0; py < ch; py++) {
        const ny = (py / (ch - 1)) * 2 - 1; // -1(上)〜+1(下)
        for (let px = 0; px < cw; px++) {
          const nx = (px / (cw - 1)) * 2 - 1; // -1〜+1

          // ドメインワーピング（煙・水蒸気のような有機的なうねりとちぎれ）
          const wx = fbm2D(nx * 1.9 + 4.2, ny * 2.1 + 1.3, seed + 3.1, 3) - 0.5;
          const wy = fbm2D(nx * 2.0 + 9.7, ny * 2.2 + 5.4, seed + 7.7, 3) - 0.5;

          const baseScaleX = mode === 'sunset' ? 2.6 : 2.3;
          const baseScaleY = mode === 'sunset' ? 3.8 : 2.6;
          const n = fbm2D((nx + wx * 0.55) * baseScaleX + 5, (ny + wy * 0.48) * baseScaleY + 5, seed, 5);

          // 雲らしい下底フラット＋上部もくもく／夕焼け雲は横長たなびき形状
          let shapeMask;
          if (mode === 'bluesky') {
            const bottomFlat = ny > 0.25 ? (ny - 0.25) * 1.55 : 0;
            const arch = Math.sqrt(nx * nx * 1.05 + Math.pow(ny + 0.08, 2) * 1.35) + bottomFlat;
            shapeMask = Math.max(0, 1 - arch);
          } else {
            const ridge = Math.sqrt(nx * nx * 0.92 + Math.pow(ny, 2) * 1.48);
            shapeMask = Math.max(0, 1 - ridge);
          }

          // 煙状の密度計算（縁がふわっとちぎれて溶け込む）
          const densityVal = shapeMask * 1.18 + (n - 0.44) * 0.85;
          if (densityVal <= 0.16) continue;

          const alphaNorm = Math.min(1, Math.pow((densityVal - 0.16) / 0.72, 1.25));
          const edgeFade = Math.min(1, shapeMask * 2.6);
          const a = alphaNorm * edgeFade;
          if (a <= 0.005) continue;

          const idx = (py * cw + px) * 4;
          if (mode === 'bluesky') {
            // 上部は純白の太陽光、下部は柔らかい空色の立体陰影
            const lightFactor = Math.max(0, Math.min(1, 0.72 - ny * 0.42 + (n - 0.5) * 0.45));
            data[idx]     = Math.round(196 + 59 * lightFactor);
            data[idx + 1] = Math.round(214 + 41 * lightFactor);
            data[idx + 2] = Math.round(236 + 19 * lightFactor);
            data[idx + 3] = Math.round(a * 238);
          } else {
            // 下縁（夕日に照らされる縁）が黄金〜茜、上部が深い夕闇の紫紅
            const rimGlow = Math.max(0, Math.min(1, (ny + 0.65) * 0.72 + (n - 0.45) * 0.55));
            let r, g, b;
            if (rimGlow > 0.55) {
              const t = (rimGlow - 0.55) / 0.45;
              r = rgbMid[0] + (rgbHi[0] - rgbMid[0]) * t;
              g = rgbMid[1] + (rgbHi[1] - rgbMid[1]) * t;
              b = rgbMid[2] + (rgbHi[2] - rgbMid[2]) * t;
            } else {
              const t = rimGlow / 0.55;
              r = rgbTop[0] + (rgbMid[0] - rgbTop[0]) * t;
              g = rgbTop[1] + (rgbMid[1] - rgbTop[1]) * t;
              b = rgbTop[2] + (rgbMid[2] - rgbTop[2]) * t;
            }
            data[idx]     = Math.round(r);
            data[idx + 1] = Math.round(g);
            data[idx + 2] = Math.round(b);
            data[idx + 3] = Math.round(a * 225);
          }
        }
      }
      octx.putImageData(img, 0, 0);
      return off;
    }

    function getCloudSprites(mode) {
      if (mode === 'bluesky') {
        if (!cloudSpriteCache.bluesky) {
          cloudSpriteCache.bluesky = Array.from({ length: 6 }, (_, i) =>
            generateSmokyCloudSprite('bluesky', 11.3 + i * 27.9)
          );
        }
        return cloudSpriteCache.bluesky;
      } else {
        const key = `${state.params.palette}_${Math.round(state.params.hueShift / 8)}`;
        if (!cloudSpriteCache.sunset || cloudSpriteCache.sunsetKey !== key) {
          cloudSpriteCache.sunsetKey = key;
          cloudSpriteCache.sunset = Array.from({ length: 6 }, (_, i) =>
            generateSmokyCloudSprite('sunset', 43.7 + i * 31.1)
          );
        }
        return cloudSpriteCache.sunset;
      }
    }

          for (let i = 0; i < rayCount; i++) {
            sim.items.push({
              angle: (i / rayCount) * Math.PI * 2,
              width: 0.02 + Math.random() * 0.04,
              speed: (Math.random() - 0.5) * 0.15,
              phase: Math.random() * Math.PI * 2,
              hue: [44, 198, 330, 52][i % 4]
            });
          }
          for (let i = 0; i < Math.min(600, Math.floor(160 * d)); i++) {
            sim.particles.push({
              angle: Math.random() * Math.PI * 2,
              dist: Math.random() * Math.max(w, h) * 0.7,
              speed: 60 + Math.random() * 140,
              size: 1.5 + Math.random() * 3,
              hue: 42 + Math.random() * 30
            });
          }
          break;
        }
        case 'blackhole': {
          sim.extra.coreX = w * 0.5;
          sim.extra.coreY = h * 0.5;
          const count = Math.min(1100, Math.floor(320 * d));
          for (let i = 0; i < count; i++) {
            const orbit = 1.15 + Math.pow(Math.random(), 1.3) * 2.4;
            sim.particles.push({
              orbit,
              angle: Math.random() * Math.PI * 2,
              speed: (1.8 / Math.pow(orbit, 1.3)) * (0.8 + Math.random() * 0.4),
              size: 1.2 + Math.random() * 2.6,
              isHalo: i % 4 === 0,
              hue: 22 + (3.5 - orbit) * 14
            });
          }
          break;
        }
        case 'chandelier': {
          const rings = 4;
          for (let ring = 1; ring <= rings; ring++) {
            const count = Math.max(4, Math.floor(ring * 10 * Math.min(2.5, d)));
            for (let i = 0; i < count; i++) {
              sim.items.push({
                ring,
                angle: (i / count) * Math.PI * 2,
                size: 6 + ring * 2.5,
                sparkle: Math.random() * Math.PI * 2,
                hue: (i * 36) % 360
              });
            }
          }
          break;
        }
      }
    }

    // 十字線長さ（crossLength）と光のサイズ（size）を分離したスターバースト描画
    function drawStarburst(x, y, coreRadius, color, alpha = 0.85) {
      const { size, crossLength } = state.params;
      if (alpha <= 0.002) return;
      const r = coreRadius * size;
      const crossR = coreRadius * crossLength * 1.75;
      if (r <= 0.05 && crossR <= 0.05) return;

      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = Math.min(1, alpha);

      if (r > 0.05) {
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.28, color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (crossR > 0.1) {
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(0.8, Math.min(4, coreRadius * 0.07 * Math.max(0.3, size)));
        ctx.beginPath();
        ctx.moveTo(-crossR, 0);
        ctx.lineTo(crossR, 0);
        ctx.moveTo(0, -crossR);
        ctx.lineTo(0, crossR);
        ctx.stroke();
      }
      ctx.restore();
    }

    // リアルなソメイヨシノ花びら描画（自然な一枚形状＋先端の切り込み）
    function drawSakuraPetal(x, y, sz, rot, tilt, color) {
      if (sz <= 0.1) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.transform(1, tilt * 0.25, -tilt * 0.2, 1, 0, 0);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, sz * 0.95);
      ctx.bezierCurveTo(-sz * 0.72, sz * 0.45, -sz * 0.85, -sz * 0.55, -sz * 0.22, -sz * 0.95);
      ctx.lineTo(0, -sz * 0.68);
      ctx.lineTo(sz * 0.22, -sz * 0.95);
      ctx.bezierCurveTo(sz * 0.85, -sz * 0.55, sz * 0.72, sz * 0.45, 0, sz * 0.95);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // リアルな7裂カエデ（紅葉）描画
    function drawMapleLeaf(x, y, sz, rot, color) {
      if (sz <= 0.1) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.fillStyle = color;
      ctx.beginPath();
      const lobes = [
        { ang: -Math.PI * 0.5, len: 1.0, wid: 0.22 },
        { ang: -Math.PI * 0.24, len: 0.86, wid: 0.20 },
        { ang: -Math.PI * 0.76, len: 0.86, wid: 0.20 },
        { ang: Math.PI * 0.04, len: 0.62, wid: 0.17 },
        { ang: Math.PI * 0.96, len: 0.62, wid: 0.17 }
      ];
      ctx.moveTo(0, sz * 0.22);
      const sorted = [...lobes].sort((a, b) => a.ang - b.ang);
      sorted.forEach((lb) => {
        const tipX = Math.cos(lb.ang) * sz * lb.len;
        const tipY = Math.sin(lb.ang) * sz * lb.len;
        const leftX = Math.cos(lb.ang - lb.wid) * sz * (lb.len * 0.48);
        const leftY = Math.sin(lb.ang - lb.wid) * sz * (lb.len * 0.48);
        const rightX = Math.cos(lb.ang + lb.wid) * sz * (lb.len * 0.48);
        const rightY = Math.sin(lb.ang + lb.wid) * sz * (lb.len * 0.48);
        ctx.lineTo(leftX, leftY);
        ctx.lineTo(tipX, tipY);
        ctx.lineTo(rightX, rightY);
      });
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.8, sz * 0.06);
      ctx.beginPath();
      ctx.moveTo(0, sz * 0.18);
      ctx.lineTo(0, sz * 0.65);
      ctx.stroke();
      ctx.restore();
    }

    // ============================================================================
    // メイン描画ループ（全24作品）
    // ============================================================================
    function renderFrame(dt) {
      const art = ARTWORKS[state.currentArtIndex];
      const w = state.width;
      const h = state.height;
      const { density, glow, speed, size, scale, reactivity, parts, sceneOffset } = state.params;
      const p1 = parts.p1 ?? 1.0;
      const p2 = parts.p2 ?? 1.0;
      const p3 = parts.p3 ?? 1.0;
      const ptr = state.pointer;

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      if (art.id === 'fireworks' || art.id === 'fairydust') {
        ctx.fillStyle = 'rgba(3, 5, 12, 0.24)';
      } else if (art.id === 'bioluminescence' || art.id === 'nebula') {
        ctx.fillStyle = 'rgba(2, 6, 16, 0.28)';
      } else {
        ctx.fillStyle = '#03050c';
      }
      ctx.fillRect(0, 0, w, h);

      if (scale <= 0.001 || density <= 0.001) {
        ctx.restore();
        ptr.justClicked = false;
        return;
      }

      ctx.translate(w * 0.5 + sceneOffset.x, h * 0.5 + sceneOffset.y);
      ctx.scale(scale, scale);
      ctx.translate(-w * 0.5, -h * 0.5);

      ctx.globalCompositeOperation = 'lighter';

      switch (art.id) {
        // ------------------------------------------------------------------------
        // #1: 呼応するランプの森
        // ------------------------------------------------------------------------
        case 'lamps': {
          const items = sim.items;
          for (let i = 0; i < items.length; i++) {
            const lamp = items[i];
            if (ptr.dragTarget?.item !== lamp) {
              lamp.y = lamp.baseY + Math.sin(state.time * 1.2 + lamp.phase) * 14;
            }
            if (lamp.cooldown > 0) lamp.cooldown -= dt;

            if (ptr.active && !ptr.isDown && reactivity > 0) {
              const local = toSceneCoords(ptr.x, ptr.y);
              const dist = Math.hypot(local.x - lamp.x, local.y - lamp.y);
              if (dist < 100 * reactivity && lamp.cooldown <= 0) {
                lamp.energy = 1.0;
                lamp.hue = (lamp.hue + 55) % 360;
                lamp.cooldown = 0.8;
                sim.ripples.push({ x: lamp.x, y: lamp.y, r: lamp.radius, maxR: 260, hue: lamp.hue, alpha: 0.9 });
              }
            }
            lamp.energy = Math.max(0.22, lamp.energy - dt * 0.45);

            const r = lamp.radius * size * p1 * (0.9 + lamp.energy * 0.45);
            if (r > 0.1) {
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(lamp.x, -h);
              ctx.lineTo(lamp.x, lamp.y - r);
              ctx.stroke();
            }

            const haloR = r * 3.2 * glow * p2;
            if (haloR > 0.5) {
              const grad = ctx.createRadialGradient(lamp.x, lamp.y, r * 0.1, lamp.x, lamp.y, haloR);
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(0.25, getArtColor(lamp.hue, 90, 62, 0.85 * lamp.energy, i));
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(lamp.x, lamp.y, haloR, 0, Math.PI * 2);
              ctx.fill();
            }

            if (r > 0.2) {
              ctx.fillStyle = getArtColor(lamp.hue, 85, 75, 0.95, i);
              ctx.beginPath();
              ctx.ellipse(lamp.x, lamp.y, r * 0.78, r * 1.15, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const rp = sim.ripples[i];
            rp.r += 240 * dt * speed;
            rp.alpha -= dt * 0.7;
            for (const lamp of items) {
              const d = Math.hypot(lamp.x - rp.x, lamp.y - rp.y);
              if (Math.abs(d - rp.r) < 18 && lamp.cooldown <= 0) {
                lamp.energy = 1.0;
                lamp.hue = (rp.hue + 25) % 360;
                lamp.cooldown = 1.1;
              }
            }
            if (rp.alpha <= 0) {
              sim.ripples.splice(i, 1);
            } else if (p3 > 0.01) {
              ctx.strokeStyle = getArtColor(rp.hue, 90, 65, rp.alpha * 0.45, i);
              ctx.lineWidth = 2.5 * p3;
              ctx.beginPath();
              ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #2: 境界のない結晶世界
        // ------------------------------------------------------------------------
        case 'crystal': {
          sim.extra.rotY += 0.35 * dt * speed;
          sim.extra.rotX = 0.25 + Math.sin(state.time * 0.4) * 0.15;
          const cosY = Math.cos(sim.extra.rotY);
          const sinY = Math.sin(sim.extra.rotY);
          const cosX = Math.cos(sim.extra.rotX);
          const sinX = Math.sin(sim.extra.rotX);
          const fov = 480 * Math.max(0.2, p3);

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const px3 = p.x * p3;
            const py3 = p.y * p3;
            const pz3 = p.z * p3;
            const x1 = px3 * cosY - pz3 * sinY;
            const z1 = pz3 * cosY + px3 * sinY;
            const y1 = py3 * cosX - z1 * sinX;
            const z2 = z1 * cosX + py3 * sinX + 550;

            if (z2 < 40) continue;
            const sc = fov / z2;
            const sx = w * 0.5 + x1 * sc;
            const sy = h * 0.5 + y1 * sc;

            const pulse = 0.5 + 0.5 * Math.sin(state.time * 3 + p.phase);
            const r = (2.5 + pulse * 4) * sc * size * p1;
            const lineH = 55 * sc * glow * p2;

            if (lineH > 0.5) {
              const grad = ctx.createLinearGradient(sx, sy - lineH, sx, sy + lineH);
              grad.addColorStop(0, 'transparent');
              grad.addColorStop(0.5, getArtColor(p.hue + state.time * 25, 90, 68, 0.55 * pulse, i));
              grad.addColorStop(1, 'transparent');
              ctx.strokeStyle = grad;
              ctx.lineWidth = Math.max(1, r * 0.7);
              ctx.beginPath();
              ctx.moveTo(sx, sy - lineH);
              ctx.lineTo(sx, sy + lineH);
              ctx.stroke();
            }

            if (r > 0.1) {
              ctx.fillStyle = getArtColor(p.hue + state.time * 25, 80, 82, 0.9, i);
              ctx.beginPath();
              ctx.arc(sx, sy, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #3: 花と人のデジタル滝
        // ------------------------------------------------------------------------
        case 'waterfall': {
          const localPtr = toSceneCoords(ptr.x, ptr.y);
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.y += p.vy * speed * 1.4;
            p.x += p.vx;
            p.vx *= 0.92;

            if (ptr.active && reactivity > 0) {
              const dx = p.x - localPtr.x;
              const dy = p.y - localPtr.y;
              const dist = Math.hypot(dx, dy);
              const blockR = 65 * reactivity;
              if (dist < blockR && dist > 0.1) {
                p.vx += (dx / dist) * 2.2;
                if (Math.random() < 0.04 && p2 > 0.01) {
                  sim.items.push({
                    x: p.x, y: p.y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -1 - Math.random() * 2,
                    r: 4 + Math.random() * 6,
                    life: 1.0,
                    hue: 320 + Math.random() * 60
                  });
                }
              }
            }

            if (p.y > h + 20) {
              p.y = -20;
              p.x = Math.random() * w;
              p.vx = 0;
            }

            if (p1 > 0.01 && p3 > 0.01) {
              ctx.strokeStyle = getArtColor(p.hue, 85, 65, 0.45 * glow, i);
              ctx.lineWidth = 2 * size * p1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p.x - p.vx * 1.5, p.y - p.len * size * p3);
              ctx.stroke();
            }
          }

          for (let i = sim.items.length - 1; i >= 0; i--) {
            const fl = sim.items[i];
            fl.x += fl.vx * speed;
            fl.y += fl.vy * speed;
            fl.vy += 0.04;
            fl.life -= dt * 0.55;
            if (fl.life <= 0) {
              sim.items.splice(i, 1);
            } else if (p2 > 0.01) {
              drawStarburst(fl.x, fl.y, fl.r * p2 * 1.6, getArtColor(fl.hue, 90, 70, fl.life, i), fl.life);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #4: 浮遊する光の球体群
        // ------------------------------------------------------------------------
        case 'spheres': {
          const items = sim.items;
          for (let i = 0; i < items.length; i++) {
            const s = items[i];
            const rad = s.r * size * p1;
            if (ptr.dragTarget?.item !== s) {
              s.x += s.vx * speed * p3;
              s.y += s.vy * speed * p3;
              if (s.x < rad) { s.x = rad; s.vx *= -1; }
              if (s.x > w - rad) { s.x = w - rad; s.vx *= -1; }
              if (s.y < rad) { s.y = rad; s.vy *= -1; }
              if (s.y > h - rad) { s.y = h - rad; s.vy *= -1; }
            }
            s.pulse = Math.max(0, s.pulse - dt * 1.5);

            const drawR = rad * (1 + s.pulse * 0.25);
            const outerR = drawR * (1.3 * glow * Math.max(0.2, p2));
            if (outerR > 0.5) {
              const grad = ctx.createRadialGradient(s.x - drawR * 0.3, s.y - drawR * 0.3, drawR * 0.05, s.x, s.y, outerR);
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(0.35, getArtColor(s.hue, 90, 65, 0.85, i));
              grad.addColorStop(0.75, getArtColor(s.hue + 30, 85, 45, 0.4, i));
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(s.x, s.y, outerR, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #5: 群蝶のデジタル空間
        // ------------------------------------------------------------------------
        case 'butterflies': {
          for (let i = 0; i < sim.items.length; i++) {
            const bf = sim.items[i];
            if (ptr.dragTarget?.item !== bf) {
              bf.x += (bf.vx + Math.sin(state.time * 1.5 + bf.phase) * 0.9) * speed;
              bf.y += (bf.vy + Math.cos(state.time * 1.3 + bf.phase) * 0.8) * speed;
              if (bf.x < -30) bf.x = w + 30;
              if (bf.x > w + 30) bf.x = -30;
              if (bf.y < -30) bf.y = h + 30;
              if (bf.y > h + 30) bf.y = -30;
            }

            const flap = Math.abs(Math.sin(state.time * 9 * speed * p3 + bf.phase));
            const sz = bf.size * size * p1;
            const ang = Math.atan2(bf.vy, bf.vx);

            if (sz > 0.1) {
              ctx.save();
              ctx.translate(bf.x, bf.y);
              ctx.rotate(ang + Math.PI * 0.5);
              const col = getArtColor(bf.hue + state.time * 25, 92, 68, 0.8 * glow, i);
              ctx.fillStyle = col;
              ctx.beginPath();
              ctx.ellipse(-sz * 0.55 * flap, -sz * 0.15, sz * 0.65 * flap, sz * 0.45, -0.3, 0, Math.PI * 2);
              ctx.ellipse(-sz * 0.45 * flap, sz * 0.35, sz * 0.5 * flap, sz * 0.35, 0.3, 0, Math.PI * 2);
              ctx.ellipse(sz * 0.55 * flap, -sz * 0.15, sz * 0.65 * flap, sz * 0.45, 0.3, 0, Math.PI * 2);
              ctx.ellipse(sz * 0.45 * flap, sz * 0.35, sz * 0.5 * flap, sz * 0.35, -0.3, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            if (p2 > 0.01 && Math.random() < 0.25 * Math.min(2, p2)) {
              sim.particles.push({
                x: bf.x, y: bf.y, life: 1.0, hue: bf.hue, size: 2 * p2
              });
            }
          }

          for (let i = sim.particles.length - 1; i >= 0; i--) {
            const sp = sim.particles[i];
            sp.life -= dt * 1.4;
            if (sp.life <= 0) {
              sim.particles.splice(i, 1);
            } else {
              drawStarburst(sp.x, sp.y, sp.size * 2 * glow, getArtColor(sp.hue, 95, 75, sp.life, i), sp.life);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #6: 万華鏡の幾何学プリズム
        // ------------------------------------------------------------------------
        case 'kaleidoscope': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const slices = 12;
          const stepAngle = (Math.PI * 2) / slices;

          for (let s = 0; s < slices; s++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(s * stepAngle + state.time * 0.15 * speed);
            if (s % 2 === 1) ctx.scale(1, -1);

            for (let i = 0; i < sim.items.length; i++) {
              const it = sim.items[i];
              const rot = it.rot + state.time * it.rotSpeed * 35 * speed;
              const dist = it.dist * p2 * (0.85 + 0.15 * Math.sin(state.time + i));
              const px = Math.cos(it.angle + state.time * 0.2 * speed) * dist;
              const py = Math.sin(it.angle + state.time * 0.2 * speed) * dist;
              const sz = it.size * size * p1;
              if (sz <= 0.1) continue;

              ctx.save();
              ctx.translate(px, py);
              ctx.rotate(rot);
              ctx.fillStyle = getArtColor(it.hue + state.time * 20, 90, 62, 0.28 * glow, i);
              ctx.strokeStyle = getArtColor(it.hue + state.time * 20, 95, 78, 0.65 * p3, i);
              ctx.lineWidth = 1.2 * Math.max(0.2, p3);
              ctx.beginPath();
              for (let k = 0; k < it.sides; k++) {
                const a = (k / it.sides) * Math.PI * 2;
                const vx = Math.cos(a) * sz;
                const vy = Math.sin(a) * sz;
                if (k === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
              }
              ctx.closePath();
              ctx.fill();
              if (p3 > 0.01) ctx.stroke();
              ctx.restore();
            }
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #7: 幻想夜桜と光の桜吹雪（自然なソメイヨシノ花びら一枚形状）
        // ------------------------------------------------------------------------
        case 'sakura': {
          const moon = sim.items[0];
          if (moon && p2 > 0.01) {
            const moonR = moon.r * size * p2;
            const moonHalo = ctx.createRadialGradient(moon.x, moon.y, moonR * 0.75, moon.x, moon.y, moonR * 3.4 * glow);
            moonHalo.addColorStop(0, 'rgba(255, 248, 228, 0.92)');
            moonHalo.addColorStop(0.28, getArtColor(340, 72, 76, 0.28, 0));
            moonHalo.addColorStop(1, 'transparent');
            ctx.fillStyle = moonHalo;
            ctx.beginPath();
            ctx.arc(moon.x, moon.y, moonR * 3.4 * glow, 0, Math.PI * 2);
            ctx.fill();
          }

          if (p1 > 0.01) {
            ctx.globalCompositeOperation = 'source-over';
            for (let i = 0; i < sim.particles.length; i++) {
              const p = sim.particles[i];
              const sway = Math.sin(state.time * 1.8 * speed + p.swayPhase) * 0.9 * p3;
              p.x += (p.vx + sway) * speed;
              p.y += p.vy * speed;
              p.rot += p.rotSpeed * speed;

              if (p.x < -25) p.x = w + 25;
              if (p.x > w + 25) p.x = -25;
              if (p.y > h + 25) { p.y = -25; p.x = Math.random() * w; }

              const sz = p.size * size * p1;
              const col = getArtColor(p.hue, 82, p.lightness, Math.min(0.96, 0.72 + glow * 0.2), i);
              drawSakuraPetal(p.x, p.y, sz, p.rot, p.tilt, col);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #8: 深海のバイオルミネッセンス
        // ------------------------------------------------------------------------
        case 'bioluminescence': {
          const localPtr = toSceneCoords(ptr.x, ptr.y);
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.vx * speed + Math.sin(state.time + p.phase) * 0.3;
            p.y += p.vy * speed + Math.cos(state.time * 0.8 + p.phase) * 0.3;

            if (ptr.active && reactivity > 0) {
              const dx = p.x - localPtr.x;
              const dy = p.y - localPtr.y;
              const d = Math.hypot(dx, dy);
              if (d < 150 * reactivity && d > 1) {
                p.vx += (-dy / d) * 0.18 * reactivity * p3;
                p.vy += (dx / d) * 0.18 * reactivity * p3;
              }
            }
            p.vx *= 0.97;
            p.vy *= 0.97;

            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            const alpha = 0.4 + 0.6 * Math.sin(state.time * 3 + p.phase);
            if (p1 > 0.01) {
              drawStarburst(p.x, p.y, p.r * 3.2 * p1 * glow * Math.max(0.2, p2), getArtColor(p.hue, 95, 65, alpha, i), alpha);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #9: 静寂の夜雨と煌めく雨粒
        // ------------------------------------------------------------------------
        case 'rain': {
          const waterLine = h * 0.84;
          if (ptr.justClicked && p3 > 0.01) {
            const local = toSceneCoords(ptr.x, ptr.y);
            sim.ripples.push({ x: local.x, y: Math.max(waterLine, local.y), rx: 4, ry: 1.5, alpha: 0.95, hue: 200 });
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.y += p.vy * speed;
            p.x -= 0.7 * speed;
            if (p.y > waterLine + Math.random() * (h - waterLine) * 0.85) {
              if (p3 > 0.01 && Math.random() < 0.35) {
                sim.ripples.push({ x: p.x, y: p.y, rx: 3, ry: 1, alpha: 0.75, hue: p.hue });
              }
              p.y = -25;
              p.x = Math.random() * (w + 60);
            }

            if (p2 > 0.01) {
              ctx.strokeStyle = getArtColor(p.hue, 80, 74, 0.38 * glow, i);
              ctx.lineWidth = 1.2 * p2;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p.x + 1.5, p.y - p.len * p2);
              ctx.stroke();
            }

            if (p1 > 0.01) {
              const dropR = 2.6 * size * p1;
              const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, dropR * 2.2 * glow);
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(0.4, getArtColor(p.hue, 92, 76, 0.75, i));
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(p.x, p.y, dropR * 2.2 * glow, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          if (p3 > 0.01) {
            for (let i = sim.ripples.length - 1; i >= 0; i--) {
              const rp = sim.ripples[i];
              rp.rx += 75 * dt * speed;
              rp.ry += 20 * dt * speed;
              rp.alpha -= dt * 0.7;
              if (rp.alpha <= 0) {
                sim.ripples.splice(i, 1);
              } else {
                ctx.strokeStyle = getArtColor(rp.hue, 85, 76, rp.alpha * glow, i);
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.ellipse(rp.x, rp.y, rp.rx * p3, rp.ry * p3, 0, 0, Math.PI * 2);
                ctx.stroke();
              }
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #10: 万華鏡の鏡面クリスタル宮殿
        // ------------------------------------------------------------------------
        case 'crystal_palace': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const maxBeam = Math.hypot(w, h) * 0.65;

          if (p2 > 0.01) {
            const beamCount = 24;
            for (let b = 0; b < beamCount; b++) {
              const bAng = (b / beamCount) * Math.PI * 2 + state.time * 0.08 * speed * (b % 2 === 0 ? 1 : -1);
              const spread = 0.035 * p2;
              const grad = ctx.createLinearGradient(cx, cy, cx + Math.cos(bAng) * maxBeam, cy + Math.sin(bAng) * maxBeam);
              grad.addColorStop(0, getArtColor(195 + b * 15, 95, 80, 0.22 * glow * p2, b));
              grad.addColorStop(0.55, getArtColor(260 + b * 12, 90, 65, 0.10 * glow * p2, b));
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx + Math.cos(bAng - spread) * maxBeam, cy + Math.sin(bAng - spread) * maxBeam);
              ctx.lineTo(cx + Math.cos(bAng + spread) * maxBeam, cy + Math.sin(bAng + spread) * maxBeam);
              ctx.closePath();
              ctx.fill();
            }
          }

          const drawFacetCrystal = (x, y, cw, ch, rot, hue, alphaMult, seed) => {
            if (cw <= 0.1 || ch <= 0.1 || alphaMult <= 0.002) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);

            const bodyGrad = ctx.createLinearGradient(-cw, -ch, cw, ch);
            bodyGrad.addColorStop(0, getArtColor(hue + 25, 95, 88, 0.68 * alphaMult, seed));
            bodyGrad.addColorStop(0.45, getArtColor(hue, 92, 62, 0.42 * alphaMult, seed));
            bodyGrad.addColorStop(1, getArtColor(hue - 35, 95, 76, 0.64 * alphaMult, seed));
            ctx.fillStyle = bodyGrad;
            ctx.strokeStyle = getArtColor(hue + 15, 96, 90, 0.85 * alphaMult, seed);
            ctx.lineWidth = 1.2;

            ctx.beginPath();
            ctx.moveTo(0, -ch);
            ctx.lineTo(cw, -ch * 0.35);
            ctx.lineTo(cw, ch * 0.35);
            ctx.lineTo(0, ch);
            ctx.lineTo(-cw, ch * 0.35);
            ctx.lineTo(-cw, -ch * 0.35);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = `rgba(255, 255, 255, ${(0.55 * alphaMult).toFixed(3)})`;
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(0, -ch);
            ctx.lineTo(0, ch);
            ctx.moveTo(-cw, -ch * 0.35);
            ctx.lineTo(cw, -ch * 0.35);
            ctx.moveTo(-cw, ch * 0.35);
            ctx.lineTo(cw, ch * 0.35);
            ctx.stroke();

            ctx.fillStyle = `rgba(255, 255, 255, ${(0.38 * alphaMult).toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(0, -ch * 0.85);
            ctx.lineTo(cw * 0.48, -ch * 0.35);
            ctx.lineTo(0, 0);
            ctx.lineTo(-cw * 0.48, -ch * 0.35);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          };

          for (let i = 0; i < sim.items.length; i++) {
            const cr = sim.items[i];
            if (ptr.dragTarget?.item !== cr && cr.pinnedX === undefined) {
              const dir = cr.ring % 2 === 0 ? 1 : -1;
              const curAng = cr.baseAngle + state.time * 0.14 * dir * speed;
              cr.x = cx + Math.cos(curAng) * cr.orbitR;
              cr.y = cy + Math.sin(curAng) * cr.orbitR;
              cr.rot = curAng + Math.PI * 0.5;
            }

            const cw = cr.w * size * p1;
            const ch = cr.h * size * p1;
            const shimmer = 0.65 + 0.35 * Math.sin(state.time * 3.2 + cr.phase);
            const dynHue = cr.hue + state.time * 18;

            if (p2 > 0.01) {
              const mx = w - cr.x;
              const my = h - cr.y;
              drawFacetCrystal(mx, my, cw * 0.82, ch * 0.82, -cr.rot, dynHue + 45, 0.38 * glow * Math.min(1.5, p2), i + 50);
            }

            drawFacetCrystal(cr.x, cr.y, cw, ch, cr.rot, dynHue, shimmer * glow, i);

            if (p3 > 0.01) {
              const glintR = cw * 1.45 * p3 * shimmer;
              if (glintR > 0.2) {
                const gGrad = ctx.createRadialGradient(cr.x, cr.y - ch * 0.25, 0, cr.x, cr.y - ch * 0.25, glintR);
                gGrad.addColorStop(0, '#ffffff');
                gGrad.addColorStop(0.35, getArtColor(dynHue + 30, 98, 82, 0.85 * glow, i));
                gGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = gGrad;
                ctx.beginPath();
                ctx.arc(cr.x, cr.y - ch * 0.25, glintR, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #11: 蒼穹の青空と流れる積雲（fBm煙状テクスチャ雲＋太陽・雲ドラッグ固定）
        // ------------------------------------------------------------------------
        case 'bluesky': {
          ctx.globalCompositeOperation = 'source-over';
          const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, getArtColor(214, 86, 36, 1, 0));
          skyGrad.addColorStop(0.55, getArtColor(203, 88, 54, 1, 1));
          skyGrad.addColorStop(1, getArtColor(194, 82, 74, 1, 2));
          ctx.fillStyle = skyGrad;
          ctx.fillRect(-w, -h, w * 3, h * 3);

          const sunX = sim.extra.sunX;
          const sunY = sim.extra.sunY;

          if (p1 > 0.01) {
            ctx.globalCompositeOperation = 'lighter';
            const sunR = Math.min(w, h) * 0.38 * size * p1 * glow;
            if (sunR > 0.5) {
              const sGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
              sGrad.addColorStop(0, 'rgba(255, 255, 248, 0.96)');
              sGrad.addColorStop(0.14, 'rgba(255, 250, 215, 0.72)');
              sGrad.addColorStop(0.45, getArtColor(48, 95, 78, 0.26, 0));
              sGrad.addColorStop(1, 'transparent');
              ctx.fillStyle = sGrad;
              ctx.beginPath();
              ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
          }

          if (p2 > 0.01) {
            const sprites = getCloudSprites('bluesky');
            for (let i = 0; i < sim.items.length; i++) {
              const cl = sim.items[i];
              const cw = cl.wBase * size * p2;
              const ch = cl.hBase * size * p2;
              if (ptr.dragTarget?.item !== cl) {
                cl.x += cl.speed * speed;
                if (cl.x > w + cw * 0.65) cl.x = -cw * 0.65;
              }
              if (cw <= 1 || ch <= 1) continue;

              const sp = sprites[cl.spriteIdx % sprites.length];
              ctx.save();
              ctx.translate(cl.x, cl.y);
              ctx.scale(cl.flipX, 1);
              ctx.globalAlpha = Math.min(1, cl.alpha * (0.75 + glow * 0.25));
              ctx.drawImage(sp, -cw * 0.5, -ch * 0.5, cw, ch);
              ctx.restore();
            }
          }

          if (p3 > 0.01) {
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < sim.particles.length; i++) {
              const d = sim.particles[i];
              const a = 0.25 + 0.45 * Math.sin(state.time * 2 + d.phase);
              ctx.fillStyle = `rgba(255, 255, 255, ${(a * glow).toFixed(3)})`;
              ctx.beginPath();
              ctx.arc(d.x, d.y, d.r * size * p3, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #12: 黄昏のマジックアワーと夕焼け雲（fBm煙状テクスチャ雲＋夕日・雲ドラッグ固定）
        // ------------------------------------------------------------------------
        case 'sunset': {
          const horizonY = h * 0.64;
          ctx.globalCompositeOperation = 'source-over';
          const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
          skyGrad.addColorStop(0, getArtColor(235, 65, 16, 1, 0));
          skyGrad.addColorStop(0.45, getArtColor(285, 58, 30, 1, 1));
          skyGrad.addColorStop(0.8, getArtColor(14, 88, 52, 1, 2));
          skyGrad.addColorStop(1, getArtColor(36, 95, 64, 1, 3));
          ctx.fillStyle = skyGrad;
          ctx.fillRect(-w, -h, w * 3, horizonY + h);

          ctx.globalCompositeOperation = 'lighter';
          const sunX = sim.extra.sunX;
          const sunY = sim.extra.sunY;
          const sunR = Math.min(w, h) * 0.11 * size * p1;
          if (sunR > 0.2) {
            const sunHalo = ctx.createRadialGradient(sunX, sunY, sunR * 0.3, sunX, sunY, sunR * 4.2 * glow);
            sunHalo.addColorStop(0, '#ffffff');
            sunHalo.addColorStop(0.22, getArtColor(38, 100, 68, 0.9, 0));
            sunHalo.addColorStop(0.6, getArtColor(12, 95, 52, 0.35, 1));
            sunHalo.addColorStop(1, 'transparent');
            ctx.fillStyle = sunHalo;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunR * 4.2 * glow, 0, Math.PI * 2);
            ctx.fill();
          }

          if (p2 > 0.01) {
            ctx.globalCompositeOperation = 'source-over';
            const sprites = getCloudSprites('sunset');
            for (let i = 0; i < sim.items.length; i++) {
              const cl = sim.items[i];
              const cw = cl.wBase * p2;
              const ch = cl.hBase * p2;
              if (ptr.dragTarget?.item !== cl) {
                cl.x += cl.speed * speed;
                if (cl.x > w + cw * 0.65) cl.x = -cw * 0.65;
              }
              if (cw <= 1 || ch <= 1) continue;

              const sp = sprites[cl.spriteIdx % sprites.length];
              ctx.save();
              ctx.translate(cl.x, cl.y);
              ctx.scale(cl.flipX, 1);
              ctx.globalAlpha = Math.min(1, cl.alpha * (0.72 + glow * 0.28));
              ctx.drawImage(sp, -cw * 0.5, -ch * 0.5, cw, ch);
              ctx.restore();
            }
          }

          ctx.globalCompositeOperation = 'source-over';
          const seaGrad = ctx.createLinearGradient(0, horizonY, 0, h);
          seaGrad.addColorStop(0, getArtColor(24, 75, 24, 1, 4));
          seaGrad.addColorStop(1, getArtColor(235, 60, 8, 1, 5));
          ctx.fillStyle = seaGrad;
          ctx.fillRect(-w, horizonY, w * 3, h * 2);

          if (p3 > 0.01) {
            ctx.globalCompositeOperation = 'lighter';
            for (let r = 0; r < 28; r++) {
              const t = r / 28;
              const ry = horizonY + t * (h - horizonY);
              const rw = (16 + t * 140) * p3 + Math.sin(state.time * 3 * speed + r) * 18 * p3;
              ctx.fillStyle = getArtColor(36, 98, 68, (0.38 - t * 0.28) * glow, r);
              ctx.fillRect(sunX - rw * 0.5 + Math.sin(state.time * 2 + r) * 10, ry, rw, 3.5);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #13: 満天のプラネタリウムと天の川
        // ------------------------------------------------------------------------
        case 'planetarium': {
          sim.extra.rot += 0.05 * dt * speed;
          const cx = w * 0.5;
          const cy = h * 0.52;
          const maxR = Math.hypot(w, h) * 0.65;

          for (let i = 0; i < sim.particles.length; i++) {
            const st = sim.particles[i];
            const isMW = i % 2 === 0;
            if (isMW && p2 <= 0.01) continue;
            if (!isMW && p1 <= 0.01) continue;

            const a = st.angle + sim.extra.rot;
            const dist = ((st.spread + Math.PI * 0.5) / Math.PI) * maxR;
            const sx = cx + Math.cos(a) * dist;
            const sy = cy + Math.sin(a) * dist * 0.75;
            const tw = 0.5 + 0.5 * Math.sin(state.time * 2.5 + st.twinkle);
            const mult = isMW ? p2 : p1;
            ctx.fillStyle = getArtColor(st.hue, 85, 80, tw * glow * (isMW ? 0.65 : 1), i);
            ctx.beginPath();
            ctx.arc(sx, sy, st.r * size * mult, 0, Math.PI * 2);
            ctx.fill();
          }

          if (p3 > 0.01 && (Math.random() < 0.03 * speed || ptr.justClicked)) {
            const local = ptr.justClicked ? toSceneCoords(ptr.x, ptr.y) : { x: Math.random() * w, y: Math.random() * h * 0.4 };
            sim.extra.meteors.push({
              x: local.x, y: local.y,
              vx: -7 - Math.random() * 5,
              vy: 4 + Math.random() * 3,
              life: 1.0
            });
          }
          for (let i = sim.extra.meteors.length - 1; i >= 0; i--) {
            const m = sim.extra.meteors[i];
            m.x += m.vx * speed;
            m.y += m.vy * speed;
            m.life -= dt * 1.4;
            if (m.life <= 0) {
              sim.extra.meteors.splice(i, 1);
            } else if (p3 > 0.01) {
              const tail = 12 * p3;
              const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * tail, m.y - m.vy * tail);
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(1, 'transparent');
              ctx.strokeStyle = grad;
              ctx.lineWidth = 2.5 * size;
              ctx.beginPath();
              ctx.moveTo(m.x, m.y);
              ctx.lineTo(m.x - m.vx * tail, m.y - m.vy * tail);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #14: 夜空の大輪・打ち上げ花火
        // ------------------------------------------------------------------------
        case 'fireworks': {
          const launch = (tx, ty) => {
            sim.extra.rockets.push({
              x: tx + (Math.random() - 0.5) * 60,
              y: h, tx, ty,
              hue: Math.random() * 360
            });
          };
          if (ptr.justClicked) {
            const local = toSceneCoords(ptr.x, ptr.y);
            launch(local.x, local.y);
          }
          if (Math.random() < 0.035 * speed * density) {
            launch(w * 0.15 + Math.random() * w * 0.7, h * 0.15 + Math.random() * h * 0.42);
          }

          for (let i = sim.extra.rockets.length - 1; i >= 0; i--) {
            const rk = sim.extra.rockets[i];
            rk.x += (rk.tx - rk.x) * 0.08 * speed;
            rk.y += (rk.ty - rk.y) * 0.08 * speed;
            if (p3 > 0.01) {
              ctx.fillStyle = '#fff3c4';
              ctx.beginPath();
              ctx.arc(rk.x, rk.y, 2.5 * size * p3, 0, Math.PI * 2);
              ctx.fill();
            }

            if (Math.hypot(rk.tx - rk.x, rk.ty - rk.y) < 12) {
              const sparkCount = Math.min(240, Math.max(8, Math.floor(85 * density)));
              for (let k = 0; k < sparkCount; k++) {
                const ang = (k / sparkCount) * Math.PI * 2 + Math.random() * 0.1;
                const spd = (1.5 + Math.random() * 4.5) * p1;
                sim.extra.sparks.push({
                  x: rk.x, y: rk.y,
                  vx: Math.cos(ang) * spd,
                  vy: Math.sin(ang) * spd,
                  life: 1.0,
                  hue: rk.hue + (Math.random() - 0.5) * 35
                });
              }
              sim.extra.rockets.splice(i, 1);
            }
          }

          for (let i = sim.extra.sparks.length - 1; i >= 0; i--) {
            const sp = sim.extra.sparks[i];
            sp.x += sp.vx * speed;
            sp.y += sp.vy * speed;
            sp.vy += 0.045 * speed;
            sp.vx *= 0.97;
            sp.vy *= 0.97;
            sp.life -= dt * 0.65;
            if (sp.life <= 0) {
              sim.extra.sparks.splice(i, 1);
            } else if (p2 > 0.01) {
              ctx.fillStyle = getArtColor(sp.hue, 95, 65, sp.life * glow, i);
              ctx.beginPath();
              ctx.arc(sp.x, sp.y, 2.2 * size * p2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #15: 錦秋の紅葉・枝垂れと舞い散る落葉（スポットライト不要・枝垂れ樹冠と自然落葉）
        // ------------------------------------------------------------------------
        case 'autumn_leaves': {
          ctx.globalCompositeOperation = 'source-over';
          const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
          bgGrad.addColorStop(0, '#140806');
          bgGrad.addColorStop(0.65, '#0b0608');
          bgGrad.addColorStop(1, '#050408');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(-w, -h, w * 3, h * 3);

          if (p2 > 0.01 && sim.extra.branches) {
            for (let b = 0; b < sim.extra.branches.length; b++) {
              const br = sim.extra.branches[b];
              ctx.strokeStyle = 'rgba(42, 22, 16, 0.85)';
              ctx.lineWidth = 3 * p2;
              ctx.beginPath();
              ctx.moveTo(br.bx, -10);
              ctx.quadraticCurveTo(br.bx + 25, h * 0.16 * p2, br.bx - 15, h * 0.34 * p2);
              ctx.stroke();

              for (let c = 0; c < br.clusters.length; c++) {
                const cl = br.clusters[c];
                const lx = br.bx + cl.dx * p2 + Math.sin(state.time * 1.1 + c) * 3;
                const ly = cl.dy * p2;
                const lsz = cl.size * size * p1;
                const lightVal = Math.min(82, cl.light + (p3 - 1) * 14);
                const col = getArtColor(cl.hue, 90, lightVal, 0.92, b * 20 + c);
                drawMapleLeaf(lx, ly, lsz, cl.rot + Math.sin(state.time + c) * 0.08, col);
              }
            }
          }

          if (p1 > 0.01) {
            for (let i = 0; i < sim.particles.length; i++) {
              const lf = sim.particles[i];
              lf.x += (lf.vx + Math.sin(state.time * 1.4 + lf.sway) * 0.65) * speed;
              lf.y += lf.vy * speed;
              lf.rot += lf.rotSpeed * speed;
              if (lf.y > h + 25) { lf.y = h * 0.15 + Math.random() * h * 0.15; lf.x = Math.random() * w; }
              if (lf.x < -25) lf.x = w + 25;
              if (lf.x > w + 25) lf.x = -25;

              const lightVal = Math.min(84, lf.light + (p3 - 1) * 15);
              const col = getArtColor(lf.hue, 92, lightVal, 0.92, i);
              drawMapleLeaf(lf.x, lf.y, lf.size * size * p1, lf.rot, col);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #16: 銀河・運河の中心への突入（均一に迫りくる3D星群・星間ガス雲＋中心核ドラッグ固定）
        // ------------------------------------------------------------------------
        case 'galaxy_canal': {
          const cx = sim.extra.coreX !== undefined ? sim.extra.coreX : w * 0.5;
          const cy = sim.extra.coreY !== undefined ? sim.extra.coreY : h * 0.5;

          if (p1 > 0.01) {
            const coreR = Math.min(w, h) * 0.42 * size * p1 * glow;
            if (coreR > 0.5) {
              const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
              coreGrad.addColorStop(0, 'rgba(255, 252, 238, 0.96)');
              coreGrad.addColorStop(0.2, getArtColor(42, 95, 76, 0.72, 0));
              coreGrad.addColorStop(0.52, getArtColor(245, 82, 54, 0.32, 1));
              coreGrad.addColorStop(1, 'transparent');
              ctx.fillStyle = coreGrad;
              ctx.beginPath();
              ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          const cosR = Math.cos(state.time * 0.08 * speed);
          const sinR = Math.sin(state.time * 0.08 * speed);

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.prevZ = p.z;
            p.z -= 0.26 * dt * speed;
            if (p.z <= 0.03) {
              p.z += 0.97;
              p.prevZ = p.z;
            }

            const rx = p.bx * cosR - p.by * sinR;
            const ry = p.bx * sinR + p.by * cosR;
            const invZ = 1 / (p.z * 1.15 + 0.08);
            const sx = cx + rx * invZ * 0.52;
            const sy = cy + ry * invZ * 0.52;

            // 画面外を大きく超えた場合はスキップ
            if (sx < -220 || sx > w + 220 || sy < -220 || sy > h + 220) continue;

            // 奥から手前まで滑らかにフェードインし、均一な密度感を保つ
            const depthFade = Math.min(1, (1 - p.z) * 2.2) * Math.min(1, p.z * 6.5);
            const alpha = depthFade * glow;

            if (p.isNebulaGlow) {
              if (p3 > 0.01) {
                const cloudR = p.size * invZ * 0.42 * size * p3;
                if (cloudR > 0.6) {
                  const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, cloudR);
                  g.addColorStop(0, getArtColor(p.hue, 88, 62, 0.14 * alpha, i));
                  g.addColorStop(1, 'transparent');
                  ctx.fillStyle = g;
