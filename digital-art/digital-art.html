            // 鏡面多重反射ゴースト（鏡の奥に映り込む対称クリスタル像）
            if (p2 > 0.15) {
              const mirrorX = w - cr.x;
              const mirrorY = h - cr.y;
              drawCrystalUnit(mirrorX, mirrorY, -cr.tilt, 0.68, 0.42 * Math.min(1.5, p2), 28);
            }

            // パーツ③：クリスタル先端の煌めく丸型・六角プリズムグリント（ばつ印なし）
            if (reflPower > 0.45 && p3 > 0.05) {
              const halfH = ch * 0.5;
              const tipOffset = cw * 0.95;
              const tipX = cr.x + Math.sin(cr.tilt) * (halfH + tipOffset);
              const tipY = cr.y - Math.cos(cr.tilt) * (halfH + tipOffset);
              const glintR = Math.max(2, cw * (0.9 + reflPower * 1.1) * glow * p3);

              const gGrad = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, glintR * 1.8);
              gGrad.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
              gGrad.addColorStop(0.3, getArtColor(cr.hue + 35, 98, 82, 0.72 * reflPower, i));
              gGrad.addColorStop(1, 'transparent');
              ctx.fillStyle = gGrad;
              ctx.beginPath();
              ctx.arc(tipX, tipY, glintR * 1.8, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #11: 蒼穹の青空と流れる積雲
        // ------------------------------------------------------------------------
        case 'bluesky': {
          ctx.globalCompositeOperation = 'source-over';
          const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, getArtColor(214, 86, 36, 1, 0));
          skyGrad.addColorStop(0.55, getArtColor(203, 88, 54, 1, 1));
          skyGrad.addColorStop(1, getArtColor(194, 82, 74, 1, 2));
          ctx.fillStyle = skyGrad;
          ctx.fillRect(-w, -h, w * 3, h * 3);

          const targetSunX = ptr.active ? ptr.x : w * 0.24 + Math.cos(state.time * 0.25) * 40;
          const targetSunY = ptr.active ? ptr.y : h * 0.20 + Math.sin(state.time * 0.35) * 25;
          sim.extra.sunX += (targetSunX - sim.extra.sunX) * Math.min(1, 0.08 * Math.max(0.2, reactivity));
          sim.extra.sunY += (targetSunY - sim.extra.sunY) * Math.min(1, 0.08 * Math.max(0.2, reactivity));

          const sunX = sim.extra.sunX;
          const sunY = sim.extra.sunY;

          ctx.globalCompositeOperation = 'lighter';
          const sunR = Math.max(10, Math.max(w, h) * 0.42 * size * p1 * glow);
          const sunGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, sunR);
          sunGlow.addColorStop(0, 'rgba(255, 253, 240, 0.96)');
          sunGlow.addColorStop(0.18, getArtColor(48, 95, 82, 0.48, 0));
          sunGlow.addColorStop(0.55, getArtColor(195, 85, 72, 0.16, 1));
          sunGlow.addColorStop(1, 'transparent');
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalCompositeOperation = 'source-over';
          for (let i = 0; i < sim.items.length; i++) {
            const cl = sim.items[i];
            cl.x += cl.vx * speed;
            if (cl.x > w + 320) cl.x = -320;

            const cw = cl.scaleW * size * p2;
            const ch = cl.scaleH * size * p2;
            if (cw <= 2 || ch <= 2) continue;

            const sprite = getRealisticCloudSprite(cl.seed, false);
            const distToSun = Math.hypot(cl.x - sunX, cl.y - sunY);
            const sunProximity = Math.max(0, 1 - distToSun / (Math.max(w, h) * 0.65));

            ctx.save();
            ctx.globalAlpha = Math.min(0.98, cl.alpha * (0.88 + sunProximity * 0.22));
            ctx.drawImage(sprite, cl.x - cw * 0.5, cl.y - ch * 0.5 + Math.sin(state.time * 0.4 + i) * 3, cw, ch);
            ctx.restore();
          }

          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.vx * speed * 1.4;
            if (p.x > w) p.x = 0;
            const tw = 0.35 + 0.65 * Math.sin(state.time * 2.5 + p.phase);
            ctx.fillStyle = `rgba(255, 255, 240, ${tw * 0.65 * glow * p3})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * size * p3, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #12: 黄昏のマジックアワーと夕焼け雲
        // ------------------------------------------------------------------------
        case 'sunset': {
          const horizonY = h * 0.64;
          ctx.globalCompositeOperation = 'source-over';
          const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
          skyGrad.addColorStop(0, getArtColor(248, 65, 16, 1, 0));
          skyGrad.addColorStop(0.42, getArtColor(325, 78, 34, 1, 1));
          skyGrad.addColorStop(0.78, getArtColor(18, 92, 52, 1, 2));
          skyGrad.addColorStop(1, getArtColor(42, 98, 66, 1, 3));
          ctx.fillStyle = skyGrad;
          ctx.fillRect(-w, -h, w * 3, horizonY + h);

          const seaGrad = ctx.createLinearGradient(0, horizonY, 0, h);
          seaGrad.addColorStop(0, getArtColor(26, 88, 36, 1, 4));
          seaGrad.addColorStop(1, getArtColor(245, 70, 12, 1, 5));
          ctx.fillStyle = seaGrad;
          ctx.fillRect(-w, horizonY, w * 3, h * 2);

          ctx.globalCompositeOperation = 'lighter';
          const sunX = w * 0.5 + (ptr.active ? (ptr.x - w * 0.5) * 0.25 * reactivity : 0);
          const sunY = horizonY - Math.min(w, h) * 0.05;

          const sunR = Math.max(2, Math.min(w, h) * 0.095 * size * p1);
          const sunHalo = ctx.createRadialGradient(sunX, sunY, sunR * 0.35, sunX, sunY, sunR * 3.8 * glow);
          sunHalo.addColorStop(0, 'rgba(255, 250, 220, 0.96)');
          sunHalo.addColorStop(0.28, getArtColor(34, 98, 62, 0.58, 0));
          sunHalo.addColorStop(1, 'transparent');
          ctx.fillStyle = sunHalo;
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunR * 3.8 * glow, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalCompositeOperation = 'source-over';
          for (let i = 0; i < sim.items.length; i++) {
            const cl = sim.items[i];
            cl.x += cl.vx * speed;
            if (cl.x > w + 320) cl.x = -320;
            const cw = cl.scaleW * p2;
            const ch = cl.scaleH * p2;
            if (cw <= 2 || ch <= 2) continue;

            const sprite = getRealisticCloudSprite(cl.seed, true);
            ctx.save();
            ctx.globalAlpha = Math.min(0.95, cl.alpha * (0.75 + 0.25 * Math.min(1.5, glow)));
            ctx.drawImage(sprite, cl.x - cw * 0.5, cl.y - ch * 0.5, cw, ch);
            ctx.restore();
          }

          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < sim.particles.length; i++) {
            const rp = sim.particles[i];
            const ratio = (rp.y - horizonY) / (h - horizonY);
            const rx = sunX + Math.sin(state.time * 1.8 * speed + rp.phase) * (25 + ratio * 95);
            const rw = rp.w * (0.5 + ratio * 1.4) * p3;
            ctx.fillStyle = getArtColor(38, 98, 72, (0.35 + 0.35 * Math.sin(state.time * 3 + rp.phase)) * glow, i);
            ctx.fillRect(rx - rw * 0.5, rp.y, rw, 2.2 * p3);
          }

          if (ptr.justClicked && ptr.y >= horizonY) {
            sim.ripples.push({ x: ptr.x, y: ptr.y, rx: 10, ry: 2, alpha: 1.0 });
          }
          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const r = sim.ripples[i];
            r.rx += 95 * dt * speed;
            r.ry += 22 * dt * speed;
            r.alpha -= dt * 0.75;
            if (r.alpha <= 0) sim.ripples.splice(i, 1);
            else {
              ctx.strokeStyle = getArtColor(42, 95, 76, r.alpha * glow, i);
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.ellipse(r.x, r.y, r.rx * p3, r.ry * p3, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #13: 満天のプラネタリウムと天の川
        // ------------------------------------------------------------------------
        case 'planetarium': {
          sim.extra.rot += 0.06 * dt * speed + (ptr.isDown ? ptr.vx * 0.003 : 0);
          const cx = w * 0.5;
          const cy = h * 0.55;
          const maxR = Math.hypot(w, h) * 0.65 * p2;

          for (let i = 0; i < sim.particles.length; i++) {
            const st = sim.particles[i];
            const a = st.angle + sim.extra.rot;
            const dist = ((st.spread + Math.PI * 0.5) / Math.PI) * maxR;
            const sx = cx + Math.cos(a) * dist;
            const sy = cy + Math.sin(a) * dist * 0.75;
            const tw = 0.5 + 0.5 * Math.sin(state.time * 2.5 + st.twinkle);
            ctx.fillStyle = getArtColor(st.hue, 85, 80, tw * glow, i);
            ctx.beginPath();
            ctx.arc(sx, sy, st.r * size * p1, 0, Math.PI * 2);
            ctx.fill();
          }

          if (Math.random() < 0.03 * speed * p3 || ptr.justClicked) {
            sim.extra.meteors.push({
              x: ptr.justClicked ? ptr.x : Math.random() * w,
              y: ptr.justClicked ? ptr.y : Math.random() * h * 0.4,
              vx: -7 - Math.random() * 5,
              vy: 4 + Math.random() * 3,
              life: 1.0
            });
          }
          for (let i = sim.extra.meteors.length - 1; i >= 0; i--) {
            const m = sim.extra.meteors[i];
            m.x += m.vx * speed;
            m.y += m.vy * speed;
            m.life -= dt * 1.4;
            if (m.life <= 0) {
              sim.extra.meteors.splice(i, 1);
            } else {
              const tail = 12 * p3;
              const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * tail, m.y - m.vy * tail);
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(1, 'transparent');
              ctx.strokeStyle = grad;
              ctx.lineWidth = 2.5 * size;
              ctx.beginPath();
              ctx.moveTo(m.x, m.y);
              ctx.lineTo(m.x - m.vx * tail, m.y - m.vy * tail);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #14: 夜空の大輪・打ち上げ花火
        // ------------------------------------------------------------------------
        case 'fireworks': {
          const launch = (tx, ty) => {
            sim.extra.rockets.push({
              x: tx + (Math.random() - 0.5) * 60,
              y: h,
              tx,
              ty,
              hue: Math.random() * 360
            });
          };
          if (ptr.justClicked) launch(ptr.x, ptr.y);
          if (Math.random() < 0.035 * speed * Math.max(0.2, density) * p3) {
            launch(w * 0.15 + Math.random() * w * 0.7, h * 0.15 + Math.random() * h * 0.42);
          }

          for (let i = sim.extra.rockets.length - 1; i >= 0; i--) {
            const rk = sim.extra.rockets[i];
            rk.x += (rk.tx - rk.x) * 0.08 * speed;
            rk.y += (rk.ty - rk.y) * 0.08 * speed;
            ctx.fillStyle = '#fff3c4';
            ctx.beginPath();
            ctx.arc(rk.x, rk.y, 2.5 * size * p2, 0, Math.PI * 2);
            ctx.fill();

            if (Math.hypot(rk.tx - rk.x, rk.ty - rk.y) < 12) {
              const sparkCount = Math.min(240, Math.max(12, Math.floor(85 * Math.max(0.2, density))));
              for (let k = 0; k < sparkCount; k++) {
                const ang = (k / sparkCount) * Math.PI * 2 + Math.random() * 0.1;
                const spd = (1.5 + Math.random() * 4.5) * p1;
                sim.extra.sparks.push({
                  x: rk.x,
                  y: rk.y,
                  vx: Math.cos(ang) * spd,
                  vy: Math.sin(ang) * spd,
                  life: 1.0,
                  hue: rk.hue + (Math.random() - 0.5) * 35
                });
              }
              sim.extra.rockets.splice(i, 1);
            }
          }

          for (let i = sim.extra.sparks.length - 1; i >= 0; i--) {
            const sp = sim.extra.sparks[i];
            sp.x += sp.vx * speed;
            sp.y += sp.vy * speed;
            sp.vy += 0.045 * speed;
            sp.vx *= 0.97;
            sp.vy *= 0.97;
            sp.life -= dt * 0.65;
            if (sp.life <= 0) {
              sim.extra.sparks.splice(i, 1);
            } else {
              ctx.fillStyle = getArtColor(sp.hue, 95, 65, sp.life * glow, i);
              ctx.beginPath();
              ctx.arc(sp.x, sp.y, 2.2 * size * p2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #15: 錦秋の紅葉・枝垂れと舞い散る落葉
        // ------------------------------------------------------------------------
        case 'momiji': {
          ctx.globalCompositeOperation = 'source-over';
          const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.25, 20, w * 0.5, h * 0.4, Math.max(w, h) * 0.8);
          bgGrad.addColorStop(0, getArtColor(16, 65, 13, 1, 0));
          bgGrad.addColorStop(1, '#040307');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(-w, -h, w * 3, h * 3);

          ctx.strokeStyle = 'rgba(32, 18, 16, 0.85)';
          ctx.lineCap = 'round';
          for (let b = 0; b < sim.extra.branches.length; b++) {
            const br = sim.extra.branches[b];
            const sway = Math.sin(state.time * 1.1 * speed + br.swayPhase) * 8;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.moveTo(br.startX, br.startY);
            ctx.quadraticCurveTo(br.cpX + sway * 0.5, br.cpY, br.endX + sway, br.endY);
            ctx.stroke();
          }

          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < sim.items.length; i++) {
            const lf = sim.items[i];
            const swayX = Math.sin(state.time * 1.1 * speed + lf.swayPhase) * 6;
            const swayRot = lf.rot + Math.sin(state.time * 1.4 * speed + lf.swayPhase) * 0.14;
            const lx = lf.baseX + swayX;
            const ly = lf.baseY;
            const sz = lf.size * size * p1;

            const distCursor = ptr.active ? Math.hypot(lx - ptr.x, ly - ptr.y) : 9999;
            const touchGlow = distCursor < 170 * reactivity ? (1 - distCursor / (170 * reactivity)) * 22 : 0;

            const lightVal = Math.min(76, lf.lightness * (0.75 + 0.25 * p3) + touchGlow);
            const fillCol = getArtColor(lf.hue, 94, lightVal, Math.min(0.95, 0.78 * glow), i);
            const edgeCol = getArtColor(lf.hue + 14, 98, Math.min(84, lightVal + 14), Math.min(0.85, 0.45 * glow * p3), i);

            drawMapleLeaf(lx, ly, sz, swayRot, lf.lobes, fillCol, edgeCol);
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const fl = sim.particles[i];
            fl.x += (fl.vx + Math.sin(state.time * 1.2 + fl.swayPhase) * 0.45 + (ptr.isDown ? ptr.vx * 0.04 * reactivity : 0)) * speed;
            fl.y += fl.vy * speed;
            fl.rot += fl.rotSpeed * speed;
            if (fl.y > h + 25) {
              fl.y = -20;
              fl.x = Math.random() * w;
            }
            if (fl.x < -30) fl.x = w + 30;
            if (fl.x > w + 30) fl.x = -30;

            const col = getArtColor(fl.hue, 95, Math.min(78, 56 + 12 * p3), Math.min(0.96, 0.88 * glow), i);
            drawMapleLeaf(fl.x, fl.y, fl.size * size * p2, fl.rot, fl.lobes, col, null);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #16: 銀河・運河の中心への突入
        // ------------------------------------------------------------------------
        case 'galaxy_canal': {
          const cx = w * 0.5 + (ptr.active ? (ptr.x - w * 0.5) * 0.35 * reactivity : 0);
          const cy = h * 0.5 + (ptr.active ? (ptr.y - h * 0.5) * 0.35 * reactivity : 0);

          const coreR = Math.max(10, Math.min(w, h) * 0.36 * size * p1);
          const coreGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreR * glow);
          coreGrad.addColorStop(0, 'rgba(255, 253, 242, 0.98)');
          coreGrad.addColorStop(0.18, getArtColor(42, 95, 78, 0.78, 0));
          coreGrad.addColorStop(0.48, getArtColor(28, 90, 52, 0.35, 1));
          coreGrad.addColorStop(0.78, getArtColor(225, 85, 38, 0.16, 2));
          coreGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, coreR * glow, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.particles.length; i++) {
            const st = sim.particles[i];
            st.z -= st.vz * speed * 1.4;
            st.angle += 0.12 * dt * speed;
            if (st.z <= 0.04) {
              st.z = 1.0;
            }

            const perspective = 1 / (st.z * 2.4 + 0.15);
            const r = st.baseR * perspective * 0.42 * p2;
            const px = cx + Math.cos(st.angle) * r * 1.32;
            const py = cy + Math.sin(st.angle) * r * 0.68;

            if (px < -80 || px > w + 80 || py < -80 || py > h + 80) continue;

            if (st.isNebulaGlow) {
              const nr = Math.max(2, st.size * perspective * 0.55 * p2);
              const nGrad = ctx.createRadialGradient(px, py, 1, px, py, nr);
              nGrad.addColorStop(0, getArtColor(st.hue, 88, 62, 0.13 * glow, i));
              nGrad.addColorStop(1, 'transparent');
              ctx.fillStyle = nGrad;
              ctx.beginPath();
              ctx.arc(px, py, nr, 0, Math.PI * 2);
              ctx.fill();
            } else {
              const starR = Math.max(0.5, st.size * perspective * 0.42 * size * p3);
              const alpha = Math.min(1, (1.1 - st.z) * 0.95 * glow);
              if (starR > 2.2) {
                drawStarburst(px, py, starR * 2.2, getArtColor(st.hue, 92, 80, alpha, i), alpha);
              } else {
                ctx.fillStyle = getArtColor(st.hue, 90, 82, alpha, i);
                ctx.beginPath();
                ctx.arc(px, py, starR, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #17: 日食のダイヤモンドリング
        // ------------------------------------------------------------------------
        case 'eclipse': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const r = Math.max(2, Math.min(w, h) * 0.17 * size * p1);

          const coronaR = Math.max(4, r * 3.2 * glow * p2);
          const corona = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, coronaR);
          corona.addColorStop(0, getArtColor(42, 95, 78, 0.85, 0));
          corona.addColorStop(0.35, getArtColor(210, 80, 65, 0.35, 1));
          corona.addColorStop(1, 'transparent');
          ctx.fillStyle = corona;
          ctx.beginPath();
          ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * speed;
            const d = r * (1.02 + Math.sin(state.time * 2 + i) * 0.12 + (p.dist - 1) * 0.8 * p2);
            const px = cx + Math.cos(p.angle) * d;
            const py = cy + Math.sin(p.angle) * d;
            ctx.fillStyle = getArtColor(45, 95, 75, 0.65, i);
            ctx.beginPath();
            ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#020308';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalCompositeOperation = 'lighter';
          const ringAngle = ptr.active ? Math.atan2(ptr.y - cy, ptr.x - cx) : -Math.PI * 0.25 + Math.sin(state.time * 0.4) * 0.2;
          const dx = cx + Math.cos(ringAngle) * r;
          const dy = cy + Math.sin(ringAngle) * r;
          drawStarburst(dx, dy, r * 0.85 * glow * p3, getArtColor(45, 100, 82, 0.95, 0), 0.95);
          break;
        }

        // ------------------------------------------------------------------------
        // #18: 星屑のネビュラ星雲
        // ------------------------------------------------------------------------
        case 'nebula': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * speed * 12;
            const rad = p.radius * p3;
            const px = cx + Math.cos(p.angle) * rad;
            const py = cy + Math.sin(p.angle) * rad * 0.68;
            if (p.cloud) {
              const cr = Math.max(2, 45 * size * p1 * glow);
              const grad = ctx.createRadialGradient(px, py, 0, px, py, cr);
              grad.addColorStop(0, getArtColor(p.hue, 88, 55, 0.14, i));
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(px, py, cr, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = getArtColor(p.hue, 90, 78, 0.85, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size * p2 * 0.6, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #19: 黄金のグリッター・ウェーブ
        // ------------------------------------------------------------------------
        case 'glitter': {
          const waveCount = 5;
          for (let ribbon = 0; ribbon < waveCount; ribbon++) {
            const baseOffset = (ribbon - 2) * 34 * p1;
            const amp1 = h * 0.14 * p1;
            const amp2 = 36 * p1;

            ctx.beginPath();
            for (let x = 0; x <= w; x += 14) {
              const cursorPull = ptr.active
                ? Math.exp(-Math.pow((x - ptr.x) / 220, 2)) * (ptr.y - h * 0.5) * 0.45 * reactivity
                : 0;
              const y = h * 0.5 + baseOffset
                + Math.sin(x * 0.0045 + state.time * 1.15 * speed + ribbon * 0.85) * amp1
                + Math.cos(x * 0.0095 - state.time * 0.75 * speed + ribbon * 0.4) * amp2
                + cursorPull;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }

            ctx.strokeStyle = getArtColor(41 + ribbon * 4, 96, 56 + ribbon * 4, 0.16 * glow * p2, ribbon);
            ctx.lineWidth = (24 - ribbon * 2.5) * size * p1;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.strokeStyle = getArtColor(46 + ribbon * 3, 100, 78, 0.42 * glow * p2, ribbon);
            ctx.lineWidth = Math.max(0.8, (3.2 - ribbon * 0.35) * size);
            ctx.stroke();
          }

          if (p3 > 0.02) {
            for (let i = 0; i < sim.particles.length; i++) {
              const p = sim.particles[i];
              p.x += p.speed * speed * 1.15;
              if (p.x > w + 10) p.x = -10;

              const ribbon = p.waveIdx;
              const baseOffset = (ribbon - 2) * 34 * p1;
              const amp1 = h * 0.14 * p1;
              const amp2 = 36 * p1;
              const cursorPull = ptr.active
                ? Math.exp(-Math.pow((p.x - ptr.x) / 220, 2)) * (ptr.y - h * 0.5) * 0.45 * reactivity
                : 0;
              const waveY = h * 0.5 + baseOffset
                + Math.sin(p.x * 0.0045 + state.time * 1.15 * speed + ribbon * 0.85) * amp1
                + Math.cos(p.x * 0.0095 - state.time * 0.75 * speed + ribbon * 0.4) * amp2
                + cursorPull;

              const py = waveY + p.offsetY * p1 + Math.sin(state.time * 2.5 + p.phase) * 8;
              const sparkle = 0.35 + 0.65 * Math.sin(state.time * 5.2 + p.phase);
              drawStarburst(p.x, py, p.size * 2.8 * size * p3 * glow, getArtColor(p.hue, 98, 76, sparkle, i), sparkle);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #20: ダイヤモンドのプリズム閃光
        // ------------------------------------------------------------------------
        case 'diamond': {
          for (let i = 0; i < sim.items.length; i++) {
            const dm = sim.items[i];
            const rot = dm.rot + state.time * dm.rotSpeed * 20 * speed;
            const r = dm.r * size * p1;
            const angleToPtr = ptr.active ? Math.atan2(ptr.y - dm.y, ptr.x - dm.x) : state.time * 0.8;
            const brilliance = Math.pow(0.5 + 0.5 * Math.cos(rot - angleToPtr + dm.phase), 2);
            const fireHue = (dm.hue + state.time * 45 + brilliance * 140) % 360;

            ctx.save();
            ctx.translate(dm.x, dm.y);
            ctx.rotate(rot);

            ctx.fillStyle = getArtColor(fireHue, 85, 72, (0.22 + brilliance * 0.45) * glow * p2, i);
            ctx.strokeStyle = getArtColor(fireHue + 30, 95, 86, (0.45 + brilliance * 0.55) * glow, i);
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            for (let k = 0; k < 8; k++) {
              const a = (k / 8) * Math.PI * 2;
              const vx = Math.cos(a) * r;
              const vy = Math.sin(a) * r;
              if (k === 0) ctx.moveTo(vx, vy);
              else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            for (let k = 0; k < 8; k++) {
              const a = (k / 8) * Math.PI * 2;
              const vx = Math.cos(a) * r * 0.52;
              const vy = Math.sin(a) * r * 0.52;
              if (k === 0) ctx.moveTo(vx, vy);
              else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            if (brilliance > 0.65 && p3 > 0.05) {
              drawStarburst(dm.x, dm.y, r * 1.5 * brilliance * glow * p3, getArtColor(fireHue, 100, 82, brilliance, i), brilliance);
            }
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const tw = Math.pow(0.5 + 0.5 * Math.sin(state.time * 4.5 + p.phase), 3);
            if (tw > 0.4) {
              drawStarburst(p.x, p.y, p.size * 2.5 * size * p3 * glow * tw, getArtColor(p.hue + state.time * 30, 95, 80, tw, i), tw);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #21: 妖精の光の粉・フェアリーダスト
        // ------------------------------------------------------------------------
        case 'fairydust': {
          const fx = ptr.active ? ptr.x : w * 0.5 + Math.cos(state.time * 1.3 * speed) * (w * 0.25);
          const fy = ptr.active ? ptr.y : h * 0.5 + Math.sin(state.time * 1.9 * speed) * (h * 0.2);

          drawStarburst(fx, fy, 32 * size * p1 * glow, getArtColor(state.time * 60, 95, 80, 0.95, 0), 0.95);

          const spawnCount = Math.min(18, Math.ceil(3 * Math.max(0.2, density)));
          for (let k = 0; k < spawnCount; k++) {
            sim.particles.push({
              x: fx + (Math.random() - 0.5) * 16 * p3,
              y: fy + (Math.random() - 0.5) * 16 * p3,
              vx: (Math.random() - 0.5) * 2.5 * p3,
              vy: (Math.random() - 0.5) * 2.5 * p3 + 0.4,
              size: 1.5 + Math.random() * 3,
              hue: (state.time * 80 + Math.random() * 90) % 360,
              phase: Math.random() * Math.PI * 2,
              life: 1.0
            });
          }
          if (sim.particles.length > 500) sim.particles.splice(0, sim.particles.length - 500);

          for (let i = sim.particles.length - 1; i >= 0; i--) {
            const p = sim.particles[i];
            p.x += p.vx * speed;
            p.y += p.vy * speed;
            if (p.life !== undefined) {
              p.life -= dt * 0.7;
              if (p.life <= 0) { sim.particles.splice(i, 1); continue; }
            }
            const a = p.life !== undefined ? p.life : (0.5 + 0.5 * Math.sin(state.time * 4 + p.phase));
            drawStarburst(p.x, p.y, p.size * 2.6 * size * p2 * glow, getArtColor(p.hue, 92, 72, a, i), a);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #22: 聖なる光の放射線・ゴッドレイ
        // ------------------------------------------------------------------------
        case 'radial_rays': {
          const ox = ptr.active ? ptr.x : w * 0.5 + Math.cos(state.time * 0.4) * 50;
          const oy = ptr.active ? ptr.y : h * 0.45 + Math.sin(state.time * 0.5) * 40;
          const maxLen = Math.hypot(w, h) * 1.1;

          for (let i = 0; i < sim.items.length; i++) {
            const ray = sim.items[i];
            const ang = ray.angle + state.time * ray.speed * speed;
            const halfW = ray.width * size * p2 * (0.75 + 0.25 * Math.sin(state.time * 2 + ray.phase));
            const grad = ctx.createLinearGradient(ox, oy, ox + Math.cos(ang) * maxLen, oy + Math.sin(ang) * maxLen);
            grad.addColorStop(0, getArtColor(ray.hue, 95, 76, 0.34 * glow, i));
            grad.addColorStop(0.55, getArtColor(ray.hue + 20, 88, 62, 0.12 * glow, i));
            grad.addColorStop(1, 'transparent');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(ox + Math.cos(ang - halfW) * maxLen, oy + Math.sin(ang - halfW) * maxLen);
            ctx.lineTo(ox + Math.cos(ang + halfW) * maxLen, oy + Math.sin(ang + halfW) * maxLen);
            ctx.closePath();
            ctx.fill();
          }

          const coreR = Math.max(4, 140 * size * p1 * glow);
          const coreGrad = ctx.createRadialGradient(ox, oy, 2, ox, oy, coreR);
          coreGrad.addColorStop(0, 'rgba(255, 255, 245, 0.98)');
          coreGrad.addColorStop(0.3, getArtColor(45, 98, 72, 0.65, 0));
          coreGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(ox, oy, coreR, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.dist += p.speed * dt * speed;
            if (p.dist > maxLen * 0.75) p.dist = 10;
            const px = ox + Math.cos(p.angle) * p.dist;
            const py = oy + Math.sin(p.angle) * p.dist;
            drawStarburst(px, py, p.size * 2.4 * size * p3 * glow, getArtColor(p.hue, 95, 78, 0.8, i), 0.8);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #23: 深淵のブラックホールと降着円盤
        // ------------------------------------------------------------------------
        case 'blackhole': {
          const cx = w * 0.5 + (ptr.active ? (ptr.x - w * 0.5) * 0.18 * reactivity : 0);
          const cy = h * 0.5 + (ptr.active ? (ptr.y - h * 0.5) * 0.18 * reactivity : 0);
          const bhR = Math.max(2, Math.min(w, h) * 0.13 * size * p1);

          const lensR = Math.max(4, bhR * 3.4 * glow * p3);
          const lensGrad = ctx.createRadialGradient(cx, cy, bhR * 0.95, cx, cy, lensR);
          lensGrad.addColorStop(0, getArtColor(32, 98, 76, 0.92, 0));
          lensGrad.addColorStop(0.25, getArtColor(24, 95, 58, 0.45, 1));
          lensGrad.addColorStop(0.6, getArtColor(265, 80, 42, 0.16, 2));
          lensGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = lensGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, lensR, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * dt * speed;
            const r = bhR * (1 + (p.orbitR - 1) * p2);
            const px = cx + Math.cos(p.angle) * r * 1.45;
            const sinA = Math.sin(p.angle);
            const py = sinA < 0
              ? cy + sinA * r * 0.72 - Math.abs(Math.cos(p.angle)) * bhR * 0.15
              : cy + sinA * r * 0.34;

            if (sinA < 0) {
              ctx.fillStyle = getArtColor(p.hue, 96, 72, 0.78 * glow, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#010103';
          ctx.beginPath();
          ctx.arc(cx, cy, bhR, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = getArtColor(38, 100, 82, 0.92 * glow * p3, 0);
          ctx.lineWidth = Math.max(1, 2.5 * size * p3);
          ctx.beginPath();
          ctx.arc(cx, cy, bhR * 1.03, 0, Math.PI * 2);
          ctx.stroke();

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const sinA = Math.sin(p.angle);
            if (sinA >= 0) {
              const r = bhR * (1 + (p.orbitR - 1) * p2);
              const px = cx + Math.cos(p.angle) * r * 1.45;
              const py = cy + sinA * r * 0.34;
              ctx.fillStyle = getArtColor(p.hue + 6, 98, 76, 0.9 * glow, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * 1.15 * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #24: プリズム・クリスタル・シャンデリア
        // ------------------------------------------------------------------------
        case 'chandelier': {
          const cx = w * 0.5;
          const cy = h * 0.42;
          const maxR = Math.min(w, h) * 0.38 * p2;

          for (let i = 0; i < sim.items.length; i++) {
            const c = sim.items[i];
            const dir = c.ring % 2 === 0 ? 1 : -1;
            const ang = c.angle + state.time * 0.25 * dir * speed;
            const rx = (c.ring / 4) * maxR;
            const ry = rx * 0.48;
            const px = cx + Math.cos(ang) * rx;
            const py = cy + Math.sin(ang) * ry + c.ring * 18 * p2;

            const pulse = 0.5 + 0.5 * Math.sin(state.time * 4 + c.sparkle);
            const hue = (c.hue + state.time * 30 + (ptr.active ? ptr.x * 0.2 : 0)) % 360;
            drawStarburst(px, py, c.size * size * p1 * (1.5 + pulse * 1.4) * glow * p3, getArtColor(hue, 95, 78, 0.85, i), 0.85);
          }
          break;
        }
      }

      ctx.restore();

      ptr.justClicked = false;
      ptr.vx *= 0.85;
      ptr.vy *= 0.85;
    }

    // アニメーションループ管理
    let lastTime = performance.now();
    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!state.isPaused) {
        state.time += dt * state.params.speed;
        renderFrame(dt);
      }
      requestAnimationFrame(animate);
    }

    // ============================================================================
    // UIインタラクション・ギャラリー生成・イベントリスナー
    // ============================================================================
    function renderGalleryGrid() {
      artGrid.innerHTML = '';
      const filtered = state.activeCategory === 'all'
        ? ARTWORKS
        : ARTWORKS.filter(a => a.cat === state.activeCategory);

      filtered.forEach((art) => {
        const idx = ARTWORKS.findIndex(item => item.id === art.id);
        const isCurrent = idx === state.currentArtIndex;
        const card = document.createElement('button');
        card.className = `glass-card text-left rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden group active:scale-[0.98] ${isCurrent ? 'ring-2 ring-amber-300' : ''}`;
        card.innerHTML = `
          <div class="absolute inset-0 bg-gradient-to-br ${art.grad} opacity-50 group-hover:opacity-80 transition-opacity pointer-events-none"></div>
          <div class="relative z-10">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-black/40 text-slate-200 border border-white/10">
                ${art.catLabel}
              </span>
              <span class="text-xs font-mono text-white/70">#${String(art.num).padStart(2, '0')}</span>
            </div>
            <h3 class="text-base font-bold text-white group-hover:text-amber-200 transition">${art.title}</h3>
            <p class="text-[11px] text-slate-300/80 font-light mb-2">${art.en}</p>
            <p class="text-xs text-slate-200/90 leading-relaxed line-clamp-2">${art.desc}</p>
          </div>
          <div class="relative z-10 mt-3 pt-2.5 border-t border-white/10 flex items-center justify-between text-[11px] text-amber-200">
            <span>${isCurrent ? '● 選択中' : 'タップして鑑賞する'}</span>
            <span class="group-hover:translate-x-1 transition-transform">→</span>
          </div>
        `;
        card.addEventListener('click', () => {
          selectArtwork(idx);
          closeGalleryMenu();
        });
        artGrid.appendChild(card);
      });
    }

    function selectArtwork(index) {
      state.currentArtIndex = index;
      const art = ARTWORKS[index];
      // 作品切替時はパーツ別パラメータを初期値（1.0）へ
      state.params.parts = { p1: 1.0, p2: 1.0, p3: 1.0 };
      document.getElementById('hudCategoryBadge').textContent = art.catLabel;
      document.getElementById('hudArtTitle').textContent = `${art.num}. ${art.title}`;
      document.getElementById('hudArtHint').textContent = art.hint;
      initCurrentArtwork();
      buildControlSliders();
      renderGalleryGrid();
    }

    function openGalleryMenu() {
      state.isMenuOpen = true;
      galleryModal.classList.remove('opacity-0', 'pointer-events-none');
      renderGalleryGrid();
    }

    function closeGalleryMenu() {
      state.isMenuOpen = false;
      galleryModal.classList.add('opacity-0', 'pointer-events-none');
    }

    function toggleControls(forceState) {
      state.isControlsOpen = forceState !== undefined ? forceState : !state.isControlsOpen;
      if (state.isControlsOpen) {
        controlPanel.classList.remove('translate-y-full', 'md:translate-x-[120%]');
      } else {
        controlPanel.classList.add('translate-y-full', 'md:translate-x-[120%]');
      }
    }

    // イベントバインド
    document.getElementById('openMenuBtn').addEventListener('click', openGalleryMenu);
    document.getElementById('closeMenuBtn').addEventListener('click', closeGalleryMenu);
    document.getElementById('randomArtBtn').addEventListener('click', () => {
      const nextIdx = Math.floor(Math.random() * ARTWORKS.length);
      selectArtwork(nextIdx);
      closeGalleryMenu();
      showToast(`「${ARTWORKS[nextIdx].title}」を表示しました`);
    });

    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.activeCategory = tab.dataset.cat;
        document.querySelectorAll('.cat-tab').forEach(t => {
          t.classList.remove('bg-white', 'text-slate-950', 'shadow');
          t.classList.add('bg-white/10', 'text-slate-200');
        });
        tab.classList.remove('bg-white/10', 'text-slate-200');
        tab.classList.add('bg-white', 'text-slate-950', 'shadow');
        renderGalleryGrid();
      });
    });

    document.getElementById('toggleControlsBtn').addEventListener('click', () => toggleControls());
    document.getElementById('closeControlsBtn').addEventListener('click', () => toggleControls(false));

    document.getElementById('hideUiBtn').addEventListener('click', () => {
      state.isUiHidden = true;
      topHud.classList.add('opacity-0', 'pointer-events-none');
      toggleControls(false);
      restoreUiBtn.classList.remove('opacity-0', 'pointer-events-none');
      showToast('純粋鑑賞モード（右下のボタンでUI復帰）');
    });
    restoreUiBtn.addEventListener('click', () => {
      state.isUiHidden = false;
      topHud.classList.remove('opacity-0', 'pointer-events-none');
      restoreUiBtn.classList.add('opacity-0', 'pointer-events-none');
    });

    document.getElementById('screenshotBtn').addEventListener('click', () => {
      try {
        const link = document.createElement('a');
        const art = ARTWORKS[state.currentArtIndex];
        link.download = `luminous-${art.id}-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('美しい光景を画像として保存しました');
      } catch (e) {
        showToast('画像の保存に失敗しました');
      }
    });

    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.params.palette = btn.dataset.palette;
        buildControlSliders();
      });
    });

    document.getElementById('randomParamBtn').addEventListener('click', () => {
      const palKeys = Object.keys(PALETTES);
      state.params.palette = palKeys[Math.floor(Math.random() * palKeys.length)];
      state.params.hueShift = Math.floor(Math.random() * 360);
      state.params.size = Number((0.6 + Math.random() * 1.4).toFixed(2));
      state.params.scale = Number((0.7 + Math.random() * 0.8).toFixed(2));
      state.params.density = Number((0.6 + Math.random() * 1.4).toFixed(2));
      state.params.glow = Number((0.7 + Math.random() * 1.3).toFixed(2));
      state.params.speed = Number((0.5 + Math.random() * 1.5).toFixed(2));
      state.params.parts = {
        p1: Number((0.6 + Math.random() * 1.4).toFixed(2)),
        p2: Number((0.6 + Math.random() * 1.4).toFixed(2)),
        p3: Number((0.6 + Math.random() * 1.4).toFixed(2))
      };
      initCurrentArtwork();
      buildControlSliders();
      showToast('光のパラメータをランダムに設定しました');
    });

    document.getElementById('pauseBtn').addEventListener('click', (e) => {
      state.isPaused = !state.isPaused;
      e.target.textContent = state.isPaused ? '▶ 再生' : '⏸ 一時停止';
    });

    document.getElementById('resetParamBtn').addEventListener('click', () => {
      state.params = {
        palette: 'original',
        hueShift: 0,
        size: 1.0,
        scale: 1.0,
        density: 1.0,
        glow: 1.0,
        speed: 1.0,
        reactivity: 1.0,
        parts: { p1: 1.0, p2: 1.0, p3: 1.0 }
      };
      initCurrentArtwork();
      buildControlSliders();
      showToast('パラメータを初期値（100%）に戻しました');
    });

    function updatePointer(x, y, isDown, clicked = false) {
      state.pointer.vx = x - state.pointer.x;
      state.pointer.vy = y - state.pointer.y;
      state.pointer.x = x;
      state.pointer.y = y;
      state.pointer.isDown = isDown;
      state.pointer.active = true;
      if (clicked) state.pointer.justClicked = true;
    }

    canvas.addEventListener('mousemove', (e) => {
      updatePointer(e.clientX, e.clientY, e.buttons > 0, false);
    });
    canvas.addEventListener('mousedown', (e) => {
      updatePointer(e.clientX, e.clientY, true, true);
    });
    window.addEventListener('mouseup', () => {
      state.pointer.isDown = false;
    });
    canvas.addEventListener('mouseleave', () => {
      state.pointer.active = false;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        updatePointer(t.clientX, t.clientY, true, true);
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        updatePointer(t.clientX, t.clientY, true, false);
      }
    }, { passive: true });
    canvas.addEventListener('touchend', () => {
      state.pointer.isDown = false;
      state.pointer.active = false;
    });

    // 起動処理（トップ画面は全24作品のギャラリー選択モーダルを表示）
    window.onload = function () {
      resizeCanvas();
      selectArtwork(0);
      openGalleryMenu();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
