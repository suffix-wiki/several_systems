        case 'sunset': {
          // #12: 黄昏のマジックアワーと夕焼け雲
          for (let i = 0; i < Math.max(5, Math.floor(11 * d)); i++) {
            sim.items.push({
              x: Math.random() * w,
              y: h * (0.14 + Math.random() * 0.38),
              vx: 0.25 + Math.random() * 0.45,
              w: 110 + Math.random() * 160,
              h: 16 + Math.random() * 20,
              hue: 12 + Math.random() * 28
            });
          }
          for (let i = 0; i < Math.floor(75 * d); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: h * (0.64 + Math.random() * 0.36),
              w: 16 + Math.random() * 44,
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
        case 'planetarium': {
          // #13: 満天のプラネタリウムと天の川
          sim.extra.rot = 0;
          const count = Math.floor(360 * d);
          for (let i = 0; i < count; i++) {
            const isMilkyWay = i < count * 0.45;
            const angle = Math.random() * Math.PI * 2;
            const spread = isMilkyWay ? (Math.random() - 0.5) * 0.35 : (Math.random() - 0.5) * Math.PI;
            sim.particles.push({
              angle,
              spread,
              r: isMilkyWay ? (0.6 + Math.random() * 1.6) : (0.8 + Math.random() * 2.4),
              twinkle: Math.random() * Math.PI * 2,
              hue: isMilkyWay ? (210 + Math.random() * 60) : (40 + Math.random() * 180)
            });
          }
          sim.extra.meteors = [];
          break;
        }
        case 'fireworks': {
          // #14: 夜空の大輪・打ち上げ花火
          sim.extra.rockets = [];
          sim.extra.sparks = [];
          break;
        }
        case 'momiji': {
          // #15: 夜空に舞うライトアップ紅葉
          const count = Math.floor(135 * d);
          for (let i = 0; i < count; i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: -0.4 - Math.random() * 0.9,
              vy: 0.65 + Math.random() * 1.2,
              rot: Math.random() * Math.PI * 2,
              rotSpeed: (Math.random() - 0.5) * 0.05,
              swayPhase: Math.random() * Math.PI * 2,
              size: 9 + Math.random() * 9,
              hue: [4, 16, 28, 38, 352][i % 5] + Math.random() * 8
            });
          }
          break;
        }
        case 'galaxy_canal': {
          // #16: 星屑が流れる銀河の運河
          const count = Math.floor(340 * d);
          for (let i = 0; i < count; i++) {
            sim.particles.push({
              x: Math.random() * w,
              offsetY: (Math.random() - 0.5) * (h * 0.34),
              speed: 0.8 + Math.random() * 1.9,
              size: 1.0 + Math.random() * 2.8,
              phase: Math.random() * Math.PI * 2,
              hue: [195, 225, 265, 310, 48][i % 5] + Math.random() * 25
            });
          }
          break;
        }
        case 'eclipse': {
          // #17: 日食のダイヤモンドリング
          for (let i = 0; i < Math.floor(140 * d); i++) {
            sim.particles.push({
              angle: Math.random() * Math.PI * 2,
              dist: 1 + Math.random() * 0.8,
              speed: 0.005 + Math.random() * 0.015,
              size: 1 + Math.random() * 2.5
            });
          }
          break;
        }
        case 'nebula': {
          // #18: 星屑のネビュラ星雲
          for (let i = 0; i < Math.floor(240 * d); i++) {
            const arm = i % 3;
            const radius = 15 + Math.random() * (Math.min(w, h) * 0.45);
            const angle = (arm * (Math.PI * 2 / 3)) + radius * 0.012 + (Math.random() - 0.5) * 0.7;
            sim.particles.push({
              radius,
              angle,
              speed: (0.002 + (1 / (radius + 30)) * 0.25),
              size: 1.5 + Math.random() * 4,
              cloud: i % 4 === 0,
              hue: [280, 210, 330, 45][arm % 4] + Math.random() * 35
            });
          }
          break;
        }
        case 'glitter': {
          // #19: 黄金のグリッター・ストリーム
          for (let i = 0; i < Math.floor(260 * d); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              phase: Math.random() * Math.PI * 2,
              speed: 0.8 + Math.random() * 1.8,
              size: 1 + Math.random() * 3.5,
              hue: 38 + Math.random() * 20
            });
          }
          break;
        }
        case 'diamond': {
          // #20: ダイヤモンドのプリズム閃光
          const facetCount = Math.max(14, Math.floor(32 * d));
          for (let i = 0; i < facetCount; i++) {
            const ring = (i % 4) + 1;
            sim.items.push({
              x: w * (0.12 + Math.random() * 0.76),
              y: h * (0.12 + Math.random() * 0.76),
              r: (14 + Math.random() * 24) * (1 - ring * 0.1),
              rot: Math.random() * Math.PI * 2,
              rotSpeed: (Math.random() - 0.5) * 0.025,
              phase: Math.random() * Math.PI * 2,
              hue: (i * 53) % 360
            });
          }
          for (let i = 0; i < Math.floor(90 * d); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              phase: Math.random() * Math.PI * 2,
              size: 2 + Math.random() * 4,
              hue: (i * 37) % 360
            });
          }
          break;
        }
        case 'fairydust': {
          // #21: 妖精の光の粉・フェアリーダスト
          sim.extra.trail = [];
          for (let i = 0; i < Math.floor(150 * d); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 1.2,
              vy: (Math.random() - 0.5) * 1.2,
              size: 1.5 + Math.random() * 3,
              hue: Math.random() * 360,
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
        case 'radial_rays': {
          // #22: 聖なる光の放射線・ゴッドレイ
          const rayCount = Math.max(16, Math.floor(38 * d));
          for (let i = 0; i < rayCount; i++) {
            sim.items.push({
              angle: (i / rayCount) * Math.PI * 2,
              width: 0.015 + Math.random() * 0.045,
              speed: (i % 2 === 0 ? 1 : -1) * (0.08 + Math.random() * 0.14),
              phase: Math.random() * Math.PI * 2,
              hue: 36 + (i * 19) % 180
            });
          }
          for (let i = 0; i < Math.floor(110 * d); i++) {
            sim.particles.push({
              dist: 20 + Math.random() * (Math.hypot(w, h) * 0.6),
              angle: Math.random() * Math.PI * 2,
              speed: 35 + Math.random() * 75,
              size: 1.5 + Math.random() * 2.5,
              hue: 42 + Math.random() * 45
            });
          }
          break;
        }
        case 'blackhole': {
          // #23: 深淵のブラックホールと降着円盤
          const count = Math.floor(320 * d);
          for (let i = 0; i < count; i++) {
            const orbitR = 1.18 + Math.pow(Math.random(), 1.4) * 2.4;
            sim.particles.push({
              orbitR,
              angle: Math.random() * Math.PI * 2,
              speed: (1.6 / Math.pow(orbitR, 1.2)) * (0.85 + Math.random() * 0.3),
              size: 1.4 + Math.random() * 2.6,
              hue: 16 + (3.6 - orbitR) * 14 + Math.random() * 12
            });
          }
          break;
        }
        case 'chandelier': {
          // #24: プリズム・クリスタル・シャンデリア
          for (let ring = 1; ring <= 4; ring++) {
            const count = Math.max(6, Math.floor(ring * 10 * d));
            for (let i = 0; i < count; i++) {
              sim.items.push({
                ring,
                angle: (i / count) * Math.PI * 2,
                size: 6 + ring * 2.5,
                sparkle: Math.random() * Math.PI * 2,
                hue: (i * 36) % 360
              });
            }
          }
          break;
        }
      }
    }

    // 十字スターバースト描画ヘルパー
    function drawStarburst(x, y, radius, color, alpha = 0.8) {
      if (radius <= 0.4) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.25, color);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      // 鋭い十字の閃光
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, radius * 0.06);
      ctx.beginPath();
      ctx.moveTo(-radius * 1.6, 0);
      ctx.lineTo(radius * 1.6, 0);
      ctx.moveTo(0, -radius * 1.6);
      ctx.lineTo(0, radius * 1.6);
      ctx.stroke();
      ctx.restore();
    }

    // ============================================================================
    // メイン描画ループ（全24作品のレンダリングスイッチ — 省略なし完全実装）
    // ============================================================================
    function renderFrame(dt) {
      const art = ARTWORKS[state.currentArtIndex];
      const w = state.width;
      const h = state.height;
      const { density, glow, speed, size, reactivity } = state.params;
      const ptr = state.pointer;

      // 背景クリア（残像効果のある作品は半透明オーバーレイ）
      ctx.globalCompositeOperation = 'source-over';
      if (art.id === 'fireworks' || art.id === 'glitter' || art.id === 'fairydust' || art.id === 'butterflies') {
        ctx.fillStyle = 'rgba(3, 5, 12, 0.22)';
      } else if (art.id === 'bioluminescence' || art.id === 'nebula' || art.id === 'seafirefly') {
        ctx.fillStyle = 'rgba(2, 6, 16, 0.26)';
      } else {
        ctx.fillStyle = '#03050c';
      }
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = 'lighter';

      switch (art.id) {
        // ------------------------------------------------------------------------
        // #1: 呼応するランプの森
        // ------------------------------------------------------------------------
        case 'lamps': {
          const items = sim.items;
          for (let i = 0; i < items.length; i++) {
            const lamp = items[i];
            lamp.y = lamp.baseY + Math.sin(state.time * 1.2 + lamp.phase) * 14;
            if (lamp.cooldown > 0) lamp.cooldown -= dt;

            const dx = ptr.x - lamp.x;
            const dy = ptr.y - lamp.y;
            const dist = Math.hypot(dx, dy);
            if (ptr.active && dist < 110 * reactivity && lamp.cooldown <= 0) {
              lamp.energy = 1.0;
              lamp.hue = (lamp.hue + 55) % 360;
              lamp.cooldown = 0.8;
              sim.ripples.push({ x: lamp.x, y: lamp.y, r: lamp.radius, maxR: 260, hue: lamp.hue, alpha: 0.9 });
            }
            lamp.energy = Math.max(0.22, lamp.energy - dt * 0.45);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(lamp.x, 0);
            ctx.lineTo(lamp.x, lamp.y - lamp.radius * size);
            ctx.stroke();

            const r = lamp.radius * size * (0.9 + lamp.energy * 0.45);
            const haloR = r * (3.2 * glow);
            const grad = ctx.createRadialGradient(lamp.x, lamp.y, r * 0.1, lamp.x, lamp.y, haloR);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.25, getArtColor(lamp.hue, 90, 62, 0.85 * lamp.energy, i));
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(lamp.x, lamp.y, haloR, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = getArtColor(lamp.hue, 85, 75, 0.95, i);
            ctx.beginPath();
            ctx.ellipse(lamp.x, lamp.y, r * 0.78, r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const rp = sim.ripples[i];
            rp.r += 240 * dt * speed;
            rp.alpha -= dt * 0.7;
            for (const lamp of items) {
              const d = Math.hypot(lamp.x - rp.x, lamp.y - rp.y);
              if (Math.abs(d - rp.r) < 18 && lamp.cooldown <= 0) {
                lamp.energy = 1.0;
                lamp.hue = (rp.hue + 25) % 360;
                lamp.cooldown = 1.1;
              }
            }
            if (rp.alpha <= 0) {
              sim.ripples.splice(i, 1);
            } else {
              ctx.strokeStyle = getArtColor(rp.hue, 90, 65, rp.alpha * 0.45);
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #2: 境界のない結晶世界
        // ------------------------------------------------------------------------
        case 'crystal': {
          sim.extra.rotY += 0.35 * dt * speed + (ptr.isDown ? ptr.vx * 0.005 : 0);
          sim.extra.rotX = 0.25 + Math.sin(state.time * 0.4) * 0.15 + (ptr.active ? ((ptr.y / h) - 0.5) * 0.5 * reactivity : 0);
          const cosY = Math.cos(sim.extra.rotY);
          const sinY = Math.sin(sim.extra.rotY);
          const cosX = Math.cos(sim.extra.rotX);
          const sinX = Math.sin(sim.extra.rotX);
          const fov = 480;

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            let x1 = p.x * cosY - p.z * sinY;
            let z1 = p.z * cosY + p.x * sinY;
            let y1 = p.y * cosX - z1 * sinX;
            let z2 = z1 * cosX + p.y * sinX + 550;

            if (z2 < 40) continue;
            const scale = fov / z2;
            const sx = w * 0.5 + x1 * scale;
            const sy = h * 0.5 + y1 * scale;

            const pulse = 0.5 + 0.5 * Math.sin(state.time * 3 + p.phase);
            const r = (2.5 + pulse * 4) * scale * size;

            const lineH = 55 * scale * glow;
            const grad = ctx.createLinearGradient(sx, sy - lineH, sx, sy + lineH);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(0.5, getArtColor(p.hue + state.time * 25, 90, 68, 0.55 * pulse, i));
            grad.addColorStop(1, 'transparent');
            ctx.strokeStyle = grad;
            ctx.lineWidth = Math.max(1, r * 0.7);
            ctx.beginPath();
            ctx.moveTo(sx, sy - lineH);
            ctx.lineTo(sx, sy + lineH);
            ctx.stroke();

            ctx.fillStyle = getArtColor(p.hue + state.time * 25, 80, 82, 0.9, i);
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #3: 花と人のデジタル滝
        // ------------------------------------------------------------------------
        case 'waterfall': {
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.y += p.vy * speed * 1.4;
            p.x += p.vx;
            p.vx *= 0.92;

            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = p.y - ptr.y;
              const dist = Math.hypot(dx, dy);
              const blockR = 65 * reactivity;
              if (dist < blockR && dist > 0.1) {
                p.vx += (dx / dist) * 2.2;
                if (Math.random() < 0.04) {
                  sim.items.push({
                    x: p.x,
                    y: p.y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -1 - Math.random() * 2,
                    r: 4 + Math.random() * 6,
                    life: 1.0,
                    hue: 320 + Math.random() * 60
                  });
                }
              }
            }

            if (p.y > h + 20) {
              p.y = -20;
              p.x = Math.random() * w;
              p.vx = 0;
            }

            ctx.strokeStyle = getArtColor(p.hue, 85, 65, 0.45 * glow, i);
            ctx.lineWidth = 2 * size;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 1.5, p.y - p.len * size);
            ctx.stroke();
          }

          for (let i = sim.items.length - 1; i >= 0; i--) {
            const fl = sim.items[i];
            fl.x += fl.vx * speed;
            fl.y += fl.vy * speed;
            fl.vy += 0.04;
            fl.life -= dt * 0.55;
            if (fl.life <= 0) {
              sim.items.splice(i, 1);
            } else {
              drawStarburst(fl.x, fl.y, fl.r * size * 1.6, getArtColor(fl.hue, 90, 70, fl.life, i), fl.life);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #4: 浮遊する光の球体群
        // ------------------------------------------------------------------------
        case 'spheres': {
          const items = sim.items;
          for (let i = 0; i < items.length; i++) {
            const s = items[i];
            const rad = s.r * size;
            s.x += s.vx * speed;
            s.y += s.vy * speed;

            if (s.x < rad) { s.x = rad; s.vx *= -1; }
            if (s.x > w - rad) { s.x = w - rad; s.vx *= -1; }
            if (s.y < rad) { s.y = rad; s.vy *= -1; }
            if (s.y > h - rad) { s.y = h - rad; s.vy *= -1; }

            if (ptr.active) {
              const dx = s.x - ptr.x;
              const dy = s.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < rad + 45 * reactivity && d > 0.1) {
                s.vx += (dx / d) * 0.45 * reactivity;
                s.vy += (dy / d) * 0.45 * reactivity;
                s.hue = (s.hue + 3) % 360;
                s.pulse = 1.0;
              }
            }
            s.vx *= 0.992;
            s.vy *= 0.992;
            s.pulse = Math.max(0, s.pulse - dt * 1.5);

            const drawR = rad * (1 + s.pulse * 0.25);
            const grad = ctx.createRadialGradient(s.x - drawR * 0.3, s.y - drawR * 0.3, drawR * 0.05, s.x, s.y, drawR * (1.3 * glow));
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.35, getArtColor(s.hue, 90, 65, 0.85, i));
            grad.addColorStop(0.75, getArtColor(s.hue + 30, 85, 45, 0.4, i));
            grad.addColorStop(1, 'transparent');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(s.x, s.y, drawR * 1.3 * glow, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #5: 群蝶のデジタル空間
        // ------------------------------------------------------------------------
        case 'butterflies': {
          for (let i = 0; i < sim.items.length; i++) {
            const b = sim.items[i];
            if (ptr.active) {
              const targetAngle = Math.atan2(ptr.y - b.y, ptr.x - b.x);
              const diff = Math.atan2(Math.sin(targetAngle - b.angle), Math.cos(targetAngle - b.angle));
              b.angle += diff * 0.04 * reactivity;
            } else {
              b.angle += Math.sin(state.time * 1.4 + i) * 0.03;
            }

            b.x += Math.cos(b.angle) * b.speed * speed;
            b.y += Math.sin(b.angle) * b.speed * speed;
            if (b.x < -30) b.x = w + 30;
            if (b.x > w + 30) b.x = -30;
            if (b.y < -30) b.y = h + 30;
            if (b.y > h + 30) b.y = -30;

            const flap = Math.abs(Math.sin(state.time * b.wingSpeed * speed + b.wingPhase));
            const sz = b.size * size;
            const col = getArtColor(b.hue + Math.sin(state.time + i) * 20, 92, 68, 0.78 * glow, i);

            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.angle + Math.PI * 0.5);
            ctx.fillStyle = col;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.8;

            // 左右の羽
            for (const side of [-1, 1]) {
              ctx.save();
              ctx.scale(side * (0.25 + flap * 0.85), 1);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.bezierCurveTo(sz * 1.4, -sz * 1.2, sz * 1.6, sz * 0.3, 0, sz * 0.3);
              ctx.bezierCurveTo(sz * 1.2, sz * 0.5, sz * 0.9, sz * 1.4, 0, sz * 0.8);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #6: 万華鏡の幾何学プリズム
        // ------------------------------------------------------------------------
        case 'kaleidoscope': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const slices = 12;
          const stepAngle = (Math.PI * 2) / slices;

          for (let s = 0; s < slices; s++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(s * stepAngle + state.time * 0.15 * speed);
            if (s % 2 === 1) ctx.scale(1, -1);

            for (let i = 0; i < sim.items.length; i++) {
              const it = sim.items[i];
              const rot = it.rot + state.time * it.rotSpeed * 35 * speed;
              const dist = it.dist * (0.85 + 0.15 * Math.sin(state.time + i));
              const px = Math.cos(it.angle + state.time * 0.2 * speed) * dist;
              const py = Math.sin(it.angle + state.time * 0.2 * speed) * dist;
              const sz = it.size * size;

              ctx.save();
              ctx.translate(px, py);
              ctx.rotate(rot);
              ctx.fillStyle = getArtColor(it.hue + state.time * 20, 90, 62, 0.28 * glow, i);
              ctx.strokeStyle = getArtColor(it.hue + state.time * 20, 95, 78, 0.65, i);
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              for (let k = 0; k < it.sides; k++) {
                const a = (k / it.sides) * Math.PI * 2;
                const vx = Math.cos(a) * sz;
                const vy = Math.sin(a) * sz;
                if (k === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
              }
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #7: 【差し替え】幻想夜桜と光の桜吹雪
        // ------------------------------------------------------------------------
        case 'sakura_blizzard': {
          const bgHalo = ctx.createRadialGradient(w * 0.5, h * 0.35, 10, w * 0.5, h * 0.35, Math.max(w, h) * 0.65);
          bgHalo.addColorStop(0, getArtColor(340, 75, 45, 0.22 * glow, 0));
          bgHalo.addColorStop(1, 'transparent');
          ctx.fillStyle = bgHalo;
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const windX = Math.sin(state.time * 0.9 + p.swayPhase) * 0.55;
            p.x += (p.vx + windX + (ptr.isDown ? ptr.vx * 0.06 * reactivity : 0)) * speed;
            p.y += (p.vy + Math.cos(state.time * 1.1 + p.swayPhase) * 0.25 + (ptr.isDown ? ptr.vy * 0.05 * reactivity : 0)) * speed;
            p.rot += p.rotSpeed * speed;
            p.flip += p.flipSpeed * speed;

            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = p.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 130 * reactivity && d > 1) {
                p.x += (dx / d) * 2.2;
                p.y -= 1.4;
              }
            }

            if (p.x < -25) p.x = w + 25;
            if (p.x > w + 25) p.x = -25;
            if (p.y > h + 25) { p.y = -25; p.x = Math.random() * w; }
            if (p.y < -25) p.y = h + 25;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.scale(1, Math.max(0.18, Math.abs(Math.cos(p.flip))));
            const sz = p.size * size;
            ctx.fillStyle = getArtColor(p.hue, 92, 78, Math.min(1, 0.85 * glow), i);
            ctx.beginPath();
            ctx.moveTo(0, -sz);
            ctx.bezierCurveTo(sz * 0.95, -sz * 0.55, sz * 0.85, sz * 0.85, 0, sz * 0.65);
            ctx.bezierCurveTo(-sz * 0.85, sz * 0.85, -sz * 0.95, -sz * 0.55, 0, -sz);
            ctx.fill();
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #8: 深海のバイオルミネッセンス
        // ------------------------------------------------------------------------
        case 'bioluminescence': {
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.vx * speed + Math.sin(state.time + p.phase) * 0.3;
            p.y += p.vy * speed + Math.cos(state.time * 0.8 + p.phase) * 0.3;

            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = p.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 150 * reactivity && d > 1) {
                p.vx += (-dy / d) * 0.18 * reactivity;
                p.vy += (dx / d) * 0.18 * reactivity;
              }
            }
            p.vx *= 0.97;
            p.vy *= 0.97;

            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            const alpha = 0.4 + 0.6 * Math.sin(state.time * 3 + p.phase);
            drawStarburst(p.x, p.y, p.r * 3.5 * size * glow, getArtColor(p.hue, 95, 65, alpha, i), alpha);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #9: ウォーターカーテン・イルミネーション
        // ------------------------------------------------------------------------
        case 'watercurtain': {
          const spotColors = [195, 325, 275, 45, 160];
          for (let s = 0; s < 5; s++) {
            const sx = (w / 4) * s + Math.sin(state.time * 0.8 * speed + s) * 40;
            const beam = ctx.createLinearGradient(sx, 0, sx, h * 0.88);
            beam.addColorStop(0, getArtColor(spotColors[s] + state.time * 25, 92, 62, 0.25 * glow, s));
            beam.addColorStop(1, 'transparent');
            ctx.fillStyle = beam;
            ctx.fillRect(sx - w * 0.14, 0, w * 0.28, h * 0.88);
          }

          const floorY = h * 0.86;
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.y += p.vy * speed * 1.35;
            if (ptr.active && Math.hypot(p.x - ptr.x, p.y - ptr.y) < 90 * reactivity) {
              p.x += Math.sign(p.x - ptr.x) * 3.5;
            }
            if (p.y >= floorY) {
              if (Math.random() < 0.16) {
                sim.ripples.push({ x: p.x, y: floorY + Math.random() * (h - floorY), rx: 4, ry: 1.5, alpha: 0.85, hue: p.hue + state.time * 30 });
              }
              p.y = -20;
              p.x = Math.random() * w;
            }
            ctx.strokeStyle = getArtColor(p.hue + state.time * 25, 90, 72, 0.55 * glow, i);
            ctx.lineWidth = 1.6 * size;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x, p.y - p.len * size);
            ctx.stroke();
          }

          if (ptr.justClicked) {
            sim.ripples.push({ x: ptr.x, y: Math.max(floorY, ptr.y), rx: 12, ry: 3, alpha: 1.0, hue: 320 });
          }

          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const rp = sim.ripples[i];
            rp.rx += 85 * dt * speed;
            rp.ry += 22 * dt * speed;
            rp.alpha -= dt * 0.8;
            if (rp.alpha <= 0) sim.ripples.splice(i, 1);
            else {
              ctx.strokeStyle = getArtColor(rp.hue, 92, 74, rp.alpha * glow, i);
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.ellipse(rp.x, rp.y, rp.rx * size, rp.ry * size, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #10: 幻想のウミホタル・波打ち際
        // ------------------------------------------------------------------------
        case 'seafirefly': {
          const waveY = (x) => h * 0.58 + Math.sin(x * 0.008 + state.time * 1.4 * speed) * 28 + Math.sin(state.time * 0.9 * speed) * 42;

          // 波打ち際の光の泡沫ライン
          ctx.beginPath();
          for (let x = 0; x <= w; x += 16) {
            const y = waveY(x);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = getArtColor(200, 95, 72, 0.45 * glow, 0);
          ctx.lineWidth = 4 * size;
          ctx.stroke();

          // ウミホタル粒子
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.vx * speed;
            p.y += p.vy * speed;
            const wy = waveY(p.x);
            if (Math.abs(p.y - wy) < 24) {
              p.charge = Math.min(1.0, p.charge + dt * 1.8);
            }
            if (ptr.active && Math.hypot(p.x - ptr.x, p.y - ptr.y) < 110 * reactivity) {
              p.charge = 1.0;
            }
            p.charge = Math.max(0.18, p.charge - dt * 0.45);

            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < h * 0.45) p.y = h;
            if (p.y > h) p.y = h * 0.45;

            drawStarburst(p.x, p.y, p.r * 3.2 * size * glow * p.charge, getArtColor(p.hue, 98, 68, p.charge, i), p.charge);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #11: 【差し替え】蒼穹の青空と流れる光の雲
        // ------------------------------------------------------------------------
        case 'bluesky': {
          ctx.globalCompositeOperation = 'source-over';
          const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, getArtColor(212, 85, 36, 1, 0));
          skyGrad.addColorStop(0.55, getArtColor(202, 88, 54, 1, 1));
          skyGrad.addColorStop(1, getArtColor(194, 82, 74, 1, 2));
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, h);

          ctx.globalCompositeOperation = 'lighter';
          const sunX = ptr.active ? w * 0.25 + (ptr.x - w * 0.5) * 0.2 : w * 0.22;
          const sunY = h * 0.18;
          const sunGlow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, Math.max(w, h) * 0.45 * glow);
          sunGlow.addColorStop(0, 'rgba(255, 252, 235, 0.92)');
          sunGlow.addColorStop(0.2, getArtColor(48, 95, 80, 0.42, 0));
          sunGlow.addColorStop(1, 'transparent');
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, Math.max(w, h) * 0.45 * glow, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.items.length; i++) {
            const cl = sim.items[i];
            const windBoost = ptr.active && Math.hypot(ptr.x - cl.x, ptr.y - cl.y) < 160 * reactivity ? 1.8 : 1.0;
            cl.x += cl.vx * speed * windBoost;
            if (cl.x > w + 220) cl.x = -220;

            for (const pf of cl.puffs) {
              const px = cl.x + pf.ox * cl.scale * size;
              const py = cl.y + pf.oy * cl.scale * size + Math.sin(state.time * 0.5 + i) * 4;
              const pr = pf.r * cl.scale * size;
              const cg = ctx.createRadialGradient(px, py - pr * 0.2, pr * 0.1, px, py, pr);
              cg.addColorStop(0, `rgba(255, 255, 255, ${cl.alpha * 0.95})`);
              cg.addColorStop(0.6, getArtColor(205, 45, 92, cl.alpha * 0.55, i));
              cg.addColorStop(1, 'transparent');
              ctx.fillStyle = cg;
              ctx.beginPath();
              ctx.arc(px, py, pr, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.vx * speed * 1.4;
            if (p.x > w) p.x = 0;
            const tw = 0.35 + 0.65 * Math.sin(state.time * 2.5 + p.phase);
            ctx.fillStyle = `rgba(255, 255, 240, ${tw * 0.6 * glow})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * size, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #12: 【差し替え】黄昏のマジックアワーと夕焼け雲
        // ------------------------------------------------------------------------
        case 'sunset': {
          const horizonY = h * 0.64;
          ctx.globalCompositeOperation = 'source-over';
          const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
          skyGrad.addColorStop(0, getArtColor(248, 65, 16, 1, 0));
          skyGrad.addColorStop(0.42, getArtColor(325, 78, 34, 1, 1));
          skyGrad.addColorStop(0.78, getArtColor(18, 92, 52, 1, 2));
          skyGrad.addColorStop(1, getArtColor(42, 98, 66, 1, 3));
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, horizonY);

          const seaGrad = ctx.createLinearGradient(0, horizonY, 0, h);
          seaGrad.addColorStop(0, getArtColor(26, 88, 36, 1, 4));
          seaGrad.addColorStop(1, getArtColor(245, 70, 12, 1, 5));
          ctx.fillStyle = seaGrad;
          ctx.fillRect(0, horizonY, w, h - horizonY);

          ctx.globalCompositeOperation = 'lighter';
          const sunX = w * 0.5 + (ptr.active ? (ptr.x - w * 0.5) * 0.25 * reactivity : 0);
          const sunY = horizonY - Math.min(w, h) * 0.05;
          const sunR = Math.min(w, h) * 0.11 * size;

          const sunHalo = ctx.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 4.2 * glow);
          sunHalo.addColorStop(0, 'rgba(255, 248, 210, 0.95)');
          sunHalo.addColorStop(0.28, getArtColor(34, 98, 62, 0.55, 0));
          sunHalo.addColorStop(1, 'transparent');
          ctx.fillStyle = sunHalo;
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunR * 4.2 * glow, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.items.length; i++) {
            const cl = sim.items[i];
            cl.x += cl.vx * speed;
            if (cl.x > w + 180) cl.x = -180;
            const cg = ctx.createRadialGradient(cl.x, cl.y, 4, cl.x, cl.y, cl.w * size);
            cg.addColorStop(0, getArtColor(cl.hue, 95, 65, 0.42 * glow, i));
            cg.addColorStop(1, 'transparent');
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.ellipse(cl.x, cl.y, cl.w * size, cl.h * size, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const rp = sim.particles[i];
            const ratio = (rp.y - horizonY) / (h - horizonY);
            const rx = sunX + Math.sin(state.time * 1.8 * speed + rp.phase) * (25 + ratio * 95);
            const rw = rp.w * (0.5 + ratio * 1.4) * size;
            ctx.fillStyle = getArtColor(38, 98, 72, (0.35 + 0.35 * Math.sin(state.time * 3 + rp.phase)) * glow, i);
            ctx.fillRect(rx - rw * 0.5, rp.y, rw, 2.2 * size);
          }

          if (ptr.justClicked && ptr.y >= horizonY) {
            sim.ripples.push({ x: ptr.x, y: ptr.y, rx: 10, ry: 2, alpha: 1.0 });
          }
          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const r = sim.ripples[i];
            r.rx += 95 * dt * speed;
            r.ry += 22 * dt * speed;
            r.alpha -= dt * 0.75;
            if (r.alpha <= 0) sim.ripples.splice(i, 1);
            else {
              ctx.strokeStyle = getArtColor(42, 95, 76, r.alpha * glow, i);
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.ellipse(r.x, r.y, r.rx * size, r.ry * size, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #13: 満天のプラネタリウムと天の川
        // ------------------------------------------------------------------------
        case 'planetarium': {
          sim.extra.rot += 0.06 * dt * speed + (ptr.isDown ? ptr.vx * 0.003 : 0);
          const cx = w * 0.5;
          const cy = h * 0.55;
          const maxR = Math.hypot(w, h) * 0.65;

          for (let i = 0; i < sim.particles.length; i++) {
            const st = sim.particles[i];
            const a = st.angle + sim.extra.rot;
            const dist = ((st.spread + Math.PI * 0.5) / Math.PI) * maxR;
            const sx = cx + Math.cos(a) * dist;
            const sy = cy + Math.sin(a) * dist * 0.75;
            const tw = 0.5 + 0.5 * Math.sin(state.time * 2.5 + st.twinkle);
            ctx.fillStyle = getArtColor(st.hue, 85, 80, tw * glow, i);
            ctx.beginPath();
            ctx.arc(sx, sy, st.r * size, 0, Math.PI * 2);
            ctx.fill();
          }

          if (Math.random() < 0.03 * speed || ptr.justClicked) {
            sim.extra.meteors.push({
              x: ptr.justClicked ? ptr.x : Math.random() * w,
              y: ptr.justClicked ? ptr.y : Math.random() * h * 0.4,
              vx: -7 - Math.random() * 5,
              vy: 4 + Math.random() * 3,
              life: 1.0
            });
          }
          for (let i = sim.extra.meteors.length - 1; i >= 0; i--) {
            const m = sim.extra.meteors[i];
            m.x += m.vx * speed;
            m.y += m.vy * speed;
            m.life -= dt * 1.4;
            if (m.life <= 0) {
              sim.extra.meteors.splice(i, 1);
            } else {
              const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(1, 'transparent');
              ctx.strokeStyle = grad;
              ctx.lineWidth = 2.5 * size;
              ctx.beginPath();
              ctx.moveTo(m.x, m.y);
              ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #14: 夜空の大輪・打ち上げ花火
        // ------------------------------------------------------------------------
        case 'fireworks': {
          const launch = (tx, ty) => {
            sim.extra.rockets.push({
              x: tx + (Math.random() - 0.5) * 60,
              y: h,
              tx,
              ty,
              hue: Math.random() * 360
            });
          };
          if (ptr.justClicked) launch(ptr.x, ptr.y);
          if (Math.random() < 0.035 * speed * density) {
            launch(w * 0.15 + Math.random() * w * 0.7, h * 0.15 + Math.random() * h * 0.42);
          }

          for (let i = sim.extra.rockets.length - 1; i >= 0; i--) {
            const rk = sim.extra.rockets[i];
            rk.x += (rk.tx - rk.x) * 0.08 * speed;
            rk.y += (rk.ty - rk.y) * 0.08 * speed;
            ctx.fillStyle = '#fff3c4';
            ctx.beginPath();
            ctx.arc(rk.x, rk.y, 2.5 * size, 0, Math.PI * 2);
            ctx.fill();

            if (Math.hypot(rk.tx - rk.x, rk.ty - rk.y) < 12) {
              const sparkCount = Math.floor(85 * density);
              for (let k = 0; k < sparkCount; k++) {
                const ang = (k / sparkCount) * Math.PI * 2 + Math.random() * 0.1;
                const spd = 1.5 + Math.random() * 4.5;
                sim.extra.sparks.push({
                  x: rk.x,
                  y: rk.y,
                  vx: Math.cos(ang) * spd,
                  vy: Math.sin(ang) * spd,
                  life: 1.0,
                  hue: rk.hue + (Math.random() - 0.5) * 35
                });
              }
              sim.extra.rockets.splice(i, 1);
            }
          }

          for (let i = sim.extra.sparks.length - 1; i >= 0; i--) {
            const sp = sim.extra.sparks[i];
            sp.x += sp.vx * speed;
            sp.y += sp.vy * speed;
            sp.vy += 0.045 * speed;
            sp.vx *= 0.97;
            sp.vy *= 0.97;
            sp.life -= dt * 0.65;
            if (sp.life <= 0) {
              sim.extra.sparks.splice(i, 1);
            } else {
              ctx.fillStyle = getArtColor(sp.hue, 95, 65, sp.life * glow, i);
              ctx.beginPath();
              ctx.arc(sp.x, sp.y, 2.2 * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #15: 【差し替え】夜空に舞うライトアップ紅葉
        // ------------------------------------------------------------------------
        case 'momiji': {
          for (let b = 0; b < 4; b++) {
            const bx = w * (0.2 + b * 0.2) + (ptr.active ? (ptr.x - w * 0.5) * 0.12 * reactivity : 0);
            const sway = Math.sin(state.time * 0.7 * speed + b * 1.5) * 65;
            const beam = ctx.createLinearGradient(bx, h, bx + sway, h * 0.12);
            beam.addColorStop(0, getArtColor(36 + b * 6, 95, 65, 0.28 * glow, b));
            beam.addColorStop(1, 'transparent');
            ctx.fillStyle = beam;
            ctx.beginPath();
            ctx.moveTo(bx - 22, h);
            ctx.lineTo(bx + 22, h);
            ctx.lineTo(bx + sway + 140 * size, h * 0.1);
            ctx.lineTo(bx + sway - 140 * size, h * 0.1);
            ctx.closePath();
            ctx.fill();
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const lf = sim.particles[i];
            lf.x += (lf.vx + Math.sin(state.time * 1.2 + lf.swayPhase) * 0.45) * speed;
            lf.y += lf.vy * speed;
            lf.rot += lf.rotSpeed * speed;

            if (ptr.active) {
              const dx = lf.x - ptr.x;
              const dy = lf.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 130 * reactivity && d > 1) {
                lf.x += (dx / d) * 1.8;
                lf.y -= 1.8;
              }
            }

            if (lf.x < -30) lf.x = w + 30;
            if (lf.x > w + 30) lf.x = -30;
            if (lf.y > h + 30) { lf.y = -30; lf.x = Math.random() * w; }

            const sz = lf.size * size;
            ctx.save();
            ctx.translate(lf.x, lf.y);
            ctx.rotate(lf.rot);
            ctx.fillStyle = getArtColor(lf.hue, 95, 62, Math.min(1, 0.88 * glow), i);
            ctx.beginPath();
            const lobes = 5;
            for (let k = 0; k < lobes * 2; k++) {
              const ang = -Math.PI * 0.5 + (k / (lobes * 2)) * Math.PI * 1.5 - Math.PI * 0.25;
              const rad = k % 2 === 0 ? sz : sz * 0.35;
              const px = Math.cos(ang) * rad;
              const py = Math.sin(ang) * rad;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #16: 【差し替え】星屑が流れる銀河の運河
        // ------------------------------------------------------------------------
        case 'galaxy_canal': {
          const canalCenterY = (x) => h * 0.5 + Math.sin(x * 0.0035 + state.time * 0.35 * speed) * (h * 0.18) - (x - w * 0.5) * 0.16;

          for (let layer = 0; layer < 3; layer++) {
            ctx.beginPath();
            for (let x = 0; x <= w; x += 24) {
              const y = canalCenterY(x) + (layer - 1) * 36 * size;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = getArtColor(210 + layer * 42, 88, 58, 0.18 * glow, layer);
            ctx.lineWidth = (110 - layer * 25) * size;
            ctx.stroke();
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.speed * speed * 1.35;
            if (p.x > w + 20) p.x = -20;

            let py = canalCenterY(p.x) + p.offsetY * size + Math.sin(state.time * 1.6 + p.phase) * 14;
            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = py - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 150 * reactivity && d > 1) {
                const swirl = (1 - d / (150 * reactivity)) * 32;
                py += Math.sin(d * 0.06 - state.time * 4) * swirl;
              }
            }

            const tw = 0.5 + 0.5 * Math.sin(state.time * 3 + p.phase);
            drawStarburst(p.x, py, p.size * 2.4 * size * glow, getArtColor(p.hue, 92, 76, tw, i), tw);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #17: 日食のダイヤモンドリング
        // ------------------------------------------------------------------------
        case 'eclipse': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const r = Math.min(w, h) * 0.17 * size;

          const corona = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 3.2 * glow);
          corona.addColorStop(0, getArtColor(42, 95, 78, 0.85, 0));
          corona.addColorStop(0.35, getArtColor(210, 80, 65, 0.35, 1));
          corona.addColorStop(1, 'transparent');
          ctx.fillStyle = corona;
          ctx.beginPath();
          ctx.arc(cx, cy, r * 3.2 * glow, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * speed;
            const d = r * (1.02 + Math.sin(state.time * 2 + i) * 0.12 + (p.dist - 1) * 0.8);
            const px = cx + Math.cos(p.angle) * d;
            const py = cy + Math.sin(p.angle) * d;
            ctx.fillStyle = getArtColor(45, 95, 75, 0.65, i);
            ctx.beginPath();
            ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#020308';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalCompositeOperation = 'lighter';
          const ringAngle = ptr.active ? Math.atan2(ptr.y - cy, ptr.x - cx) : -Math.PI * 0.25 + Math.sin(state.time * 0.4) * 0.2;
          const dx = cx + Math.cos(ringAngle) * r;
          const dy = cy + Math.sin(ringAngle) * r;
          drawStarburst(dx, dy, r * 0.85 * glow, getArtColor(45, 100, 82, 0.95, 0), 0.95);
          break;
        }

        // ------------------------------------------------------------------------
        // #18: 星屑のネビュラ星雲
        // ------------------------------------------------------------------------
        case 'nebula': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * speed * 12;
            const px = cx + Math.cos(p.angle) * p.radius * size;
            const py = cy + Math.sin(p.angle) * p.radius * 0.68 * size;
            if (p.cloud) {
              const cr = 45 * size * glow;
              const grad = ctx.createRadialGradient(px, py, 0, px, py, cr);
              grad.addColorStop(0, getArtColor(p.hue, 88, 55, 0.14, i));
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(px, py, cr, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = getArtColor(p.hue, 90, 78, 0.85, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size * 0.6, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #19: 黄金のグリッター・ストリーム
        // ------------------------------------------------------------------------
        case 'glitter': {
          for (let ribbon = 0; ribbon < 3; ribbon++) {
            ctx.beginPath();
            for (let x = 0; x <= w; x += 18) {
              const y = h * 0.5
                + Math.sin(x * 0.005 + state.time * 1.4 * speed + ribbon * 1.2) * (h * 0.22)
                + Math.cos(x * 0.008 - state.time * 0.9 * speed) * 45;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = getArtColor(43 + ribbon * 6, 95, 65, 0.28 * glow, ribbon);
            ctx.lineWidth = (18 - ribbon * 4) * size;
            ctx.stroke();
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.speed * speed * 1.2;
            p.y += Math.sin(state.time * 2 + p.phase) * 0.9 * speed;
            if (ptr.active) {
              const dx = ptr.x - p.x;
              const dy = ptr.y - p.y;
              const d = Math.hypot(dx, dy);
              if (d < 160 * reactivity && d > 1) {
                p.x += (dx / d) * 1.5;
                p.y += (dy / d) * 1.5;
              }
            }
            if (p.x > w + 10) { p.x = -10; p.y = Math.random() * h; }
            const sparkle = 0.4 + 0.6 * Math.sin(state.time * 5 + p.phase);
            drawStarburst(p.x, p.y, p.size * 3.2 * size * glow, getArtColor(p.hue, 95, 72, sparkle, i), sparkle);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #20: 【差し替え】ダイヤモンドのプリズム閃光
        // ------------------------------------------------------------------------
        case 'diamond': {
          const lightAngle = ptr.active ? Math.atan2(ptr.y - h * 0.5, ptr.x - w * 0.5) : state.time * 0.6;

          for (let i = 0; i < sim.items.length; i++) {
            const dm = sim.items[i];
            dm.rot += dm.rotSpeed * speed;
            const r = dm.r * size;
            const align = Math.pow(0.5 + 0.5 * Math.cos(dm.rot * 2 - lightAngle + dm.phase), 3);

            ctx.save();
            ctx.translate(dm.x, dm.y);
            ctx.rotate(dm.rot);

            const sides = 8;
            for (let s = 0; s < sides; s++) {
              const a1 = (s / sides) * Math.PI * 2;
              const a2 = ((s + 1) / sides) * Math.PI * 2;
              const facetLight = 0.12 + 0.35 * Math.max(0, Math.cos(a1 + dm.rot - lightAngle));
              ctx.fillStyle = getArtColor(dm.hue + s * 45, 92, 74, facetLight * glow, i + s);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
              ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
              ctx.closePath();
              ctx.fill();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let s = 0; s < sides; s++) {
              const a = (s / sides) * Math.PI * 2;
              if (s === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
              else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            if (align > 0.25) {
              drawStarburst(dm.x, dm.y, r * (1.2 + align * 1.8) * glow, getArtColor(dm.hue + state.time * 60, 98, 82, align, i), align);
            }
          }

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const tw = Math.pow(0.5 + 0.5 * Math.sin(state.time * 4.5 + p.phase), 3);
            if (tw > 0.2) {
              drawStarburst(p.x, p.y, p.size * 3.2 * size * glow, getArtColor(p.hue, 96, 84, tw, i), tw);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #21: 妖精の光の粉・フェアリーダスト
        // ------------------------------------------------------------------------
        case 'fairydust': {
          const fx = ptr.active ? ptr.x : w * 0.5 + Math.cos(state.time * 1.3 * speed) * (w * 0.25);
          const fy = ptr.active ? ptr.y : h * 0.5 + Math.sin(state.time * 1.9 * speed) * (h * 0.2);

          drawStarburst(fx, fy, 32 * size * glow, getArtColor(state.time * 60, 95, 80, 0.95, 0), 0.95);

          for (let k = 0; k < Math.ceil(3 * density); k++) {
            sim.particles.push({
              x: fx + (Math.random() - 0.5) * 16,
              y: fy + (Math.random() - 0.5) * 16,
              vx: (Math.random() - 0.5) * 2.5,
              vy: (Math.random() - 0.5) * 2.5 + 0.4,
              size: 1.5 + Math.random() * 3,
              hue: (state.time * 80 + Math.random() * 90) % 360,
              phase: Math.random() * Math.PI * 2,
              life: 1.0
            });
          }
          if (sim.particles.length > 350) sim.particles.splice(0, sim.particles.length - 350);

          for (let i = sim.particles.length - 1; i >= 0; i--) {
            const p = sim.particles[i];
            p.x += p.vx * speed;
            p.y += p.vy * speed;
            if (p.life !== undefined) {
              p.life -= dt * 0.7;
              if (p.life <= 0) { sim.particles.splice(i, 1); continue; }
            }
            const a = p.life !== undefined ? p.life : (0.5 + 0.5 * Math.sin(state.time * 4 + p.phase));
            drawStarburst(p.x, p.y, p.size * 2.6 * size * glow, getArtColor(p.hue, 92, 72, a, i), a);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #22: 【差し替え】聖なる光の放射線・ゴッドレイ
        // ------------------------------------------------------------------------
        case 'radial_rays': {
          const cx = ptr.active ? ptr.x : w * 0.5 + Math.cos(state.time * 0.4 * speed) * (w * 0.14);
          const cy = ptr.active ? ptr.y : h * 0.46 + Math.sin(state.time * 0.5 * speed) * (h * 0.1);
          const maxLen = Math.hypot(w, h) * 1.15;

          for (let i = 0; i < sim.items.length; i++) {
            const ray = sim.items[i];
            const ang = ray.angle + state.time * ray.speed * speed;
            const pulse = 0.55 + 0.45 * Math.sin(state.time * 2.2 + ray.phase);
            const spread = ray.width * size * pulse;

            const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, maxLen * 0.85);
            grad.addColorStop(0, getArtColor(ray.hue, 95, 82, 0.42 * glow * pulse, i));
            grad.addColorStop(0.5, getArtColor(ray.hue + 25, 90, 62, 0.16 * glow * pulse, i));
            grad.addColorStop(1, 'transparent');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(ang - spread) * maxLen, cy + Math.sin(ang - spread) * maxLen);
            ctx.lineTo(cx + Math.cos(ang + spread) * maxLen, cy + Math.sin(ang + spread) * maxLen);
            ctx.closePath();
            ctx.fill();
          }

          drawStarburst(cx, cy, 65 * size * glow, getArtColor(45, 98, 86, 0.95, 0), 0.95);

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.dist += p.speed * dt * speed * 1.8;
            if (p.dist > maxLen * 0.8) p.dist = 8;
            const px = cx + Math.cos(p.angle) * p.dist;
            const py = cy + Math.sin(p.angle) * p.dist;
            ctx.fillStyle = getArtColor(p.hue, 95, 80, 0.75 * glow, i);
            ctx.beginPath();
            ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #23: 【差し替え】深淵のブラックホールと降着円盤
        // ------------------------------------------------------------------------
        case 'blackhole': {
          const cx = w * 0.5 + (ptr.active ? (ptr.x - w * 0.5) * 0.18 * reactivity : 0);
          const cy = h * 0.5 + (ptr.active ? (ptr.y - h * 0.5) * 0.18 * reactivity : 0);
          const bhR = Math.min(w, h) * 0.13 * size;

          // 相対論的ジェット（上下のプラズマビーム）
          const jetLen = h * 0.44 * size;
          for (const dir of [-1, 1]) {
            const jetGrad = ctx.createLinearGradient(cx, cy, cx, cy + dir * jetLen);
            jetGrad.addColorStop(0, getArtColor(215, 95, 78, 0.42 * glow, dir));
            jetGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = jetGrad;
            ctx.beginPath();
            ctx.moveTo(cx - bhR * 0.14, cy);
            ctx.lineTo(cx + bhR * 0.14, cy);
            ctx.lineTo(cx + bhR * 0.48, cy + dir * jetLen);
            ctx.lineTo(cx - bhR * 0.48, cy + dir * jetLen);
            ctx.closePath();
            ctx.fill();
          }

          // 重力レンズ効果の光のハロー
          const lensGrad = ctx.createRadialGradient(cx, cy, bhR * 0.95, cx, cy, bhR * 3.4 * glow);
          lensGrad.addColorStop(0, getArtColor(32, 98, 76, 0.92, 0));
          lensGrad.addColorStop(0.25, getArtColor(24, 95, 58, 0.45, 1));
          lensGrad.addColorStop(0.6, getArtColor(265, 80, 42, 0.16, 2));
          lensGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = lensGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, bhR * 3.4 * glow, 0, Math.PI * 2);
          ctx.fill();

          // 降着円盤の奥側＆重力レンズアーチ
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * dt * speed;
            const r = bhR * p.orbitR;
            const px = cx + Math.cos(p.angle) * r * 1.45;
            const sinA = Math.sin(p.angle);
            const py = sinA < 0
              ? cy + sinA * r * 0.72 - Math.abs(Math.cos(p.angle)) * bhR * 0.15
              : cy + sinA * r * 0.34;

            if (sinA < 0) {
              ctx.fillStyle = getArtColor(p.hue, 96, 72, 0.78 * glow, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // 事象の地平面（漆黒のブラックホール本体）
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#010103';
          ctx.beginPath();
          ctx.arc(cx, cy, bhR, 0, Math.PI * 2);
          ctx.fill();

          // 光子球（フォトンリング）
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = getArtColor(38, 100, 82, 0.9 * glow, 0);
          ctx.lineWidth = 2.5 * size;
          ctx.beginPath();
          ctx.arc(cx, cy, bhR * 1.03, 0, Math.PI * 2);
          ctx.stroke();

          // 降着円盤の手前側
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const sinA = Math.sin(p.angle);
            if (sinA >= 0) {
              const r = bhR * p.orbitR;
              const px = cx + Math.cos(p.angle) * r * 1.45;
              const py = cy + sinA * r * 0.34;
              ctx.fillStyle = getArtColor(p.hue + 6, 98, 76, 0.9 * glow, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * 1.15 * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #24: プリズム・クリスタル・シャンデリア
        // ------------------------------------------------------------------------
        case 'chandelier': {
          const cx = w * 0.5;
          const cy = h * 0.42;
          const maxR = Math.min(w, h) * 0.38 * size;

          for (let i = 0; i < sim.items.length; i++) {
            const c = sim.items[i];
            const dir = c.ring % 2 === 0 ? 1 : -1;
            const ang = c.angle + state.time * 0.25 * dir * speed;
            const rx = (c.ring / 4) * maxR;
            const ry = rx * 0.48;
            const px = cx + Math.cos(ang) * rx;
            const py = cy + Math.sin(ang) * ry + c.ring * 18;

            const pulse = 0.5 + 0.5 * Math.sin(state.time * 4 + c.sparkle);
            const hue = (c.hue + state.time * 30 + (ptr.active ? ptr.x * 0.2 : 0)) % 360;
            drawStarburst(px, py, c.size * (1.5 + pulse * 1.4) * glow, getArtColor(hue, 95, 78, 0.85, i), 0.85);
          }
          break;
        }
      }

      ptr.justClicked = false;
      ptr.vx *= 0.85;
      ptr.vy *= 0.85;
    }

    // アニメーションループ管理
    let lastTime = performance.now();
    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!state.isPaused) {
        state.time += dt * state.params.speed;
        renderFrame(dt);
      }
      requestAnimationFrame(animate);
    }

    // ============================================================================
    // UIインタラクション・ギャラリー生成・イベントリスナー
    // ============================================================================
    function renderGalleryGrid() {
      artGrid.innerHTML = '';
      const filtered = state.activeCategory === 'all'
        ? ARTWORKS
        : ARTWORKS.filter(a => a.cat === state.activeCategory);

      filtered.forEach((art) => {
        const idx = ARTWORKS.findIndex(item => item.id === art.id);
        const isCurrent = idx === state.currentArtIndex;
        const card = document.createElement('button');
        card.className = `glass-card text-left rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden group active:scale-[0.98] ${isCurrent ? 'ring-2 ring-amber-300' : ''}`;
        card.innerHTML = `
          <div class="absolute inset-0 bg-gradient-to-br ${art.grad} opacity-50 group-hover:opacity-80 transition-opacity pointer-events-none"></div>
          <div class="relative z-10">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-black/40 text-slate-200 border border-white/10">
                ${art.catLabel}
              </span>
              <span class="text-xs font-mono text-white/70">#${String(art.num).padStart(2, '0')}</span>
            </div>
            <h3 class="text-base font-bold text-white group-hover:text-amber-200 transition">${art.title}</h3>
            <p class="text-[11px] text-slate-300/80 font-light mb-2">${art.en}</p>
            <p class="text-xs text-slate-200/90 leading-relaxed line-clamp-2">${art.desc}</p>
          </div>
          <div class="relative z-10 mt-3 pt-2.5 border-t border-white/10 flex items-center justify-between text-[11px] text-amber-200">
            <span>${isCurrent ? '● 選択中' : 'タップして鑑賞する'}</span>
            <span class="group-hover:translate-x-1 transition-transform">→</span>
          </div>
        `;
        card.addEventListener('click', () => {
          selectArtwork(idx);
          closeGalleryMenu();
        });
        artGrid.appendChild(card);
      });
    }

    function selectArtwork(index) {
      state.currentArtIndex = index;
      const art = ARTWORKS[index];
      document.getElementById('hudCategoryBadge').textContent = art.catLabel;
      document.getElementById('hudArtTitle').textContent = `${art.num}. ${art.title}`;
      document.getElementById('hudArtHint').textContent = art.hint;
      initCurrentArtwork();
      renderGalleryGrid();
    }

    function openGalleryMenu() {
      state.isMenuOpen = true;
      galleryModal.classList.remove('opacity-0', 'pointer-events-none');
      renderGalleryGrid();
    }

    function closeGalleryMenu() {
      state.isMenuOpen = false;
      galleryModal.classList.add('opacity-0', 'pointer-events-none');
    }

    function toggleControls(forceState) {
      state.isControlsOpen = forceState !== undefined ? forceState : !state.isControlsOpen;
      if (state.isControlsOpen) {
        controlPanel.classList.remove('translate-y-full', 'md:translate-x-[120%]');
      } else {
        controlPanel.classList.add('translate-y-full', 'md:translate-x-[120%]');
      }
    }

    function syncParamUI() {
      const p = state.params;
      document.getElementById('paramHue').value = p.hueShift;
      document.getElementById('valHue').textContent = `${p.hueShift}°`;

      document.getElementById('paramDensity').value = Math.round(p.density * 100);
      document.getElementById('valDensity').textContent = `${Math.round(p.density * 100)}%`;

      document.getElementById('paramGlow').value = Math.round(p.glow * 100);
      document.getElementById('valGlow').textContent = `${Math.round(p.glow * 100)}%`;

      document.getElementById('paramSpeed').value = Math.round(p.speed * 100);
      document.getElementById('valSpeed').textContent = `${p.speed.toFixed(1)}x`;

      document.getElementById('paramSize').value = Math.round(p.size * 100);
      document.getElementById('valSize').textContent = `${Math.round(p.size * 100)}%`;

      document.getElementById('paramReact').value = Math.round(p.reactivity * 100);
      document.getElementById('valReact').textContent = `${Math.round(p.reactivity * 100)}%`;

      document.querySelectorAll('.palette-btn').forEach(btn => {
        const active = btn.dataset.palette === p.palette;
        btn.classList.toggle('bg-white/20', active);
        btn.classList.toggle('border-white/40', active);
        btn.classList.toggle('bg-white/5', !active);
      });
    }

    // イベントバインド
    document.getElementById('openMenuBtn').addEventListener('click', openGalleryMenu);
    document.getElementById('closeMenuBtn').addEventListener('click', closeGalleryMenu);
    document.getElementById('randomArtBtn').addEventListener('click', () => {
      const nextIdx = Math.floor(Math.random() * ARTWORKS.length);
      selectArtwork(nextIdx);
      closeGalleryMenu();
      showToast(`「${ARTWORKS[nextIdx].title}」を表示しました`);
    });

    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.activeCategory = tab.dataset.cat;
        document.querySelectorAll('.cat-tab').forEach(t => {
          t.classList.remove('bg-white', 'text-slate-950', 'shadow');
          t.classList.add('bg-white/10', 'text-slate-200');
        });
        tab.classList.remove('bg-white/10', 'text-slate-200');
        tab.classList.add('bg-white', 'text-slate-950', 'shadow');
        renderGalleryGrid();
      });
    });

    document.getElementById('toggleControlsBtn').addEventListener('click', () => toggleControls());
    document.getElementById('closeControlsBtn').addEventListener('click', () => toggleControls(false));

    document.getElementById('hideUiBtn').addEventListener('click', () => {
      state.isUiHidden = true;
      topHud.classList.add('opacity-0', 'pointer-events-none');
      toggleControls(false);
      restoreUiBtn.classList.remove('opacity-0', 'pointer-events-none');
      showToast('純粋鑑賞モード（右下のボタンでUI復帰）');
    });
    restoreUiBtn.addEventListener('click', () => {
      state.isUiHidden = false;
      topHud.classList.remove('opacity-0', 'pointer-events-none');
      restoreUiBtn.classList.add('opacity-0', 'pointer-events-none');
    });

    document.getElementById('screenshotBtn').addEventListener('click', () => {
      try {
        const link = document.createElement('a');
        const art = ARTWORKS[state.currentArtIndex];
        link.download = `luminous-${art.id}-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('美しい光景を画像として保存しました');
      } catch (e) {
        showToast('画像の保存に失敗しました');
      }
    });

    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.params.palette = btn.dataset.palette;
        syncParamUI();
      });
    });

    document.getElementById('paramHue').addEventListener('input', (e) => {
      state.params.hueShift = Number(e.target.value);
      syncParamUI();
    });
    document.getElementById('paramDensity').addEventListener('input', (e) => {
      state.params.density = Number(e.target.value) / 100;
      initCurrentArtwork();
      syncParamUI();
    });
    document.getElementById('paramGlow').addEventListener('input', (e) => {
      state.params.glow = Number(e.target.value) / 100;
      syncParamUI();
    });
    document.getElementById('paramSpeed').addEventListener('input', (e) => {
      state.params.speed = Number(e.target.value) / 100;
      syncParamUI();
    });
    document.getElementById('paramSize').addEventListener('input', (e) => {
      state.params.size = Number(e.target.value) / 100;
      syncParamUI();
    });
    document.getElementById('paramReact').addEventListener('input', (e) => {
      state.params.reactivity = Number(e.target.value) / 100;
      syncParamUI();
    });

    document.getElementById('randomParamBtn').addEventListener('click', () => {
      const palKeys = Object.keys(PALETTES);
      state.params.palette = palKeys[Math.floor(Math.random() * palKeys.length)];
      state.params.hueShift = Math.floor(Math.random() * 360);
      state.params.density = Number((0.6 + Math.random() * 1.1).toFixed(2));
      state.params.glow = Number((0.7 + Math.random() * 1.0).toFixed(2));
      state.params.speed = Number((0.5 + Math.random() * 1.5).toFixed(1));
      state.params.size = Number((0.7 + Math.random() * 0.8).toFixed(2));
      initCurrentArtwork();
      syncParamUI();
      showToast('光のパラメータをランダムに設定しました');
    });

    document.getElementById('pauseBtn').addEventListener('click', (e) => {
      state.isPaused = !state.isPaused;
      e.target.textContent = state.isPaused ? '▶ 再生' : '⏸ 一時停止';
    });

    document.getElementById('resetParamBtn').addEventListener('click', () => {
      state.params = {
        palette: 'original',
        hueShift: 0,
        density: 1.0,
        glow: 1.0,
        speed: 1.0,
        size: 1.0,
        reactivity: 1.0
      };
      initCurrentArtwork();
      syncParamUI();
      showToast('パラメータを初期値に戻しました');
    });

    function updatePointer(x, y, isDown, clicked = false) {
      state.pointer.vx = x - state.pointer.x;
      state.pointer.vy = y - state.pointer.y;
      state.pointer.x = x;
      state.pointer.y = y;
      state.pointer.isDown = isDown;
      state.pointer.active = true;
      if (clicked) state.pointer.justClicked = true;
    }

    canvas.addEventListener('mousemove', (e) => {
      updatePointer(e.clientX, e.clientY, e.buttons > 0, false);
    });
    canvas.addEventListener('mousedown', (e) => {
      updatePointer(e.clientX, e.clientY, true, true);
    });
    window.addEventListener('mouseup', () => {
      state.pointer.isDown = false;
    });
    canvas.addEventListener('mouseleave', () => {
      state.pointer.active = false;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        updatePointer(t.clientX, t.clientY, true, true);
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        updatePointer(t.clientX, t.clientY, true, false);
      }
    }, { passive: true });
    canvas.addEventListener('touchend', () => {
      state.pointer.isDown = false;
      state.pointer.active = false;
    });

    // 起動処理（トップ画面は全24作品のギャラリー選択モーダルを表示）
    window.onload = function () {
      resizeCanvas();
      selectArtwork(0);
      syncParamUI();
      openGalleryMenu();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
