                  ctx.beginPath();
                  ctx.arc(sx, sy, cloudR, 0, Math.PI * 2);
                  ctx.fill();
                }
              }
            } else if (p2 > 0.01) {
              const starR = p.size * invZ * 0.28 * size * p2;
              if (starR > 0.1) {
                // 突入感を引き立てる繊細な光跡ストリーク
                const prevInvZ = 1 / (p.prevZ * 1.15 + 0.08);
                const px = cx + rx * prevInvZ * 0.52;
                const py = cy + ry * prevInvZ * 0.52;
                ctx.strokeStyle = getArtColor(p.hue, 86, 86, alpha * 0.65, i);
                ctx.lineWidth = Math.max(0.6, starR * 1.1);
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();

                ctx.fillStyle = getArtColor(p.hue, 90, 90, alpha, i);
                ctx.beginPath();
                ctx.arc(sx, sy, starR, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #17: 日食のダイヤモンドリング（月影・コロナ中心もドラッグ配置可能）
        // ------------------------------------------------------------------------
        case 'eclipse': {
          const cx = sim.extra.coreX !== undefined ? sim.extra.coreX : w * 0.5;
          const cy = sim.extra.coreY !== undefined ? sim.extra.coreY : h * 0.5;
          const r = Math.min(w, h) * 0.17 * size * p1;

          if (r > 0.5 && p2 > 0.01) {
            const coronaR = r * 3.2 * glow * p2;
            const corona = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, coronaR);
            corona.addColorStop(0, getArtColor(42, 95, 78, 0.85, 0));
            corona.addColorStop(0.35, getArtColor(210, 80, 65, 0.35, 1));
            corona.addColorStop(1, 'transparent');
            ctx.fillStyle = corona;
            ctx.beginPath();
            ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < sim.particles.length; i++) {
              const p = sim.particles[i];
              p.angle += p.speed * speed;
              const d = r * (1.02 + Math.sin(state.time * 2 + i) * 0.12 + (p.dist - 1) * 0.8 * p2);
              const px = cx + Math.cos(p.angle) * d;
              const py = cy + Math.sin(p.angle) * d;
              ctx.fillStyle = getArtColor(45, 95, 75, 0.65, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          if (r > 0.2) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#020308';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
          }

          if (r > 0.2 && p3 > 0.01) {
            ctx.globalCompositeOperation = 'lighter';
            const ringAngle = -Math.PI * 0.25 + Math.sin(state.time * 0.4) * 0.12;
            const dx = cx + Math.cos(ringAngle) * r;
            const dy = cy + Math.sin(ringAngle) * r;
            drawStarburst(dx, dy, Math.min(w, h) * 0.14 * p3 * glow, getArtColor(45, 100, 82, 0.95, 0), 0.95);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #18: 星屑のネビュラ星雲
        // ------------------------------------------------------------------------
        case 'nebula': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.angle += p.speed * speed * 12;
            const px = cx + Math.cos(p.angle) * p.radius * p3;
            const py = cy + Math.sin(p.angle) * p.radius * 0.68 * p3;
            if (p.cloud) {
              if (p1 > 0.01) {
                const cr = 45 * size * p1 * glow;
                const grad = ctx.createRadialGradient(px, py, 0, px, py, cr);
                grad.addColorStop(0, getArtColor(p.hue, 88, 55, 0.14, i));
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(px, py, cr, 0, Math.PI * 2);
                ctx.fill();
              }
            } else if (p2 > 0.01) {
              ctx.fillStyle = getArtColor(p.hue, 90, 78, 0.85, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size * p2 * 0.6, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #19: 黄金のグリッター・ウェーブ（波と波頭の金粉のみの純粋演出）
        // ------------------------------------------------------------------------
        case 'glitter': {
          const waveCount = 5;
          if (p2 > 0.01) {
            for (let r = 0; r < waveCount; r++) {
              const baseLineY = h * (0.34 + r * 0.085);
              ctx.beginPath();
              for (let x = 0; x <= w; x += 14) {
                const wy = baseLineY
                  + Math.sin(x * 0.0055 + state.time * 1.4 * speed + r * 0.9) * (h * 0.14 * p1)
                  + Math.cos(x * 0.009 - state.time * 0.9 * speed + r) * (32 * p1);
                if (x === 0) ctx.moveTo(x, wy);
                else ctx.lineTo(x, wy);
              }
              ctx.strokeStyle = getArtColor(42 + r * 4, 96, 66, (0.38 - r * 0.04) * glow, r);
              ctx.lineWidth = (10 - r * 1.3) * size * p2;
              ctx.stroke();
            }
          }

          if (p3 > 0.01) {
            for (let i = 0; i < sim.particles.length; i++) {
              const p = sim.particles[i];
              p.x += p.speed * speed * 1.3;
              if (p.x > w + 15) p.x = -15;
              const baseLineY = h * (0.34 + p.ribbonIdx * 0.085);
              const wy = baseLineY
                + Math.sin(p.x * 0.0055 + state.time * 1.4 * speed + p.ribbonIdx * 0.9) * (h * 0.14 * p1)
                + Math.cos(p.x * 0.009 - state.time * 0.9 * speed + p.ribbonIdx) * (32 * p1)
                + p.offsetY * p1;
              const sparkle = 0.45 + 0.55 * Math.sin(state.time * 5 + p.phase);
              drawStarburst(p.x, wy, p.size * 2.4 * p3 * glow, getArtColor(p.hue, 96, 75, sparkle, i), sparkle);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #20: ダイヤモンドのプリズム閃光
        // ------------------------------------------------------------------------
        case 'diamond': {
          const dm = sim.items[0];
          if (!dm) break;
          dm.rot += 0.22 * dt * speed;
          const r = dm.r * size * p1;

          if (r > 0.5) {
            for (let i = 0; i < sim.particles.length; i++) {
              const pt = sim.particles[i];
              const a = pt.angle + state.time * 0.3 * speed;
              const d = r * pt.dist * Math.max(0.2, p2);
              const px = dm.x + Math.cos(a) * d;
              const py = dm.y + Math.sin(a) * d;
              const tw = 0.4 + 0.6 * Math.sin(state.time * 4 + pt.phase);
              if (p2 > 0.01) {
                const fr = pt.size * 5 * p2 * glow;
                const fg = ctx.createRadialGradient(px, py, 0, px, py, fr);
                fg.addColorStop(0, getArtColor(pt.hue, 98, 72, 0.5 * tw, i));
                fg.addColorStop(1, 'transparent');
                ctx.fillStyle = fg;
                ctx.beginPath();
                ctx.arc(px, py, fr, 0, Math.PI * 2);
                ctx.fill();
              }
              if (p3 > 0.01 && i % 3 === 0) {
                drawStarburst(px, py, pt.size * 3.2 * p3 * glow, getArtColor(pt.hue, 95, 82, tw, i), tw);
              }
            }

            ctx.save();
            ctx.translate(dm.x, dm.y);
            ctx.rotate(dm.rot);
            const outerSides = 8;
            const innerR = r * 0.54;
            ctx.strokeStyle = getArtColor(200, 90, 88, 0.85 * glow, 0);
            ctx.lineWidth = 1.6;
            for (let k = 0; k < outerSides; k++) {
              const a1 = (k / outerSides) * Math.PI * 2;
              const a2 = ((k + 1) / outerSides) * Math.PI * 2;
              const ox1 = Math.cos(a1) * r, oy1 = Math.sin(a1) * r;
              const ox2 = Math.cos(a2) * r, oy2 = Math.sin(a2) * r;
              const ix1 = Math.cos(a1) * innerR, iy1 = Math.sin(a1) * innerR;
              const ix2 = Math.cos(a2) * innerR, iy2 = Math.sin(a2) * innerR;

              ctx.fillStyle = getArtColor(190 + k * 42 + state.time * 30, 92, 74, 0.32 * glow, k);
              ctx.beginPath();
              ctx.moveTo(ox1, oy1);
              ctx.lineTo(ox2, oy2);
              ctx.lineTo(ix2, iy2);
              ctx.lineTo(ix1, iy1);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.beginPath();
            for (let k = 0; k < outerSides; k++) {
              const a = (k / outerSides) * Math.PI * 2;
              if (k === 0) ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
              else ctx.lineTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #21: 妖精の光の粉・フェアリーダスト（光源をドラッグ＆ドロップで好きな位置へ固定）
        // ------------------------------------------------------------------------
        case 'fairydust': {
          const fx = sim.extra.originX;
          const fy = sim.extra.originY;

          if (p1 > 0.01) {
            drawStarburst(fx, fy, 28 * p1 * glow, getArtColor(state.time * 60, 95, 80, 0.95, 0), 0.95);
          }

          if (p2 > 0.01) {
            const spawn = Math.min(8, Math.ceil(3 * density));
            for (let k = 0; k < spawn; k++) {
              sim.particles.push({
                x: fx + (Math.random() - 0.5) * 18 * p3,
                y: fy + (Math.random() - 0.5) * 18 * p3,
                vx: (Math.random() - 0.5) * 2.5 * p3,
                vy: (Math.random() - 0.5) * 2.5 * p3 + 0.35,
                size: 1.5 + Math.random() * 3,
                hue: (state.time * 80 + Math.random() * 90) % 360,
                phase: Math.random() * Math.PI * 2,
                life: 1.0
              });
            }
            if (sim.particles.length > 420) sim.particles.splice(0, sim.particles.length - 420);

            for (let i = sim.particles.length - 1; i >= 0; i--) {
              const p = sim.particles[i];
              p.x += p.vx * speed;
              p.y += p.vy * speed;
              if (p.life !== undefined) {
                p.life -= dt * 0.7;
                if (p.life <= 0) { sim.particles.splice(i, 1); continue; }
              }
              const a = p.life !== undefined ? p.life : (0.5 + 0.5 * Math.sin(state.time * 4 + p.phase));
              drawStarburst(p.x, p.y, p.size * 2.4 * p2 * glow, getArtColor(p.hue, 92, 72, a, i), a);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #22: 聖なる光の放射線・ゴッドレイ（十字線なしの純粋な光源・放射線ビーム・ドラッグ固定）
        // ------------------------------------------------------------------------
        case 'radial_rays': {
          const ox = sim.extra.originX;
          const oy = sim.extra.originY;
          const maxLen = Math.hypot(w, h) * 1.15;

          if (p2 > 0.01) {
            for (let i = 0; i < sim.items.length; i++) {
              const ray = sim.items[i];
              const ang = ray.angle + state.time * ray.speed * speed;
              const pulse = 0.55 + 0.45 * Math.sin(state.time * 2.2 + ray.phase);
              const spread = ray.width * p2;
              const grad = ctx.createLinearGradient(ox, oy, ox + Math.cos(ang) * maxLen, oy + Math.sin(ang) * maxLen);
              grad.addColorStop(0, getArtColor(ray.hue, 95, 78, 0.42 * pulse * glow, i));
              grad.addColorStop(0.55, getArtColor(ray.hue + 15, 90, 62, 0.16 * pulse * glow, i));
              grad.addColorStop(1, 'transparent');

              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.moveTo(ox, oy);
              ctx.lineTo(ox + Math.cos(ang - spread) * maxLen, oy + Math.sin(ang - spread) * maxLen);
              ctx.lineTo(ox + Math.cos(ang + spread) * maxLen, oy + Math.sin(ang + spread) * maxLen);
              ctx.closePath();
              ctx.fill();
            }
          }

          if (p3 > 0.01) {
            for (let i = 0; i < sim.particles.length; i++) {
              const pt = sim.particles[i];
              pt.dist += pt.speed * dt * speed;
              if (pt.dist > maxLen) pt.dist = 6;
              const px = ox + Math.cos(pt.angle) * pt.dist;
              const py = oy + Math.sin(pt.angle) * pt.dist;
              const alpha = Math.sin((pt.dist / maxLen) * Math.PI) * glow;
              const pr = pt.size * 2.1 * size * p3;
              if (pr > 0.1 && alpha > 0.005) {
                const pg = ctx.createRadialGradient(px, py, 0, px, py, pr);
                pg.addColorStop(0, `rgba(255, 255, 255, ${Math.min(1, alpha).toFixed(3)})`);
                pg.addColorStop(0.4, getArtColor(pt.hue, 95, 76, alpha * 0.8, i));
                pg.addColorStop(1, 'transparent');
                ctx.fillStyle = pg;
                ctx.beginPath();
                ctx.arc(px, py, pr, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }

          // 中央光源は十字線なしの純粋で神々しい円形グロー
          if (p1 > 0.01) {
            const coreR = Math.min(w, h) * 0.24 * size * p1 * glow;
            if (coreR > 0.5) {
              const cGrad = ctx.createRadialGradient(ox, oy, 0, ox, oy, coreR);
              cGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
              cGrad.addColorStop(0.18, getArtColor(46, 98, 86, 0.85, 0));
              cGrad.addColorStop(0.48, getArtColor(42, 95, 68, 0.34, 1));
              cGrad.addColorStop(1, 'transparent');
              ctx.fillStyle = cGrad;
              ctx.beginPath();
              ctx.arc(ox, oy, coreR, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #23: 深淵のブラックホールと降着円盤（中心核をドラッグ＆ドロップで好きな位置に固定）
        // ------------------------------------------------------------------------
        case 'blackhole': {
          const cx = sim.extra.coreX !== undefined ? sim.extra.coreX : w * 0.5;
          const cy = sim.extra.coreY !== undefined ? sim.extra.coreY : h * 0.5;
          const bhR = Math.min(w, h) * 0.13 * size * p1;

          if (bhR > 0.5 && p2 > 0.01) {
            for (let i = 0; i < sim.particles.length; i++) {
              const p = sim.particles[i];
              p.angle += p.speed * dt * speed;
              const r = bhR * (1 + (p.orbit - 1) * p2);
              let px, py;
              if (p.isHalo) {
                px = cx + Math.cos(p.angle) * r * 1.15;
                py = cy + Math.sin(p.angle) * r * 0.92;
              } else {
                px = cx + Math.cos(p.angle) * r * 2.3;
                py = cy + Math.sin(p.angle) * r * 0.34;
              }
              const doppler = 0.65 + 0.35 * Math.cos(p.angle);
              ctx.fillStyle = getArtColor(p.hue, 96, 56 + doppler * 26, 0.72 * glow, i);
              ctx.beginPath();
              ctx.arc(px, py, p.size * size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          if (bhR > 0.5 && p3 > 0.01) {
            const photonR = bhR * 1.08;
            const ringGrad = ctx.createRadialGradient(cx, cy, bhR * 0.94, cx, cy, photonR * (1.28 * p3));
            ringGrad.addColorStop(0, '#ffffff');
            ringGrad.addColorStop(0.35, getArtColor(36, 100, 72, 0.92 * glow, 0));
            ringGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = ringGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, photonR * (1.28 * p3), 0, Math.PI * 2);
            ctx.fill();
          }

          if (bhR > 0.2) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(cx, cy, bhR, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #24: プリズム・クリスタル・シャンデリア
        // ------------------------------------------------------------------------
        case 'chandelier': {
          const cx = w * 0.5;
          const cy = h * 0.42;
          const maxR = Math.min(w, h) * 0.38 * p2;

          for (let i = 0; i < sim.items.length; i++) {
            const c = sim.items[i];
            const dir = c.ring % 2 === 0 ? 1 : -1;
            const ang = c.angle + state.time * 0.25 * dir * speed;
            const rx = (c.ring / 4) * maxR;
            const ry = rx * 0.48;
            const px = cx + Math.cos(ang) * rx;
            const py = cy + Math.sin(ang) * ry + c.ring * 18 * p2;

            const pulse = 0.5 + 0.5 * Math.sin(state.time * 4 + c.sparkle);
            const hue = (c.hue + state.time * 30) % 360;
            if (p1 > 0.01 || p3 > 0.01) {
              drawStarburst(px, py, c.size * (1.2 + pulse * 1.1) * Math.max(0.2, p1) * glow, getArtColor(hue, 95, 78, 0.85, i), 0.85);
            }
          }
          break;
        }
      }

      ctx.restore();
      ptr.justClicked = false;
      ptr.vx *= 0.85;
      ptr.vy *= 0.85;
    }

    let lastTime = performance.now();
    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!state.isPaused) {
        state.time += dt * state.params.speed;
        renderFrame(dt);
      }
      requestAnimationFrame(animate);
    }

    // ============================================================================
    // ギャラリーUI・メニュー操作・イベントバインド
    // ============================================================================
    function renderGalleryGrid() {
      artGrid.innerHTML = '';
      const filtered = state.activeCategory === 'all'
        ? ARTWORKS
        : ARTWORKS.filter(a => a.cat === state.activeCategory);

      filtered.forEach((art) => {
        const idx = ARTWORKS.findIndex(item => item.id === art.id);
        const isCurrent = idx === state.currentArtIndex;
        const card = document.createElement('button');
        card.className = `glass-card text-left rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden group w-full ${isCurrent ? 'ring-2 ring-amber-300' : ''}`;
        card.innerHTML = `
          <div class="absolute inset-0 bg-gradient-to-br ${art.grad} opacity-50 group-hover:opacity-80 transition-opacity pointer-events-none"></div>
          <div class="relative z-10 w-full">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-black/45 text-slate-100 border border-white/15">
                ${art.catLabel}
              </span>
              <span class="text-xs font-mono text-white/80 shrink-0">#${String(art.num).padStart(2, '0')}</span>
            </div>
            <h3 class="text-sm sm:text-base font-bold text-white group-hover:text-amber-200 transition break-words leading-snug">${art.title}</h3>
            <p class="text-[11px] text-slate-300/85 font-light mb-2 break-words">${art.en}</p>
            <p class="text-xs text-slate-200/95 leading-relaxed break-words">${art.desc}</p>
          </div>
          <div class="relative z-10 w-full mt-3 pt-2.5 border-t border-white/15 flex items-center justify-between text-[11px] text-amber-200 font-medium">
            <span>${isCurrent ? '● 選択中' : 'タップして鑑賞する'}</span>
            <span class="group-hover:translate-x-1 transition-transform">→</span>
          </div>
        `;
        card.addEventListener('click', () => {
          selectArtwork(idx);
          closeGalleryMenu();
        });
        artGrid.appendChild(card);
      });
    }

    function selectArtwork(index) {
      state.currentArtIndex = index;
      const art = ARTWORKS[index];

      // 別作品を選んだら一時停止も解除し、全パラメータを初期値へリセット
      state.isPaused = false;
      const pauseBtn = document.getElementById('pauseBtn');
      if (pauseBtn) pauseBtn.textContent = '⏸ 一時停止';

      state.params = {
        palette: 'original',
        hueShift: 0,
        size: 1.0,
        crossLength: 1.0,
        scale: 1.0,
        density: 1.0,
        glow: 1.0,
        speed: 1.0,
        reactivity: 1.0,
        parts: { p1: 1.0, p2: 1.0, p3: 1.0 },
        sceneOffset: { x: 0, y: 0 }
      };

      document.getElementById('hudCategoryBadge').textContent = art.catLabel;
      document.getElementById('hudArtTitle').textContent = `${art.num}. ${art.title}`;
      document.getElementById('hudArtHint').textContent = art.hint;
      initCurrentArtwork();
      state.history.stack = [];
      state.history.index = -1;
      pushHistory();
      buildControlSliders();
      renderGalleryGrid();
    }

    function openGalleryMenu() {
      state.isMenuOpen = true;
      galleryModal.classList.remove('opacity-0', 'pointer-events-none');
      renderGalleryGrid();
    }

    function closeGalleryMenu() {
      state.isMenuOpen = false;
      galleryModal.classList.add('opacity-0', 'pointer-events-none');
    }

    function toggleControls(forceState) {
      state.isControlsOpen = forceState !== undefined ? forceState : !state.isControlsOpen;
      controlPanel.classList.toggle('panel-closed', !state.isControlsOpen);
    }

    // パネル位置・サイズのリセット関数（初期レイアウトへ戻す）
    function resetPanelLayout(silent = false) {
      state.isSlimMode = false;
      controlPanel.classList.remove('panel-slim');
      controlPanel.style.left = '';
      controlPanel.style.top = '';
      controlPanel.style.right = '';
      controlPanel.style.bottom = '';
      controlPanel.style.width = '';
      controlPanel.style.height = '';
      controlPanel.style.maxHeight = '';
      const slimBtn = document.getElementById('slimModeBtn');
      if (slimBtn) slimBtn.textContent = '⇕ スリム';
      if (!silent) showToast('設定欄の位置と大きさを初期状態に戻しました');
    }

    // パネルを自由位置モードへ移行させる補助関数
    function ensureFloatingGeometry() {
      if (controlPanel.style.left && controlPanel.style.top && controlPanel.style.width && controlPanel.style.height) {
        return;
      }
      const rect = controlPanel.getBoundingClientRect();
      controlPanel.style.left = `${rect.left}px`;
      controlPanel.style.top = `${rect.top}px`;
      controlPanel.style.width = `${rect.width}px`;
      controlPanel.style.height = `${rect.height}px`;
      controlPanel.style.right = 'auto';
      controlPanel.style.bottom = 'auto';
      controlPanel.style.maxHeight = 'none';
    }

    document.getElementById('openMenuBtn').addEventListener('click', openGalleryMenu);
    document.getElementById('closeMenuBtn').addEventListener('click', closeGalleryMenu);
    document.getElementById('randomArtBtn').addEventListener('click', () => {
      const nextIdx = Math.floor(Math.random() * ARTWORKS.length);
      selectArtwork(nextIdx);
      closeGalleryMenu();
      showToast(`「${ARTWORKS[nextIdx].title}」を表示しました`);
    });

    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.activeCategory = tab.dataset.cat;
        document.querySelectorAll('.cat-tab').forEach(t => {
          t.classList.remove('bg-white', 'text-slate-950', 'shadow');
          t.classList.add('bg-white/10', 'text-slate-200');
        });
        tab.classList.remove('bg-white/10', 'text-slate-200');
        tab.classList.add('bg-white', 'text-slate-950', 'shadow');
        renderGalleryGrid();
      });
    });

    document.getElementById('toggleControlsBtn').addEventListener('click', () => toggleControls());
    document.getElementById('closeControlsBtn').addEventListener('click', () => toggleControls(false));
    document.getElementById('resetPanelLayoutBtn').addEventListener('click', () => resetPanelLayout(false));

    // スリム折りたたみ表示（PC・スマホ共通で確実に高さを縮小）＆半透明切り替え
    document.getElementById('slimModeBtn').addEventListener('click', (e) => {
      state.isSlimMode = !state.isSlimMode;
      controlPanel.classList.toggle('panel-slim', state.isSlimMode);
      e.target.textContent = state.isSlimMode ? '⇕ 標準' : '⇕ スリム';
      showToast(state.isSlimMode ? '高さを小さくして画面を見やすくしました' : '標準パネル高さに戻しました');
    });

    document.getElementById('translucentBtn').addEventListener('click', (e) => {
      state.isTranslucent = !state.isTranslucent;
      controlPanel.classList.toggle('panel-translucent', state.isTranslucent);
      e.target.classList.toggle('bg-cyan-400/30', state.isTranslucent);
    });

    // パネルヘッダーのドラッグ＆ドロップでパネル位置を自由移動
    (() => {
      const dragHeader = document.getElementById('panelDragHeader');
      let moving = false;
      let startX = 0, startY = 0, origLeft = 0, origTop = 0;

      dragHeader.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        e.stopPropagation();
        ensureFloatingGeometry();
        moving = true;
        controlPanel.classList.add('panel-interacting');
        const rect = controlPanel.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origLeft = rect.left;
        origTop = rect.top;
        dragHeader.setPointerCapture(e.pointerId);
      });

      dragHeader.addEventListener('pointermove', (e) => {
        if (!moving) return;
        e.stopPropagation();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const w = controlPanel.offsetWidth;
        const h = controlPanel.offsetHeight;
        const nextLeft = Math.max(8, Math.min(window.innerWidth - Math.min(w, 80), origLeft + dx));
        const nextTop = Math.max(8, Math.min(window.innerHeight - Math.min(h, 64), origTop + dy));
        controlPanel.style.left = `${nextLeft}px`;
        controlPanel.style.top = `${nextTop}px`;
      });

      const endMove = (e) => {
        if (!moving) return;
        moving = false;
        controlPanel.classList.remove('panel-interacting');
        if (dragHeader.hasPointerCapture(e.pointerId)) {
          dragHeader.releasePointerCapture(e.pointerId);
        }
      };
      dragHeader.addEventListener('pointerup', endMove);
      dragHeader.addEventListener('pointercancel', endMove);
    })();

    // パネル四辺・四隅のドラッグ＆ドロップで幅・高さを自由リサイズ
    (() => {
      const MIN_W = 270;
      const MIN_H = 160;
      document.querySelectorAll('.resize-handle').forEach(handle => {
        const dir = handle.dataset.resize;
        let resizing = false;
        let sx = 0, sy = 0, oL = 0, oT = 0, oW = 0, oH = 0;

        handle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (state.isSlimMode) {
            state.isSlimMode = false;
            controlPanel.classList.remove('panel-slim');
            const slimBtn = document.getElementById('slimModeBtn');
            if (slimBtn) slimBtn.textContent = '⇕ スリム';
          }
          ensureFloatingGeometry();
          resizing = true;
          controlPanel.classList.add('panel-interacting');
          const rect = controlPanel.getBoundingClientRect();
          sx = e.clientX;
          sy = e.clientY;
          oL = rect.left;
          oT = rect.top;
          oW = rect.width;
          oH = rect.height;
          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (!resizing) return;
          e.stopPropagation();
          const dx = e.clientX - sx;
          const dy = e.clientY - sy;
          const maxW = window.innerWidth - 16;
          const maxH = window.innerHeight - 16;

          let newL = oL, newT = oT, newW = oW, newH = oH;
          if (dir.includes('e')) {
            newW = Math.max(MIN_W, Math.min(maxW - oL, oW + dx));
          }
          if (dir.includes('w')) {
            const proposedW = Math.max(MIN_W, Math.min(oL + oW - 8, oW - dx));
            newL = oL + (oW - proposedW);
            newW = proposedW;
          }
          if (dir.includes('s')) {
            newH = Math.max(MIN_H, Math.min(maxH - oT, oH + dy));
          }
          if (dir.includes('n')) {
            const proposedH = Math.max(MIN_H, Math.min(oT + oH - 8, oH - dy));
            newT = oT + (oH - proposedH);
            newH = proposedH;
          }

          controlPanel.style.left = `${newL}px`;
          controlPanel.style.top = `${newT}px`;
          controlPanel.style.width = `${newW}px`;
          controlPanel.style.height = `${newH}px`;
        });

        const endResize = (e) => {
          if (!resizing) return;
          resizing = false;
          controlPanel.classList.remove('panel-interacting');
          if (handle.hasPointerCapture(e.pointerId)) {
            handle.releasePointerCapture(e.pointerId);
          }
        };
        handle.addEventListener('pointerup', endResize);
        handle.addEventListener('pointercancel', endResize);
      });
    })();

    // 設定パネル内カテゴリの個別折りたたみ（アコーディオン）
    document.querySelectorAll('.acc-header').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.accTarget);
        const chev = btn.querySelector('.acc-chevron');
        if (!target) return;
        const isClosed = target.classList.toggle('hidden');
        if (chev) chev.style.transform = isClosed ? 'rotate(-90deg)' : 'rotate(0deg)';
      });
    });

    // 動画保存（Canvas録画機能）
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    const recordVideoBtn = document.getElementById('recordVideoBtn');
    const recordDot = document.getElementById('recordDot');
    const recordLabel = document.getElementById('recordLabel');

    recordVideoBtn.addEventListener('click', () => {
      if (!isRecording) {
        try {
          if (typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
            showToast('お使いのブラウザは動画録画に対応していません');
            return;
          }
          const stream = canvas.captureStream(30);
          const mimeTypes = [
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm',
            'video/mp4'
          ];
          const supportedMime = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';
          recordedChunks = [];
          mediaRecorder = supportedMime
            ? new MediaRecorder(stream, { mimeType: supportedMime })
            : new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            const blobType = supportedMime || 'video/webm';
            const ext = blobType.includes('mp4') ? 'mp4' : 'webm';
            const blob = new Blob(recordedChunks, { type: blobType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const art = ARTWORKS[state.currentArtIndex];
            link.download = `luminous-${art.id}-${Date.now()}.${ext}`;
            link.href = url;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            showToast('録画した動画を保存しました');
          };

          mediaRecorder.start(200);
          isRecording = true;
          recordVideoBtn.classList.add('border-rose-400/70', 'bg-rose-500/25');
          recordDot.classList.add('animate-ping');
          recordLabel.textContent = '停止';
          showToast('動画の録画を開始しました（もう一度押すと保存）');
        } catch (err) {
          showToast('動画録画の開始に失敗しました');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        isRecording = false;
        recordVideoBtn.classList.remove('border-rose-400/70', 'bg-rose-500/25');
        recordDot.classList.remove('animate-ping');
        recordLabel.textContent = '録画';
      }
    });

    document.getElementById('hideUiBtn').addEventListener('click', () => {
      state.isUiHidden = true;
      topHud.classList.add('opacity-0', 'pointer-events-none');
      toggleControls(false);
      restoreUiBtn.classList.remove('opacity-0', 'pointer-events-none');
      showToast('純粋鑑賞モード（右下のボタンでUI復帰）');
    });
    restoreUiBtn.addEventListener('click', () => {
      state.isUiHidden = false;
      topHud.classList.remove('opacity-0', 'pointer-events-none');
      restoreUiBtn.classList.add('opacity-0', 'pointer-events-none');
    });

    document.getElementById('screenshotBtn').addEventListener('click', () => {
      try {
        const link = document.createElement('a');
        const art = ARTWORKS[state.currentArtIndex];
        link.download = `luminous-${art.id}-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('美しい光景を静止画として保存しました');
      } catch (e) {
        showToast('画像の保存に失敗しました');
      }
    });

    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.params.palette = btn.dataset.palette;
        buildControlSliders();
        pushHistory();
      });
    });

    // 1個前に戻す / 1個先に進める / パーツ位置戻す
    document.getElementById('undoBtn').addEventListener('click', () => {
      if (state.history.index > 0) {
        state.history.index--;
        applySnapshot(state.history.stack[state.history.index]);
        showToast('1個前の設定に戻しました');
      }
    });

    document.getElementById('redoBtn').addEventListener('click', () => {
      if (state.history.index < state.history.stack.length - 1) {
        state.history.index++;
        applySnapshot(state.history.stack[state.history.index]);
        showToast('1個先の設定に進めました');
      }
    });

    document.getElementById('resetPositionsBtn').addEventListener('click', () => {
      state.params.sceneOffset = { x: 0, y: 0 };
      initCurrentArtwork();
      pushHistory();
      showToast('アイテムと画面の配置を初期位置に戻しました');
    });

    document.getElementById('randomParamBtn').addEventListener('click', () => {
      const palKeys = Object.keys(PALETTES);
      state.params.palette = palKeys[Math.floor(Math.random() * palKeys.length)];
      state.params.hueShift = Math.floor(Math.random() * 360);
      state.params.size = Number((0.6 + Math.random() * 1.4).toFixed(2));
      state.params.crossLength = Number((0.4 + Math.random() * 1.8).toFixed(2));
      state.params.scale = Number((0.75 + Math.random() * 0.7).toFixed(2));
      state.params.density = Number((0.6 + Math.random() * 1.4).toFixed(2));
      state.params.glow = Number((0.7 + Math.random() * 1.3).toFixed(2));
      state.params.speed = Number((0.5 + Math.random() * 1.6).toFixed(2));
      state.params.parts = {
        p1: Number((0.6 + Math.random() * 1.4).toFixed(2)),
        p2: Number((0.6 + Math.random() * 1.4).toFixed(2)),
        p3: Number((0.6 + Math.random() * 1.4).toFixed(2))
      };
      initCurrentArtwork();
      buildControlSliders();
      pushHistory();
      showToast('パラメータをランダムに設定しました');
    });

    document.getElementById('pauseBtn').addEventListener('click', (e) => {
      state.isPaused = !state.isPaused;
      e.target.textContent = state.isPaused ? '▶ 再生' : '⏸ 一時停止';
    });

    document.getElementById('resetParamBtn').addEventListener('click', () => {
      state.params = {
        palette: 'original',
        hueShift: 0,
        size: 1.0,
        crossLength: 1.0,
        scale: 1.0,
        density: 1.0,
        glow: 1.0,
        speed: 1.0,
        reactivity: 1.0,
        parts: { p1: 1.0, p2: 1.0, p3: 1.0 },
        sceneOffset: { x: 0, y: 0 }
      };
      initCurrentArtwork();
      buildControlSliders();
      pushHistory();
      showToast('すべての設定を初期値に戻しました');
    });

    document.getElementById('savePresetBtn').addEventListener('click', () => {
      const input = document.getElementById('presetNameInput');
      const art = ARTWORKS[state.currentArtIndex];
      const all = loadAllPresets();
      if (!all[art.id]) all[art.id] = [];
      const name = (input.value || '').trim() || `マイ設定 #${all[art.id].length + 1}`;
      all[art.id].unshift({
        name,
        snapshot: cloneCurrentSnapshot()
      });
      saveAllPresets(all);
      input.value = '';
      renderPresetList();
      showToast(`「${name}」を保存しました`);
    });

    // ============================================================================
    // 画面上の全アイテム・オブジェクトのドラッグ＆ドロップ配置・固定ロジック
    // ============================================================================
    function toSceneCoords(clientX, clientY) {
      const w = state.width;
      const h = state.height;
      const sc = Math.max(0.05, state.params.scale);
      const ox = state.params.sceneOffset.x;
      const oy = state.params.sceneOffset.y;
      return {
        x: (clientX - (w * 0.5 + ox)) / sc + w * 0.5,
        y: (clientY - (h * 0.5 + oy)) / sc + h * 0.5
      };
    }

    function beginCanvasDrag(clientX, clientY, isClick) {
      state.pointer.vx = 0;
      state.pointer.vy = 0;
      state.pointer.x = clientX;
      state.pointer.y = clientY;
      state.pointer.isDown = true;
      state.pointer.active = true;
      if (isClick) state.pointer.justClicked = true;

      const art = ARTWORKS[state.currentArtIndex];
      const local = toSceneCoords(clientX, clientY);
      state.pointer.dragTarget = null;

      // 太陽・光源を持つ作品（11青空, 12夕焼け, 21妖精, 22放射線）は太陽・光源を優先ヒット判定
      if ((art.id === 'bluesky' || art.id === 'sunset') && sim.extra.sunX !== undefined) {
        if (Math.hypot(local.x - sim.extra.sunX, local.y - sim.extra.sunY) < 110) {
          state.pointer.dragTarget = { type: 'sun' };
          state.pointer.dragOffsetX = sim.extra.sunX - local.x;
          state.pointer.dragOffsetY = sim.extra.sunY - local.y;
          return;
        }
      }
      if ((art.id === 'fairydust' || art.id === 'radial_rays') && sim.extra.originX !== undefined) {
        if (Math.hypot(local.x - sim.extra.originX, local.y - sim.extra.originY) < 110) {
          state.pointer.dragTarget = { type: 'origin' };
          state.pointer.dragOffsetX = sim.extra.originX - local.x;
          state.pointer.dragOffsetY = sim.extra.originY - local.y;
          return;
        }
      }
      // 中心核を持つ作品（16銀河中心核, 17日食, 23ブラックホール）は中心核をドラッグ＆ドロップで配置可能
      if ((art.id === 'galaxy_canal' || art.id === 'eclipse' || art.id === 'blackhole') && sim.extra.coreX !== undefined) {
        if (Math.hypot(local.x - sim.extra.coreX, local.y - sim.extra.coreY) < 140) {
          state.pointer.dragTarget = { type: 'core' };
          state.pointer.dragOffsetX = sim.extra.coreX - local.x;
          state.pointer.dragOffsetY = sim.extra.coreY - local.y;
          return;
        }
      }

      // 個別アイテム（ランプ・球体・雲・蝶・満月・ダイヤモンド・クリスタル等）のヒット判定
      if (sim.items && sim.items.length > 0) {
        let bestItem = null;
        let bestDist = Infinity;
        for (const it of sim.items) {
          if (it.x === undefined || it.y === undefined) continue;
          const hitR = (it.hitR || 50) * state.params.size;
          const d = Math.hypot(local.x - it.x, local.y - it.y);
          if (d < hitR && d < bestDist) {
            bestDist = d;
            bestItem = it;
          }
        }
        if (bestItem) {
          state.pointer.dragTarget = { type: 'item', item: bestItem };
          state.pointer.dragOffsetX = bestItem.x - local.x;
          state.pointer.dragOffsetY = bestItem.y - local.y;
          if (art.id === 'lamps') {
            bestItem.energy = 1.0;
            bestItem.hue = (bestItem.hue + 55) % 360;
            sim.ripples.push({ x: bestItem.x, y: bestItem.y, r: bestItem.radius, maxR: 260, hue: bestItem.hue, alpha: 0.9 });
          }
          return;
        }
      }

      // 空間全体（星雲・天の川・滝・紅葉枝など）のオフセット移動
      state.pointer.dragTarget = { type: 'scene' };
      state.pointer.dragOffsetX = state.params.sceneOffset.x - clientX;
      state.pointer.dragOffsetY = state.params.sceneOffset.y - clientY;
    }

    function moveCanvasDrag(clientX, clientY) {
      state.pointer.vx = clientX - state.pointer.x;
      state.pointer.vy = clientY - state.pointer.y;
      state.pointer.x = clientX;
      state.pointer.y = clientY;
      state.pointer.active = true;

      if (!state.pointer.isDown || !state.pointer.dragTarget) return;
      const local = toSceneCoords(clientX, clientY);
      const target = state.pointer.dragTarget;

      if (target.type === 'sun') {
        sim.extra.sunX = local.x + state.pointer.dragOffsetX;
        sim.extra.sunY = local.y + state.pointer.dragOffsetY;
      } else if (target.type === 'origin') {
        sim.extra.originX = local.x + state.pointer.dragOffsetX;
        sim.extra.originY = local.y + state.pointer.dragOffsetY;
      } else if (target.type === 'core') {
        sim.extra.coreX = local.x + state.pointer.dragOffsetX;
        sim.extra.coreY = local.y + state.pointer.dragOffsetY;
      } else if (target.type === 'item') {
        const it = target.item;
        it.x = local.x + state.pointer.dragOffsetX;
        it.y = local.y + state.pointer.dragOffsetY;
        if (it.baseX !== undefined) it.baseX = it.x;
        if (it.baseY !== undefined) it.baseY = it.y;
        it.pinnedX = it.x;
        it.pinnedY = it.y;
      } else if (target.type === 'scene') {
        state.params.sceneOffset.x = clientX + state.pointer.dragOffsetX;
        state.params.sceneOffset.y = clientY + state.pointer.dragOffsetY;
      }
    }

    function endCanvasDrag() {
      if (state.pointer.isDown && state.pointer.dragTarget) {
        pushHistory();
      }
      state.pointer.isDown = false;
      state.pointer.dragTarget = null;
    }

    canvas.addEventListener('mousedown', (e) => beginCanvasDrag(e.clientX, e.clientY, true));
    window.addEventListener('mousemove', (e) => moveCanvasDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endCanvasDrag);
    canvas.addEventListener('mouseleave', () => { state.pointer.active = false; });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        beginCanvasDrag(t.clientX, t.clientY, true);
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        moveCanvasDrag(t.clientX, t.clientY);
      }
    }, { passive: true });
    canvas.addEventListener('touchend', endCanvasDrag);

    window.onload = function () {
      resizeCanvas();
      selectArtwork(0);
      requestAnimationFrame(animate);
    };
  </script>
</body>
