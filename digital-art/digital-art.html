<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LUMINOUS SANCTUARY - 光と情景のデジタルアート空間</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #03050a;
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      color: #f8fafc;
    }
    canvas#artCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.35);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.7);
    }

    /* 1. スマホでの縦スクロール誤操作を防止しつつ指で掴みやすいレンジスライダー */
    .slider-track-wrap {
      touch-action: pan-y;
      padding: 6px 0;
    }
    input[type="range"].guarded-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      touch-action: pan-y;
    }
    input[type="range"].guarded-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid rgba(56, 189, 248, 0.75);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 2px 6px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    input[type="range"].guarded-slider:active::-webkit-slider-thumb,
    input[type="range"].guarded-slider:hover::-webkit-slider-thumb {
      transform: scale(1.16);
      background: #fef08a;
    }
    input[type="range"].guarded-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(56, 189, 248, 0.75);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }

    .glass-panel {
      background: rgba(10, 14, 26, 0.84);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.78);
    }
    .glass-card {
      background: rgba(20, 27, 46, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(30, 41, 69, 0.78);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.25);
    }
    .fade-transition {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .pt-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
  </style>
</head>
<body class="relative w-screen h-[100dvh] overflow-hidden select-none">

  <!-- メインアート描画用全画面Canvas -->
  <canvas id="artCanvas"></canvas>

  <!-- トースト通知（alert代替） -->
  <div id="toastMessage" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 glass-panel px-5 py-2.5 rounded-full text-xs sm:text-sm font-medium text-white shadow-lg flex items-center gap-2 whitespace-nowrap">
    <span class="w-2 h-2 rounded-full bg-amber-300 animate-ping"></span>
    <span id="toastText">通知メッセージ</span>
  </div>

  <!-- 上部フローティングHUD（鑑賞中に表示） -->
  <header id="topHud" class="fixed top-0 left-0 right-0 z-30 px-3 sm:px-5 pb-3 pt-safe flex items-center justify-between pointer-events-none fade-transition">
    <!-- 左側：メニューボタン＆現在の作品タイトル -->
    <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto min-w-0">
      <button id="openMenuBtn" class="glass-panel hover:bg-white/15 active:scale-95 text-white px-3 py-2.5 sm:px-4 sm:py-2.5 rounded-2xl flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-medium transition shadow-lg shrink-0">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>作品一覧</span>
      </button>

      <div class="glass-panel px-3 py-2 sm:px-4 sm:py-2 rounded-2xl max-w-[175px] sm:max-w-md truncate">
        <div class="flex items-center gap-2">
          <span id="hudCategoryBadge" class="hidden sm:inline-block text-[10px] px-2 py-0.5 rounded-full bg-white/15 text-amber-200 font-medium shrink-0">デジタル空間</span>
          <h1 id="hudArtTitle" class="text-xs sm:text-sm font-semibold text-white truncate">1. 呼応するランプの森</h1>
        </div>
        <p id="hudArtHint" class="text-[10px] sm:text-xs text-slate-300 truncate mt-0.5">ランプに近づく・タップすると光の連鎖が広がります</p>
      </div>
    </div>

    <!-- 右側：クイック操作＆パラメータパネル開閉 -->
    <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto shrink-0">
      <button id="screenshotBtn" title="スクリーンショット保存" class="glass-panel hover:bg-white/15 active:scale-95 p-2.5 rounded-2xl text-slate-200 hover:text-white transition">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>

      <button id="hideUiBtn" title="純粋鑑賞モード（UI非表示）" class="glass-panel hover:bg-white/15 active:scale-95 px-2.5 py-2.5 sm:px-3 rounded-2xl text-slate-200 hover:text-white flex items-center gap-1.5 text-xs font-medium transition">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        </svg>
        <span class="hidden md:inline">純粋鑑賞</span>
      </button>

      <button id="toggleControlsBtn" class="glass-panel hover:bg-white/15 active:scale-95 px-3 py-2.5 sm:px-4 sm:py-2.5 rounded-2xl flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-medium text-white transition shadow-lg">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
        </svg>
        <span>調整</span>
      </button>
    </div>
  </header>

  <!-- UI非表示時の復帰ボタン -->
  <button id="restoreUiBtn" class="fixed bottom-5 right-5 z-40 glass-panel px-4 py-2.5 rounded-full text-xs sm:text-sm text-white/90 hover:text-white flex items-center gap-2 shadow-xl opacity-0 pointer-events-none transition-opacity duration-300">
    <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
    </svg>
    <span>UIを表示</span>
  </button>

  <!-- パラメータ調整パネル（PC: 右サイド / スマホ: 誤操作防止ボトムシート＋右端スクロール安全帯） -->
  <aside id="controlPanel" class="fixed z-30 bottom-0 left-0 right-0 md:top-20 md:bottom-5 md:left-auto md:right-5 md:w-[360px] glass-panel rounded-t-3xl md:rounded-3xl flex flex-col max-h-[72dvh] md:max-h-[calc(100dvh-6.5rem)] transform translate-y-full md:translate-y-0 md:translate-x-[120%] transition-transform duration-300 ease-out">
    <!-- 固定ヘッダー部（上下スワイプでも快適） -->
    <div class="px-5 pt-3.5 pb-3 border-b border-white/10 shrink-0">
      <div class="w-10 h-1 rounded-full bg-white/25 mx-auto mb-2 md:hidden"></div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-amber-300 to-cyan-300"></span>
          <h2 class="text-sm font-semibold tracking-wide text-white">光のパラメータ調整 (0%〜500%)</h2>
        </div>
        <button id="closeControlsBtn" aria-label="設定を閉じる" class="p-1.5 rounded-xl hover:bg-white/10 text-slate-300 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <p class="text-[10px] text-slate-400 mt-1 md:hidden">※上下スワイプでスクロール／横スライドまたは「− ＋」で微調整</p>
    </div>

    <!-- スクロール領域（右端に指で安全にスクロールできる余白グリップ帯を確保） -->
    <div id="controlScrollArea" class="flex-1 overflow-y-auto pl-5 pr-8 md:pr-5 py-4 pb-[calc(1.75rem+env(safe-area-inset-bottom))] space-y-5 relative" style="touch-action: pan-y;">
      <!-- 右端スクロールガイドライン（スマホの親指スクロール専用ゾーン視覚補助） -->
      <div class="md:hidden pointer-events-none fixed right-1.5 top-1/2 -translate-y-1/2 w-1.5 h-16 rounded-full bg-white/15"></div>

      <!-- 4. 作品固有のメインパーツ別パラメータ（0%〜500%） -->
      <div class="bg-white/[0.04] border border-amber-300/25 rounded-2xl p-3.5 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-amber-200 flex items-center gap-1.5">
            <span>🎛️</span>
            <span id="partSectionTitle">パーツ別サイズ・強さ調整</span>
          </span>
          <span class="text-[10px] text-slate-400">0%〜500%</span>
        </div>
        <div id="partControlsContainer" class="space-y-3 text-xs">
          <!-- JavaScriptで現在選択中作品のパーツ別スライダーを動的生成 -->
        </div>
      </div>

      <!-- カラーテーマ選択（6種） -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-2">カラーパレット・雰囲気</label>
        <div id="paletteSelector" class="grid grid-cols-3 gap-1.5">
          <button data-palette="original" class="palette-btn active px-2 py-2 rounded-xl text-xs font-medium bg-white/20 border border-white/40 text-white transition">オリジナル</button>
          <button data-palette="golden" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-amber-200 hover:bg-white/15 transition">ゴールデン</button>
          <button data-palette="aurora" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-emerald-200 hover:bg-white/15 transition">オーロラ</button>
          <button data-palette="sakura" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-pink-200 hover:bg-white/15 transition">サクラ幻想</button>
          <button data-palette="deepblue" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-cyan-200 hover:bg-white/15 transition">ディープ海</button>
          <button data-palette="prism" class="palette-btn px-2 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-purple-200 hover:bg-white/15 transition">プリズム虹</button>
        </div>
      </div>

      <!-- 2 & 3 & 10. 共通パラメータ群（下限0%〜上限500%、サイズとスケールを完全分離） -->
      <div id="globalSlidersContainer" class="space-y-3.5 text-xs">
        <!-- JavaScriptで共通スライダー群を生成（タッチガード＆−/＋ボタン付き） -->
      </div>

      <!-- アクションボタン -->
      <div class="grid grid-cols-3 gap-2 pt-3 border-t border-white/10">
        <button id="randomParamBtn" class="py-2.5 px-2 rounded-xl bg-gradient-to-r from-indigo-500/40 to-purple-500/40 hover:from-indigo-500/60 hover:to-purple-500/60 border border-white/20 text-xs font-medium text-white transition active:scale-95">
          ✨ ランダム
        </button>
        <button id="pauseBtn" class="py-2.5 px-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-xs font-medium text-white transition active:scale-95">
          ⏸ 一時停止
        </button>
        <button id="resetParamBtn" class="py-2.5 px-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-xs font-medium text-white transition active:scale-95">
          ↺ 初期値
        </button>
      </div>
    </div>
  </aside>

  <!-- ギャラリーメニューオーバーレイ（トップ画面：全24作品選択画面） -->
  <div id="galleryModal" class="fixed inset-0 z-40 bg-slate-950/90 backdrop-blur-xl flex flex-col transition-opacity duration-300">
    <!-- ヘッダー部 -->
    <div class="px-4 sm:px-8 pt-safe pb-3 border-b border-white/10 flex flex-col md:flex-row md:items-center md:justify-between gap-3 shrink-0">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="inline-block w-3 h-3 rounded-full bg-gradient-to-tr from-amber-300 via-pink-400 to-cyan-400 shadow-[0_0_12px_#fbbf24]"></span>
          <h1 class="text-lg sm:text-2xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-amber-100 to-cyan-200">
            LUMINOUS SANCTUARY
          </h1>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-white/10 text-amber-200 border border-amber-300/30">全24作品</span>
        </div>
        <p class="text-xs sm:text-sm text-slate-300 mt-1">美しい光と幻想的な情景を旅するインタラクティブ・デジタルアート空間</p>
      </div>

      <div class="flex items-center gap-2 self-end md:self-auto">
        <button id="randomArtBtn" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500/30 to-pink-500/30 hover:from-amber-500/50 hover:to-pink-500/50 border border-amber-300/30 text-xs sm:text-sm font-medium text-amber-100 transition flex items-center gap-1.5 active:scale-95">
          <span>🎲 ランダム鑑賞</span>
        </button>
        <button id="closeMenuBtn" class="px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-xs sm:text-sm font-medium text-white transition active:scale-95">
          閉じる ✕
        </button>
      </div>
    </div>

    <!-- カテゴリフィルタータブ -->
    <div class="px-4 sm:px-8 py-3 flex items-center gap-2 overflow-x-auto shrink-0 border-b border-white/5">
      <button data-cat="all" class="cat-tab active px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white text-slate-950 shadow transition whitespace-nowrap">
        すべて (24)
      </button>
      <button data-cat="teamlab" class="cat-tab px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/10 text-slate-200 hover:bg-white/20 transition whitespace-nowrap">
        ✨ デジタル空間 (6)
      </button>
      <button data-cat="aqua" class="cat-tab px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/10 text-slate-200 hover:bg-white/20 transition whitespace-nowrap">
        🪼 アクア・自然 (6)
      </button>
      <button data-cat="cosmos" class="cat-tab px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/10 text-slate-200 hover:bg-white/20 transition whitespace-nowrap">
        🌌 天体・宇宙・風景 (6)
      </button>
      <button data-cat="glitter" class="cat-tab px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/10 text-slate-200 hover:bg-white/20 transition whitespace-nowrap">
        🌟 黄金グリッター・幻想光 (6)
      </button>
    </div>

    <!-- 24作品グリッド一覧 -->
    <div id="artGrid" class="flex-1 overflow-y-auto p-4 sm:p-8 pb-[calc(1.5rem+env(safe-area-inset-bottom))] grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <!-- JavaScriptで24枚のカードを生成 -->
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * LUMINOUS SANCTUARY - 24種類の光と情景のデジタルアートエンジン（完全改修版）
     * ============================================================================
     */

    // 全24作品の定義データ（各作品固有のメインパーツ別パラメータ定義を含む）
    const ARTWORKS = [
      // --- カテゴリA：デジタル空間 (6) ---
      {
        id: 'lamps',
        num: 1,
        cat: 'teamlab',
        catLabel: 'デジタル空間',
        title: '呼応するランプの森',
        en: 'Forest of Resonating Lamps',
        desc: '無数のベネチアンガラス風ランプが空間に浮かび、触れたランプから隣へと光の波紋が伝播します。',
        hint: 'ランプに近づく・タップすると光の連鎖が広がります',
        grad: 'from-amber-500/40 via-rose-500/30 to-purple-900/60',
        parts: [
          { key: 'p1', label: '① ガラスランプ本体の大きさ', def: 100 },
          { key: 'p2', label: '② 周囲ハロー光の広がり', def: 100 },
          { key: 'p3', label: '③ 光の連鎖波紋の大きさ', def: 100 }
        ]
      },
      {
        id: 'crystal',
        num: 2,
        cat: 'teamlab',
        catLabel: 'デジタル空間',
        title: '境界のない結晶世界',
        en: 'Borderless Crystal Universe',
        desc: '無限に広がる3D空間のLED光柱と光の粒が立体的に回転・明滅し、空間の境界を溶かします。',
        hint: 'ドラッグ・スワイプで3D光空間の視点を自由に回転できます',
        grad: 'from-cyan-500/40 via-blue-600/30 to-indigo-950/70',
        parts: [
          { key: 'p1', label: '① 結晶コア粒子の大きさ', def: 100 },
          { key: 'p2', label: '② 垂直LED光柱の長さ', def: 100 },
          { key: 'p3', label: '③ 3D結晶格子の間隔', def: 100 }
        ]
      },
      {
        id: 'waterfall',
        num: 3,
        cat: 'teamlab',
        catLabel: 'デジタル空間',
        title: '花と人のデジタル滝',
        en: 'Waterfall of Flowers & Light',
        desc: '岩肌を流れ落ちる光の滝。触れた場所を人が立つ岩のように避けて流れ、色とりどりの花びらが舞い散ります。',
        hint: '画面に触れると水流が分かれ、光の華が咲き誇ります',
        grad: 'from-teal-400/40 via-pink-500/30 to-slate-900/70',
        parts: [
          { key: 'p1', label: '① 滝の水流ラインの太さ・長さ', def: 100 },
          { key: 'p2', label: '② 咲き誇る光の華の大きさ', def: 100 },
          { key: 'p3', label: '③ 岩（障害物）の反発半径', def: 100 }
        ]
      },
      {
        id: 'spheres',
        num: 4,

        size: 1.0,       // 光の粒・要素個別のサイズ倍率
        scale: 1.0,      // 空間全体のズーム・スケール倍率
        density: 1.0,
        glow: 1.0,
        speed: 1.0,
        reactivity: 1.0,
        parts: { p1: 1.0, p2: 1.0, p3: 1.0 } // 作品固有パーツ別パラメータ
      },
      pointer: {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        isDown: false,
        justClicked: false,
        active: false
      },
      time: 0,
      width: 0,
      height: 0,
      dpr: 1
    };

    // DOM要素参照
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const galleryModal = document.getElementById('galleryModal');
    const artGrid = document.getElementById('artGrid');
    const controlPanel = document.getElementById('controlPanel');
    const topHud = document.getElementById('topHud');
    const restoreUiBtn = document.getElementById('restoreUiBtn');

    // トースト通知表示関数
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    // 色変換ヘルパー（パレットと色相シフトを適用）
    function getArtColor(defaultHue, sat = 85, light = 60, alpha = 1, seed = 0) {
      let h = defaultHue;
      let s = sat;
      let l = light;
      const pal = PALETTES[state.params.palette];
      if (pal) {
        if (state.params.palette === 'prism') {
          h = (state.time * 40 + seed * 137.5) % 360;
        } else {
          const offset = Math.sin(seed * 12.9898) * 0.5 + 0.5;
          h = pal.baseHue + (offset - 0.5) * pal.spread;
        }
        s = (s + pal.sat) * 0.5;
        l = (l + pal.light) * 0.5;
      }
      h = (h + state.params.hueShift + 360) % 360;
      const safeAlpha = Math.max(0, Math.min(1, alpha));
      return `hsla(${h.toFixed(1)}, ${s.toFixed(0)}%, ${l.toFixed(0)}%, ${safeAlpha.toFixed(3)})`;
    }

    // Canvasのリサイズ処理
    function resizeCanvas() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      initCurrentArtwork();
    }
    window.addEventListener('resize', resizeCanvas);

    // ============================================================================
    // 1. スマホでの上下スクロール誤操作を防止するスライダー生成＆タッチガード
    // ============================================================================
    function createGuardedSliderRow({ id, label, min, max, step, value, unit, onChange }) {
      const wrapper = document.createElement('div');
      wrapper.className = 'space-y-1';

      const header = document.createElement('div');
      header.className = 'flex items-center justify-between gap-2';
      header.innerHTML = `
        <span class="text-slate-200 font-medium truncate">${label}</span>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" data-step="-${step}" class="step-btn w-6 h-6 rounded-lg bg-white/10 hover:bg-white/20 active:bg-white/30 text-white font-bold flex items-center justify-center text-xs transition">−</button>
          <span id="${id}_val" class="font-mono text-amber-200 w-12 text-right">${value}${unit}</span>
          <button type="button" data-step="${step}" class="step-btn w-6 h-6 rounded-lg bg-white/10 hover:bg-white/20 active:bg-white/30 text-white font-bold flex items-center justify-center text-xs transition">＋</button>
        </div>
      `;

      const trackWrap = document.createElement('div');
      trackWrap.className = 'slider-track-wrap';

      const input = document.createElement('input');
      input.type = 'range';
      input.id = id;
      input.className = 'guarded-slider';
      input.min = min;
      input.max = max;
      input.step = step;
      input.value = value;

      // タッチ時の縦スクロール誤反応防止ガード
      let startX = 0;
      let startY = 0;
      let lockedValue = value;
      let gestureMode = 'undecided'; // 'undecided' | 'scroll' | 'slide'

      input.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          lockedValue = Number(input.value);
          gestureMode = 'undecided';
        }
      }, { passive: true });

      input.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const dx = Math.abs(e.touches[0].clientX - startX);
          const dy = Math.abs(e.touches[0].clientY - startY);
          if (gestureMode === 'undecided' && (dx > 6 || dy > 6)) {
            gestureMode = dy > dx * 1.1 ? 'scroll' : 'slide';
          }
          if (gestureMode === 'scroll') {
            // 縦スクロールと判定された場合は値をロックして戻す
            input.value = lockedValue;
          }
        }
      }, { passive: true });

      input.addEventListener('input', () => {
        if (gestureMode === 'scroll') {
          input.value = lockedValue;
          return;
        }
        const v = Number(input.value);
        document.getElementById(`${id}_val`).textContent = `${v}${unit}`;
        onChange(v);
      });

      // 「−」「＋」微調整ボタンのイベント
      header.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const delta = Number(btn.dataset.step);
          const next = Math.max(min, Math.min(max, Number(input.value) + delta));
          input.value = next;
          document.getElementById(`${id}_val`).textContent = `${next}${unit}`;
          onChange(next);
        });
      });

      trackWrap.appendChild(input);
      wrapper.appendChild(header);
      wrapper.appendChild(trackWrap);
      return wrapper;
    }

    function buildControlSliders() {
      // 作品固有パーツ別スライダー
      const art = ARTWORKS[state.currentArtIndex];
      const partContainer = document.getElementById('partControlsContainer');
      document.getElementById('partSectionTitle').textContent = `パーツ別調整：${art.title}`;
      partContainer.innerHTML = '';

      art.parts.forEach((pt) => {
        const curPct = Math.round((state.params.parts[pt.key] ?? 1.0) * 100);
        const row = createGuardedSliderRow({
          id: `part_${pt.key}`,

          unit: '%',

            state.params.parts[pt.key] = val / 100;
          }
        });
        partContainer.appendChild(row);
      });

      // 共通スライダー（0%〜500%）
      const globalContainer = document.getElementById('globalSlidersContainer');
      globalContainer.innerHTML = '';
      GLOBAL_SLIDERS.forEach((gs) => {
        const curVal = gs.isPct ? Math.round(state.params[gs.key] * 100) : state.params[gs.key];
        const row = createGuardedSliderRow({
          id: `global_${gs.key}`,
          label: gs.label,
          min: gs.min,
          max: gs.max,
          step: gs.step,
          value: curVal,
          unit: gs.unit,
          onChange: (val) => {
            state.params[gs.key] = gs.isPct ? val / 100 : val;
            if (gs.reinit) initCurrentArtwork();
          }
        });
        globalContainer.appendChild(row);
      });

      // パレットボタンの同期
      document.querySelectorAll('.palette-btn').forEach(btn => {
        const active = btn.dataset.palette === state.params.palette;
        btn.classList.toggle('bg-white/20', active);
        btn.classList.toggle('border-white/40', active);
        btn.classList.toggle('bg-white/5', !active);
      });
    }

    // ============================================================================
    // 各アートワークの内部状態・初期化ロジック（全24種）
    // ============================================================================
    let sim = {};

    // フラクタルノイズ（fBm）を用いたリアルな雲テクスチャ生成キャッシュ（作品11・12用）
    const cloudSpriteCache = new Map();

    function hash2D(ix, iy, seed) {
      const n = Math.sin(ix * 127.1 + iy * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, y, seed) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2D(ix, iy, seed);
      const b = hash2D(ix + 1, iy, seed);
      const c = hash2D(ix, iy + 1, seed);
      const d = hash2D(ix + 1, iy + 1, seed);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, seed, octaves = 5) {
      let val = 0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * valueNoise2D(x * freq, y * freq, seed + i * 19.3);
        freq *= 2.04;
        amp *= 0.5;
      }
      return val;
    }

    // 煙・水蒸気のように繊細な輪郭と明暗を持つオフスクリーン雲スプライトを生成
    function getRealisticCloudSprite(seed, isSunset = false) {
      const key = `${seed}_${isSunset ? 'sunset' : 'sky'}`;
      if (cloudSpriteCache.has(key)) return cloudSpriteCache.get(key);

      const cw = 300;
      const ch = 150;
      const off = document.createElement('canvas');
      off.width = cw;
      off.height = ch;
      const octx = off.getContext('2d');
      const img = octx.createImageData(cw, ch);
      const data = img.data;

      for (let py = 0; py < ch; py++) {
        const ny = (py / ch) * 2 - 1; // -1(上端) 〜 +1(下端)
        for (let px = 0; px < cw; px++) {
          const nx = (px / cw) * 2 - 1; // -1(左端) 〜 +1(右端)

          // ドメインワーピング（煙のようなうねり）＋多層fBmノイズ
          const warpX = fbm2D(px * 0.016, py * 0.022, seed + 3.1, 3) - 0.5;
          const warpY = fbm2D(px * 0.016 + 7.2, py * 0.022, seed + 8.4, 3) - 0.5;
          const n = fbm2D(px * 0.024 + warpX * 1.4, py * 0.032 + warpY * 1.2, seed, 5);
          const detail = fbm2D(px * 0.065, py * 0.08, seed + 41.2, 3);

          // 積雲・層積雲らしい平らな底面とモクモクした上部シルエットのマスク
          const flatBottom = ny > 0.25 ? Math.pow((ny - 0.25) / 0.75, 1.5) * 1.35 : 0;
          const radialDist = Math.sqrt(nx * nx * 0.95 + Math.pow(Math.min(0, ny) * 1.15, 2) + flatBottom);
          const mask = Math.max(0, 1.0 - Math.pow(radialDist, 1.75));

          const densityVal = (n * 0.78 + detail * 0.22) * mask * 1.65 - 0.26;
          const idx = (py * cw + px) * 4;

          if (densityVal <= 0) {
            data[idx + 3] = 0;
          } else {
            const alpha = Math.min(1, Math.pow(densityVal, 1.25) * 1.25);
            // 上部ほど太陽光を浴びて明るく、下部ほど水蒸気の厚みで柔らかな陰影になるグラデーション
            const lightFactor = Math.max(0, Math.min(1, 0.55 - ny * 0.42 + (detail - 0.5) * 0.35));
            if (isSunset) {
              // 夕焼け雲：縁は黄金〜茜、厚みのある中心・下部は深紫〜ローズの陰影
              data[idx]     = Math.min(255, Math.round(145 + lightFactor * 110));
              data[idx + 1] = Math.min(255, Math.round(58 + lightFactor * 125));
              data[idx + 2] = Math.min(255, Math.round(88 + lightFactor * 75));
            } else {
              // 青空の積雲：上部は純白、下部は爽やかなスカイグレーブルーの陰影
              data[idx]     = Math.min(255, Math.round(205 + lightFactor * 50));
              data[idx + 1] = Math.min(255, Math.round(218 + lightFactor * 37));
              data[idx + 2] = Math.min(255, Math.round(238 + lightFactor * 17));
            }
            data[idx + 3] = Math.round(alpha * 235);
          }
        }
      }
      octx.putImageData(img, 0, 0);
      cloudSpriteCache.set(key, off);
      return off;
    }

    function initCurrentArtwork() {
      const art = ARTWORKS[state.currentArtIndex];
      const w = state.width;
      const h = state.height;
      const d = Math.max(0.05, state.params.density);
      sim = { particles: [], items: [], ripples: [], extra: {} };

      switch (art.id) {
        case 'lamps': {
          const count = Math.min(260, Math.max(4, Math.floor(((w * h) / 14000 + 18) * d)));
          for (let i = 0; i < count; i++) {
            sim.items.push({
              x: Math.random() * w,
              y: Math.random() * h,
              baseY: Math.random() * h,
              phase: Math.random() * Math.PI * 2,
              radius: 14 + Math.random() * 14,
              hue: 25 + Math.random() * 35,
              energy: 0.22,
              cooldown: 0
            });
          }
          break;
        }
        case 'crystal': {
          sim.extra.rotX = 0.2;
          sim.extra.rotY = 0;
          const cols = d > 1.8 ? 9 : (d > 1.2 ? 8 : 6);
          for (let x = -cols; x <= cols; x += 2) {
            for (let z = -cols; z <= cols; z += 2) {
              for (let y = -4; y <= 4; y += 2) {
                sim.particles.push({
                  x: x * 65,
                  y: y * 65,
                  z: z * 65,
                  phase: Math.random() * Math.PI * 2,
                  hue: 190 + (x + z) * 12
                });
              }
            }
          }
          break;
        }
        case 'waterfall': {
          const count = Math.min(1500, Math.floor(450 * d));
          for (let i = 0; i < count; i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vy: 3 + Math.random() * 5,
              vx: 0,
              len: 12 + Math.random() * 22,
              hue: 185 + Math.random() * 35
            });
          }
          break;
        }
        case 'spheres': {
          const count = Math.min(60, Math.max(2, Math.floor(Math.min(18, Math.max(8, Math.floor(w / 85))) * d)));
          for (let i = 0; i < count; i++) {
            const r = (Math.min(w, h) * 0.055) + Math.random() * 25;
            sim.items.push({
              x: r + Math.random() * Math.max(10, w - r * 2),
              y: r + Math.random() * Math.max(10, h - r * 2),
              vx: (Math.random() - 0.5) * 1.2,
              vy: (Math.random() - 0.5) * 1.2,
              r,
              hue: (i * 42) % 360,
              pulse: 0
            });
          }
          break;
        }
        case 'butterflies': {
          const count = Math.min(240, Math.max(3, Math.floor(60 * d)));
          for (let i = 0; i < count; i++) {
            sim.items.push({
              x: Math.random() * w,
              y: Math.random() * h,
              angle: Math.random() * Math.PI * 2,
              speed: 1.5 + Math.random() * 1.5,
              wingPhase: Math.random() * Math.PI * 2,
              wingSpeed: 9 + Math.random() * 5,
              size: 8 + Math.random() * 7,
              hue: 275 + Math.random() * 85
            });
          }
          break;
        }
        case 'kaleidoscope': {
          const count = Math.min(140, Math.max(4, Math.floor(45 * d)));
          for (let i = 0; i < count; i++) {
            sim.items.push({
              dist: 20 + Math.random() * (Math.min(w, h) * 0.48),
              angle: Math.random() * Math.PI * 2,
              size: 12 + Math.random() * 34,
              rot: Math.random() * Math.PI,
              rotSpeed: (Math.random() - 0.5) * 0.03,
              sides: [3, 4, 6][Math.floor(Math.random() * 3)],
              hue: Math.random() * 360
            });
          }
          break;
        }
        case 'sakura_blizzard': {
          // 1. 作品7：実際のソメイヨシノの基本花びら形状に一本化（開閉アニメーションなし、自然な個体差と立体回転）
          const count = Math.min(900, Math.floor(220 * d));
          for (let i = 0; i < count; i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: -0.75 - Math.random() * 1.35,
              vy: 0.55 + Math.random() * 1.25,
              rot: Math.random() * Math.PI * 2,
              rotSpeed: (Math.random() - 0.5) * 0.045,
              // 空間での緩やかな傾き（完全には閉じず自然な立体傾斜を保つ）
              tiltAngle: Math.random() * Math.PI * 2,
              tiltSpeed: 0.02 + Math.random() * 0.03,
              swayPhase: Math.random() * Math.PI * 2,
              size: 6.5 + Math.random() * 8.5,
              // 同一の花びら形状内での自然な個体差（縦横比・切れ込み深さ・わずかな湾曲）
              aspect: 0.72 + Math.random() * 0.24,
              notchDepth: 0.20 + Math.random() * 0.08,
              curveSkew: (Math.random() - 0.5) * 0.14,
              hue: 338 + Math.random() * 14,
              lightness: 78 + Math.random() * 14
            });
          }
          break;
        }
        case 'bioluminescence': {
          const count = Math.min(900, Math.floor(220 * d));
          for (let i = 0; i < count; i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 0.8,
              vy: (Math.random() - 0.5) * 0.8,
              r: 1.2 + Math.random() * 3,
              phase: Math.random() * Math.PI * 2,
              hue: 175 + Math.random() * 35
            });
          }
          break;
        }
        case 'watercurtain': {
          // 2. 作品9：虹のカーテンを廃止し、繊細な雨の線と雨粒・水面しぶきに特化
          const count = Math.min(1100, Math.floor(280 * d));
          for (let i = 0; i < count; i++) {
            const isDroplet = i % 5 === 0;
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vy: isDroplet ? (4.2 + Math.random() * 4.2) : (6.5 + Math.random() * 6.5),
              len: 16 + Math.random() * 26,
              dropR: 1.5 + Math.random() * 2.5,
              isDroplet,
              phase: Math.random() * Math.PI * 2,
              hue: 196 + Math.random() * 24
            });
          }
          break;
        }
        case 'crystal_cavern': {
          // 作品10：鏡面空間に広がる多数の多面クリスタル結晶群（二重リング＋ランダム群で煌びやかに配置）
          const baseCount = Math.min(96, Math.max(18, Math.floor(46 * d)));
          for (let i = 0; i < baseCount; i++) {
            const layer = i % 3;
            const ringAngle = (i / baseCount) * Math.PI * 2 + layer * 0.4;
            const distRatio = layer === 0 ? 0.18 + (i % 5) * 0.04
                            : layer === 1 ? 0.34 + (i % 7) * 0.03
                            : 0.46 + (i % 9) * 0.025;
            const cx = w * 0.5 + Math.cos(ringAngle) * (w * distRatio * 0.92);
            const cy = h * 0.5 + Math.sin(ringAngle) * (h * distRatio * 0.88);
            const scaleFactor = layer === 0 ? 1.15 : (layer === 1 ? 0.9 : 0.7);
            sim.items.push({
              x: cx,
              y: cy,
              height: (54 + (i % 6) * 16) * scaleFactor,
              width: (13 + (i % 5) * 4) * scaleFactor,
              tilt: ringAngle + Math.PI * 0.5 + ((i % 3) - 1) * 0.18,
              hue: [190, 218, 275, 325, 45, 175][i % 6] + (i * 7) % 24,
              phase: i * 0.65,
              layer
            });
          }
          break;
        }
        case 'bluesky': {
          // 4. 作品11：フラクタルノイズ雲スプライトを用いたリアルな流れる積雲＆可動太陽光源
          sim.extra.sunX = w * 0.22;
          sim.extra.sunY = h * 0.20;
          const cloudCount = Math.min(36, Math.max(4, Math.floor(14 * d)));
          for (let i = 0; i < cloudCount; i++) {
            const depth = 0.35 + (i / cloudCount) * 0.65;
            sim.items.push({
              x: Math.random() * (w + 500) - 250,
              y: h * (0.14 + (1 - depth) * 0.54 + Math.random() * 0.12),
              vx: (0.26 + Math.random() * 0.42) * depth,
              scaleW: (220 + Math.random() * 210) * depth,
              scaleH: (110 + Math.random() * 105) * depth,
              depth,
              alpha: 0.58 + depth * 0.38,
              seed: (i % 8) + 1
            });
          }
          for (let i = 0; i < Math.min(250, Math.floor(65 * d)); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: 0.4 + Math.random() * 0.7,
              r: 1 + Math.random() * 2.2,
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
        case 'sunset': {
          // 5. 作品12：フラクタルノイズ雲スプライトを用いた煙のように繊細な夕焼け雲
          const cloudCount = Math.min(34, Math.max(3, Math.floor(13 * d)));
          for (let i = 0; i < cloudCount; i++) {
            const depth = 0.4 + (i / cloudCount) * 0.6;
            sim.items.push({
              x: Math.random() * (w + 500) - 250,
              y: h * (0.12 + Math.random() * 0.44),
              vx: (0.20 + Math.random() * 0.38) * depth,
              scaleW: (250 + Math.random() * 240) * depth,
              scaleH: (95 + Math.random() * 90) * depth,
              alpha: 0.48 + depth * 0.42,
              seed: (i % 8) + 11
            });
          }
          for (let i = 0; i < Math.min(300, Math.floor(85 * d)); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: h * (0.64 + Math.random() * 0.36),
              w: 16 + Math.random() * 46,
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
        case 'planetarium': {
          sim.extra.rot = 0;
          const count = Math.min(1400, Math.floor(360 * d));
          for (let i = 0; i < count; i++) {
            const isMilkyWay = i < count * 0.45;
            const angle = Math.random() * Math.PI * 2;
            const spread = isMilkyWay ? (Math.random() - 0.5) * 0.35 : (Math.random() - 0.5) * Math.PI;
            sim.particles.push({
              angle,
              spread,
              r: isMilkyWay ? (0.6 + Math.random() * 1.6) : (0.8 + Math.random() * 2.4),
              twinkle: Math.random() * Math.PI * 2,
              hue: isMilkyWay ? (210 + Math.random() * 60) : (40 + Math.random() * 180)
            });
          }
          sim.extra.meteors = [];
          break;
        }
        case 'fireworks': {
          sim.extra.rockets = [];
          sim.extra.sparks = [];
          break;
        }
        case 'momiji': {
          // 6. 作品15：スポットライトビームと空中浮遊葉を廃止し、画面上部・左右の枝垂れ樹冠と舞い散る落葉のみで構成
          const paletteHues = [354, 3, 12, 24, 36, 45]; // 深紅・真紅・朱・橙・山吹・黄金
          // 画面上部と左右端から枝垂れる木の枝スジを生成
          sim.extra.branches = [];
          const branchCount = 11;
          for (let b = 0; b < branchCount; b++) {
            const isLeft = b < 4;
            const isRight = b >= 7;
            const startX = isLeft ? -20 : (isRight ? w + 20 : w * (0.15 + (b - 4) * 0.24));
            const startY = (isLeft || isRight) ? h * (0.06 + (b % 4) * 0.13) : -15;
            const endX = isLeft ? w * (0.24 + Math.random() * 0.2) : (isRight ? w * (0.56 + Math.random() * 0.2) : startX + (Math.random() - 0.5) * 160);
            const endY = (isLeft || isRight) ? startY + 70 + Math.random() * 90 : h * (0.22 + Math.random() * 0.16);
            sim.extra.branches.push({
              startX, startY, endX, endY,
              cpX: (startX + endX) * 0.5 + (Math.random() - 0.5) * 60,
              cpY: Math.min(startY, endY) - 20,
              swayPhase: Math.random() * Math.PI * 2
            });
          }

          // 枝に沿って密に茂る紅葉の葉群（空中に孤立して浮かない配置）
          const canopyCount = Math.min(420, Math.max(30, Math.floor(180 * d)));
          for (let i = 0; i < canopyCount; i++) {
            const br = sim.extra.branches[i % sim.extra.branches.length];
            const t = 0.15 + Math.random() * 0.85;
            const invT = 1 - t;
            const bx = invT * invT * br.startX + 2 * invT * t * br.cpX + t * t * br.endX;
            const by = invT * invT * br.startY + 2 * invT * t * br.cpY + t * t * br.endY;
            const spread = 24 + t * 44;
            const depth = 0.45 + Math.random() * 0.65;
            sim.items.push({
              baseX: bx + (Math.random() - 0.5) * spread * 2.1,
              baseY: by + (Math.random() - 0.45) * spread * 1.4,
              swayPhase: br.swayPhase + t * 2.0 + Math.random() * 0.6,
              rot: (Math.random() - 0.5) * 1.6,
              size: (11 + Math.random() * 13) * depth,
              lobes: Math.random() > 0.25 ? 7 : 5,
              hue: paletteHues[i % paletteHues.length] + (Math.random() - 0.5) * 7,
              lightness: 30 + depth * 34
            });
          }

          // 樹冠から静かに舞い散る紅葉の落葉
          const fallingCount = Math.min(260, Math.floor(65 * d));
          for (let i = 0; i < fallingCount; i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: -0.35 - Math.random() * 0.75,
              vy: 0.55 + Math.random() * 1.05,
              rot: Math.random() * Math.PI * 2,
              rotSpeed: (Math.random() - 0.5) * 0.045,
              swayPhase: Math.random() * Math.PI * 2,
              size: 8 + Math.random() * 8,
              lobes: Math.random() > 0.3 ? 7 : 5,
              hue: paletteHues[i % paletteHues.length]
            });
          }
          break;
        }
        case 'galaxy_canal': {
          // 7. 作品16：黒い塊（暗黒星雲の黒いブロブ）を削除し、恒星群と淡く輝く星間ガス雲の運河に純化
          const starCount = Math.min(1600, Math.floor(520 * d));
          for (let i = 0; i < starCount; i++) {
            const arm = i % 4;
            const z = Math.random();
            const baseR = 25 + Math.pow(Math.random(), 0.75) * (Math.max(w, h) * 0.58);
            const spiralAngle = (arm * (Math.PI * 0.5)) + baseR * 0.0085 + (Math.random() - 0.5) * 0.85;
            const isNebulaGlow = i % 9 === 0;
            const isPinkHII = i % 11 === 0;
            sim.particles.push({
              baseR,
              angle: spiralAngle,
              z,
              vz: 0.0025 + Math.random() * 0.0045,
              size: isNebulaGlow ? (16 + Math.random() * 22) : (1.0 + Math.random() * 2.6),
              isNebulaGlow,
              hue: isPinkHII ? 328 : (baseR < 150 ? (38 + Math.random() * 22) : (205 + Math.random() * 45)),
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
        case 'eclipse': {
          for (let i = 0; i < Math.min(500, Math.floor(140 * d)); i++) {
            sim.particles.push({
              angle: Math.random() * Math.PI * 2,
              dist: 1 + Math.random() * 0.8,
              speed: 0.005 + Math.random() * 0.015,
              size: 1 + Math.random() * 2.5
            });
          }
          break;
        }
        case 'nebula': {
          for (let i = 0; i < Math.min(900, Math.floor(240 * d)); i++) {
            const arm = i % 3;
            const radius = 15 + Math.random() * (Math.min(w, h) * 0.45);
            const angle = (arm * (Math.PI * 2 / 3)) + radius * 0.012 + (Math.random() - 0.5) * 0.7;
            sim.particles.push({
              radius,
              angle,
              speed: (0.002 + (1 / (radius + 30)) * 0.25),
              size: 1.5 + Math.random() * 4,
              cloud: i % 4 === 0,
              hue: [280, 210, 330, 45][arm % 4] + Math.random() * 35
            });
          }
          break;
        }
        case 'glitter': {
          // 5. 作品19：黄金のグリッター・ウェーブ（波と波頭の金粉に一本化）
          for (let i = 0; i < Math.min(900, Math.floor(280 * d)); i++) {
            sim.particles.push({
              x: Math.random() * w,
              waveIdx: i % 5,
              offsetY: (Math.random() - 0.5) * 32,
              phase: Math.random() * Math.PI * 2,
              speed: 0.6 + Math.random() * 1.4,
              size: 0.8 + Math.random() * 2.6,
              hue: 40 + Math.random() * 16
            });
          }
          break;
        }
        case 'diamond': {
          const facetCount = Math.min(110, Math.max(6, Math.floor(32 * d)));
          for (let i = 0; i < facetCount; i++) {
            const ring = (i % 4) + 1;
            sim.items.push({
              x: w * (0.12 + Math.random() * 0.76),
              y: h * (0.12 + Math.random() * 0.76),
              r: (14 + Math.random() * 24) * (1 - ring * 0.1),
              rot: Math.random() * Math.PI * 2,
              rotSpeed: (Math.random() - 0.5) * 0.025,
              phase: Math.random() * Math.PI * 2,
              hue: (i * 53) % 360
            });
          }
          for (let i = 0; i < Math.min(350, Math.floor(90 * d)); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              phase: Math.random() * Math.PI * 2,
              size: 2 + Math.random() * 4,
              hue: (i * 37) % 360
            });
          }
          break;
        }
        case 'fairydust': {
          sim.extra.trail = [];
          for (let i = 0; i < Math.min(500, Math.floor(150 * d)); i++) {
            sim.particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 1.2,
              vy: (Math.random() - 0.5) * 1.2,
              size: 1.5 + Math.random() * 3,
              hue: Math.random() * 360,
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
        case 'radial_rays': {
          const rayCount = Math.min(120, Math.max(8, Math.floor(38 * d)));
          for (let i = 0; i < rayCount; i++) {
            sim.items.push({
              angle: (i / rayCount) * Math.PI * 2,
              width: 0.015 + Math.random() * 0.045,
              speed: (i % 2 === 0 ? 1 : -1) * (0.08 + Math.random() * 0.14),
              phase: Math.random() * Math.PI * 2,
              hue: 36 + (i * 19) % 180
            });
          }
          for (let i = 0; i < Math.min(400, Math.floor(110 * d)); i++) {
            sim.particles.push({
              dist: 20 + Math.random() * (Math.hypot(w, h) * 0.6),
              angle: Math.random() * Math.PI * 2,
              speed: 35 + Math.random() * 75,
              size: 1.5 + Math.random() * 2.5,
              hue: 42 + Math.random() * 45
            });
          }
          break;
        }
        case 'blackhole': {
          const count = Math.min(1100, Math.floor(320 * d));
          for (let i = 0; i < count; i++) {
            const orbitR = 1.18 + Math.pow(Math.random(), 1.4) * 2.4;
            sim.particles.push({
              orbitR,
              angle: Math.random() * Math.PI * 2,
              speed: (1.6 / Math.pow(orbitR, 1.2)) * (0.85 + Math.random() * 0.3),
              size: 1.4 + Math.random() * 2.6,
              hue: 16 + (3.6 - orbitR) * 14 + Math.random() * 12
            });
          }
          break;
        }
        case 'chandelier': {
          for (let ring = 1; ring <= 4; ring++) {
            const count = Math.min(90, Math.max(4, Math.floor(ring * 10 * d)));
            for (let i = 0; i < count; i++) {
              sim.items.push({
                ring,
                angle: (i / count) * Math.PI * 2,
                size: 6 + ring * 2.5,
                sparkle: Math.random() * Math.PI * 2,
                hue: (i * 36) % 360
              });
            }
          }
          break;
        }
      }
    }

    // 十字スターバースト描画ヘルパー
    function drawStarburst(x, y, radius, color, alpha = 0.8) {
      if (radius <= 0.4 || alpha <= 0.01) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.25, color);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, radius * 0.06);
      ctx.beginPath();
      ctx.moveTo(-radius * 1.6, 0);
      ctx.lineTo(radius * 1.6, 0);
      ctx.moveTo(0, -radius * 1.6);
      ctx.lineTo(0, radius * 1.6);
      ctx.stroke();
      ctx.restore();
    }

    // リアルなモミジ（カエデ）の葉を描画するヘルパー
    function drawMapleLeaf(x, y, sz, rot, lobes, fillStyle, strokeStyle = null) {
      if (sz <= 0.5) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      // 葉柄（茎）
      ctx.moveTo(0, sz * 1.25);
      ctx.lineTo(0, sz * 0.55);

      const totalTips = lobes * 2 - 1;
      for (let k = 0; k < totalTips; k++) {
        const t = k / (totalTips - 1);
        const ang = -Math.PI * 0.85 + t * Math.PI * 1.7 - Math.PI * 0.5;
        const isTip = k % 2 === 0;
        const centerFactor = 1 - Math.abs(t - 0.5) * 0.65;
        const r = isTip ? sz * (0.72 + centerFactor * 0.45) : sz * 0.28;
        const px = Math.cos(ang) * r;
        const py = Math.sin(ang) * r;
        ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
      ctx.restore();
    }

    // ============================================================================
    // メイン描画ループ（全24作品のレンダリングスイッチ）
    // ============================================================================
    function renderFrame(dt) {
      const art = ARTWORKS[state.currentArtIndex];
      const w = state.width;
      const h = state.height;
      const { density, glow, speed, size, scale, reactivity, parts } = state.params;
      const { p1, p2, p3 } = parts;
      const ptr = state.pointer;

      // 背景クリア
      ctx.globalCompositeOperation = 'source-over';
      if (art.id === 'fireworks' || art.id === 'fairydust' || art.id === 'butterflies') {
        ctx.fillStyle = 'rgba(3, 5, 12, 0.22)';
      } else if (art.id === 'bioluminescence' || art.id === 'nebula') {
        ctx.fillStyle = 'rgba(2, 6, 16, 0.26)';
      } else {
        ctx.fillStyle = '#03050c';
      }
      ctx.fillRect(0, 0, w, h);

      // 空間スケール（Scene Scale）の適用（中央基準ズーム）
      ctx.save();
      const safeScale = Math.max(0.01, scale);
      ctx.translate(w * 0.5, h * 0.5);
      ctx.scale(safeScale, safeScale);
      ctx.translate(-w * 0.5, -h * 0.5);

      ctx.globalCompositeOperation = 'lighter';

      switch (art.id) {
        // ------------------------------------------------------------------------
        // #1: 呼応するランプの森
        // ------------------------------------------------------------------------
        case 'lamps': {
          const items = sim.items;
          for (let i = 0; i < items.length; i++) {
            const lamp = items[i];
            lamp.y = lamp.baseY + Math.sin(state.time * 1.2 + lamp.phase) * 14;
            if (lamp.cooldown > 0) lamp.cooldown -= dt;

            const dx = ptr.x - lamp.x;
            const dy = ptr.y - lamp.y;
            const dist = Math.hypot(dx, dy);
            if (ptr.active && dist < 110 * reactivity && lamp.cooldown <= 0) {
              lamp.energy = 1.0;
              lamp.hue = (lamp.hue + 55) % 360;
              lamp.cooldown = 0.8;
              sim.ripples.push({ x: lamp.x, y: lamp.y, r: lamp.radius * p1, maxR: 260, hue: lamp.hue, alpha: 0.9 });
            }
            lamp.energy = Math.max(0.22, lamp.energy - dt * 0.45);

            const r = Math.max(0.5, lamp.radius * size * p1 * (0.9 + lamp.energy * 0.45));
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(lamp.x, 0);
            ctx.lineTo(lamp.x, lamp.y - r);
            ctx.stroke();

            const haloR = Math.max(1, r * (3.2 * glow * p2));
            const grad = ctx.createRadialGradient(lamp.x, lamp.y, r * 0.1, lamp.x, lamp.y, haloR);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.25, getArtColor(lamp.hue, 90, 62, 0.85 * lamp.energy, i));
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(lamp.x, lamp.y, haloR, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = getArtColor(lamp.hue, 85, 75, 0.95, i);
            ctx.beginPath();
            ctx.ellipse(lamp.x, lamp.y, r * 0.78, r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const rp = sim.ripples[i];
            rp.r += 240 * dt * speed;
            rp.alpha -= dt * 0.7;
            for (const lamp of items) {
              const d = Math.hypot(lamp.x - rp.x, lamp.y - rp.y);
              if (Math.abs(d - rp.r * p3) < 18 && lamp.cooldown <= 0) {
                lamp.energy = 1.0;
                lamp.hue = (rp.hue + 25) % 360;
                lamp.cooldown = 1.1;
              }
            }
            if (rp.alpha <= 0) {
              sim.ripples.splice(i, 1);
            } else {
              ctx.strokeStyle = getArtColor(rp.hue, 90, 65, rp.alpha * 0.45 * glow, i);
              ctx.lineWidth = 2.5 * p3;
              ctx.beginPath();
              ctx.arc(rp.x, rp.y, rp.r * p3, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #2: 境界のない結晶世界
        // ------------------------------------------------------------------------
        case 'crystal': {
          sim.extra.rotY += 0.35 * dt * speed + (ptr.isDown ? ptr.vx * 0.005 : 0);
          sim.extra.rotX = 0.25 + Math.sin(state.time * 0.4) * 0.15 + (ptr.active ? ((ptr.y / h) - 0.5) * 0.5 * reactivity : 0);
          const cosY = Math.cos(sim.extra.rotY);
          const sinY = Math.sin(sim.extra.rotY);
          const cosX = Math.cos(sim.extra.rotX);
          const sinX = Math.sin(sim.extra.rotX);
          const fov = 480;

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const px3 = p.x * p3;
            const py3 = p.y * p3;
            const pz3 = p.z * p3;

            const x1 = px3 * cosY - pz3 * sinY;
            const z1 = pz3 * cosY + px3 * sinY;
            const y1 = py3 * cosX - z1 * sinX;
            const z2 = z1 * cosX + py3 * sinX + 550;

            if (z2 < 40) continue;
            const persp = fov / z2;
            const sx = w * 0.5 + x1 * persp;
            const sy = h * 0.5 + y1 * persp;

            const pulse = 0.5 + 0.5 * Math.sin(state.time * 3 + p.phase);
            const r = (2.5 + pulse * 4) * persp * size * p1;
            const lineH = 55 * persp * glow * p2;

            if (lineH > 0.5) {
              const grad = ctx.createLinearGradient(sx, sy - lineH, sx, sy + lineH);
              grad.addColorStop(0, 'transparent');
              grad.addColorStop(0.5, getArtColor(p.hue + state.time * 25, 90, 68, 0.55 * pulse, i));
              grad.addColorStop(1, 'transparent');
              ctx.strokeStyle = grad;
              ctx.lineWidth = Math.max(1, r * 0.7);
              ctx.beginPath();
              ctx.moveTo(sx, sy - lineH);
              ctx.lineTo(sx, sy + lineH);
              ctx.stroke();
            }

            if (r > 0.2) {
              ctx.fillStyle = getArtColor(p.hue + state.time * 25, 80, 82, 0.9, i);
              ctx.beginPath();
              ctx.arc(sx, sy, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #3: 花と人のデジタル滝
        // ------------------------------------------------------------------------
        case 'waterfall': {
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.y += p.vy * speed * 1.4;
            p.x += p.vx;
            p.vx *= 0.92;

            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = p.y - ptr.y;
              const dist = Math.hypot(dx, dy);
              const blockR = 65 * reactivity * p3;
              if (dist < blockR && dist > 0.1) {
                p.vx += (dx / dist) * 2.2;
                if (Math.random() < 0.045) {
                  sim.items.push({
                    x: p.x,
                    y: p.y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -1 - Math.random() * 2,
                    r: 4 + Math.random() * 6,
                    life: 1.0,
                    hue: 320 + Math.random() * 60
                  });
                }
              }
            }

            if (p.y > h + 20) {
              p.y = -20;
              p.x = Math.random() * w;
              p.vx = 0;
            }

            ctx.strokeStyle = getArtColor(p.hue, 85, 65, 0.45 * glow, i);
            ctx.lineWidth = 2 * size * p1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 1.5, p.y - p.len * size * p1);
            ctx.stroke();
          }

          for (let i = sim.items.length - 1; i >= 0; i--) {
            const fl = sim.items[i];
            fl.x += fl.vx * speed;
            fl.y += fl.vy * speed;
            fl.vy += 0.04;
            fl.life -= dt * 0.55;
            if (fl.life <= 0) {
              sim.items.splice(i, 1);
            } else {
              drawStarburst(fl.x, fl.y, fl.r * size * p2 * 1.6, getArtColor(fl.hue, 90, 70, fl.life, i), fl.life);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #4: 浮遊する光の球体群
        // ------------------------------------------------------------------------
        case 'spheres': {
          const items = sim.items;
          for (let i = 0; i < items.length; i++) {
            const s = items[i];
            const rad = Math.max(2, s.r * size * p1);
            s.x += s.vx * speed;
            s.y += s.vy * speed;

            if (s.x < rad) { s.x = rad; s.vx *= -1; }
            if (s.x > w - rad) { s.x = w - rad; s.vx *= -1; }
            if (s.y < rad) { s.y = rad; s.vy *= -1; }
            if (s.y > h - rad) { s.y = h - rad; s.vy *= -1; }

            if (ptr.active) {
              const dx = s.x - ptr.x;
              const dy = s.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < rad + 45 * reactivity && d > 0.1) {
                s.vx += (dx / d) * 0.45 * reactivity * p3;
                s.vy += (dy / d) * 0.45 * reactivity * p3;
                s.hue = (s.hue + 3) % 360;
                s.pulse = 1.0;
              }
            }
            s.vx *= 0.992;
            s.vy *= 0.992;
            s.pulse = Math.max(0, s.pulse - dt * 1.5);

            const drawR = rad * (1 + s.pulse * 0.25 * p3);
            const outerR = Math.max(2, drawR * (1.3 * glow * p2));
            const grad = ctx.createRadialGradient(s.x - drawR * 0.3, s.y - drawR * 0.3, drawR * 0.05, s.x, s.y, outerR);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.35, getArtColor(s.hue, 90, 65, 0.85, i));
            grad.addColorStop(0.75, getArtColor(s.hue + 30, 85, 45, 0.4, i));
            grad.addColorStop(1, 'transparent');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(s.x, s.y, outerR, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #5: 群蝶のデジタル空間
        // ------------------------------------------------------------------------
        case 'butterflies': {
          for (let i = 0; i < sim.items.length; i++) {
            const bf = sim.items[i];
            bf.wingPhase += bf.wingSpeed * dt * speed * p3;
            const flap = Math.cos(bf.wingPhase);

            if (ptr.active) {
              const dx = ptr.x - bf.x;
              const dy = ptr.y - bf.y;
              const dist = Math.hypot(dx, dy);
              if (dist > 30) {
                const targetAngle = Math.atan2(dy, dx) + Math.sin(state.time * 2 + i) * 0.5;
                bf.angle += Math.sin(targetAngle - bf.angle) * 0.04 * reactivity;
              }
            } else {
              bf.angle += Math.sin(state.time * 1.2 + i * 0.7) * 0.03 * speed;
            }

            bf.x += Math.cos(bf.angle) * bf.speed * speed;
            bf.y += Math.sin(bf.angle) * bf.speed * speed;
            if (bf.x < -40) bf.x = w + 40;
            if (bf.x > w + 40) bf.x = -40;
            if (bf.y < -40) bf.y = h + 40;
            if (bf.y > h + 40) bf.y = -40;

            const sz = bf.size * size * p1;
            const wingW = Math.max(0.2, Math.abs(flap) * sz);
            ctx.save();
            ctx.translate(bf.x, bf.y);
            ctx.rotate(bf.angle + Math.PI * 0.5);

            ctx.fillStyle = getArtColor(bf.hue, 92, 68, 0.72 * glow, i);
            ctx.strokeStyle = getArtColor(bf.hue + 30, 95, 82, 0.9, i);
            ctx.lineWidth = 1;

            [-1, 1].forEach((side) => {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.bezierCurveTo(side * wingW * 1.4, -sz * 1.1, side * wingW * 1.6, sz * 0.2, 0, sz * 0.3);
              ctx.bezierCurveTo(side * wingW * 1.1, sz * 0.5, side * wingW * 0.9, sz * 1.2, 0, sz * 0.8);
              ctx.fill();
              ctx.stroke();
            });
            ctx.restore();

            if (p2 > 0.05 && Math.random() < 0.25) {
              drawStarburst(bf.x, bf.y, 4 * size * p2 * glow, getArtColor(bf.hue + 20, 95, 80, 0.75, i), 0.75);
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #6: 万華鏡の幾何学プリズム
        // ------------------------------------------------------------------------
        case 'kaleidoscope': {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const slices = 12;
          const stepAngle = (Math.PI * 2) / slices;

          for (let s = 0; s < slices; s++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(s * stepAngle + state.time * 0.15 * speed);
            if (s % 2 === 1) ctx.scale(1, -1);

            for (let i = 0; i < sim.items.length; i++) {
              const it = sim.items[i];
              const rot = it.rot + state.time * it.rotSpeed * 35 * speed;
              const dist = it.dist * p2 * (0.85 + 0.15 * Math.sin(state.time + i));
              const px = Math.cos(it.angle + state.time * 0.2 * speed) * dist;
              const py = Math.sin(it.angle + state.time * 0.2 * speed) * dist;
              const sz = it.size * size * p1;

              ctx.save();
              ctx.translate(px, py);
              ctx.rotate(rot);
              ctx.fillStyle = getArtColor(it.hue + state.time * 20, 90, 62, 0.28 * glow, i);
              ctx.strokeStyle = getArtColor(it.hue + state.time * 20, 95, 78, 0.65 * p3, i);
              ctx.lineWidth = 1.2 * p3;
              ctx.beginPath();
              for (let k = 0; k < it.sides; k++) {
                const a = (k / it.sides) * Math.PI * 2;
                const vx = Math.cos(a) * sz;
                const vy = Math.sin(a) * sz;
                if (k === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
              }
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #7: 幻想夜桜と光の桜吹雪
        // ------------------------------------------------------------------------
        case 'sakura_blizzard': {
          const haloR = Math.max(10, Math.max(w, h) * 0.6 * p2);
          const bgHalo = ctx.createRadialGradient(w * 0.5, h * 0.35, 10, w * 0.5, h * 0.35, haloR);
          bgHalo.addColorStop(0, getArtColor(340, 75, 48, 0.24 * glow, 0));
          bgHalo.addColorStop(1, 'transparent');
          ctx.fillStyle = bgHalo;
          ctx.fillRect(-w, -h, w * 3, h * 3);

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            const windX = Math.sin(state.time * 0.9 + p.swayPhase) * 0.65 * p3;
            p.x += (p.vx + windX + (ptr.isDown ? ptr.vx * 0.06 * reactivity : 0)) * speed;
            p.y += (p.vy + Math.cos(state.time * 1.1 + p.swayPhase) * 0.28 * p3 + (ptr.isDown ? ptr.vy * 0.05 * reactivity : 0)) * speed;
            p.rot += p.rotSpeed * speed;
            p.tiltAngle += p.tiltSpeed * speed;

            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = p.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 130 * reactivity && d > 1) {
                p.x += (dx / d) * 2.2;
                p.y -= 1.4;
              }
            }

            if (p.x < -30) p.x = w + 30;
            if (p.x > w + 30) p.x = -30;
            if (p.y > h + 30) { p.y = -30; p.x = Math.random() * w; }
            if (p.y < -30) p.y = h + 30;

            const tiltScaleX = 0.62 + 0.38 * Math.abs(Math.cos(p.tiltAngle));
            const tiltScaleY = 0.68 + 0.32 * Math.abs(Math.sin(p.tiltAngle * 0.8 + p.swayPhase));
            const sz = p.size * size * p1;
            const pw = sz * p.aspect * tiltScaleX;
            const ph = sz * tiltScaleY;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);

            const pGrad = ctx.createLinearGradient(0, ph, 0, -ph);
            pGrad.addColorStop(0, getArtColor(p.hue - 4, 60, 95, 0.92 * glow, i));
            pGrad.addColorStop(0.55, getArtColor(p.hue, 86, p.lightness, 0.9 * glow, i));
            pGrad.addColorStop(1, getArtColor(p.hue + 4, 92, p.lightness - 7, 0.95 * glow, i));
            ctx.fillStyle = pGrad;

            const notch = ph * p.notchDepth;
            const skew = pw * p.curveSkew;
            ctx.beginPath();
            ctx.moveTo(0, ph);
            ctx.bezierCurveTo(pw * 0.78 + skew, ph * 0.48, pw * 0.94 + skew, -ph * 0.42, pw * 0.24, -ph);
            ctx.lineTo(0, -ph + notch);
            ctx.lineTo(-pw * 0.24, -ph);
            ctx.bezierCurveTo(-pw * 0.94 + skew, -ph * 0.42, -pw * 0.78 + skew, ph * 0.48, 0, ph);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #8: 深海のバイオルミネッセンス
        // ------------------------------------------------------------------------
        case 'bioluminescence': {
          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.x += p.vx * speed + Math.sin(state.time + p.phase) * 0.3;
            p.y += p.vy * speed + Math.cos(state.time * 0.8 + p.phase) * 0.3;

            if (ptr.active) {
              const dx = p.x - ptr.x;
              const dy = p.y - ptr.y;
              const d = Math.hypot(dx, dy);
              if (d < 150 * reactivity && d > 1) {
                p.vx += (-dy / d) * 0.18 * reactivity * p3;
                p.vy += (dx / d) * 0.18 * reactivity * p3;
              }
            }
            p.vx *= 0.97;
            p.vy *= 0.97;

            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            const alpha = 0.4 + 0.6 * Math.sin(state.time * 3 + p.phase);
            drawStarburst(p.x, p.y, p.r * 3.5 * size * p1 * p2 * glow, getArtColor(p.hue, 95, 65, alpha, i), alpha);
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #9: 静寂の夜雨と煌めく雨粒
        // ------------------------------------------------------------------------
        case 'watercurtain': {
          const floorY = h * 0.84;
          ctx.globalCompositeOperation = 'source-over';
          const waterGrad = ctx.createLinearGradient(0, floorY, 0, h);
          waterGrad.addColorStop(0, getArtColor(210, 65, 10, 1, 0));
          waterGrad.addColorStop(1, '#02040a');
          ctx.fillStyle = waterGrad;
          ctx.fillRect(-w, floorY, w * 3, h * 2);

          ctx.globalCompositeOperation = 'lighter';

          for (let i = 0; i < sim.particles.length; i++) {
            const p = sim.particles[i];
            p.y += p.vy * speed * 1.35;
            p.x -= 0.45 * speed;

            if (ptr.active && Math.hypot(p.x - ptr.x, p.y - ptr.y) < 85 * reactivity) {
              p.x += Math.sign(p.x - ptr.x) * 2.8;
            }

            if (p.y >= floorY) {
              if (p3 > 0.05 && Math.random() < 0.24) {
                sim.ripples.push({
                  x: p.x,
                  y: floorY + Math.random() * (h - floorY) * 0.85,
                  rx: 3,
                  ry: 1.1,
                  splashH: (6 + Math.random() * 10) * p3,
                  alpha: 0.85,
                  hue: p.hue
                });
              }
              p.y = -20;
              p.x = Math.random() * (w + 40);
            }
            if (p.x < -20) p.x = w + 20;

            if (p.isDroplet && p2 > 0.02) {
              const tw = 0.55 + 0.45 * Math.sin(state.time * 4 + p.phase);
              const dr = p.dropR * size * p2;
              drawStarburst(p.x, p.y, dr * 2.6 * glow, getArtColor(p.hue, 90, 82, tw, i), tw);
            } else if (p1 > 0.02) {
              const rLen = p.len * size * p1;
              const rGrad = ctx.createLinearGradient(p.x, p.y, p.x + 2, p.y - rLen);
              rGrad.addColorStop(0, getArtColor(p.hue, 85, 78, 0.62 * glow, i));
              rGrad.addColorStop(1, 'transparent');
              ctx.strokeStyle = rGrad;
              ctx.lineWidth = Math.max(0.8, 1.35 * size * p1);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p.x + 2, p.y - rLen);
              ctx.stroke();
            }
          }

          if (ptr.justClicked && p3 > 0.05) {
            sim.ripples.push({
              x: ptr.x,
              y: Math.max(floorY, ptr.y),
              rx: 10,
              ry: 2.8,
              splashH: 18 * p3,
              alpha: 1.0,
              hue: 198
            });
          }

          for (let i = sim.ripples.length - 1; i >= 0; i--) {
            const rp = sim.ripples[i];
            rp.rx += 75 * dt * speed;
            rp.ry += 20 * dt * speed;
            rp.alpha -= dt * 0.85;
            if (rp.alpha <= 0) {
              sim.ripples.splice(i, 1);
            } else {
              ctx.strokeStyle = getArtColor(rp.hue, 88, 76, rp.alpha * glow * p3, i);
              ctx.lineWidth = 1.3;
              ctx.beginPath();
              ctx.ellipse(rp.x, rp.y, rp.rx * size * p3, rp.ry * size * p3, 0, 0, Math.PI * 2);
              ctx.stroke();

              if (rp.alpha > 0.45) {
                const lift = (1 - rp.alpha) * rp.splashH * size;
                ctx.fillStyle = getArtColor(rp.hue, 92, 86, rp.alpha * glow, i);
                ctx.beginPath();
                ctx.arc(rp.x - rp.rx * 0.35, rp.y - lift, 1.4 * size * p3, 0, Math.PI * 2);
                ctx.arc(rp.x + rp.rx * 0.35, rp.y - lift, 1.4 * size * p3, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
          break;
        }

        // ------------------------------------------------------------------------
        // #10: 万華鏡の鏡面クリスタル宮殿（ばつ印なし・鏡面多重反射＋多数の煌びやかなクリスタル）
        // ------------------------------------------------------------------------
        case 'crystal_cavern': {
          const lightX = ptr.active ? ptr.x : w * 0.5 + Math.cos(state.time * 0.55 * speed) * (w * 0.34);
          const lightY = ptr.active ? ptr.y : h * 0.45 + Math.sin(state.time * 0.72 * speed) * (h * 0.26);

          // 鏡面宮殿の華やかな環境光ハロー
          const envGrad = ctx.createRadialGradient(lightX, lightY, 6, lightX, lightY, Math.max(w, h) * 0.65);
          envGrad.addColorStop(0, getArtColor(200, 92, 74, 0.24 * glow, 0));
          envGrad.addColorStop(0.45, getArtColor(280, 82, 52, 0.12 * glow, 1));
          envGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = envGrad;
          ctx.fillRect(-w, -h, w * 3, h * 3);

          // 鏡面反射の放射状ライトカーテン（奥行きのある鏡の回廊）
          if (p2 > 0.05) {
            const mirrorSlices = 8;
            for (let m = 0; m < mirrorSlices; m++) {
              const mAng = (m / mirrorSlices) * Math.PI * 2 + state.time * 0.08 * speed;
              const beamLen = Math.max(w, h) * 0.75;
              const bGrad = ctx.createLinearGradient(w * 0.5, h * 0.5, w * 0.5 + Math.cos(mAng) * beamLen, h * 0.5 + Math.sin(mAng) * beamLen);
              bGrad.addColorStop(0, getArtColor(210 + m * 25, 88, 70, 0.12 * glow * p2, m));
              bGrad.addColorStop(1, 'transparent');
              ctx.strokeStyle = bGrad;
              ctx.lineWidth = 22 * p2;
              ctx.beginPath();
              ctx.moveTo(w * 0.5, h * 0.5);
              ctx.lineTo(w * 0.5 + Math.cos(mAng) * beamLen, h * 0.5 + Math.sin(mAng) * beamLen);
              ctx.stroke();
            }
          }

          // 多面カットクリスタル結晶の描画（メイン結晶＋鏡面ゴースト反射）
          for (let i = 0; i < sim.items.length; i++) {
            const cr = sim.items[i];
            const cw = cr.width * size * p1;
            const ch = cr.height * size * p1;
            const dist = Math.hypot(lightX - cr.x, lightY - cr.y);
            const incidentAngle = Math.atan2(lightY - cr.y, lightX - cr.x);
            const angleDiff = Math.cos(incidentAngle - cr.tilt + cr.phase + state.time * 0.4);
            const proximity = Math.max(0, 1 - dist / (Math.max(w, h) * 0.72));
            const reflPower = (0.42 + 0.58 * Math.max(0, angleDiff)) * (0.45 + proximity * 0.95 * reactivity);

            const drawCrystalUnit = (ux, uy, uTilt, uScale, alphaMult, hueShiftExtra) => {
              const wUnit = cw * uScale;
              const hUnit = ch * uScale;
              const halfH = hUnit * 0.5;
              const tipOffset = wUnit * 0.95;

              ctx.save();
              ctx.translate(ux, uy);
              ctx.rotate(uTilt);

              const faces = [
                { x1: -wUnit, x2: -wUnit * 0.35, light: 48 + reflPower * 30, hueOff: -14 + hueShiftExtra },
                { x1: -wUnit * 0.35, x2: wUnit * 0.35, light: 68 + reflPower * 28, hueOff: 0 + hueShiftExtra },
                { x1: wUnit * 0.35, x2: wUnit, light: 52 + reflPower * 28, hueOff: 18 + hueShiftExtra }
              ];

              faces.forEach((fc, fIdx) => {
                const fAlpha = Math.min(0.95, (0.34 + reflPower * 0.52 * p2) * glow * alphaMult);
                const fGrad = ctx.createLinearGradient(fc.x1, -halfH - tipOffset, fc.x2, halfH + tipOffset);
                fGrad.addColorStop(0, getArtColor(cr.hue + fc.hueOff, 94, Math.min(92, fc.light + 14), fAlpha, i + fIdx));
                fGrad.addColorStop(0.5, getArtColor(cr.hue + fc.hueOff + 12, 90, fc.light, fAlpha * 0.9, i + fIdx));
                fGrad.addColorStop(1, getArtColor(cr.hue + fc.hueOff - 10, 94, Math.min(92, fc.light + 12), fAlpha, i + fIdx));
                ctx.fillStyle = fGrad;

                ctx.beginPath();
                ctx.moveTo(0, -halfH - tipOffset);
                ctx.lineTo(fc.x2, -halfH);
                ctx.lineTo(fc.x2, halfH);
                ctx.lineTo(0, halfH + tipOffset);
                ctx.lineTo(fc.x1, halfH);
                ctx.lineTo(fc.x1, -halfH);
                ctx.closePath();
                ctx.fill();
              });

              // ファセット稜線（縦のカット面境界と上下ピラミッド稜線のみ・ばつ印の斜め交差線は一切描画しない）
              ctx.strokeStyle = getArtColor(cr.hue + hueShiftExtra + 15, 98, 90, Math.min(0.95, (0.45 + reflPower * 0.45) * glow * alphaMult), i);
              ctx.lineWidth = Math.max(0.9, 1.2 * uScale);
              ctx.beginPath();
              // 外周輪郭
              ctx.moveTo(0, -halfH - tipOffset);
              ctx.lineTo(wUnit, -halfH);
              ctx.lineTo(wUnit, halfH);
              ctx.lineTo(0, halfH + tipOffset);
              ctx.lineTo(-wUnit, halfH);
              ctx.lineTo(-wUnit, -halfH);
              ctx.closePath();
              // 縦ファセット稜線
              ctx.moveTo(0, -halfH - tipOffset);
              ctx.lineTo(-wUnit * 0.35, -halfH);
              ctx.lineTo(-wUnit * 0.35, halfH);
              ctx.lineTo(0, halfH + tipOffset);
              ctx.moveTo(0, -halfH - tipOffset);
              ctx.lineTo(wUnit * 0.35, -halfH);
              ctx.lineTo(wUnit * 0.35, halfH);
              ctx.lineTo(0, halfH + tipOffset);
              ctx.stroke();

              // 内部のスペキュラハイライト帯（滑らかな光沢グラデーション）
              if (p2 > 0.05) {
                const sheenGrad = ctx.createLinearGradient(-wUnit * 0.5, -halfH * 0.5, wUnit * 0.5, halfH * 0.5);
                sheenGrad.addColorStop(0, 'transparent');
                sheenGrad.addColorStop(0.5, `rgba(255, 255, 255, ${Math.min(0.55, 0.32 * reflPower * glow * p2 * alphaMult)})`);
                sheenGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = sheenGrad;
                ctx.beginPath();
                ctx.moveTo(-wUnit * 0.35, -halfH);
                ctx.lineTo(wUnit * 0.35, -halfH);
                ctx.lineTo(wUnit * 0.35, halfH);
                ctx.lineTo(-wUnit * 0.35, halfH);
                ctx.closePath();
                ctx.fill();
              }

              ctx.restore();
            };

            // メインクリスタル描画
            drawCrystalUnit(cr.x, cr.y, cr.tilt, 1.0, 1.0, 0);
