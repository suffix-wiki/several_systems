<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Scouter & Face AI Analyzer</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- MediaPipe Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');
    
    :root {
      --theme-primary: #00ccff;
      --theme-primary-rgb: 0, 204, 255;
      --theme-glow: rgba(0, 204, 255, 0.4);
      --theme-border: rgba(0, 204, 255, 0.4);
      --theme-bg-panel: rgba(5, 15, 25, 0.92);
    }

    [data-theme="green"] {
      --theme-primary: #00ff66;
      --theme-primary-rgb: 0, 255, 102;
      --theme-glow: rgba(0, 255, 102, 0.4);
      --theme-border: rgba(0, 255, 102, 0.4);
      --theme-bg-panel: rgba(5, 25, 12, 0.92);
    }

    [data-theme="red"] {
      --theme-primary: #ff3344;
      --theme-primary-rgb: 255, 51, 68;
      --theme-glow: rgba(255, 51, 68, 0.4);
      --theme-border: rgba(255, 51, 68, 0.4);
      --theme-bg-panel: rgba(25, 5, 8, 0.92);
    }

    [data-theme="purple"] {
      --theme-primary: #bf00ff;
      --theme-primary-rgb: 191, 0, 255;
      --theme-glow: rgba(191, 0, 255, 0.4);
      --theme-border: rgba(191, 0, 255, 0.4);
      --theme-bg-panel: rgba(20, 5, 28, 0.92);
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    
    .theme-color-text { color: var(--theme-primary); }
    .theme-border { border-color: var(--theme-border); }

    .theme-glow-text {
      text-shadow: 0 0 8px var(--theme-primary), 0 0 16px var(--theme-glow);
    }

    .theme-btn-primary {
      background: linear-gradient(135deg, var(--theme-primary), rgba(var(--theme-primary-rgb), 0.7));
      color: #030712;
      box-shadow: 0 0 15px var(--theme-glow);
    }

    .scouter-panel {
      background: var(--theme-bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--theme-border);
      box-shadow: 0 0 20px var(--theme-glow);
    }

    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
    }
  </style>
</head>

  <script>
    const STATE = {
      mode: 'power',
      theme: 'cyan',
      criteria: 'cool',
      audioEnabled: true,
      facingMode: 'environment',
      rawFaces: [],
      smoothFaces: [],
      selectedFaceId: null,
      isScanning: false,
      scrambleValue: 0,
      lockedResults: {} // Frozen scan results per face ID
    };

    const THEMES = {
      cyan: { primary: '#00ccff', rgb: '0, 204, 255', tint: 'rgba(0, 204, 255, 0.15)', name: 'CYAN' },
      green: { primary: '#00ff66', rgb: '0, 255, 102', tint: 'rgba(0, 255, 102, 0.15)', name: 'GREEN' },
      red: { primary: '#ff3344', rgb: '255, 51, 68', tint: 'rgba(255, 51, 68, 0.2)', name: 'RED' },

    };

    const MALE_TYPES_COOL = [

    const FEMALE_TYPES_COOL = [

    const FEMALE_TYPES_BEAUTY = [
      { name: "フェミニン (Feminine)", desc: "華やかで曲線的な美しい輪郭を持つ洗練された女性美" },
      { name: "フレッシュ (Fresh)", desc: "透明感あふれるナチュラルな印象と爽やかな美しさ" },
      { name: "キュート (Cute)", desc: "愛くるしい瞳と丸みのある愛されフェミニン顔" }
    ];

    const RPG_JOBS = [
      { title: "勇者 (Hero)", trait: "万能な統率力と不屈の精神を持った光のリーダー", rank: "S-Rank" },
      { title: "魔法使い (Mage)", trait: "圧倒的な知性と広範囲な状況変化を起こす術士", rank: "A-Rank" },
      { title: "賢者 (Sage)", trait: "全知全能の知識で攻守両面を支える最高の頭脳", rank: "S-Rank" },
      { title: "僧侶 (Cleric)", trait: "高い共感力と癒やしのオーラでチームを守る聖者", rank: "A-Rank" },
      { title: "戦士 (Warrior)", trait: "強固な意志と圧倒的タフネスで前線を切り拓く傑物", rank: "A-Rank" },
      { title: "武闘家 (Martial Artist)", trait: "超絶な身体能力と直感力で一撃を叩き込む達人", rank: "B-Rank" },
      { title: "盗賊 (Thief)", trait: "鋭い洞察力と素早さでチャンスを見極める技巧派", rank: "B-Rank" },
      { title: "魔王 (Demon King)", trait: "全周囲を圧倒するカリスマ性と絶大なオーラ", rank: "EX-Rank" }
    ];

    const FORTUNE_ARCHETYPES = [
      { title: "運命のソウルメイト", desc: "前世からの深い絆。お互いの長所を高め合える最高の相性です。" },
      { title: "最強の無敵バディ", desc: "直感と波長が完璧に合致。どんな困難も二人でクリアできます。" },
      { title: "互いを高め合うライバル", desc: "切磋琢磨することで秘められた能力が覚醒する刺激的な関係。" },
      { title: "天敵だが惹かれ合う磁石", desc: "正反対のタイプだからこそ、互いに自分にない魅力を強く補い合えます。" }
    ];

    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      playBeep(freq = 1200, duration = 0.08) {
        if (!STATE.audioEnabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playFastScanBeep(pitchOffset = 0) {
        if (!STATE.audioEnabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(800 + pitchOffset, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }

      playClimaxLockSound() {
        if (!STATE.audioEnabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(400, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1800, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.35);
        } catch(e) {}
      }
    }

    const soundEngine = new SoundEngine();

    // Memory cache to maintain high face attribute consistency for same person
    const faceFeatureMemory = new Map();

    function analyzeFacialGeometrics(landmarks, bboxWidth, bboxHeight) {
      if (!landmarks || landmarks.length < 4) {
        return { eyeRatio: 0.3, jawRatio: 1.0, vertRatio: 1.3, rawHash: Math.floor(bboxWidth * bboxHeight) };
      }

      // Landmarks: 0: Right Eye, 1: Left Eye, 2: Nose Tip, 3: Mouth Center
      const rEye = landmarks[0];
      const lEye = landmarks[1];
      const nose = landmarks[2];
      const mouth = landmarks[3];

      const eyeDist = Math.hypot(rEye.x - lEye.x, rEye.y - lEye.y);
      const noseToMouth = Math.hypot(nose.x - mouth.x, nose.y - mouth.y);
      const eyeToNose = Math.hypot(((rEye.x + lEye.x)/2) - nose.x, ((rEye.y + lEye.y)/2) - nose.y);

      const eyeRatio = eyeDist / Math.max(0.001, bboxWidth);
      const vertRatio = (eyeToNose + noseToMouth) / Math.max(0.001, eyeDist);

      // Quantize feature values to create stable fingerprint bins
      const bin1 = Math.round(eyeRatio * 100);
      const bin2 = Math.round(vertRatio * 100);
      const rawHash = (bin1 * 73) + (bin2 * 109) + Math.round(bboxWidth / bboxHeight * 50);

      return { eyeRatio, vertRatio, rawHash };
    }

    function computeStableFaceMetrics(faceId, landmarks, bboxWidth, bboxHeight) {
      const geo = analyzeFacialGeometrics(landmarks, bboxWidth, bboxHeight);

      let cached = faceFeatureMemory.get(faceId);
      if (!cached) {
        // Deterministic attribution based on geometric fingerprint
        const eyeSpan = geo.eyeRatio;
        const gender = (eyeSpan > 0.28 || (geo.rawHash % 2 === 0)) ? 'Male' : 'Female';
        const age = 20 + (geo.rawHash % 28);
        
        // Battle Power Calculation
        const basePower = 12000 + (geo.rawHash % 880000);
        let rank = "一般人級";
        if (basePower > 700000) rank = "神話・伝説級";
        else if (basePower > 400000) rank = "超絶戦士級";
        else if (basePower > 100000) rank = "特級戦士級";
        else if (basePower > 30000) rank = "達人級";

        // Face types according to criteria & gender
        const maleCool = MALE_TYPES_COOL[geo.rawHash % MALE_TYPES_COOL.length];
        const maleBeauty = MALE_TYPES_BEAUTY[geo.rawHash % MALE_TYPES_BEAUTY.length];
        const femaleCool = FEMALE_TYPES_COOL[geo.rawHash % FEMALE_TYPES_COOL.length];
        const femaleBeauty = FEMALE_TYPES_BEAUTY[geo.rawHash % FEMALE_TYPES_BEAUTY.length];

        const score = 78 + (geo.rawHash % 21);
        const rpg = RPG_JOBS[geo.rawHash % RPG_JOBS.length];

        cached = {
          gender, age, basePower, rank,
          maleCool, maleBeauty, femaleCool, femaleBeauty,
          score, rpg, hash: geo.rawHash
        };
        faceFeatureMemory.set(faceId, cached);
      }

      return cached;
    }

    class ClampedHUDCanvasRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      render(faces) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        const theme = THEMES[STATE.theme];
        const color = theme.primary;

        this.drawCentralGuideCrosshair(color);

        if (!faces || faces.length === 0) {
          this.drawSearchingStatus(color);
          return;
        }

        if (STATE.mode === 'chemistry') {
          if (faces.length >= 2) {
            this.drawTargetReticle(faces[0], color, true);
            this.drawTargetReticle(faces[1], '#ff00aa', false);
            this.drawChemistryConnection(faces[0], faces[1]);
          } else {
            this.drawTargetReticle(faces[0], color, true);
            this.drawSingleTargetPrompt(color);
          }
        } else {
          // Secondary targets
          faces.forEach(f => {
            if (f.id !== STATE.selectedFaceId && faces.length > 1) {
              this.drawTargetReticle(f, 'rgba(255,255,255,0.4)', false);
            }
          });

          // Selected target
          const activeFace = faces.find(f => f.id === STATE.selectedFaceId) || faces[0];
          this.drawTargetReticle(activeFace, color, true);

          if (STATE.mode === 'power') {
            this.drawPowerOverlay(activeFace, color);
          } else if (STATE.mode === 'facetype') {
            this.drawFaceTypeOverlay(activeFace, color);
          } else if (STATE.mode === 'rpg') {
            this.drawRPGOverlay(activeFace, color);
          }
        }
      }

      drawCentralGuideCrosshair(color) {
        const ctx = this.ctx;
        const cx = this.canvas.width / 2;
        const cy = this.canvas.height / 2;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.2;

        ctx.beginPath();
        ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
        ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 40, 0, Math.PI * 2);
        ctx.setLineDash([4, 4]);
        ctx.stroke();

        ctx.restore();
      }

      drawSearchingStatus(color) {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = '700 13px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fillText('SEARCHING FOR TARGET FACE...', this.canvas.width / 2, this.canvas.height / 2 + 70);
        ctx.restore();
      }

      drawTargetReticle(face, color, isSelected) {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const H = this.canvas.height;

        const boxWidth = Math.min(face.width, W * 0.85);
        const boxHeight = Math.min(face.height, H * 0.85);
        
        const cx = Math.max(boxWidth / 2 + 10, Math.min(W - boxWidth / 2 - 10, face.centerX));
        const cy = Math.max(boxHeight / 2 + 10, Math.min(H - boxHeight / 2 - 10, face.centerY));

        const x = cx - boxWidth / 2;
        const y = cy - boxHeight / 2;
        const radius = Math.max(boxWidth, boxHeight) * 0.52;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = isSelected ? 2.5 : 1.5;
        ctx.shadowColor = color;
        ctx.shadowBlur = isSelected ? 12 : 4;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.setLineDash(isSelected ? [10, 5] : [4, 4]);
        ctx.stroke();

        ctx.setLineDash([]);
        const len = Math.min(20, boxWidth * 0.2);
        ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + boxWidth - len, y); ctx.lineTo(x + boxWidth, y); ctx.lineTo(x + boxWidth, y + len); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + boxHeight - len); ctx.lineTo(x, y + boxHeight); ctx.lineTo(x + len, y + boxHeight); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + boxWidth - len, y + boxHeight); ctx.lineTo(x + boxWidth, y + boxHeight); ctx.lineTo(x + boxWidth, y + boxHeight - len); ctx.stroke();

        const badgeW = 120;
        const badgeH = 20;
        const badgeX = Math.max(10, Math.min(W - badgeW - 10, x));
        const badgeY = Math.max(10, y - badgeH - 6);

        ctx.fillStyle = 'rgba(3, 7, 18, 0.9)';
        ctx.fillRect(badgeX, badgeY, badgeW, badgeH);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.strokeRect(badgeX, badgeY, badgeW, badgeH);

        const metrics = face.metrics || {};
        ctx.fillStyle = color;
        ctx.font = '700 10px Orbitron';
        ctx.textAlign = 'left';
        ctx.fillText(isSelected ? `[LOCKED] ${metrics.gender === 'Male' ? '♂' : '♀'}` : `[TAP TO LOCK]`, badgeX + 6, badgeY + 14);

        ctx.restore();
      }

      drawPowerOverlay(face, color) {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const lx = Math.min(W - 160, Math.max(10, face.x + face.width + 12));
        const ly = Math.max(40, face.y + 15);

        ctx.save();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;

        ctx.font = '900 11px Orbitron';
        ctx.fillText('BATTLE POWER', lx, ly);

        const lockedResult = STATE.lockedResults[face.id];
        let displayVal = 0;
        let displayRank = "未測定";

        if (STATE.isScanning) {
          displayVal = STATE.scrambleValue;
          displayRank = "CALCULATING...";
        } else if (lockedResult && lockedResult.powerValue !== undefined) {
          displayVal = lockedResult.powerValue;
          displayRank = lockedResult.rank;
        } else {
          displayVal = face.metrics.basePower;
          displayRank = face.metrics.rank;
        }

        ctx.font = '900 24px Orbitron';
        ctx.fillText(displayVal.toLocaleString(), lx, ly + 28);

        ctx.font = '700 11px Noto Sans JP';
        ctx.fillStyle = STATE.isScanning ? '#fbbf24' : '#ffffff';
        ctx.fillText(`ランク: ${displayRank}`, lx, ly + 48);

        ctx.restore();
      }

      drawFaceTypeOverlay(face, color) {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const lx = Math.min(W - 160, Math.max(10, face.x + face.width + 12));
        const ly = Math.max(40, face.y + 15);

        const lockedResult = STATE.lockedResults[face.id];
        let typeName = "---";
        let score = "--";

        if (lockedResult && lockedResult.faceType) {
          typeName = lockedResult.faceType.name.split(' ')[0];
          score = lockedResult.score;
        } else {
          const m = face.metrics;
          const isMale = m.gender === 'Male';
          const isCool = STATE.criteria === 'cool';
          const type = isMale ? (isCool ? m.maleCool : m.maleBeauty) : (isCool ? m.femaleCool : m.femaleBeauty);
          typeName = type.name.split(' ')[0];
          score = m.score;
        }

        ctx.save();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;

        ctx.font = '700 12px Noto Sans JP';
        ctx.fillText(`タイプ: ${typeName}`, lx, ly);
        ctx.fillText(`スコア: ${score} pt`, lx, ly + 22);

        ctx.restore();
      }

      drawRPGOverlay(face, color) {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const lx = Math.min(W - 160, Math.max(10, face.x + face.width + 12));
        const ly = Math.max(40, face.y + 15);

        const lockedResult = STATE.lockedResults[face.id];
        let rpgTitle = lockedResult ? lockedResult.rpg.title : face.metrics.rpg.title;
        let rpgRank = lockedResult ? lockedResult.rpg.rank : face.metrics.rpg.rank;

        ctx.save();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;

        ctx.font = '700 12px Noto Sans JP';
        ctx.fillText(`適性: ${rpgTitle}`, lx, ly);
        ctx.fillText(`ランク: ${rpgRank}`, lx, ly + 22);

        ctx.restore();
      }

      drawChemistryConnection(f1, f2) {
        const ctx = this.ctx;
        ctx.save();
        ctx.strokeStyle = '#ff00aa';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 6]);
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 10;

        ctx.beginPath();
        ctx.moveTo(f1.centerX, f1.centerY);
        ctx.lineTo(f2.centerX, f2.centerY);
        ctx.stroke();

        const midX = (f1.centerX + f2.centerX) / 2;
        const midY = (f1.centerY + f2.centerY) / 2;

        const chemScore = STATE.isScanning 
          ? Math.floor(Math.random() * 99) 
          : Math.floor(80 + ((f1.metrics.hash + f2.metrics.hash) % 20));

        ctx.fillStyle = 'rgba(20, 0, 30, 0.95)';
        ctx.strokeStyle = '#ff00aa';
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(midX, midY, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 14px Orbitron';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${chemScore}%`, midX, midY - 5);
        ctx.font = '700 9px Noto Sans JP';
        ctx.fillText('相性度', midX, midY + 10);

        ctx.restore();
      }

      drawSingleTargetPrompt(color) {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = '700 12px Noto Sans JP';
        ctx.textAlign = 'center';
        ctx.fillText('2人目を認識すると占い相性診断が開始されます', this.canvas.width / 2, this.canvas.height - 120);
        ctx.restore();
      }
    }

    class ScouterApp {
      constructor() {
        this.video = document.getElementById('webcam');
        this.canvas = document.getElementById('scouter-canvas');
        this.renderer = new ClampedHUDCanvasRenderer(this.canvas);
        
        this.bindEvents();
        this.initFaceTracker();
        this.startRenderLoop();
      }

      initFaceTracker() {
        this.faceDetection = new FaceDetection({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
        });

        this.faceDetection.setOptions({
          model: 'short',
          minDetectionConfidence: 0.55
        });

        this.faceDetection.onResults((results) => this.handleFaceResults(results));
        this.startCamera();
      }

      async startCamera() {
        if (this.cameraUtils) {
          await this.cameraUtils.stop();
        }

        if (STATE.facingMode === 'user') {
          this.video.classList.add('-scale-x-100');
        } else {
          this.video.classList.remove('-scale-x-100');
        }

        this.cameraUtils = new Camera(this.video, {
          onFrame: async () => {
            await this.faceDetection.send({ image: this.video });
          },
          width: 1280,
          height: 720,
          facingMode: STATE.facingMode
        });

        await this.cameraUtils.start();
        this.renderer.resize();
      }

      handleFaceResults(results) {
        if (!results.detections || results.detections.length === 0) {
          STATE.rawFaces = [];
          STATE.selectedFaceId = null;
          return;
        }

        const W = this.canvas.width;
        const H = this.canvas.height;
        const screenCenterX = W / 2;
        const screenCenterY = H / 2;

        const detected = results.detections.map((det, index) => {
          const bbox = det.boundingBox;
          let x = bbox.xCenter * W - (bbox.width * W) / 2;
          let y = bbox.yCenter * H - (bbox.height * H) / 2;
          let w = bbox.width * W;
          let h = bbox.height * H;

          if (STATE.facingMode === 'user') {
            x = W - x - w;
          }

          const centerX = x + w / 2;
          const centerY = y + h / 2;
          const distToCenter = Math.hypot(centerX - screenCenterX, centerY - screenCenterY);

          const faceId = `face-${index}`;
          const metrics = computeStableFaceMetrics(faceId, det.landmarks, w, h);

          return {
            id: faceId,
            x, y, width: w, height: h,
            centerX, centerY,
            distToCenter,
            metrics
          };
        });

        detected.sort((a, b) => a.distToCenter - b.distToCenter);
        STATE.rawFaces = detected;

        if (!STATE.selectedFaceId || !detected.find(f => f.id === STATE.selectedFaceId)) {
          STATE.selectedFaceId = detected[0].id;
        }
      }

      updateSmoothFaces() {
        if (STATE.rawFaces.length === 0) {
          STATE.smoothFaces = [];
          return;
        }

        const alpha = 0.25;
        if (STATE.smoothFaces.length !== STATE.rawFaces.length) {
          STATE.smoothFaces = STATE.rawFaces.map(f => ({ ...f }));
          return;
        }

        STATE.rawFaces.forEach((raw, i) => {
          const target = STATE.smoothFaces[i];
          if (target) {
            target.id = raw.id;
            target.x += (raw.x - target.x) * alpha;
            target.y += (raw.y - target.y) * alpha;
            target.width += (raw.width - target.width) * alpha;
            target.height += (raw.height - target.height) * alpha;
            target.centerX = target.x + target.width / 2;
            target.centerY = target.y + target.height / 2;
            target.metrics = raw.metrics;
          }
        });
      }

      bindEvents() {
        window.addEventListener('resize', () => this.renderer.resize());

        this.canvas.addEventListener('click', (e) => {
          if (STATE.smoothFaces.length <= 1) return;
          const rect = this.canvas.getBoundingClientRect();
          const tapX = e.clientX - rect.left;
          const tapY = e.clientY - rect.top;

          let closest = null;
          let minDist = Infinity;

          STATE.smoothFaces.forEach(f => {
            const d = Math.hypot(f.centerX - tapX, f.centerY - tapY);
            if (d < minDist) {
              minDist = d;
              closest = f;
            }
          });

          if (closest) {
            STATE.selectedFaceId = closest.id;
            this.updateAnalysisPanel();
            soundEngine.playBeep(1400, 0.08);
          }
        });

        document.querySelectorAll('.mode-tab').forEach(tab => {
          tab.addEventListener('click', (e) => {
            const mode = e.currentTarget.dataset.mode;
            this.setMode(mode);
          });
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
          const keys = Object.keys(THEMES);
          const nextIdx = (keys.indexOf(STATE.theme) + 1) % keys.length;
          STATE.theme = keys[nextIdx];

          document.getElementById('app-body').setAttribute('data-theme', STATE.theme);
          document.getElementById('theme-label').innerText = THEMES[STATE.theme].name;
          document.getElementById('scouter-tint').style.backgroundColor = THEMES[STATE.theme].tint;

          soundEngine.playBeep(1100, 0.08);
        });

        document.getElementById('btn-criteria-cool').addEventListener('click', () => {
          STATE.criteria = 'cool';
          this.updateCriteriaButtons();
          this.updateAnalysisPanel();
          soundEngine.playBeep(1200, 0.05);
        });

        document.getElementById('btn-criteria-beauty').addEventListener('click', () => {
          STATE.criteria = 'beauty';
          this.updateCriteriaButtons();
          this.updateAnalysisPanel();
          soundEngine.playBeep(1200, 0.05);
        });

        document.getElementById('btn-audio').addEventListener('click', () => {
          STATE.audioEnabled = !STATE.audioEnabled;
          const icon = document.getElementById('icon-audio');
          icon.setAttribute('data-lucide', STATE.audioEnabled ? 'volume-2' : 'volume-x');
          lucide.createIcons();
          if (STATE.audioEnabled) soundEngine.playBeep(1300, 0.08);
        });

        document.getElementById('btn-camera-flip').addEventListener('click', () => {
          STATE.facingMode = (STATE.facingMode === 'environment') ? 'user' : 'environment';
          this.startCamera();
          soundEngine.playBeep(1500, 0.08);
        });

        document.getElementById('btn-scan').addEventListener('click', () => {
          this.triggerScanSequence();
        });

        document.getElementById('btn-capture').addEventListener('click', () => {
          this.captureSnapshot();
        });

        document.getElementById('btn-modal-close').addEventListener('click', () => {
          document.getElementById('capture-modal').classList.add('hidden');
        });

        document.getElementById('btn-download').addEventListener('click', () => {
          const imgUrl = document.getElementById('captured-image').src;
          const a = document.createElement('a');
          a.href = imgUrl;
          a.download = `cyber_scouter_${Date.now()}.png`;
          a.click();
        });
      }

      triggerScanSequence() {
        if (STATE.isScanning || STATE.smoothFaces.length === 0) return;

        STATE.isScanning = true;
        const banner = document.getElementById('alert-banner');
        const btnText = document.getElementById('btn-scan-text');
        
        banner.classList.remove('hidden');
        btnText.innerText = '計測中...';

        const activeFace = STATE.smoothFaces.find(f => f.id === STATE.selectedFaceId) || STATE.smoothFaces[0];
        const m = activeFace.metrics;
        const targetVal = m.basePower;

        let elapsed = 0;
        const totalDuration = 2400;
        const interval = 50;

        const scanTimer = setInterval(() => {
          elapsed += interval;
          const progress = elapsed / totalDuration;

          STATE.scrambleValue = Math.floor(Math.random() * (targetVal * progress * 1.3) + (1000 * progress));
          soundEngine.playFastScanBeep(progress * 600);

          if (elapsed >= totalDuration) {
            clearInterval(scanTimer);
            STATE.isScanning = false;
            banner.classList.add('hidden');
            btnText.innerText = 'ターゲットスキャン';

            // Freeze values permanently for this active target face
            const isMale = m.gender === 'Male';
            const isCool = STATE.criteria === 'cool';
            const faceType = isMale ? (isCool ? m.maleCool : m.maleBeauty) : (isCool ? m.femaleCool : m.femaleBeauty);

            STATE.lockedResults[activeFace.id] = {
              powerValue: m.basePower,
              rank: m.rank,
              gender: m.gender,
              age: m.age,
              score: m.score,
              faceType: faceType,
              rpg: m.rpg
            };

            soundEngine.playClimaxLockSound();
            this.updateAnalysisPanel();
          }
        }, interval);
      }

      setMode(mode) {
        STATE.mode = mode;
        document.querySelectorAll('.mode-tab').forEach(tab => {
          if (tab.dataset.mode === mode) {
            tab.className = 'mode-tab px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold flex items-center gap-1.5 bg-slate-800 text-white shadow-lg transition border theme-border';
          } else {
            tab.className = 'mode-tab px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold flex items-center gap-1.5 theme-color-text hover:bg-slate-800/50 transition';
          }
        });

        const panel = document.getElementById('analysis-panel');
        const selector = document.getElementById('criteria-selector');

        if (mode === 'power') {
          panel.classList.add('hidden');
          selector.classList.add('hidden');
        } else if (mode === 'facetype') {
          panel.classList.remove('hidden');
          selector.classList.remove('hidden');
          this.updateAnalysisPanel();
        } else {
          panel.classList.remove('hidden');
          selector.classList.add('hidden');
          this.updateAnalysisPanel();
        }

        soundEngine.playBeep(1250, 0.08);
      }

      updateCriteriaButtons() {
        const btnCool = document.getElementById('btn-criteria-cool');
        const btnBeauty = document.getElementById('btn-criteria-beauty');

        if (STATE.criteria === 'cool') {
          btnCool.className = 'px-2.5 py-0.5 rounded-full font-bold bg-slate-800 theme-color-text border theme-border transition';
          btnBeauty.className = 'px-2.5 py-0.5 rounded-full font-bold text-slate-400 hover:text-white transition';
        } else {
          btnBeauty.className = 'px-2.5 py-0.5 rounded-full font-bold bg-slate-800 theme-color-text border theme-border transition';
          btnCool.className = 'px-2.5 py-0.5 rounded-full font-bold text-slate-400 hover:text-white transition';
        }
      }

      updateAnalysisPanel() {
        const faces = STATE.smoothFaces;
        const panelContent = document.getElementById('panel-content');

        if (!faces || faces.length === 0) {
          panelContent.innerHTML = `
            <div class="text-center py-2 text-slate-400 font-bold">
              ターゲット顔が検出されていません
            </div>
          `;
          return;
        }

        const f1 = faces.find(f => f.id === STATE.selectedFaceId) || faces[0];
        const locked = STATE.lockedResults[f1.id];
        const m = f1.metrics;

        if (STATE.mode === 'facetype') {
          const isMale = (locked ? locked.gender : m.gender) === 'Male';
          const isCool = STATE.criteria === 'cool';
          const activeType = locked ? locked.faceType : (isMale ? (isCool ? m.maleCool : m.maleBeauty) : (isCool ? m.femaleCool : m.femaleBeauty));
          const score = locked ? locked.score : m.score;
          const gender = locked ? locked.gender : m.gender;
          const age = locked ? locked.age : m.age;
          const criteriaLabel = isCool ? 'かっこよさ' : '美しさ';

          panelContent.innerHTML = `
            <div class="grid grid-cols-2 gap-2.5">
              <div class="p-2.5 rounded-xl bg-slate-900/80 border theme-border">
                <div class="text-xs text-slate-400">推定属性</div>
                <div class="font-bold text-xs md:text-sm text-white mt-0.5">${gender === 'Male' ? '男性 ♂' : '女性 ♀'} (${age}歳)</div>
              </div>

              <div class="p-2.5 rounded-xl bg-slate-900/80 border theme-border">
                <div class="text-xs text-slate-400">${criteriaLabel}スコア</div>
                <div class="font-orbitron font-black text-lg theme-color-text mt-0.5">${score} <span class="text-xs">/ 100</span></div>
              </div>
            </div>

            <div class="p-2.5 rounded-xl bg-slate-900/80 border theme-border">
              <div class="text-xs text-slate-400">系統顔タイプ診断</div>
              <div class="font-bold text-sm text-white mt-0.5">${activeType.name}</div>
              <div class="text-xs text-slate-300 mt-1 leading-relaxed">${activeType.desc}</div>
            </div>
          `;
        } else if (STATE.mode === 'rpg') {
          const rpg = locked ? locked.rpg : m.rpg;
          panelContent.innerHTML = `
            <div class="p-3 rounded-xl bg-slate-900/80 border theme-border">
              <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400">適正RPGジョブ</span>
                <span class="text-xs px-2 py-0.5 rounded bg-amber-950/80 border border-amber-500/50 text-amber-300 font-bold">${rpg.rank}</span>
              </div>
              <div class="font-bold text-sm md:text-base text-white mt-1">${rpg.title}</div>
              <div class="text-xs text-slate-300 mt-1 leading-relaxed">${rpg.trait}</div>
            </div>
          `;
        } else if (STATE.mode === 'chemistry') {
          if (faces.length < 2) {
            panelContent.innerHTML = `
              <div class="text-center py-2 text-amber-300 text-xs md:text-sm font-bold flex items-center justify-center gap-1.5">
                <i data-lucide="users" class="w-4 h-4"></i>
                カメラ画角内に2人目の顔を検出してください
              </div>
            `;
            lucide.createIcons();
            return;
          }

          const f2 = faces[1];
          const synergyScore = Math.floor(80 + ((m.hash + f2.metrics.hash) % 20));
          const fortune = FORTUNE_ARCHETYPES[synergyScore % FORTUNE_ARCHETYPES.length];

          panelContent.innerHTML = `
            <div class="space-y-2">
              <div class="flex items-center justify-between p-2 rounded-xl bg-slate-900/80 border border-pink-500/40">
                <span class="text-xs text-slate-300">2人の運命相性度</span>
                <span class="font-orbitron font-black text-base text-pink-400">${synergyScore}%</span>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-900/80 border theme-border">
                <div class="font-bold text-xs md:text-sm text-pink-300">${fortune.title}</div>
                <div class="text-xs text-slate-300 mt-1 leading-relaxed">${fortune.desc}</div>
              </div>
            </div>
          `;
        }
      }

      captureSnapshot() {
        soundEngine.playClimaxLockSound();

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = this.canvas.width;
        exportCanvas.height = this.canvas.height;
        const ctx = exportCanvas.getContext('2d');

        ctx.save();
        if (STATE.facingMode === 'user') {
          ctx.translate(exportCanvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(this.video, 0, 0, exportCanvas.width, exportCanvas.height);
        ctx.restore();

        ctx.drawImage(this.canvas, 0, 0);

        const dataUrl = exportCanvas.toDataURL('image/png');
        document.getElementById('captured-image').src = dataUrl;
        document.getElementById('capture-modal').classList.remove('hidden');
      }

      startRenderLoop() {
        const loop = () => {
          this.updateSmoothFaces();
          this.renderer.render(STATE.smoothFaces);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    }

    window.addEventListener('load', () => {
      lucide.createIcons();
      new ScouterApp();
    });
  </script>
