<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>即興ドラムアレンジャー Pro Mobile Full</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #131b2e;
    }
    body {
      background-color: var(--bg-main);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #090d16;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 2px;
    }
    .pad-btn {
      transition: all 0.05s ease;
      touch-action: manipulation;
    }
    .pad-btn:active, .pad-btn.active {
      transform: scale(0.94);
      filter: brightness(1.3);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
    }
    .pattern-btn.active-pattern {
      border-color: #38bdf8 !important;
      background-color: #0369a1 !important;
      color: #ffffff !important;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .pattern-btn.queued-pattern {
      border-color: #f59e0b !important;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.6; }
      to { opacity: 1.0; }
    }
    .grid-cell {
      box-sizing: border-box;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .grid-cell.beat-start {
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }
    .drum-bar {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      z-index: 10;
      cursor: pointer;
    }
    .resize-handle {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 14px;
      background: rgba(255, 255, 255, 0.35);
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
      cursor: ew-resize;
      touch-action: none;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
      z-index: 30;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .mobile-modal-content {
        height: 100%;
        max-height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-2 flex items-center justify-between z-40 shrink-0">
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-drum text-rose-500 text-base sm:text-xl"></i>
      <h1 class="font-black text-xs sm:text-base tracking-wider text-slate-100">ドラムアレンジャー <span class="text-[10px] sm:text-xs font-bold text-rose-500">PRO</span></h1>
    </div>

    <!-- CONTROL BUTTONS -->
    <div class="flex items-center gap-1 sm:gap-2">
      <button id="btn-play" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-play"></i> <span>スタート</span>
      </button>
      <button id="btn-stop" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-white px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-square"></i> <span>停止</span>
      </button>

      <!-- BPM INPUT -->
      <div class="flex items-center gap-0.5 bg-slate-800 px-1.5 py-1 rounded-lg border border-slate-700 text-xs">
        <span class="text-slate-400 font-bold text-[10px]">BPM</span>
        <input type="number" id="bpm-input" min="40" max="240" value="120" class="w-10 bg-transparent text-center font-black text-rose-400 focus:outline-none text-xs">
      </div>

      <button id="btn-open-editor-new" class="bg-cyan-700 hover:bg-cyan-600 text-white font-bold p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs flex items-center gap-1 transition" title="新規作成">
        <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">新規作成</span>
      </button>

      <button id="btn-open-backup" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs flex items-center gap-1 transition" title="保存/復元">
        <i class="fa-solid fa-floppy-disk"></i><span class="hidden sm:inline">保存/復元</span>
      </button>
    </div>
  </header>

  <!-- MOBILE TABS BAR -->
  <div class="flex md:hidden bg-slate-950 border-b border-slate-800 shrink-0 text-xs font-bold">
    <button class="mobile-tab-btn flex-1 py-2 text-center text-cyan-400 border-b-2 border-cyan-400" data-target="panel-left">
      <i class="fa-solid fa-compact-disc"></i> BGM・基本パターン
    </button>
    <button class="mobile-tab-btn flex-1 py-2 text-center text-slate-400 border-b-2 border-transparent" data-target="panel-right">
      <i class="fa-solid fa-bolt"></i> 即興フィルイン・パッド
    </button>
  </div>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- LEFT PANEL: BGM LOAD & BASIC PATTERNS -->
    <aside id="panel-left" class="w-full md:w-80 bg-slate-950 border-r border-slate-800 flex flex-col overflow-hidden h-full md:h-auto">
      <!-- BGM FILE LOADER -->
      <div class="p-2.5 border-b border-slate-800 bg-slate-900/50 space-y-2 shrink-0">
        <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-compact-disc text-rose-400"></i> バックグラウンド楽曲 (MP3/WAV)
        </span>
        <label class="block w-full bg-rose-950/50 hover:bg-rose-900/70 text-rose-200 border border-rose-800/60 p-2 rounded-lg text-center text-xs font-bold cursor-pointer transition">
          <i class="fa-solid fa-upload"></i> 好きな曲を読み込む
          <input type="file" id="bgm-input" accept="audio/*" class="hidden">
        </label>
        
        <div id="bgm-info" class="hidden text-[11px] text-slate-400 space-y-1 bg-slate-900 p-2 rounded border border-slate-800">
          <div class="flex items-center justify-between">
            <span id="bgm-name" class="truncate max-w-[150px] font-semibold text-slate-200">曲名</span>
            <button id="btn-remove-bgm" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-slate-800">
            <span class="text-amber-400 font-bold" id="bgm-detected-bpm">解析中...</span>
            <button id="btn-sync-bpm" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded text-[10px] font-bold hidden">
              このBPMに合わせる
            </button>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <span class="text-[10px] text-slate-400">音量:</span>
            <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.7" class="flex-1 accent-rose-500 h-1.5">
          </div>
        </div>
      </div>

      <!-- BASIC DRUM PATTERNS SELECTOR (全20種類) -->
      <div class="flex-1 overflow-y-auto p-2.5 custom-scrollbar space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-cyan-400"><i class="fa-solid fa-list-ul"></i> 基本ドラムパターン (全20種)</span>
        </div>
        <div id="basic-patterns-list" class="space-y-1.5">
          <!-- JS Populated -->
        </div>
      </div>
    </aside>

    <!-- RIGHT MAIN WORKSPACE: INSTANT FILL-INS & LIVE PADS -->
    <main id="panel-right" class="hidden md:flex flex-1 flex-col overflow-y-auto custom-scrollbar p-2.5 gap-3 bg-slate-900/60 h-full">

      <!-- REALTIME STATUS DISPLAY -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between text-xs shrink-0">
        <div class="flex items-center gap-2">
          <div>
            <span class="text-slate-500 block text-[9px]">現在のパターン</span>
            <span id="status-current-pattern" class="font-bold text-cyan-300 text-xs sm:text-sm truncate max-w-[140px] sm:max-w-[200px] block">8ビート (標準)</span>
          </div>
          <div id="status-queued-container" class="hidden">
            <span class="text-amber-500 block text-[9px]">次小節の予約</span>
            <span id="status-queued-pattern" class="font-bold text-amber-300 text-xs truncate max-w-[100px] block">----</span>
          </div>
        </div>

        <!-- BEAT INDICATOR DOTS -->
        <div class="flex items-center gap-1" id="beat-dots">
          <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700" id="dot-0"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700" id="dot-1"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700" id="dot-2"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700" id="dot-3"></div>
        </div>
      </div>

      <!-- INSTANT FILL-IN TRIGGER BUTTONS (全30種類以上) -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 space-y-2.5 shrink-0">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
            <i class="fa-solid fa-bolt"></i> 即時割り込みフィルイン (全30種)
          </span>
          <span class="text-[10px] text-slate-500">押した瞬間に鳴る！</span>
        </div>

        <!-- SHORT (1/4小節 - 4拍) -->
        <div>
          <span class="text-[10px] font-semibold text-slate-400 block mb-1">⚡ ショートフィルイン (1/4小節)</span>
          <div id="fillins-short" class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 max-h-32 overflow-y-auto custom-scrollbar">
            <!-- JS Populated -->
          </div>
        </div>

        <!-- MEDIUM (1/2小節 - 8拍) -->
        <div>
          <span class="text-[10px] font-semibold text-slate-400 block mb-1">⚡ ミディアムフィルイン (1/2小節)</span>
          <div id="fillins-medium" class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 max-h-32 overflow-y-auto custom-scrollbar">
            <!-- JS Populated -->
          </div>
        </div>

        <!-- LONG (1小節 - 16拍) -->
        <div>
          <span class="text-[10px] font-semibold text-slate-400 block mb-1">⚡ ロングフィルイン (1小節)</span>
          <div id="fillins-long" class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 max-h-32 overflow-y-auto custom-scrollbar">
            <!-- JS Populated -->
          </div>
        </div>
      </div>

      <!-- MANUAL LIVE DRUM PADS -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 space-y-1.5 shrink-0">
        <span class="text-xs font-bold text-rose-400 flex items-center gap-1">
          <i class="fa-solid fa-hand-pointer"></i> リアルタイム・ドラムパッド
        </span>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5" id="drum-pads-container">
          <!-- JS Populated -->
        </div>
      </div>

    </main>
  </div>

  <!-- PATTERN EDITOR MODAL -->
  <div id="modal-editor" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-0 sm:p-3 z-50 hidden">
    <div class="mobile-modal-content bg-slate-900 border border-slate-700 sm:rounded-2xl p-3 w-full max-w-2xl max-h-full sm:max-h-[92vh] flex flex-col gap-2.5 shadow-2xl overflow-hidden">
      
      <div class="flex justify-between items-center border-b border-slate-800 pb-2 shrink-0">
        <h3 class="font-bold text-slate-200 text-xs sm:text-base flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square text-cyan-400"></i> <span id="editor-modal-title">ドラムエディタ</span>
        </h3>

        <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[11px] font-bold">
          <button id="btn-mode-karaoke" class="px-2.5 py-1 rounded-md bg-cyan-600 text-white">
            <i class="fa-solid fa-grip-lines"></i> カラオケ
          </button>
          <button id="btn-mode-score" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white">
            <i class="fa-solid fa-music"></i> 楽譜
          </button>
        </div>

        <button class="btn-close-editor text-slate-400 hover:text-white text-2xl px-1">&times;</button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs shrink-0">
        <div class="col-span-2 sm:col-span-1">
          <input type="text" id="edit-pattern-name" value="マイビート" class="w-full bg-slate-800 border border-slate-700 p-1.5 rounded text-slate-200 focus:outline-none focus:border-cyan-500 font-bold text-xs">
        </div>
        <div>
          <select id="edit-pattern-type" class="w-full bg-slate-800 border border-slate-700 p-1.5 rounded text-slate-200 focus:outline-none focus:border-cyan-500 font-bold text-xs">
            <option value="basic">基本パターン</option>
            <option value="fill_short">ショート(4拍)</option>
            <option value="fill_medium">ミディアム(8拍)</option>
            <option value="fill_long">ロング(16拍)</option>
          </select>
        </div>
        <div class="flex items-center gap-1 col-span-2 sm:col-span-1">
          <button id="btn-editor-preview-play" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-2 rounded text-xs flex items-center justify-center gap-1">
            <i class="fa-solid fa-play"></i> 試聴
          </button>
          <button id="btn-editor-preview-stop" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-1.5 px-2 rounded text-xs">
            <i class="fa-solid fa-square"></i>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto overflow-x-auto custom-scrollbar bg-slate-950 p-2 border border-slate-800 rounded-xl relative flex flex-col justify-center">
        <div id="editor-grid-container" class="relative min-w-[500px]">
          <div id="editor-playhead" class="playhead hidden"></div>
          <div id="editor-drum-grid" class="relative bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
            <!-- JS Populated -->
          </div>
        </div>

        <div id="editor-score-container" class="hidden w-full overflow-x-auto flex flex-col items-center justify-center py-2">
          <canvas id="drum-score-canvas" width="600" height="200" class="bg-slate-900 border border-slate-800 rounded-xl shadow-inner"></canvas>
        </div>
      </div>

      <div class="flex justify-between items-center pt-1 border-t border-slate-800 shrink-0">
        <button id="btn-editor-clear" class="text-rose-400 hover:underline text-xs"><i class="fa-solid fa-trash"></i> クリア</button>
        <div class="flex gap-2">
          <button class="btn-close-editor bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded text-xs">閉じる</button>
          <button id="btn-save-custom-pattern" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-1.5 rounded text-xs flex items-center gap-1">
            <i class="fa-solid fa-floppy-disk"></i> 保存
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- BACKUP & RESTORE MODAL -->
  <div id="modal-backup" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 z-50 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 w-full max-w-md flex flex-col gap-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-slate-200 text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-floppy-disk text-cyan-400"></i> パターンの保存と復元
        </h3>
        <button class="btn-close-backup text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <div class="space-y-2.5 pt-1">
        <button id="btn-export-json" class="w-full bg-cyan-900/60 hover:bg-cyan-800 text-cyan-200 border border-cyan-700/80 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-export"></i> 全パターンをJSON保存
        </button>

        <label class="w-full bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 border border-emerald-700/80 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-file-import"></i> JSONファイルを復元
          <input type="file" id="input-import-json" accept=".json" class="hidden">
        </label>

        <button id="btn-reset-default" class="w-full bg-slate-800 hover:bg-rose-950/60 text-slate-400 hover:text-rose-300 border border-slate-700 p-2 rounded-xl font-bold text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-left"></i> 初期状態に戻す
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * 即興ドラムアレンジャー PRO MOBILE FULL - COMPLETE PRESETS & ENGINE
     */

    const DRUMS = [
      { id: "crash", label: "クラッシュ", color: "bg-amber-500", notePos: 0 },
      { id: "ride", label: "ライド", color: "bg-yellow-600", notePos: 1 },
      { id: "hihat_open", label: "オープンHH", color: "bg-emerald-500", notePos: 2 },
      { id: "hihat_close", label: "クローズHH", color: "bg-emerald-600", notePos: 2 },
      { id: "high_tom", label: "ハイタム", color: "bg-indigo-400", notePos: 3 },
      { id: "low_tom", label: "ロータム", color: "bg-indigo-600", notePos: 4 },
      { id: "snare", label: "スネア", color: "bg-pink-500", notePos: 5 },
      { id: "floor_tom", label: "フロアタム", color: "bg-purple-700", notePos: 6 },
      { id: "kick", label: "バスドラム", color: "bg-rose-600", notePos: 7 }
    ];

    // 全20種類の基本ドラムパターン
    const DEFAULT_BASIC_PATTERNS = [
      { name: "1. 標準 8ビート (ポップス/ロック)", notes: [{type:"kick",step:0,duration:2},{type:"kick",step:8,duration:2},{type:"snare",step:4,duration:2},{type:"snare",step:12,duration:2},{type:"hihat_close",step:0,duration:1},{type:"hihat_close",step:2,duration:1},{type:"hihat_close",step:4,duration:1},{type:"hihat_close",step:6,duration:1},{type:"hihat_close",step:8,duration:1},{type:"hihat_close",step:10,duration:1},{type:"hihat_close",step:12,duration:1},{type:"hihat_close",step:14,duration:1}] },
      { name: "2. ダンス 4つ打ち (EDM/Club)", notes: [{type:"kick",step:0,duration:2},{type:"kick",step:4,duration:2},{type:"kick",step:8,duration:2},{type:"kick",step:12,duration:2},{type:"snare",step:4,duration:2},{type:"snare",step:12,duration:2},{type:"hihat_open",step:2,duration:1},{type:"hihat_open",step:6,duration:1},{type:"hihat_open",step:10,duration:1},{type:"hihat_open",step:14,duration:1}] },
      { name: "3. 16ビート・ファンク", notes: [{type:"kick",step:0,duration:2},{type:"kick",step:6,duration:2},{type:"kick",step:10,duration:2},{type:"snare",step:4,duration:2},{type:"snare",step:12,duration:2},{type:"hihat_close",step:0,duration:1},{type:"hihat_close",step:1,duration:1},{type:"hihat_close",step:2,duration:1},{type:"hihat_close",step:4,duration:1},{type:"hihat_close",step:8,duration:1},{type:"hihat_close",step:12,duration:1}] },
      { name: "4. アコースティック・ボサノバ", notes: [{type:"kick",step:0,duration:2},{type:"kick",step:6,duration:2},{type:"kick",step:10,duration:2},{type:"snare",step:4,duration:2},{type:"ride",step:0,duration:2},{type:"ride",step:4,duration:2},{type:"ride",step:8,duration:2},{type:"ride",step:12,duration:2}] },
      { name: "5. トラップ (Trap/HipHop)", notes: [{type:"kick",step:0,duration:2},{type:"kick",step:10,duration:2},{type:"snare",step:8,duration:2},{type:"hihat_close",step:0,duration:1},{type:"hihat_close",step:1,duration:1},{type:"hihat_close",step:2,duration:1},{type:"hihat_close",step:3,duration:1},{type:"hihat_close",step:4,duration:1},{type:"hihat_close",step:6,duration:1}] },

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function initUI() {
      // MOBILE TABS SWITCHING
      document.querySelectorAll(".mobile-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mobile-tab-btn").forEach(b => {
            b.classList.remove("text-cyan-400", "border-cyan-400");
            b.classList.add("text-slate-400", "border-transparent");
          });
          btn.classList.add("text-cyan-400", "border-cyan-400");
          btn.classList.remove("text-slate-400", "border-transparent");

          const targetId = btn.dataset.target;
          if (targetId === "panel-left") {
            document.getElementById("panel-left").classList.remove("hidden");
            document.getElementById("panel-right").classList.add("hidden");
          } else {
            document.getElementById("panel-left").classList.add("hidden");
            document.getElementById("panel-right").classList.remove("hidden");
            document.getElementById("panel-right").classList.add("flex");
          }
        });
      });

      document.getElementById("btn-play").addEventListener("click", startPerformance);
      document.getElementById("btn-stop").addEventListener("click", stopPerformance);

      const bpmInput = document.getElementById("bpm-input");
      bpmInput.addEventListener("change", () => {
        bpm = Math.max(40, Math.min(240, parseInt(bpmInput.value) || 120));
        bpmInput.value = bpm;
      });

      // BGM FILE INPUT
      document.getElementById("bgm-input").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const ctx = getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        bgmBuffer = await ctx.decodeAudioData(arrayBuffer);

        document.getElementById("bgm-name").innerText = file.name;
        document.getElementById("bgm-info").classList.remove("hidden");
        document.getElementById("bgm-detected-bpm").innerText = "解析中...";
        document.getElementById("btn-sync-bpm").classList.add("hidden");

        detectBPM(bgmBuffer).then(estimatedBpm => {
          if (estimatedBpm) {
            detectedBPM = estimatedBpm;
            document.getElementById("bgm-detected-bpm").innerText = `推定BPM: ${detectedBPM}`;
            document.getElementById("btn-sync-bpm").classList.remove("hidden");
          } else {
            document.getElementById("bgm-detected-bpm").innerText = "BPM解析不可";
          }
        });
      });

      document.getElementById("btn-sync-bpm").addEventListener("click", () => {
        if (detectedBPM) {
          bpm = detectedBPM;
          document.getElementById("bpm-input").value = bpm;
          alert(`BPMを ${bpm} に合わせました！`);
        }
      });

      document.getElementById("btn-remove-bgm").addEventListener("click", () => {
        bgmBuffer = null;
        if (bgmSourceNode) {
          try { bgmSourceNode.stop(); } catch(e){}
        }
        document.getElementById("bgm-info").classList.add("hidden");
      });

      document.getElementById("bgm-volume").addEventListener("input", (e) => {
        if (bgmGainNode) {
          bgmGainNode.gain.value = parseFloat(e.target.value);
        }
      });

      // EDITOR MODAL CONTROLS
      const editorModal = document.getElementById("modal-editor");
      document.getElementById("btn-open-editor-new").addEventListener("click", () => openEditorForCreate());
      document.querySelectorAll(".btn-close-editor").forEach(b => b.addEventListener("click", () => {
        stopEditorPreview();
        editorModal.classList.add("hidden");
      }));

      // MODE SWITCH
      document.getElementById("btn-mode-karaoke").addEventListener("click", () => switchEditorMode("karaoke"));
      document.getElementById("btn-mode-score").addEventListener("click", () => switchEditorMode("score"));

      document.getElementById("btn-editor-clear").addEventListener("click", () => {
        editingPattern.notes = [];
        renderEditorGrid();
        renderDrumScore();
      });

      document.getElementById("btn-editor-preview-play").addEventListener("click", startEditorPreview);
      document.getElementById("btn-editor-preview-stop").addEventListener("click", stopEditorPreview);

      document.getElementById("btn-save-custom-pattern").addEventListener("click", () => {
        const name = document.getElementById("edit-pattern-name").value || "カスタムパターン";
        const type = document.getElementById("edit-pattern-type").value;

        const notesToSave = editingPattern.notes.map(n => {
          const noteObj = { type: n.type, duration: n.duration };
          if (type.startsWith("fill")) {
            noteObj.relStep = n.step;
          } else {
            noteObj.step = n.step;
          }
          return noteObj;
        });

        const savedPat = { name: name, notes: JSON.parse(JSON.stringify(notesToSave)) };

        if (editingContext.isNew) {
          if (type === "basic") basicPatterns.push(savedPat);
          if (type === "fill_short") fillinsShort.push(savedPat);
          if (type === "fill_medium") fillinsMedium.push(savedPat);
          if (type === "fill_long") fillinsLong.push(savedPat);
        } else {
          editingContext.targetArray[editingContext.index] = savedPat;
        }

        renderPatternList();
        renderFillinButtons();
        stopEditorPreview();
        editorModal.classList.add("hidden");
        alert(`パターン「${name}」を保存しました！`);
      });

      // BACKUP MODAL
      const backupModal = document.getElementById("modal-backup");
      document.getElementById("btn-open-backup").addEventListener("click", () => backupModal.classList.remove("hidden"));
      document.querySelectorAll(".btn-close-backup").forEach(b => b.addEventListener("click", () => backupModal.classList.add("hidden")));

      document.getElementById("btn-export-json").addEventListener("click", () => {
        const backupData = { basicPatterns, fillinsShort, fillinsMedium, fillinsLong };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "drum_jam_patterns_backup.json";
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("input-import-json").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.basicPatterns) basicPatterns = data.basicPatterns;
            if (data.fillinsShort) fillinsShort = data.fillinsShort;
            if (data.fillinsMedium) fillinsMedium = data.fillinsMedium;
            if (data.fillinsLong) fillinsLong = data.fillinsLong;

            currentPatternIndex = 0;
            renderPatternList();
            renderFillinButtons();
            alert("復元しました！");
            backupModal.classList.add("hidden");
          } catch(err) {
            alert("JSON読み込み失敗。");
          }
        };
        reader.readAsText(file);
      });

      document.getElementById("btn-reset-default").addEventListener("click", () => {
        if (confirm("初期状態に戻しますか？")) {
          basicPatterns = JSON.parse(JSON.stringify(DEFAULT_BASIC_PATTERNS));
          fillinsShort = JSON.parse(JSON.stringify(DEFAULT_FILLINS_SHORT));
          fillinsMedium = JSON.parse(JSON.stringify(DEFAULT_FILLINS_MEDIUM));
          fillinsLong = JSON.parse(JSON.stringify(DEFAULT_FILLINS_LONG));

          currentPatternIndex = 0;
          renderPatternList();
          renderFillinButtons();
          alert("初期化しました。");
          backupModal.classList.add("hidden");
        }
      });
    }

    // BPM AUTO DETECTOR
    async function detectBPM(audioBuffer) {
      try {
        const rawData = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        const step = Math.floor(sampleRate / 100);
        const energies = [];

        for (let i = 0; i < rawData.length; i += step) {
          let sum = 0;
          for (let j = 0; j < step && (i + j) < rawData.length; j++) {
            sum += Math.abs(rawData[i + j]);
          }
          energies.push(sum);
        }

        const onsets = [];
        for (let i = 1; i < energies.length; i++) {
          onsets.push(Math.max(0, energies[i] - energies[i - 1]));
        }

        let maxCorr = 0;
        let bestIntervalSec = 0.5;

        for (let targetBpm = 70; targetBpm <= 170; targetBpm += 1) {
          const intervalMs = (60.0 / targetBpm) * 100;
          let corr = 0;
          const lag = Math.round(intervalMs);

          for (let i = 0; i < onsets.length - lag; i++) {
            corr += onsets[i] * onsets[i + lag];
          }

          if (corr > maxCorr) {
            maxCorr = corr;
            bestIntervalSec = 60.0 / targetBpm;
          }
        }

        return Math.round(60.0 / bestIntervalSec);
      } catch (e) {
        return 120;
      }
    }

    // SWITCH EDITOR MODE
    function switchEditorMode(mode) {
      editorMode = mode;
      const btnKaraoke = document.getElementById("btn-mode-karaoke");
      const btnScore = document.getElementById("btn-mode-score");
      const gridContainer = document.getElementById("editor-grid-container");
      const scoreContainer = document.getElementById("editor-score-container");

      if (mode === "karaoke") {
        btnKaraoke.className = "px-2.5 py-1 rounded-md bg-cyan-600 text-white";
        btnScore.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white";
        gridContainer.classList.remove("hidden");
        scoreContainer.classList.add("hidden");
      } else {
        btnScore.className = "px-2.5 py-1 rounded-md bg-cyan-600 text-white";
        btnKaraoke.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white";
        gridContainer.classList.add("hidden");
        scoreContainer.classList.remove("hidden");
        renderDrumScore();
      }
    }

    function openEditorForCreate() {
      editingContext = { targetArray: null, index: -1, isNew: true };
      editingPattern = { name: "マイビート", type: "basic", notes: [] };

      document.getElementById("editor-modal-title").innerText = "新規ドラムパターン";
      document.getElementById("edit-pattern-name").value = editingPattern.name;
      document.getElementById("edit-pattern-type").value = "basic";
      document.getElementById("edit-pattern-type").disabled = false;

      renderEditorGrid();
      renderDrumScore();
      document.getElementById("modal-editor").classList.remove("hidden");
    }

    function openEditorForEdit(targetArray, index, type) {
      editingContext = { targetArray, index, isNew: false };
      const source = targetArray[index];

      const mappedNotes = source.notes.map(n => ({
        type: n.type,
        step: n.step !== undefined ? n.step : (n.relStep !== undefined ? n.relStep : 0),
        duration: n.duration || 1
      }));

      editingPattern = {
        name: source.name,
        type: type,
        notes: JSON.parse(JSON.stringify(mappedNotes))
      };

      document.getElementById("editor-modal-title").innerText = `「${source.name}」の編集`;
      document.getElementById("edit-pattern-name").value = editingPattern.name;
      document.getElementById("edit-pattern-type").value = type;
      document.getElementById("edit-pattern-type").disabled = true;

      renderEditorGrid();
      renderDrumScore();
      document.getElementById("modal-editor").classList.remove("hidden");
    }

    // RENDER UI ELEMENTS
    function renderPatternList() {
      const list = document.getElementById("basic-patterns-list");
      list.innerHTML = "";

      basicPatterns.forEach((p, idx) => {
        const btn = document.createElement("button");
        btn.className = `pattern-btn w-full text-left bg-slate-900 hover:bg-slate-800 p-2 rounded-lg text-xs font-semibold border border-slate-800 flex justify-between items-center transition ${idx === currentPatternIndex ? 'active-pattern' : ''}`;
        btn.id = `pattern-btn-${idx}`;
        
        btn.innerHTML = `
          <span class="truncate max-w-[130px] sm:max-w-[150px]">${p.name}</span>
          <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-pen-to-square text-slate-400 hover:text-cyan-300 p-1 text-[11px]" title="編集" data-edit-pat="${idx}"></i>
            ${basicPatterns.length > 1 ? `<i class="fa-solid fa-trash text-slate-500 hover:text-rose-400 p-1 text-[11px]" title="削除" data-del="${idx}"></i>` : ''}
            <i class="fa-solid fa-play text-[10px] text-cyan-400"></i>
          </div>
        `;

        const editBtn = btn.querySelector("[data-edit-pat]");
        if (editBtn) {
          editBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditorForEdit(basicPatterns, idx, "basic");
          });
        }

        const delBtn = btn.querySelector("[data-del]");
        if (delBtn) {
          delBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (confirm(`「${p.name}」を削除しますか？`)) {
              basicPatterns.splice(idx, 1);
              if (currentPatternIndex >= basicPatterns.length) {
                currentPatternIndex = Math.max(0, basicPatterns.length - 1);
              }
              renderPatternList();
            }
          });
        }
        
        btn.addEventListener("click", () => {
          if (!isPlaying) {
            currentPatternIndex = idx;
            updatePatternUI();
          } else {
            queuedPatternIndex = idx;
            updatePatternUI();
          }
        });
        list.appendChild(btn);
      });
    }

    function updatePatternUI() {
      basicPatterns.forEach((_, idx) => {
        const btn = document.getElementById(`pattern-btn-${idx}`);
        if (!btn) return;
        btn.classList.remove("active-pattern", "queued-pattern");

        if (idx === currentPatternIndex) {
          btn.classList.add("active-pattern");
        } else if (idx === queuedPatternIndex) {
          btn.classList.add("queued-pattern");
        }
      });

      if (basicPatterns[currentPatternIndex]) {
        document.getElementById("status-current-pattern").innerText = basicPatterns[currentPatternIndex].name;
      }
      
      const queuedContainer = document.getElementById("status-queued-container");
      if (queuedPatternIndex !== null && basicPatterns[queuedPatternIndex]) {
        queuedContainer.classList.remove("hidden");
        document.getElementById("status-queued-pattern").innerText = basicPatterns[queuedPatternIndex].name;
      } else {
        queuedContainer.classList.add("hidden");
      }
    }

    function renderFillinButtons() {
      const renderGroup = (containerId, fillinsArray, fillinType, colorClass) => {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        fillinsArray.forEach((f, idx) => {
          const btn = document.createElement("button");
          btn.className = `bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 text-xs font-bold p-2 rounded-lg text-left hover:${colorClass} transition flex items-center justify-between shadow`;
          
          btn.innerHTML = `
            <span class="truncate max-w-[90px] sm:max-w-[100px]">${f.name}</span>
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-pen-to-square text-slate-400 hover:text-cyan-300 p-0.5 text-[10px]" title="編集" data-edit-fill="${idx}"></i>
              <i class="fa-solid fa-trash text-slate-500 hover:text-rose-400 p-0.5 text-[10px]" title="削除" data-del-fill="${idx}"></i>
              <i class="fa-solid fa-bolt text-[10px] text-amber-400"></i>
            </div>
          `;

          const editBtn = btn.querySelector("[data-edit-fill]");
          if (editBtn) {
            editBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openEditorForEdit(fillinsArray, idx, fillinType);
            });
          }

          const delBtn = btn.querySelector("[data-del-fill]");
          if (delBtn) {
            delBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              if (confirm(`フィルイン「${f.name}」を削除しますか？`)) {
                fillinsArray.splice(idx, 1);
                renderFillinButtons();
              }
            });
          }

          btn.addEventListener("click", () => triggerInstantFillin(f));
          container.appendChild(btn);
        });
      };

      renderGroup("fillins-short", fillinsShort, "fill_short", "border-amber-500");
      renderGroup("fillins-medium", fillinsMedium, "fill_medium", "border-amber-500");
      renderGroup("fillins-long", fillinsLong, "fill_long", "border-amber-500");
    }

    function renderDrumPads() {
      const container = document.getElementById("drum-pads-container");
      container.innerHTML = "";

      DRUMS.forEach(d => {
        const btn = document.createElement("button");
        btn.className = `pad-btn ${d.color} text-white font-bold py-2.5 px-1 rounded-xl text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg active:scale-95`;
        btn.innerHTML = `<span class="truncate max-w-[60px]">${d.label}</span>`;

        const triggerPad = () => {
          playDrumSound(d.id);
          btn.classList.add("active");
          setTimeout(() => btn.classList.remove("active"), 100);
        };

        btn.addEventListener("pointerdown", triggerPad);
        container.appendChild(btn);
      });
    }

    // EDITOR PIANO ROLL GRID
    function renderEditorGrid() {
      const container = document.getElementById("editor-drum-grid");
      container.innerHTML = "";

      DRUMS.forEach(drum => {
        const row = document.createElement("div");
        row.className = "flex h-7 border-b border-slate-800/60 relative";

        const label = document.createElement("div");
        label.className = "w-16 bg-slate-900 border-r border-slate-800 flex items-center justify-center text-[10px] font-semibold text-slate-400 select-none z-20 shrink-0";
        label.innerText = drum.label;
        row.appendChild(label);

        const gridArea = document.createElement("div");
        gridArea.className = "flex-1 flex relative h-full cursor-pointer";

        for (let s = 0; s < 16; s++) {
          const cell = document.createElement("div");
          cell.className = `flex-1 grid-cell ${s % 4 === 0 ? 'beat-start' : ''}`;
          cell.addEventListener("click", (e) => {
            if (e.target.classList.contains("resize-handle")) return;
            toggleEditorNote(drum.id, s);
          });
          gridArea.appendChild(cell);
        }

        editingPattern.notes.filter(n => n.type === drum.id).forEach(note => {
          const drumBar = document.createElement("div");
          drumBar.className = `drum-bar ${drum.color} text-white text-[9px] font-bold`;
          drumBar.style.left = `${(note.step / 16) * 100}%`;
          drumBar.style.width = `${(note.duration / 16) * 100}%`;

          const handle = document.createElement("div");
          handle.className = "resize-handle";
          setupEditorResizeHandler(handle, note);

          drumBar.appendChild(handle);
          drumBar.addEventListener("click", (e) => {
            e.stopPropagation();
            removeEditorNote(drum.id, note.step);
          });

          gridArea.appendChild(drumBar);
        });

        row.appendChild(gridArea);
        container.appendChild(row);
      });
    }

    function toggleEditorNote(drumId, step) {
      const existingIdx = editingPattern.notes.findIndex(n => n.type === drumId && n.step === step);
      if (existingIdx >= 0) {
        editingPattern.notes.splice(existingIdx, 1);
      } else {
        playDrumSound(drumId);
        const nextNotes = editingPattern.notes.filter(n => n.type === drumId && n.step > step);
        let maxDuration = 2;
        if (nextNotes.length > 0) {
          const nextStep = Math.min(...nextNotes.map(n => n.step));
          maxDuration = Math.min(2, nextStep - step);
        }
        maxDuration = Math.min(maxDuration, 16 - step);
        if (maxDuration > 0) {
          editingPattern.notes.push({ type: drumId, step: step, duration: maxDuration });
        }
      }
      renderEditorGrid();
      if (editorMode === "score") renderDrumScore();
    }

    function removeEditorNote(drumId, step) {
      editingPattern.notes = editingPattern.notes.filter(n => !(n.type === drumId && n.step === step));
      renderEditorGrid();
      if (editorMode === "score") renderDrumScore();
    }

    function setupEditorResizeHandler(handleEl, noteObj) {
      let startX = 0;
      let initialDuration = noteObj.duration;

      const onPointerDown = (e) => {
        e.stopPropagation();
        startX = e.clientX || e.touches[0].clientX;
        initialDuration = noteObj.duration;
        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
      };

      const onPointerMove = (e) => {
        const currentX = e.clientX || (e.touches && e.touches[0].clientX);
        if (!currentX) return;

        const gridWidth = document.getElementById("editor-drum-grid").clientWidth - 64;
        const stepWidth = gridWidth / 16;
        const deltaX = currentX - startX;
        const deltaSteps = Math.round(deltaX / stepWidth);

        let newDuration = Math.max(1, Math.min(16 - noteObj.step, initialDuration + deltaSteps));
        const sameTrackNotes = editingPattern.notes.filter(n => n.type === noteObj.type && n.step > noteObj.step);

        if (sameTrackNotes.length > 0) {
          const nextStep = Math.min(...sameTrackNotes.map(n => n.step));
          newDuration = Math.min(newDuration, nextStep - noteObj.step);
        }

        noteObj.duration = newDuration;
        renderEditorGrid();
        if (editorMode === "score") renderDrumScore();
      };

      const onPointerUp = () => {
        document.removeEventListener("pointermove", onPointerMove);
        document.removeEventListener("pointerup", onPointerUp);
      };

      handleEl.addEventListener("pointerdown", onPointerDown);
    }

    // DRAW DRUM SCORE
    function renderDrumScore(highlightStep = -1) {
      const canvas = document.getElementById("drum-score-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1.5;
      const startY = 60;
      const lineGap = 14;

      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(40, startY + i * lineGap);
        ctx.lineTo(560, startY + i * lineGap);
        ctx.stroke();
      }

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, startY);
      ctx.lineTo(40, startY + 4 * lineGap);
      ctx.moveTo(560, startY);
      ctx.lineTo(560, startY + 4 * lineGap);
      ctx.stroke();

      for (let s = 0; s < 16; s++) {
        const x = 60 + (s / 16) * 480;
        ctx.strokeStyle = s % 4 === 0 ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, startY - 10);
        ctx.lineTo(x, startY + 4 * lineGap + 10);
        ctx.stroke();
      }

      if (highlightStep >= 0) {
        const hx = 60 + (highlightStep / 16) * 480;
        ctx.strokeStyle = "#f43f5e";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(hx, startY - 15);
        ctx.lineTo(hx, startY + 4 * lineGap + 15);
        ctx.stroke();
      }

      editingPattern.notes.forEach(n => {
        const drumDef = DRUMS.find(d => d.id === n.type);
        if (!drumDef) return;

        const x = 60 + (n.step / 16) * 480;
        const y = startY + drumDef.notePos * (lineGap / 2);

        ctx.fillStyle = highlightStep === n.step ? "#38bdf8" : "#f8fafc";
        ctx.strokeStyle = ctx.fillStyle;

        if (n.type.includes("hihat") || n.type === "crash" || n.type === "ride") {
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y + 5);
          ctx.moveTo(x + 5, y - 5); ctx.lineTo(x - 5, y + 5);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.ellipse(x, y, 6, 4.5, -Math.PI / 6, 0, 2 * Math.PI);
          ctx.fill();
        }

        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 5, y);
        ctx.lineTo(x + 5, y - 25);
        ctx.stroke();
      });
    }

    // EDITOR LOOP PREVIEW
    function startEditorPreview() {
      stopEditorPreview();
      const ctx = getAudioContext();
      editorIsPreviewing = true;
      editorStep = 0;

      document.getElementById("editor-playhead").classList.remove("hidden");

      const stepIntervalMs = ((60.0 / bpm) / 4) * 1000;

      const previewTick = () => {
        if (!editorIsPreviewing) return;

        const playhead = document.getElementById("editor-playhead");
        const stepWidthPct = 100 / 16;
        playhead.style.left = `calc(64px + ${(editorStep) * stepWidthPct}%)`;

        if (editorMode === "score") {
          renderDrumScore(editorStep);
        }

        editingPattern.notes.filter(n => n.step === editorStep).forEach(n => {
          playDrumSound(n.type);
        });

        editorStep = (editorStep + 1) % 16;
        editorTimerId = setTimeout(previewTick, stepIntervalMs);
      };

      previewTick();
    }

    function stopEditorPreview() {
      editorIsPreviewing = false;
      if (editorTimerId) clearTimeout(editorTimerId);
      document.getElementById("editor-playhead").classList.add("hidden");
      if (editorMode === "score") renderDrumScore(-1);
    }

    // INSTANT FILLIN TRIGGER LOGIC
    function triggerInstantFillin(fillin) {
      if (!isPlaying) {
        startPerformance();
      }

      fillin.notes.forEach(note => {
        const rel = note.relStep !== undefined ? note.relStep : note.step;
        const targetStep = (currentStep + rel) % 16;
        if (!fillinOverrideSteps[targetStep]) {
          fillinOverrideSteps[targetStep] = [];
        }
        fillinOverrideSteps[targetStep].push(note.type);
      });
    }

    // PERFORMANCE ENGINE
    function startPerformance() {
      stopPerformance();
      const ctx = getAudioContext();

      isPlaying = true;
      currentStep = 0;

      if (bgmBuffer) {
        bgmSourceNode = ctx.createBufferSource();
        bgmSourceNode.buffer = bgmBuffer;

        bgmGainNode = ctx.createGain();
        const volSlider = document.getElementById("bgm-volume");
        bgmGainNode.gain.value = parseFloat(volSlider.value);

        bgmSourceNode.connect(bgmGainNode);
        bgmGainNode.connect(ctx.destination);
        bgmSourceNode.start(0);
      }

      const stepIntervalMs = ((60.0 / bpm) / 4) * 1000;

      const tick = () => {
        if (!isPlaying) return;

        const beatIdx = Math.floor(currentStep / 4);
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById(`dot-${i}`);
          if (dot) {
            dot.className = `w-2.5 h-2.5 rounded-full ${i === beatIdx ? 'bg-rose-500 shadow-lg shadow-rose-500/50' : 'bg-slate-800 border border-slate-700'}`;
          }
        }

        if (fillinOverrideSteps[currentStep] && fillinOverrideSteps[currentStep].length > 0) {
          fillinOverrideSteps[currentStep].forEach(drumType => {
            playDrumSound(drumType);
          });
          delete fillinOverrideSteps[currentStep];
        } else {
          const currentPattern = basicPatterns[currentPatternIndex];
          if (currentPattern) {
            currentPattern.notes.filter(n => (n.step !== undefined ? n.step : n.relStep) === currentStep).forEach(n => {
              playDrumSound(n.type);
            });
          }
        }

        currentStep++;
        if (currentStep >= 16) {
          currentStep = 0;

          if (queuedPatternIndex !== null) {
            currentPatternIndex = queuedPatternIndex;
            queuedPatternIndex = null;
            updatePatternUI();
          }
        }

        timerId = setTimeout(tick, stepIntervalMs);
      };

      tick();
    }

    function stopPerformance() {
      isPlaying = false;
      if (timerId) clearTimeout(timerId);
      if (bgmSourceNode) {
        try { bgmSourceNode.stop(); } catch(e){}
      }
      fillinOverrideSteps = {};
      currentStep = 0;
      updatePatternUI();
    }

    // DRUM SYNTHESIZER
    function playDrumSound(drumType) {
      const ctx = getAudioContext();
      const time = ctx.currentTime;

      if (drumType === "kick") {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(30, time + 0.12);

        gain.gain.setValueAtTime(1.2, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

        osc.start(time);
        osc.stop(time + 0.15);
      } 
      else if (drumType === "snare") {
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(180, time);
        oscGain.gain.setValueAtTime(0.5, time);
        oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + 0.1);

        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = "highpass";
        noiseFilter.frequency.value = 1000;

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.8, time);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        noise.start(time);
      } 
      else if (drumType.includes("hihat") || drumType === "crash" || drumType === "ride") {
        const bufferSize = ctx.sampleRate * (drumType === "crash" ? 0.8 : (drumType === "hihat_open" ? 0.3 : 0.08));
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = drumType === "crash" ? 3000 : 7000;

        const gain = ctx.createGain();
        const vol = drumType === "crash" ? 0.6 : 0.4;
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + (bufferSize / ctx.sampleRate));

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(time);
      } 
      else if (drumType.includes("tom")) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        let freq = 120;
        if (drumType === "high_tom") freq = 220;
        if (drumType === "low_tom") freq = 150;
        if (drumType === "floor_tom") freq = 90;

        osc.frequency.setValueAtTime(freq, time);
        osc.frequency.exponentialRampToValueAtTime(30, time + 0.2);

        gain.gain.setValueAtTime(0.9, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + 0.2);
      }
    }
