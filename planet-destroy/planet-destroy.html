<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>リアル3D惑星破壊シミュレーター (Planetary Destroyer 3D)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #020208;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        body {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .weapon-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .weapon-btn:active {
            transform: scale(0.92);
        }
        .weapon-btn.active {
            box-shadow: 0 0 22px currentColor;
            transform: translateY(-2px) scale(1.06);
            border-color: currentColor;
            background-color: rgba(255, 255, 255, 0.16);
        }

        /* Floating Damage Text */
        .damage-number {
            position: absolute;
            pointer-events: none;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 2px 4px #000;
            animation: floatUp 0.85s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            z-index: 50;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6);
            }
            25% {
                transform: translate(-50%, -75%) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150%) scale(0.95);
            }
        }

        /* Annihilation Banner */
        @keyframes bannerPop {
            0% { transform: scale(0.4); opacity: 0; }
            50% { transform: scale(1.04); opacity: 1; }
            70% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(0.96); opacity: 0; }
        }
        .annihilation-banner {
            animation: bannerPop 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            width: min(42rem, calc(100vw - 2rem));
            max-height: calc(100dvh - 2rem);
            overflow-y: auto;
        }

        .annihilation-banner h2 {
            overflow-wrap: anywhere;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #webgl-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        #webgl-container canvas {
            width: 100%;
            height: 100%;
            pointer-events: auto;
            cursor: crosshair;
        }

        @media (max-height: 520px) and (max-width: 900px) {
            header {
                padding-top: 0.25rem !important;
                gap: 0.35rem !important;
            }

            footer {
                padding-bottom: 0.25rem !important;
            }
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between relative select-none">

    <!-- 3D WebGL Canvas Container -->
    <div id="webgl-container" class="absolute inset-0 z-0 w-full h-full"></div>

    <!-- Floating Damage Numbers Container -->
    <div id="damage-container" class="absolute inset-0 z-20 pointer-events-none overflow-hidden"></div>

    <!-- Annihilation Victory Banner Overlay -->
    <div id="annihilation-overlay" class="absolute inset-0 z-40 pointer-events-none flex items-center justify-center hidden">
        <div class="annihilation-banner text-center p-4 sm:p-6 bg-slate-950/85 border-2 border-rose-500 rounded-3xl shadow-[0_0_80px_rgba(244,63,94,0.6)] backdrop-blur-xl">
            <div class="text-xs font-mono font-bold tracking-widest text-rose-400 uppercase flex items-center justify-center gap-2 mb-1">
                <i class="fa-solid fa-skull-crossbones text-xl animate-pulse"></i> TARGET ANNIHILATED
            </div>
            <h2 class="text-2xl sm:text-5xl font-black text-white tracking-wider drop-shadow-[0_0_25px_rgba(255,255,255,0.8)]">
                惑星完全破壊達成！
            </h2>
            <p class="text-xs sm:text-sm text-cyan-300 font-mono mt-2" id="annihilation-stats">次世代惑星を生成中...</p>
        </div>
    </div>

    <!-- HUD ヘッダー -->
    <header class="relative z-30 w-full max-w-5xl mx-auto px-3 pt-2.5 sm:pt-3 flex flex-wrap items-center justify-between gap-2.5 pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-2.5 bg-slate-900/85 p-2 sm:p-2.5 rounded-2xl border border-slate-700/80 backdrop-blur-md shadow-2xl">
            <div class="w-8 h-8 rounded-xl bg-cyan-500/20 border border-cyan-400/50 flex items-center justify-center">
                <i class="fa-solid fa-earth-americas text-cyan-400 text-lg animate-spin" style="animation-duration: 20s;"></i>
            </div>
            <div>

    <!-- コントロールバー（天体切替・音響・自動） -->

        <!-- 惑星切替タブ -->

        <!-- 音響 ＆ 自動爆撃トグル -->

            </button>
            <button id="auto-btn" onclick="toggleAutoAttack()" class="px-3 py-1.5 bg-slate-900/85 border border-slate-700/80 rounded-xl flex items-center gap-1.5 text-slate-300 backdrop-blur-md hover:bg-slate-800 font-semibold text-[11px] cursor-pointer shadow-lg transition">

    <!-- インタラクティブ空間ヒント -->
    <main class="flex-1 min-h-0 w-full relative z-10 flex items-center justify-center pointer-events-none" id="interactive-area">
        <div id="tap-hint" class="absolute top-2 left-1/2 -translate-x-1/2 max-w-[calc(100%-1rem)] text-center text-slate-400/60 font-mono text-[11px] tracking-wider bg-slate-950/40 px-3 py-1 rounded-full border border-slate-800/40 backdrop-blur-sm transition-opacity duration-500 flex items-center gap-1.5">
            <i class="fa-solid fa-fingerprint text-cyan-400 animate-pulse"></i> 惑星をクリック/タップして攻撃
        </div>
    </main>

    <!-- 兵器ツールバー (全5大兵器完全網羅) -->
    <footer class="relative z-30 w-full max-w-2xl mx-auto px-3 pb-3 sm:pb-5 pt-1">
        <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-1.5 sm:p-2 backdrop-blur-xl shadow-2xl flex items-center justify-around gap-1 sm:gap-2">
            <!-- 1. 誘導核ミサイル -->
            <button onclick="selectWeapon('nuke')" id="w-nuke" class="weapon-btn active flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 text-rose-500 border border-transparent cursor-pointer" data-weapon="nuke">
                <i class="fa-solid fa-radiation text-base sm:text-xl"></i>
                <span class="text-[10px] sm:text-[11px] font-bold">核ミサイル</span>
            </button>
            <!-- 2. 軌道レーザー -->
            <button onclick="selectWeapon('laser')" id="w-laser" class="weapon-btn flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 text-cyan-400 border border-transparent cursor-pointer" data-weapon="laser">
                <i class="fa-solid fa-bolt-lightning text-base sm:text-xl"></i>

            </button>
            <!-- 3. 神の杖 -->
            <button onclick="selectWeapon('rod')" id="w-rod" class="weapon-btn flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 text-amber-400 border border-transparent cursor-pointer" data-weapon="rod">
                <i class="fa-solid fa-arrows-down-to-line text-base sm:text-xl"></i>
                <span class="text-[10px] sm:text-[11px] font-bold">神の杖</span>
            </button>
            <!-- 4. 巨大メテオ -->
            <button onclick="selectWeapon('meteor')" id="w-meteor" class="weapon-btn flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 text-orange-400 border border-transparent cursor-pointer" data-weapon="meteor">
                <i class="fa-solid fa-meteor text-base sm:text-xl"></i>
                <span class="text-[10px] sm:text-[11px] font-bold">巨大メテオ</span>
            </button>
            <!-- 5. ブラックホール -->
            <button onclick="selectWeapon('singularity')" id="w-singularity" class="weapon-btn flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 text-purple-400 border border-transparent cursor-pointer" data-weapon="singularity">
                <i class="fa-solid fa-atom text-base sm:text-xl"></i>
                <span class="text-[10px] sm:text-[11px] font-bold">特異点</span>
            </button>

    <!-- Three.js Engine & Game Logic Script -->
    <script>
        /**
         * PLANETARY DESTROYER 3D (v5.0 Ultra-Juicy & Realistic Edition)
         */
        const PLANET_MAX_HP = {
            moon: 2800,
            mars: 4200,
            earth: 6500,
            saturn: 14000,
            sun: 30000
        };
        let currentPlanetType = 'earth';
        let currentWeapon = 'nuke';
        let maxPlanetHp = PLANET_MAX_HP[currentPlanetType];
        let planetHp = maxPlanetHp;
        let totalDamage = 0;
        let comboCount = 0;
        let comboTimer = null;
        let destroyedCount = 0;
        let isDestroyed = false;
        let isAutoAttack = false;
        let autoAttackInterval = null;
        const activePointers = new Map();
        let lastLaserShotAt = 0;
        let lastCanvasMouseDown = null;
        let userHasInteracted = false;

        // Camera Shake variables
        let shakeIntensity = 0;
        const cameraBasePos = new THREE.Vector3(0, 0, 18);

        // Web Audio API Context & Sound Synthesizer
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmOscs = [];

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type, pitchOffset = 0) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'hit' || type === 'laser') {
                    // Crisp zap / impact spark
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    const baseFreq = type === 'laser' ? 700 : 380;
                    osc.frequency.setValueAtTime(baseFreq + Math.min(600, pitchOffset * 25), now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'explosion') {
                    // Deep sub-bass boom
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(85 + Math.min(40, pitchOffset * 2), now);
                    osc.frequency.exponentialRampToValueAtTime(22, now + 0.6);
                    gain.gain.setValueAtTime(0.8, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.65);

                    // Filtered noise explosion burst
                    const bufSize = Math.floor(ctx.sampleRate * 0.4);
                    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.28));
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(850, now);
                    filter.frequency.linearRampToValueAtTime(150, now + 0.4);
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.65, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    noise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(ctx.destination);
                    noise.start(now);
                } else if (type === 'sonicboom') {
                    // Mach-speed tungsten sweep
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + 0.45);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'supernova') {
                    // Cataclysmic cosmic explosion
                    [45, 65, 120].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = idx === 0 ? 'sine' : 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                        osc.frequency.exponentialRampToValueAtTime(12, now + 1.8);
                        gain.gain.setValueAtTime(0.75, now + idx * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.05);
                        osc.stop(now + 1.8);
                    });
                }
            } catch (e) {
                // Audio safety
            }
        }

        function toggleBGM() {
            getAudioContext();
            const btn = document.getElementById('bgm-btn');
            const icon = document.getElementById('bgm-icon');
            if (isBgmPlaying) {
                bgmOscs.forEach(o => { try { o.stop(); } catch(e){} });
                bgmOscs = [];
                isBgmPlaying = false;
                btn.classList.remove('border-cyan-500', 'text-cyan-300');
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
            } else {
                startBGM();
                isBgmPlaying = true;
                btn.classList.add('border-cyan-500', 'text-cyan-300');
                icon.className = 'fa-solid fa-volume-high text-cyan-400';
            }
        }

        function startBGM() {
            const ctx = getAudioContext();
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            // Deep meditative space chord (C minor 9)
            [65.41, 98.00, 130.81, 155.56, 196.00, 293.66].forEach(freq => {
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                osc.start();
                bgmOscs.push(osc);
            });
            gain.connect(ctx.destination);
        }

        // --- Fast 2D Fractal Brownian Motion (fBm) Perlin Noise Generator ---
        const perm = new Uint8Array(512);
        const pTable = [
            151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,
            8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,
            35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,
            134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,
            55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,
            18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,
            250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,
            189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,
            172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,
            228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,
            107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,
            138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180
        ];
        for (let i = 0; i < 256; i++) perm[256 + i] = perm[i] = pTable[i];

        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y) {
            const h = hash & 7;
            const u = h < 4 ? x : y;
            const v = h < 4 ? y : x;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }
        function perlin2D(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const xf = x - Math.floor(x);
            const yf = y - Math.floor(y);
            const u = fade(xf);
            const v = fade(yf);
            const A = perm[X] + Y;
            const B = perm[X + 1] + Y;
            return lerp(v,
                lerp(u, grad(perm[A], xf, yf), grad(perm[B], xf - 1, yf)),
                lerp(u, grad(perm[A + 1], xf, yf - 1), grad(perm[B + 1], xf - 1, yf - 1))
            );
        }
        function fbm(x, y, octaves = 5) {
            let val = 0, amp = 0.5, freq = 1;
            for (let i = 0; i < octaves; i++) {
                val += perlin2D(x * freq, y * freq) * amp;
                freq *= 2.0;
                amp *= 0.5;
            }
            return val;
        }

        // --- Ultra-Realistic Procedural Texture Synthesizers ---
        const textureCache = {};

        // Natural Earth 1:110m land outlines, simplified for a compact standalone texture.
        const earthLandPolygons = [

        function getPlanetTexture(type) {
            if (textureCache[type]) return textureCache[type];

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(1024, 512);
            const data = imgData.data;

            if (type === 'earth') {
                const mask = document.createElement('canvas');
                mask.width = canvas.width;
                mask.height = canvas.height;
                const maskCtx = mask.getContext('2d');
                maskCtx.fillStyle = '#fff';
                earthLandPolygons.forEach(polygon => {
                    maskCtx.beginPath();
                    polygon.forEach(([lon, lat], index) => {
                        const x = ((lon + 180) / 360) * mask.width;
                        const y = ((90 - lat) / 180) * mask.height;
                        if (index === 0) maskCtx.moveTo(x, y);
                        else maskCtx.lineTo(x, y);
                    });
                    maskCtx.closePath();
                    maskCtx.fill();
                });
                const landMask = maskCtx.getImageData(0, 0, mask.width, mask.height).data;

                for (let y = 0; y < 512; y++) {
                    const lat = (y / 512) * 2 - 1; // -1 (North) to 1 (South)
                    const absLat = Math.abs(lat);
                    for (let x = 0; x < 1024; x++) {
                        const idx = (y * 1024 + x) * 4;
                        const n = fbm((x / 1024) * 10, (y / 512) * 5, 4);
                        const isLand = landMask[idx + 3] > 0;

                        if (absLat > 0.88 || (isLand && absLat > 0.78)) {
                            data[idx] = 235; data[idx + 1] = 245; data[idx + 2] = 255; data[idx + 3] = 255;
                        } else if (!isLand) {
                            const depth = Math.max(0, Math.min(1, (n + 0.4) * 0.7));
                            data[idx] = Math.round(lerp(depth, 3, 16));
                            data[idx + 1] = Math.round(lerp(depth, 18, 72));
                            data[idx + 2] = Math.round(lerp(depth, 55, 125));
                            data[idx + 3] = 255;
                        } else if (absLat < 0.42 && absLat > 0.15 && n < 0.18) {
                            data[idx] = 190; data[idx + 1] = 151; data[idx + 2] = 91; data[idx + 3] = 255;
                        } else if (n > 0.36) {
                            data[idx] = 166; data[idx + 1] = 157; data[idx + 2] = 139; data[idx + 3] = 255;
                        } else {
                            const green = Math.max(0, Math.min(1, 0.45 + n));
                            data[idx] = Math.round(lerp(green, 42, 92));
                            data[idx + 1] = Math.round(lerp(green, 83, 142));
                            data[idx + 2] = Math.round(lerp(green, 36, 68));
                            data[idx + 3] = 255;
                        }
                    }
                }
            } else if (type === 'moon') {
                for (let y = 0; y < 512; y++) {
                    for (let x = 0; x < 1024; x++) {
                        const nx = (x / 1024) * 5.0;
                        const ny = (y / 512) * 2.5;
                        const nLow = fbm(nx, ny, 3);
                        const nHigh = fbm(nx * 3, ny * 3, 5);
                        const idx = (y * 1024 + x) * 4;

                        // Dark basalt maria vs bright highlands
                        let base = nLow < -0.05 ? 65 + nHigh * 30 : 145 + nHigh * 50;
                        base = Math.max(25, Math.min(230, Math.round(base)));
                        data[idx] = base; data[idx + 1] = base; data[idx + 2] = Math.round(base * 1.02); data[idx + 3] = 255;
                    }
                }
            } else if (type === 'mars') {
                for (let y = 0; y < 512; y++) {
                    const absLat = Math.abs((y / 512) * 2 - 1);
                    for (let x = 0; x < 1024; x++) {
                        const nx = (x / 1024) * 4.0;
                        const ny = (y / 512) * 2.0;
                        const n = fbm(nx, ny, 5);
                        const idx = (y * 1024 + x) * 4;

                        // Polar Ice Caps (CO2 Frost)
                        if (absLat > 0.85) {
                            data[idx] = 245; data[idx + 1] = 245; data[idx + 2] = 255; data[idx + 3] = 255;
                            continue;
                        }

                        // Volcanic Basalt highlands vs Rust Ochre Plains
                        if (n < -0.08) {
                            data[idx] = 85; data[idx + 1] = 32; data[idx + 2] = 16;
                        } else {
                            data[idx] = Math.round(lerp(n, 165, 215));
                            data[idx + 1] = Math.round(lerp(n, 65, 95));
                            data[idx + 2] = Math.round(lerp(n, 20, 35));
                        }
                        data[idx + 3] = 255;
                    }
                }
            } else if (type === 'sun') {
                for (let y = 0; y < 512; y++) {
                    for (let x = 0; x < 1024; x++) {
                        const nx = (x / 1024) * 8.0;
                        const ny = (y / 512) * 4.0;
                        const n = fbm(nx, ny, 5);
                        const idx = (y * 1024 + x) * 4;

                        // Plasma Granules: White-Hot Centers to Fiery Orange Edges
                        const t = Math.max(0, Math.min(1, (n + 0.3) * 1.4));
                        data[idx] = 255;
                        data[idx + 1] = Math.round(lerp(t, 60, 240));
                        data[idx + 2] = Math.round(lerp(t, 0, 160));
                        data[idx + 3] = 255;
                    }
                }
            } else if (type === 'saturn') {
                for (let y = 0; y < 512; y++) {
                    const ny = (y / 512) * 18.0;
                    const band = Math.sin(ny) * 0.5 + Math.sin(ny * 2.8) * 0.3 + fbm(0, ny * 0.5, 3) * 0.2;
                    for (let x = 0; x < 1024; x++) {
                        const idx = (y * 1024 + x) * 4;
                        // Pastel Cream, Amber, Caramel Bands
                        data[idx] = Math.round(205 + band * 35);
                        data[idx + 1] = Math.round(180 + band * 30);
                        data[idx + 2] = Math.round(145 + band * 25);
                        data[idx + 3] = 255;
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            textureCache[type] = tex;
            return tex;
        }

        // Earth Clouds Texture
        function getEarthCloudsTexture() {
            if (textureCache['earth_clouds']) return textureCache['earth_clouds'];
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(1024, 512);
            const data = imgData.data;

            for (let y = 0; y < 512; y++) {
                const lat = (y / 512) * 2 - 1;
                for (let x = 0; x < 1024; x++) {
                    const nx = (x / 1024) * 6.0;
                    const ny = (y / 512) * 3.0;
                    const n = fbm(nx, ny, 5);
                    const idx = (y * 1024 + x) * 4;

                    // Swirling cloud belts
                    const alpha = n > 0.08 ? Math.min(240, Math.round((n - 0.08) * 450)) : 0;
                    data[idx] = 255;
                    data[idx + 1] = 255;
                    data[idx + 2] = 255;
                    data[idx + 3] = alpha;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            textureCache['earth_clouds'] = tex;
            return tex;
        }

            grad.addColorStop(1.0, 'rgba(150, 130, 100, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 64);
            const tex = new THREE.CanvasTexture(canvas);

        function fitCameraToPlanet(type) {
            const aspect = window.innerWidth / window.innerHeight;
            const interactiveArea = document.getElementById('interactive-area');
            const areaRect = interactiveArea.getBoundingClientRect();
            const hintReserve = document.getElementById('tap-hint').offsetHeight + 12;
            const fitAreaTop = Math.min(areaRect.bottom, areaRect.top + hintReserve);
            const fitAreaHeight = Math.max(1, areaRect.bottom - fitAreaTop);
            const radius = type === 'saturn' ? 9.2 : type === 'sun' ? planetRadius + 0.65 : planetRadius + 0.38;
            const halfFovTangent = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const fitMargin = 0.88;
            const distanceForWidth = radius / (halfFovTangent * aspect * fitMargin);
            const areaHeightRatio = Math.max(0.2, fitAreaHeight / window.innerHeight);
            const distanceForHeight = radius / (halfFovTangent * areaHeightRatio * fitMargin);
            const distance = Math.max(18, distanceForWidth, distanceForHeight);
            const areaCenterY = fitAreaTop + fitAreaHeight / 2;
            const worldUnitsPerPixel = (2 * distance * halfFovTangent) / window.innerHeight;

            camera.aspect = aspect;
            cameraBasePos.z = distance;
            camera.position.copy(cameraBasePos);
            camera.lookAt(0, (areaCenterY - window.innerHeight / 2) * worldUnitsPerPixel, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Build Planet Mesh

            fitCameraToPlanet(type);

            // Clean up existing meshes
            while (planetGroup.children.length > 0) {
                const child = planetGroup.children[0];
                child.traverse(object => {
                    if (object.geometry) object.geometry.dispose();
                    if (object.material) {
                        if (Array.isArray(object.material)) object.material.forEach(material => material.dispose());
                        else object.material.dispose();
                    }
                });
                planetGroup.remove(child);
            }

            const tex = getPlanetTexture(type);
            // 128x128 Sphere Geometry (Safe, responsive, perfectly dense for deep crater indentation)
            const geo = new THREE.SphereGeometry(planetRadius, 128, 128);

            let mat;
            if (type === 'sun') {
                mat = new THREE.MeshBasicMaterial({ map: tex });
            } else if (type === 'earth') {
                mat = new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 0.45,
                    metalness: 0.1,
                    bumpMap: tex,
                    bumpScale: 0.12
                });
            } else {
                mat = new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 0.65,
                    metalness: 0.08,
                    bumpMap: tex,
                    bumpScale: 0.15
                });
            }

            planetMesh = new THREE.Mesh(geo, mat);
            planetGroup.add(planetMesh);

            // Earth Atmospheric Layers
            if (type === 'earth') {
                // Cloud Layer

                );

        // Safe & Non-NaN Crater Deformation
        function deformPlanetAt(worldHitPoint, radius = 1.5, depth = 1.1) {
            if (!planetMesh || isDestroyed) return;
            const geo = planetMesh.geometry;
            const pos = geo.attributes.position;
            const localHit = planetMesh.worldToLocal(worldHitPoint.clone());
            const rSq = radius * radius;
            const minRadius = planetRadius * 0.45; // Safe core clamp (mathematically prevents NaN!)

            let changed = false;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);
                const dx = vx - localHit.x;
                const dy = vy - localHit.y;
                const dz = vz - localHit.z;
                const dSq = dx * dx + dy * dy + dz * dz;

                if (dSq < rSq) {
                    const dist = Math.sqrt(dSq);
                    const factor = (1 - dist / radius) * depth;
                    const curR = Math.sqrt(vx * vx + vy * vy + vz * vz);
                    if (curR > 0.001) {
                        const newR = Math.max(minRadius, curR - factor);
                        const s = newR / curR;
                        pos.setXYZ(i, vx * s, vy * s, vz * s);
                        changed = true;
                    }
                }
            }

            if (changed) {
                pos.needsUpdate = true;
                geo.computeVertexNormals();
                geo.computeBoundingSphere();
            }

            // Stamp a dark impact mark into the deformed surface.
            const localNormal = localHit.clone().normalize();
            const scorch = new THREE.Mesh(
                new THREE.CircleGeometry(radius * 0.42, 24),
                new THREE.MeshBasicMaterial({
                    color: currentPlanetType === 'sun' ? 0x321500 : 0x35120d,
                    transparent: true,
                    opacity: 0.95,
                    side: THREE.DoubleSide
                })
            );
            scorch.position.copy(localNormal).multiplyScalar(Math.max(minRadius, planetRadius - depth * 0.48));
            scorch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), localNormal);
            planetMesh.add(scorch);

            // Decal auto-fades over time to prevent memory growth
            activeEffects.push({
                obj: scorch,
                type: 'scorch_fade',
                life: 1.0,
                decay: 0.008
            });
        }

            const rod = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.12, 6.0, 8),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.95, roughness: 0.05 })
            );
            const startPos = hitWorldPos.clone().add(normal.clone().multiplyScalar(22));
            rod.position.copy(startPos);
            rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
            scene.add(rod);

            activeEffects.push({
                obj: rod,
                type: 'rod',
                startPos: startPos,
                targetPos: hitWorldPos,
                progress: 0,
                speed: 0.22
            });
        }

        // 4. Giant Meteor Impact
        function fireMeteor(hitWorldPos) {
            playSound('hit', comboCount);

            const meteorGeo = new THREE.DodecahedronGeometry(0.95, 1);
            const meteorMat = new THREE.MeshStandardMaterial({ color: 0x5a2d18, roughness: 0.9 });
            const meteor = new THREE.Mesh(meteorGeo, meteorMat);

            const startPos = hitWorldPos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 16, 16, 10));
            meteor.position.copy(startPos);
            scene.add(meteor);

            activeEffects.push({
                obj: meteor,
                type: 'meteor',
                startPos: startPos,
                targetPos: hitWorldPos,
                progress: 0,
                speed: 0.09
            });
        }

        // 5. Singularity (Black Hole)
        function fireSingularity(hitWorldPos) {
            playSound('laser', 4);
            addCameraShake(0.25);

            const bh = new THREE.Mesh(
                new THREE.TorusGeometry(1.2, 0.35, 16, 32),
                new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true, blending: THREE.AdditiveBlending })
            );
            bh.position.copy(hitWorldPos);
            scene.add(bh);

            activeEffects.push({
                obj: bh,
                type: 'singularity',
                targetPos: hitWorldPos,
                life: 1.0,
                decay: 0.03
            });
        }

        // Shockwave Blast Dome & Expanding Ring
        function triggerBlastDome(pos, scale = 5.0, color = 0xff5500) {
            const dome = new THREE.Mesh(
                new THREE.SphereGeometry(0.6, 16, 16),
                new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })
            );
            dome.position.copy(pos);
            scene.add(dome);

            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.4, 0.7, 32),
                new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending })
            );
            ring.position.copy(pos);
            ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), pos.clone().normalize());
            scene.add(ring);

            activeEffects.push({ obj: dome, type: 'blast', maxScale: scale, life: 1.0, decay: 0.05 });
            activeEffects.push({ obj: ring, type: 'ring', maxScale: scale * 1.5, life: 1.0, decay: 0.05 });

            playSound('explosion', comboCount);
            addCameraShake(0.14);
        }

        // --- Attack Execution & Smart Hit Testing ---
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();

        function executeAttack(screenX, screenY) {
            if (isDestroyed || !planetMesh) return;

            // Hide tap hint on first attack
            if (!userHasInteracted) {
                userHasInteracted = true;
                const hint = document.getElementById('tap-hint');
                if (hint) hint.style.opacity = '0';
            }

            const rect = renderer.domElement.getBoundingClientRect();
            mouseVec.x = ((screenX - rect.left) / rect.width) * 2 - 1;
            mouseVec.y = -((screenY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);

            // 1. Raycast on planetMesh
            let hitPos = null;
            let normal = null;
            const meshHits = raycaster.intersectObject(planetMesh, false);

            if (meshHits.length > 0) {
                hitPos = meshHits[0].point.clone();
                normal = meshHits[0].face ? meshHits[0].face.normal.clone().applyQuaternion(planetMesh.quaternion) : hitPos.clone().normalize();
            } else {
                // Mathematical fallback keeps taps reliable even when the mesh ray misses.
                const center = planetGroup.getWorldPosition(new THREE.Vector3());
                const proxyHit = raycaster.ray.intersectSphere(
                    new THREE.Sphere(center, planetRadius * 1.08),
                    new THREE.Vector3()
                );
                if (proxyHit) {
                    hitPos = proxyHit.clone().sub(center).normalize().multiplyScalar(planetRadius).add(center);
                    normal = hitPos.clone().sub(center).normalize();
                }
            }

            if (hitPos) {
                if (currentWeapon === 'nuke') {
                    fireNuke(hitPos);
                } else if (currentWeapon === 'laser') {
                    fireLaser(hitPos, normal);
                } else if (currentWeapon === 'rod') {
                    fireRod(hitPos, normal);
                } else if (currentWeapon === 'meteor') {
                    fireMeteor(hitPos);
                } else if (currentWeapon === 'singularity') {
                    fireSingularity(hitPos);
                }

                if (navigator.vibrate) navigator.vibrate(18);
            }
        }

        // --- Damage & Combo Engine ---
        function applyDamage(baseAmount, worldHitPos) {
            if (isDestroyed) return;

            comboCount++;
            document.getElementById('combo-count').innerText = comboCount;
            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                comboCount = 0;
                document.getElementById('combo-count').innerText = '0';
            }, 1400);

            // Combo multiplier bonus
            const multiplier = 1 + Math.min(2.5, comboCount * 0.04);
            const isCrit = Math.random() < 0.2 || comboCount % 10 === 0;
            const finalDmg = Math.round(baseAmount * multiplier * (isCrit ? 1.75 : 1.0));

            planetHp = Math.max(0, planetHp - finalDmg);
            totalDamage += finalDmg;

            // Spawn floating damage text in screen space
            if (worldHitPos) {
                const screenPos = worldHitPos.clone().project(camera);
                const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                const sy = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;
                spawnFloatingDamage(sx, sy, finalDmg, isCrit);
            }

            updateHpUI();

            if (planetHp <= 0 && !isDestroyed) {
                triggerAnnihilation();
            }
        }

        function updateHpUI() {
            const pct = Math.max(0, (planetHp / maxPlanetHp) * 100);
            const hpBar = document.getElementById('hp-bar');
            hpBar.style.width = `${pct}%`;
            document.getElementById('hp-text').innerText = `${Math.ceil(planetHp)} / ${maxPlanetHp} (${Math.ceil(pct)}%)`;
            document.getElementById('damage-count').innerText = totalDamage.toLocaleString();
        }

        // --- Cataclysmic Annihilation (Supernova & Rebirth) ---
        function triggerAnnihilation() {
            isDestroyed = true;
            destroyedCount++;
            document.getElementById('destroyed-count').innerText = destroyedCount;

            // Completely hide central planet mesh
            planetGroup.visible = false;

            // Show dramatic Annihilation HUD Banner
            const banner = document.getElementById('annihilation-overlay');
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 2300);

            // Audio & Screen Quake
            playSound('supernova');
            addCameraShake(1.2);
            if (navigator.vibrate) navigator.vibrate([40, 60, 100]);

            // Shatter into 450+ 3D Debris Chunks hurtling into space
            const debrisCount = 450;
            const cols = [0xff3300, 0xffaa00, 0x00f3ff, 0xffffff, 0x4a5568];
            for (let i = 0; i < debrisCount; i++) {
                const size = 0.2 + Math.random() * 0.45;
                const part = new THREE.Mesh(
                    new THREE.BoxGeometry(size, size, size),
                    new THREE.MeshStandardMaterial({
                        color: cols[i % cols.length],
                        roughness: 0.5,
                        emissive: cols[i % cols.length],
                        emissiveIntensity: 0.35
                    })
                );
                part.position.copy(planetGroup.position);
                scene.add(part);

                const dir = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                ).normalize();

                activeEffects.push({
                    obj: part,
                    type: 'debris',
                    dir: dir,
                    speed: 0.15 + Math.random() * 0.6,
                    life: 1.0,
                    decay: 0.012
                });
            }

            // Expanding Supernova Energy Spheres
            triggerBlastDome(planetGroup.position, 18.0, 0xffffff);

            // Smooth Seamless Rebirth Loop after 2.0s
            setTimeout(() => {
                buildPlanet(currentPlanetType);
            }, 2000);
        }

        // --- Main Animation & Effects Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Gentle Planet Rotation
            if (planetGroup && !isDestroyed) {
                planetGroup.rotation.y += 0.003;
                if (cloudsMesh) cloudsMesh.rotation.y += 0.0042;
            }

            // Camera Shake Decay
            if (shakeIntensity > 0.001) {
                camera.position.x = cameraBasePos.x + (Math.random() - 0.5) * shakeIntensity * 1.5;
                camera.position.y = cameraBasePos.y + (Math.random() - 0.5) * shakeIntensity * 1.5;
                camera.position.z = cameraBasePos.z + (Math.random() - 0.5) * shakeIntensity * 0.5;
                shakeIntensity *= 0.91;
            } else {
                camera.position.copy(cameraBasePos);
            }

            // Update Active Effects
            for (let i = activeEffects.length - 1; i >= 0; i--) {
                const ef = activeEffects[i];
                ef.life -= (ef.decay || 0.05);

                if (ef.type === 'missile') {
                    ef.progress += ef.speed;
                    ef.obj.position.lerpVectors(ef.startPos, ef.targetPos, ef.progress);

                    if (ef.progress >= 1.0) {
                        triggerBlastDome(ef.targetPos, 6.0, 0xff5500);
                        deformPlanetAt(ef.targetPos, 1.8, 1.5);
                        applyDamage(350, ef.targetPos);

                        scene.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'rod') {
                    ef.progress += ef.speed;
                    ef.obj.position.lerpVectors(ef.startPos, ef.targetPos, ef.progress);

                    if (ef.progress >= 1.0) {
                        triggerBlastDome(ef.targetPos, 7.5, 0xffdd00);
                        deformPlanetAt(ef.targetPos, 2.0, 1.8);
                        applyDamage(420, ef.targetPos);

                        scene.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'meteor') {
                    ef.progress += ef.speed;
                    ef.obj.position.lerpVectors(ef.startPos, ef.targetPos, ef.progress);
                    ef.obj.rotation.x += 0.12;
                    ef.obj.rotation.y += 0.15;

                    if (ef.progress >= 1.0) {
                        triggerBlastDome(ef.targetPos, 8.5, 0xff3300);
                        deformPlanetAt(ef.targetPos, 2.4, 2.0);
                        applyDamage(500, ef.targetPos);

                        scene.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'singularity') {
                    ef.obj.rotation.z += 0.16;
                    ef.obj.scale.multiplyScalar(0.975);

                    if (ef.life <= 0) {
                        triggerBlastDome(ef.targetPos, 9.0, 0xa855f7);
                        deformPlanetAt(ef.targetPos, 2.5, 2.2);
                        applyDamage(650, ef.targetPos);

                        scene.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'blast' || ef.type === 'ring') {
                    const s = (1 - ef.life) * ef.maxScale;
                    ef.obj.scale.set(s, s, s);
                    if (ef.obj.material) ef.obj.material.opacity = ef.life;

                    if (ef.life <= 0) {
                        scene.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'fade') {
                    if (ef.obj.material) ef.obj.material.opacity = ef.life;
                    if (ef.life <= 0) {
                        scene.remove(ef.obj);
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'scorch_fade') {
                    if (ef.obj.material) ef.obj.material.opacity = ef.life;
                    if (ef.life <= 0) {
                        if (planetMesh) planetMesh.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                } else if (ef.type === 'debris') {
                    ef.obj.position.addScaledVector(ef.dir, ef.speed);
                    ef.obj.rotation.x += 0.1;
                    ef.obj.rotation.y += 0.1;
                    if (ef.obj.material) ef.obj.material.opacity = ef.life;

                    if (ef.life <= 0) {
                        scene.remove(ef.obj);
                        if (ef.obj.geometry) ef.obj.geometry.dispose();
                        activeEffects.splice(i, 1);
                    }
                }
            }

            // Continuous Laser Fire while any pointer is held on the canvas.
            const now = performance.now();
            if (currentWeapon === 'laser' && activePointers.size && now - lastLaserShotAt >= 120) {
                const pointer = activePointers.values().next().value;
                executeAttack(pointer.x, pointer.y);
                lastLaserShotAt = now;
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- Window Resize & Responsive Touch/Pointer Controls ---
        window.addEventListener('resize', () => {
            fitCameraToPlanet(currentPlanetType);
        });

        // Listen on the actual canvas so UI overlays cannot swallow gameplay input.
        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'mouse') e.preventDefault();
            renderer.domElement.setPointerCapture(e.pointerId);
            if (e.pointerType === 'mouse') {
                lastCanvasMouseDown = { x: e.clientX, y: e.clientY, time: performance.now() };
            }
            activePointers.set(e.pointerId, {
                x: e.clientX,
                y: e.clientY,
                lastX: e.clientX,
                lastY: e.clientY,
                lastAttackAt: performance.now()
            });
            executeAttack(e.clientX, e.clientY);
        }, { passive: false });

        // Native mouse fallback for browsers/environments that do not deliver pointer input to the canvas.
        window.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || (e.target instanceof Element && e.target.closest('button, header, footer, a, input'))) return;
            const now = performance.now();
            const samePointerDown = lastCanvasMouseDown
                && now - lastCanvasMouseDown.time < 250
                && Math.abs(e.clientX - lastCanvasMouseDown.x) < 2
                && Math.abs(e.clientY - lastCanvasMouseDown.y) < 2;
            if (samePointerDown) {
                lastCanvasMouseDown = null;
                return;
            }
            executeAttack(e.clientX, e.clientY);
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            const pointer = activePointers.get(e.pointerId);
            if (!pointer) return;
            pointer.x = e.clientX;
            pointer.y = e.clientY;
            const now = performance.now();
            const minDistance = currentWeapon === 'laser' ? 12 : 42;
            const dx = pointer.x - (pointer.lastX ?? pointer.x);
            const dy = pointer.y - (pointer.lastY ?? pointer.y);
            if (Math.hypot(dx, dy) >= minDistance && now - pointer.lastAttackAt >= 100) {
                executeAttack(pointer.x, pointer.y);
                pointer.lastAttackAt = now;
                pointer.lastX = pointer.x;
                pointer.lastY = pointer.y;
                if (currentWeapon === 'laser') lastLaserShotAt = now;
            }
        });

        const releasePointer = (e) => {
            activePointers.delete(e.pointerId);
            if (renderer.domElement.hasPointerCapture(e.pointerId)) {
                renderer.domElement.releasePointerCapture(e.pointerId);
            }
        };
        renderer.domElement.addEventListener('pointerup', releasePointer);
        renderer.domElement.addEventListener('pointercancel', releasePointer);
        renderer.domElement.addEventListener('lostpointercapture', (e) => activePointers.delete(e.pointerId));

        // UI Planet Switcher
        function switchPlanet(pType) {
            currentPlanetType = pType;
            document.querySelectorAll('.planet-btn').forEach(btn => {
                btn.className = 'planet-btn px-2.5 sm:px-3 py-1 rounded-xl hover:bg-slate-800 text-slate-300 font-semibold text-[11px] sm:text-xs whitespace-nowrap transition cursor-pointer';
            });
            const activeBtn = document.getElementById(`btn-${pType}`);
            if (activeBtn) {
                activeBtn.className = 'planet-btn px-2.5 sm:px-3 py-1 rounded-xl bg-cyan-600/40 text-cyan-200 border border-cyan-400/50 font-bold text-[11px] sm:text-xs whitespace-nowrap transition cursor-pointer';
            }
            buildPlanet(pType);
            playSound('hit');
        }

        // UI Weapon Switcher
        function selectWeapon(wType) {
            currentWeapon = wType;
            document.querySelectorAll('.weapon-btn').forEach(btn => {
                if (btn.dataset.weapon === wType) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            playSound('hit');
        }

        // UI Auto Bombardment Mode
        function toggleAutoAttack() {
            isAutoAttack = !isAutoAttack;
            const btn = document.getElementById('auto-btn');
            const icon = document.getElementById('auto-icon');
            if (isAutoAttack) {
                btn.classList.add('border-cyan-500', 'text-cyan-300');
                icon.className = 'fa-solid fa-crosshairs text-cyan-400 animate-spin';
                autoAttackInterval = setInterval(() => {
                    const rx = window.innerWidth / 2 + (Math.random() - 0.5) * (window.innerWidth * 0.4);
                    const ry = window.innerHeight / 2 + (Math.random() - 0.5) * (window.innerHeight * 0.4);
                    executeAttack(rx, ry);
                }, 180);
            } else {
                clearInterval(autoAttackInterval);
                btn.classList.remove('border-cyan-500', 'text-cyan-300');
                icon.className = 'fa-solid fa-crosshairs text-slate-400';
            }
        }
    </script>
</body>
