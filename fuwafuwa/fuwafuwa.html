<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ふわふわ褒められサロン - 癒しのキャラクターアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #e0f7fa 100%);
            min-height: 100vh;
            color: #4a4a4a;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Character Float Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        /* Bounce Animation when Praised */
        @keyframes happy-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-18px) scale(1.08, 0.92); }
            50% { transform: translateY(-8px) scale(0.95, 1.05); }
            75% { transform: translateY(-3px) scale(1.02, 0.98); }
        }

        /* Talking Animation */
        @keyframes talking-wiggle {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-6px) rotate(-3deg) scale(1.03, 0.97); }
            50% { transform: translateY(0px) rotate(0deg) scale(0.98, 1.02); }
            75% { transform: translateY(-6px) rotate(3deg) scale(1.03, 0.97); }
        }

        /* Blinking Eyes */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Sparkle float */
        @keyframes float-up {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-65px) scale(1.2); opacity: 0; }
        }

        .character-float { animation: float 4s ease-in-out infinite; }
        .character-bounce { animation: happy-bounce 0.6s ease-in-out; }
        .character-talking { animation: talking-wiggle 0.4s ease-in-out infinite !important; }
        .eye-blink { animation: blink 4.5s infinite; transform-origin: center; }
        .sparkle-particle {
            position: absolute;
            pointer-events: none;
            animation: float-up 1.2s ease-out forwards;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #fff0f5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #ffb6c1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-3 sm:p-5 relative">

    <header class="w-full max-w-md flex items-center justify-between py-1.5 px-1">
        <div class="inline-block bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-md border border-pink-200">
            <h1 class="text-sm sm:text-base font-extrabold text-pink-500 tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-cloud text-pink-300"></i> ふわふわ褒められサロン <i class="fa-solid fa-heart text-pink-400"></i>
            </h1>
        </div>

        <button onclick="openSettingsModal()" class="bg-white/90 hover:bg-white text-pink-500 p-2.5 rounded-full shadow-md border border-pink-200 transition active:scale-95 flex items-center justify-center gap-1.5 px-3 text-xs font-bold" title="設定">
            <i class="fa-solid fa-gear text-sm"></i>
            <span>設定</span>
        </button>
    </header>

    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-1 relative">
        
        <!-- Speech Bubble -->
        <div class="w-full mb-3 relative z-10">
            <div id="speechBubble" class="bg-white/95 backdrop-blur-md p-4 sm:p-5 rounded-3xl shadow-xl border-2 border-pink-200 text-center relative transition-all duration-300 transform scale-100">
                <p id="characterMessage" class="text-sm sm:text-base font-bold text-slate-700 leading-relaxed">
                    「今日もよくがんばってるねぇ〜！えら〜い！なにしてきたか教えてねぇ〜！」
                </p>
                <div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[12px] border-t-white"></div>
            </div>
        </div>

        <!-- Fluffy Character Graphic -->
        <div class="character-float relative cursor-pointer select-none my-1" id="characterContainer" title="タップしてね！">
            <div id="particleContainer" class="absolute inset-0 pointer-events-none z-20"></div>

            <div class="w-40 h-40 sm:w-48 sm:h-48 bg-gradient-to-br from-pink-100 to-amber-50 rounded-full shadow-inner flex items-center justify-center border-4 border-white relative overflow-hidden">
                <svg viewBox="0 0 200 200" class="w-36 h-36 sm:w-44 sm:h-44 drop-shadow-md">
                    <!-- Ears -->
                    <ellipse cx="65" cy="50" rx="18" ry="24" fill="#ffd1dc" transform="rotate(-15 65 50)" />
                    <ellipse cx="65" cy="50" rx="10" ry="15" fill="#ffb6c1" transform="rotate(-15 65 50)" />
                    <ellipse cx="135" cy="50" rx="18" ry="24" fill="#ffd1dc" transform="rotate(15 135 50)" />
                    <ellipse cx="135" cy="50" rx="10" ry="15" fill="#ffb6c1" transform="rotate(15 135 50)" />

                    <!-- Main Fluffy Body -->
                    <path d="M 40,110 C 30,60 170,60 160,110 C 170,165 30,165 40,110 Z" fill="#ffffff" stroke="#ffdeeb" stroke-width="3" />

                    <!-- Cheeks -->
                    <ellipse cx="58" cy="118" rx="12" ry="7" fill="#ff99b3" opacity="0.6" />
                    <ellipse cx="142" cy="118" rx="12" ry="7" fill="#ff99b3" opacity="0.6" />

                    <!-- Animated Eyes -->
                    <g class="eye-blink">
                        <circle cx="75" cy="105" r="7" fill="#334155" />
                        <circle cx="73" cy="103" r="2.5" fill="#ffffff" />
                        <circle cx="125" cy="105" r="7" fill="#334155" />
                        <circle cx="123" cy="103" r="2.5" fill="#ffffff" />
                    </g>

                    <!-- Cute Mouth -->
                    <path d="M 96,112 C 98,110 102,110 104,112 C 105,115 95,115 96,112 Z" fill="#f43f5e" />
                    <path d="M 93,118 Q 100,125 107,118" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />

                    <!-- Paws -->
                    <ellipse cx="68" cy="148" rx="10" ry="8" fill="#ffffff" stroke="#ffdeeb" stroke-width="2" />
                    <ellipse cx="132" cy="148" rx="10" ry="8" fill="#ffffff" stroke="#ffdeeb" stroke-width="2" />
                </svg>

                <div class="absolute top-3 left-5 text-pink-400 animate-ping text-xs">✨</div>
                <div class="absolute bottom-5 right-5 text-amber-300 animate-bounce text-sm">⭐</div>
            </div>
        </div>

    </main>

    <section class="w-full max-w-md bg-white/90 backdrop-blur-md p-3.5 sm:p-4 rounded-3xl shadow-xl border border-pink-200 flex flex-col gap-2.5">
        
        <!-- Header & Quick Praise Grid -->
        <div>
            <div class="flex items-center justify-between mb-2 px-1">
                <p class="text-xs font-bold text-pink-500 flex items-center gap-1">
                    <i class="fa-solid fa-sparkles text-amber-400"></i> ワンタップで報告する：
                </p>
                <button onclick="openSettingsModal('praise-tab')" class="text-[11px] text-pink-500 hover:text-pink-700 font-bold underline flex items-center gap-1">
                    <i class="fa-solid fa-pen-to-square"></i> 編集・追加・並び替え
                </button>
            </div>
            
            <!-- Quick Praise Buttons Grid (Supports 12+ items cleanly) -->
            <div id="quickButtonsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-[220px] overflow-y-auto p-1">
                <!-- Dynamically rendered -->
            </div>
        </div>

        <!-- Custom Text Input & Mic Control -->
        <div class="flex flex-col gap-2 pt-1 border-t border-pink-100">
            <div class="flex gap-2">
                <input type="text" id="userInput" placeholder="例：書類を出した、手洗いうがいした..." class="flex-1 bg-pink-50/50 border border-pink-200 rounded-2xl px-3.5 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 text-slate-700 placeholder-slate-400">
                <button onclick="submitCustomInput()" class="bg-pink-400 hover:bg-pink-500 text-white px-4 py-2 rounded-2xl font-bold text-xs sm:text-sm shadow-md transition active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            
            <button id="micButton" onclick="toggleSpeechRecognition()" class="w-full bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-2 px-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-xs sm:text-sm">
                <i class="fa-solid fa-microphone text-white"></i>
                <span id="micButtonText">音声でえらい報告をする（マイク）</span>
            </button>
        </div>

    </section>

    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-pink-200 overflow-hidden flex flex-col max-h-[92vh]">
            
            <!-- Modal Header with Voice Mute Toggle -->
            <div class="bg-gradient-to-r from-pink-100 to-amber-50 p-3.5 border-b border-pink-100 flex items-center justify-between">
                <h2 class="font-extrabold text-pink-600 text-sm sm:text-base flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> 設定・カスタマイズ
                </h2>
                
                <div class="flex items-center gap-2">
                    <!-- Relocated Voice Mute Button -->
                    <button id="toggleVoice" class="bg-pink-200 hover:bg-pink-300 text-pink-800 px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1">
                        <i class="fa-solid fa-volume-high"></i> 音声 ON
                    </button>
                    <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Tab Buttons -->
            <div class="flex border-b border-slate-100 bg-slate-50 text-[11px] sm:text-xs font-bold">
                <button id="tabVoiceBtn" onclick="switchTab('voice')" class="flex-1 py-2.5 border-b-2 border-pink-400 text-pink-600 bg-white">
                    <i class="fa-solid fa-microphone-lines"></i> 声の調整
                </button>
                <button id="tabPraiseBtn" onclick="switchTab('praise')" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-pink-500">
                    <i class="fa-solid fa-list-check"></i> 報告ボタン(12選)
                </button>
                <button id="tabTapBtn" onclick="switchTab('tap')" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-pink-500">
                    <i class="fa-solid fa-hand-pointer"></i> タッチした時
                </button>
            </div>

            <!-- Tab Content -->
            <div class="p-4 overflow-y-auto flex-1 space-y-4 text-xs sm:text-sm text-slate-700">
                
                <!-- TAB 1: Voice Adjustments -->
                <div id="voiceTabContent" class="space-y-4">
                    <div>
                        <label class="font-bold text-slate-700 block mb-1">音声の種類（ボイス）:</label>
                        <select id="voiceSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs focus:ring-2 focus:ring-pink-300 outline-none">
                            <option value="">自動選択（おすすめの可愛い高音ボイス）</option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between font-bold mb-1">
                            <span>声の高さ（ピッチ）:</span>
                            <span id="pitchVal" class="text-pink-500">1.6</span>
                        </div>
                        <input type="range" id="pitchInput" min="0.5" max="2.0" step="0.05" value="1.6" class="w-full accent-pink-400">
                    </div>

                    <div>
                        <div class="flex justify-between font-bold mb-1">
                            <span>話す速さ（スピード）:</span>
                            <span id="rateVal" class="text-pink-500">1.1</span>
                        </div>
                        <input type="range" id="rateInput" min="0.5" max="1.8" step="0.05" value="1.1" class="w-full accent-pink-400">
                    </div>

                    <div>
                        <div class="flex justify-between font-bold mb-1">
                            <span>音量:</span>
                            <span id="volumeVal" class="text-pink-500">1.0</span>
                        </div>
                        <input type="range" id="volumeInput" min="0.0" max="1.0" step="0.05" value="1.0" class="w-full accent-pink-400">
                    </div>

                    <button onclick="testSpeech()" class="w-full bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold py-2 rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> 試し聞き（サンプル音声を聞く）
                    </button>
                </div>

                <!-- TAB 2: Quick Action Items Management -->
                <div id="praiseTabContent" class="space-y-4 hidden">
                    
                    <!-- Form to Add/Edit Button -->
                    <div class="bg-pink-50/70 p-3 rounded-2xl border border-pink-100 space-y-2">
                        <div class="flex justify-between items-center">
                            <span id="formTitle" class="font-bold text-pink-600 block">＋ 新しい報告ボタンを追加</span>
                            <button id="cancelEditBtn" onclick="resetActionForm()" class="text-[11px] text-slate-400 hover:text-slate-600 hidden underline">編集をキャンセル</button>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <div class="col-span-2">
                                <label class="text-[10px] font-bold text-slate-500">ボタン表示名</label>
                                <input type="text" id="actionLabelInput" placeholder="例：散歩した、薬飲んだ" class="w-full border border-pink-200 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pink-300">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500">アイコン</label>
                                <input type="text" id="actionIconInput" placeholder="🌸" class="w-full border border-pink-200 rounded-xl px-2.5 py-1.5 text-xs text-center focus:outline-none focus:ring-2 focus:ring-pink-300">
                            </div>
                        </div>

                        <!-- Icon Preset Selector -->
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 block mb-1">アイコンのプリセット（タップで選択）:</span>
                            <div class="flex flex-wrap gap-1 text-sm bg-white p-1.5 rounded-xl border border-pink-100" id="iconPresetContainer">
                                <!-- Emojis dynamically rendered -->
                            </div>
                        </div>

                        <div>
                            <label class="text-[10px] font-bold text-slate-500">キャラの返し・褒め言葉（改行で複数設定）</label>
                            <textarea id="actionRepliesInput" placeholder="すご〜い！体を動かしてえら〜い！&#10;えら〜い！リフレッシュできたねぇ〜！" class="w-full border border-pink-200 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pink-300 h-16"></textarea>
                        </div>

                        <button id="saveActionButton" onclick="savePraiseItemFromForm()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-2 rounded-xl text-xs shadow transition">
                            追加・保存する
                        </button>
                    </div>

                    <!-- List & Reorder Management -->
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-slate-700">ボタン一覧（チェック表示・並び替え）:</span>
                            <span class="text-[10px] text-pink-500 font-bold" id="enabledCountLabel">12個表示中</span>
                        </div>
                        <p class="text-[10px] text-slate-400 mb-2">※チェックを入れたものがトップ画面に順に表示されます（12個以上も設定可能）。</p>
                        
                        <div id="praiseItemsList" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                            <!-- Action Items List rendered dynamically -->
                        </div>
                    </div>
                </div>

                <!-- TAB 3: Character Tap Responses Settings -->
                <div id="tapTabContent" class="space-y-4 hidden">
                    <div class="bg-pink-50/70 p-3 rounded-2xl border border-pink-100 space-y-2">
                        <span class="font-bold text-pink-600 block">＋ タッチ時の新しい反応を追加</span>
                        <input type="text" id="newTapResponseInput" placeholder="例：やさしくなでなでしてくれてありがとう〜！" class="w-full border border-pink-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pink-300">
                        <button onclick="addTapResponseItem()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-1.5 rounded-xl text-xs shadow transition">
                            追加する
                        </button>
                    </div>

                    <div>
                        <span class="font-bold text-slate-700 block mb-1">現在設定中のタッチ反応（ランダム再生）:</span>
                        <div id="tapResponsesList" class="space-y-2 max-h-52 overflow-y-auto pr-1">
                            <!-- Tap Responses rendered dynamically -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="bg-slate-50 p-3 border-t border-slate-100 flex justify-between items-center text-xs">
                <button onclick="resetDataToDefault()" class="text-slate-400 hover:text-rose-500 underline text-[11px]">
                    初期設定に戻す
                </button>
                <button onclick="saveAndCloseSettings()" class="bg-pink-400 hover:bg-pink-500 text-white font-bold px-5 py-2 rounded-xl shadow transition">
                    保存して閉じる
                </button>
            </div>

        </div>
    </div>

    <script>
        const iconPresets = ["🌸", "🧹", "📚", "🦷", "🛁", "🌟", "☕", "🍱", "💤", "🧸", "🍞", "🐱", "🏃‍♂️", "🎨", "💊", "💧", "☀️", "🚃", "💻", "❤️"];

        // Default Actions Data
        const defaultPraiseData = [
            { id: "1", label: "起きた", icon: "☀️", enabled: true, replies: ["お布団から起きられたの〜！？世界一えら〜い！素晴らしい朝のスタートだねぇ〜！", "朝だよ〜！目を覚まして起きただけで100点満点〜！はなまるをあげるねぇ〜！"] },
            { id: "2", label: "通勤・通学した", icon: "🚃", enabled: true, replies: ["お外に出て移動したの〜！？えらすぎる…！よく頑張って向かったねぇ〜満点！", "お外に出て目的地に向かうなんて本当にえら〜い！いってらっしゃ〜い！"] },
            { id: "3", label: "歯磨きした", icon: "🦷", enabled: true, replies: ["歯磨きしたの〜！？ピカピカでえら〜い！お口も気持ちもスッキリだねぇ〜！", "ゴシゴシ歯磨きできたの〜？自分の体を大切にしていてえら〜い天才！"] },
            { id: "4", label: "お風呂に入った", icon: "🛁", enabled: true, replies: ["お風呂に入ったの〜！？偉すぎる〜！温まってサッパリして最高だねぇ〜！", "お湯に浸かって体を洗ったの〜？自分をしっかりケアできて偉〜い天才！"] },
            { id: "5", label: "ごはん食べた", icon: "🍱", enabled: true, replies: ["えら〜い！ちゃんとご飯を食べて栄養補給できたねぇ〜！偉すぎる〜！", "美味しくご飯を食べられたの〜？もぐもぐできてとっても偉いねぇ〜！"] },
            { id: "6", label: "勉強・お仕事した", icon: "💻", enabled: true, replies: ["お仕事や勉強に集中したの〜！？頑張り屋さんで本当に偉すぎるよ〜！", "頭を使って一生懸命取り組んだんだねぇ〜！世界で一番偉〜い！なでなで〜！"] },
            { id: "7", label: "家事をした", icon: "🧹", enabled: true, replies: ["お掃除やお洗濯などの家事をしたの〜！？おうちを快適にしてえら〜い！", "家事をこなすなんて偉すぎる天才〜！自分とおうちを大切にして素晴らしいねぇ〜！"] },
            { id: "8", label: "お薬飲んだ", icon: "💊", enabled: true, replies: ["えら〜い！忘れずにお薬を飲めて偉すぎるよ〜！体を大切にしていて素晴らしいねぇ〜！"] },
            { id: "9", label: "水分補給した", icon: "💧", enabled: true, replies: ["ゴクゴクお水や飲み物を飲んだの〜！？こまめな水分補給ができてえら〜い！"] },
            { id: "10", label: "散歩・運動した", icon: "🏃‍♂️", enabled: true, replies: ["体を動かしたの〜！？すごすぎる〜！リフレッシュできて最高の行動力だねぇ〜！"] },
            { id: "11", label: "偉く息した", icon: "🌸", enabled: true, replies: ["今日も生きて息をしているだけで100点満点〜！本当に偉いよ〜大好き〜！"] },
            { id: "12", label: "今日も生き延びた", icon: "❤️", enabled: true, replies: ["今日一日を最後まで生き延びた〜！それだけで大優勝！本当に頑張ったねぇ〜！", "大変な一日を生き抜いたあなたに金メダル〜！本当にお疲れ様〜偉いよ〜！"] }
        ];

        // Default Character Tap Phrases
        const defaultTapResponses = [
            "やさしくタッチしてくれてありがとう〜！なでなで〜！",
            "ふふっ、なぁに〜？あなたにタッチしてもらえてとっても嬉しいよ〜！",
            "今日もいてくれるだけで本当に偉いねぇ〜！いつも応援してるよ〜！",
            "ぎゅ〜っ！今日もいっぱいがんばってて偉すぎるよ〜！",
            "タッチしてくれてエネルギー満タン〜！今日も大優勝だよ〜！"
        ];

        const generalReplies = [
            "そんなことまでできたの〜！？すごすぎるよ〜とっても偉〜い！",
            "よく頑張ったねぇ〜！あなたのその努力、ちゃんと届いてるよ〜！",
            "偉い偉〜い！今日も本当に素晴らしい一日を重ねてるねぇ〜！",
            "すごすぎるよ〜！頑張ったあなたの頭をなでなでしちゃう〜！"
        ];

        // Application State
        let praiseData = [];
        let tapResponses = [];
        let voiceSettings = { pitch: 1.6, rate: 1.1, volume: 1.0, voiceURI: "" };
        let voiceEnabled = true;
        let editingActionId = null;

        // Load persisted settings
        function loadSettings() {
            const savedData = localStorage.getItem('praiseApp_praiseData_v2');
            if (savedData) {
                try { praiseData = JSON.parse(savedData); } catch(e) { praiseData = [...defaultPraiseData]; }
            } else {
                praiseData = JSON.parse(JSON.stringify(defaultPraiseData));
            }

            const savedTap = localStorage.getItem('praiseApp_tapResponses');
            if (savedTap) {
                try { tapResponses = JSON.parse(savedTap); } catch(e) { tapResponses = [...defaultTapResponses]; }
            } else {
                tapResponses = [...defaultTapResponses];
            }

            const savedVoice = localStorage.getItem('praiseApp_voiceSettings');
            if (savedVoice) {
                try { voiceSettings = JSON.parse(savedVoice); } catch(e) {}
            }

            // Sync voice control UI
            document.getElementById('pitchInput').value = voiceSettings.pitch;
            document.getElementById('pitchVal').innerText = voiceSettings.pitch;
            document.getElementById('rateInput').value = voiceSettings.rate;
            document.getElementById('rateVal').innerText = voiceSettings.rate;
            document.getElementById('volumeInput').value = voiceSettings.volume;
            document.getElementById('volumeVal').innerText = voiceSettings.volume;

            renderPresetIcons();
            renderQuickButtons();
        }

        function saveSettings() {
            localStorage.setItem('praiseApp_praiseData_v2', JSON.stringify(praiseData));
            localStorage.setItem('praiseApp_tapResponses', JSON.stringify(tapResponses));
            localStorage.setItem('praiseApp_voiceSettings', JSON.stringify(voiceSettings));
        }

        // Voice Synthesis Helper
        function populateVoiceList() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            const select = document.getElementById('voiceSelect');
            select.innerHTML = '<option value="">自動選択（おすすめの可愛い高音ボイス）</option>';

            const jpVoices = voices.filter(v => v.lang.includes('ja'));
            jpVoices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.voiceURI;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.voiceURI === voiceSettings.voiceURI) option.selected = true;
                select.appendChild(option);
            });
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function speakText(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.pitch = parseFloat(voiceSettings.pitch);
            utterance.rate = parseFloat(voiceSettings.rate);
            utterance.volume = parseFloat(voiceSettings.volume);

            const voices = window.speechSynthesis.getVoices();
            if (voiceSettings.voiceURI) {
                const selectedVoice = voices.find(v => v.voiceURI === voiceSettings.voiceURI);
                if (selectedVoice) utterance.voice = selectedVoice;
            } else {
                const bestVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Kyoko') || v.name.includes('Sayaka') || v.name.includes('Google') || v.name.includes('Natural'))) || voices.find(v => v.lang.includes('ja'));
                if (bestVoice) utterance.voice = bestVoice;
            }

            utterance.onstart = () => document.getElementById('characterContainer').classList.add('character-talking');
            utterance.onend = utterance.onerror = () => document.getElementById('characterContainer').classList.remove('character-talking');

            window.speechSynthesis.speak(utterance);
        }

        // Display and speak message
        function displayAndSpeakMessage(msg) {
            const msgEl = document.getElementById('characterMessage');
            const bubbleEl = document.getElementById('speechBubble');
            
            bubbleEl.classList.remove('scale-100');
            bubbleEl.classList.add('scale-95', 'opacity-80');

            setTimeout(() => {
                msgEl.innerText = msg;
                bubbleEl.classList.remove('scale-95', 'opacity-80');
                bubbleEl.classList.add('scale-100');
            }, 120);

            speakText(msg);
        }

        function triggerHappyEffects() {
            const container = document.getElementById('characterContainer');
            container.classList.remove('character-bounce');
            void container.offsetWidth;
            container.classList.add('character-bounce');

            const particleContainer = document.getElementById('particleContainer');
            const symbols = ['✨', '💖', '🌸', '⭐', '💮', '🎉'];
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'sparkle-particle text-sm sm:text-base';
                particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                particle.style.left = `${15 + Math.random() * 70}%`;
                particle.style.top = `${30 + Math.random() * 40}%`;
                particleContainer.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function triggerPraise(actionId) {
            const item = praiseData.find(d => d.id === actionId);
            const replies = item && item.replies.length > 0 ? item.replies : generalReplies;
            const randomMsg = replies[Math.floor(Math.random() * replies.length)];
            displayAndSpeakMessage(randomMsg);
            triggerHappyEffects();
        }

        function submitCustomInput() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (!val) return;

            let matchedItem = praiseData.find(item => item.enabled && (val.includes(item.label) || item.label.includes(val)));
            let replies = matchedItem && matchedItem.replies.length > 0 ? matchedItem.replies : generalReplies;
            const randomMsg = replies[Math.floor(Math.random() * replies.length)];

            displayAndSpeakMessage(`「${val}」できたの〜！？${randomMsg}`);
            triggerHappyEffects();
            input.value = "";
        }

        // Tap character logic
        document.getElementById('characterContainer').addEventListener('click', () => {
            const replies = tapResponses.length > 0 ? tapResponses : defaultTapResponses;
            const randomMsg = replies[Math.floor(Math.random() * replies.length)];
            displayAndSpeakMessage(randomMsg);
            triggerHappyEffects();
        });

        function renderQuickButtons() {
            const grid = document.getElementById('quickButtonsGrid');
            grid.innerHTML = "";

            const enabledItems = praiseData.filter(item => item.enabled !== false);

            if (enabledItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-xs text-slate-400 py-4">表示できるボタンがありません。「編集」からボタンを選択してね！</div>`;
                return;
            }

            enabledItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `quick-btn bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 py-2 px-2.5 rounded-2xl text-xs font-bold transition shadow-sm active:scale-95 flex items-center justify-start gap-1.5 truncate`;
                btn.onclick = () => triggerPraise(item.id);
                btn.innerHTML = `<span class="text-sm">${item.icon || '🌸'}</span> <span class="truncate">${item.label}</span>`;
                grid.appendChild(btn);
            });
        }

        function renderPresetIcons() {
            const container = document.getElementById('iconPresetContainer');
            container.innerHTML = "";
            iconPresets.forEach(icon => {
                const span = document.createElement('span');
                span.className = "cursor-pointer hover:bg-pink-100 p-1 rounded transition text-center";
                span.innerText = icon;
                span.onclick = () => {
                    document.getElementById('actionIconInput').value = icon;
                };
                container.appendChild(span);
            });
        }

        function renderPraiseItemsList() {
            const listContainer = document.getElementById('praiseItemsList');
            listContainer.innerHTML = "";

            const enabledCount = praiseData.filter(i => i.enabled !== false).length;
            document.getElementById('enabledCountLabel').innerText = `${enabledCount}個 表示中`;

            praiseData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `p-2 rounded-xl border flex flex-col gap-1 text-xs transition ${item.enabled !== false ? 'bg-white border-pink-200 shadow-sm' : 'bg-slate-100 border-slate-200 opacity-60'}`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-1">
                        <div class="flex items-center gap-2 flex-1 truncate">
                            <input type="checkbox" ${item.enabled !== false ? 'checked' : ''} onchange="toggleActionEnabled(${index})" class="accent-pink-500 w-4 h-4 rounded cursor-pointer">
                            <span class="font-bold text-slate-700 text-sm">${item.icon || '🌸'}</span>
                            <span class="font-bold text-slate-800 truncate">${item.label}</span>
                        </div>
                        
                        <div class="flex items-center gap-1">
                            <button onclick="moveActionOrder(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30"' : 'class="hover:text-pink-600"'} title="上へ">
                                <i class="fa-solid fa-arrow-up text-slate-500"></i>
                            </button>
                            <button onclick="moveActionOrder(${index}, 1)" ${index === praiseData.length - 1 ? 'disabled class="opacity-30"' : 'class="hover:text-pink-600"'} title="下へ">
                                <i class="fa-solid fa-arrow-down text-slate-500"></i>
                            </button>
                            <button onclick="editActionItem(${index})" class="text-pink-500 hover:text-pink-700 font-bold px-1" title="編集">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="removePraiseItem(${index})" class="text-rose-400 hover:text-rose-600 p-1" title="削除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="text-[10px] text-slate-500 bg-slate-50 p-1.5 rounded-lg border border-slate-100 truncate">
                        ${item.replies.join(' / ')}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function renderTapResponsesList() {
            const container = document.getElementById('tapResponsesList');
            container.innerHTML = "";

            tapResponses.forEach((resp, index) => {
                const item = document.createElement('div');
                item.className = "bg-white border border-pink-100 p-2 rounded-xl flex items-center justify-between gap-2 text-xs shadow-sm";
                item.innerHTML = `
                    <span class="flex-1 text-slate-700">${resp}</span>
                    <button onclick="removeTapResponse(${index})" class="text-rose-400 hover:text-rose-600 p-1">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(item);
            });
        }

        // Modal navigation & tab management
        function openSettingsModal(defaultTab = 'voice') {
            document.getElementById('settingsModal').classList.remove('hidden');
            populateVoiceList();
            renderPraiseItemsList();
            renderTapResponsesList();
            switchTab(defaultTab === 'praise-tab' ? 'praise' : defaultTab);
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
            resetActionForm();
        }

        function switchTab(tab) {
            const vBtn = document.getElementById('tabVoiceBtn');
            const pBtn = document.getElementById('tabPraiseBtn');
            const tBtn = document.getElementById('tabTapBtn');
            const vContent = document.getElementById('voiceTabContent');
            const pContent = document.getElementById('praiseTabContent');
            const tContent = document.getElementById('tapTabContent');

            const activeClass = "flex-1 py-2.5 border-b-2 border-pink-400 text-pink-600 bg-white font-bold";
            const inactiveClass = "flex-1 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-pink-500 font-bold";

            vBtn.className = tab === 'voice' ? activeClass : inactiveClass;
            pBtn.className = tab === 'praise' ? activeClass : inactiveClass;
            tBtn.className = tab === 'tap' ? activeClass : inactiveClass;

            vContent.classList.toggle('hidden', tab !== 'voice');
            pContent.classList.toggle('hidden', tab !== 'praise');
            tContent.classList.toggle('hidden', tab !== 'tap');
        }

        // Form handlers for adding/editing action items
        function savePraiseItemFromForm() {
            const label = document.getElementById('actionLabelInput').value.trim();
            const icon = document.getElementById('actionIconInput').value.trim() || "🌸";
            const repliesRaw = document.getElementById('actionRepliesInput').value.trim();

            if (!label || !repliesRaw) {
                alert("ボタン名と返しのセリフの両方を入力してね！");
                return;
            }

            const replies = repliesRaw.split('\n').map(r => r.trim()).filter(r => r.length > 0);

            if (editingActionId) {
                const item = praiseData.find(i => i.id === editingActionId);
                if (item) {
                    item.label = label;
                    item.icon = icon;
                    item.replies = replies;
                }
            } else {
                praiseData.push({
                    id: Date.now().toString(),
                    label: label,
                    icon: icon,
                    enabled: true,
                    replies: replies
                });
            }

            resetActionForm();
            renderPraiseItemsList();
            saveSettings();
        }

        function editActionItem(index) {
            const item = praiseData[index];
            if (!item) return;

            editingActionId = item.id;
            document.getElementById('formTitle').innerText = "✎ 報告ボタンを編集中";
            document.getElementById('actionLabelInput').value = item.label;
            document.getElementById('actionIconInput').value = item.icon || "🌸";
            document.getElementById('actionRepliesInput').value = item.replies.join('\n');
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('saveActionButton').innerText = "変更を保存する";
        }

        function resetActionForm() {
            editingActionId = null;
            document.getElementById('formTitle').innerText = "＋ 新しい報告ボタンを追加";
            document.getElementById('actionLabelInput').value = "";
            document.getElementById('actionIconInput').value = "";
            document.getElementById('actionRepliesInput').value = "";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('saveActionButton').innerText = "追加・保存する";
        }

        function toggleActionEnabled(index) {
            praiseData[index].enabled = praiseData[index].enabled === false ? true : false;
            renderPraiseItemsList();
            saveSettings();
            renderQuickButtons();
        }

        function moveActionOrder(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= praiseData.length) return;
            const temp = praiseData[index];
            praiseData[index] = praiseData[targetIndex];
            praiseData[targetIndex] = temp;
            renderPraiseItemsList();
            saveSettings();
            renderQuickButtons();
        }

        function removePraiseItem(index) {
            if (confirm("このボタンを削除しますか？")) {
                praiseData.splice(index, 1);
                renderPraiseItemsList();
                saveSettings();
                renderQuickButtons();
            }
        }

        // Tap Responses Handlers
        function addTapResponseItem() {
            const input = document.getElementById('newTapResponseInput');
            const val = input.value.trim();
            if (!val) return;
            tapResponses.push(val);
            input.value = "";
            renderTapResponsesList();
            saveSettings();
        }

        function removeTapResponse(index) {
            tapResponses.splice(index, 1);
            renderTapResponsesList();
            saveSettings();
        }

        // Voice Sliders & Mute Toggle
        document.getElementById('pitchInput').addEventListener('input', (e) => {
            document.getElementById('pitchVal').innerText = e.target.value;
            voiceSettings.pitch = e.target.value;
        });
        document.getElementById('rateInput').addEventListener('input', (e) => {
            document.getElementById('rateVal').innerText = e.target.value;
            voiceSettings.rate = e.target.value;
        });
        document.getElementById('volumeInput').addEventListener('input', (e) => {
            document.getElementById('volumeVal').innerText = e.target.value;
            voiceSettings.volume = e.target.value;
        });
        document.getElementById('voiceSelect').addEventListener('change', (e) => {
            voiceSettings.voiceURI = e.target.value;
        });

        function testSpeech() {
            speakText("えら〜い！この声でいっぱい褒めてあげるねぇ〜！");
        }

        document.getElementById('toggleVoice').addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('toggleVoice');
            if (voiceEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> 音声 ON';
                btn.className = "bg-pink-200 hover:bg-pink-300 text-pink-800 px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1";
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> 音声 OFF';
                btn.className = "bg-slate-200 hover:bg-slate-300 text-slate-600 px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1";
            }
        });

        function resetDataToDefault() {
            if (confirm("初期設定に戻しますか？追加・変更したボタンや音声設定がリセットされます。")) {
                praiseData = JSON.parse(JSON.stringify(defaultPraiseData));
                tapResponses = [...defaultTapResponses];
                voiceSettings = { pitch: 1.6, rate: 1.1, volume: 1.0, voiceURI: "" };
                saveSettings();
                loadSettings();
                renderPraiseItemsList();
                renderTapResponsesList();
                closeSettingsModal();
            }
        }

        function saveAndCloseSettings() {
            saveSettings();
            renderQuickButtons();
            closeSettingsModal();
        }

        // Speech Recognition setup
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                const micBtn = document.getElementById('micButton');
                document.getElementById('micButtonText').innerText = "聞いてるよ〜！お話ししてね...";
                micBtn.className = "w-full bg-rose-500 text-white font-bold py-2 px-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-xs sm:text-sm animate-pulse";
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechResult;
                submitCustomInput();
            };

            recognition.onerror = recognition.onend = () => {
                isRecording = false;
                const micBtn = document.getElementById('micButton');
                document.getElementById('micButtonText').innerText = "音声でえらい報告をする（マイク）";
                micBtn.className = "w-full bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-2 px-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-xs sm:text-sm";
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("お使いのブラウザは音声認識に対応していません。テキスト入力を使ってね！");
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                try { recognition.start(); } catch(e) { recognition.stop(); }
            }
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitCustomInput();
        });

        // Initialize on load
        window.onload = function() {
            loadSettings();
        };
    </script>
</body>
</html>
