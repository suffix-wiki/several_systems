<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物体サイズ計測ツール (v8.0)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
            width: 100%;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .tab-bar {
            display: flex;
            width: 100%;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            white-space: nowrap;
            min-height: 44px;
            font-size: 0.95rem;
        }
        @media (min-width: 768px) {
            .tab-bar {
                width: 19rem;
            }
            .tab-btn {
                min-height: 36px;
                font-size: 0.8125rem;
            }
        }
        canvas {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col bg-[#0f172a] text-slate-100 select-none">

    <!-- Header & 3-Tab Navigation (Strict Order: 1. 計測, 2. 履歴, 3. 設定) -->
    <header class="app-header px-2.5 sm:px-4 py-1.5 sm:py-2 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 w-full">
            <!-- App Title (Hidden on mobile <768px so 3 tabs span 100% width) -->
            <div class="hidden md:flex items-center gap-2 shrink-0">
                <span class="text-lg">📐</span>
                <h1 class="text-sm font-extrabold tracking-tight text-white">物体サイズ計測</h1>
            </div>

            <!-- 3-Tab Navigation -->
            <nav class="tab-bar gap-1.5 bg-[#0f172a] p-1 rounded-xl border border-slate-700" role="tablist">
                <button type="button" id="tabBtnMeasure" role="tab" aria-selected="true"
                    class="tab-btn nav-tab flex items-center justify-center gap-1.5 px-2 rounded-lg font-extrabold bg-[#38bdf8] text-slate-950 shadow-sm transition-all">
                    <span>📷</span>
                    <span>計測</span>
                </button>
                <button type="button" id="tabBtnHistory" role="tab" aria-selected="false"
                    class="tab-btn nav-tab flex items-center justify-center gap-1.5 px-2 rounded-lg font-extrabold text-slate-300 hover:text-white transition-all relative">
                    <span>🖼️</span>
                    <span>履歴</span>
                    <span id="historyBadgeDot" class="hidden w-2 h-2 rounded-full bg-[#22c55e] absolute top-2 right-2.5"></span>
                </button>
                <button type="button" id="tabBtnSettings" role="tab" aria-selected="false"
                    class="tab-btn nav-tab flex items-center justify-center gap-1.5 px-2 rounded-lg font-extrabold text-slate-300 hover:text-white transition-all">
                    <span>⚙️</span>
                    <span>設定</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden flex flex-col w-full min-h-0">

        <!-- =====================================================================
             TAB 1: 計測 (MEASURE)
        ====================================================================== -->
        <section id="viewMeasure" class="flex-1 flex flex-col md:flex-row relative overflow-hidden w-full min-h-0">

            <!-- Camera & Overlay Viewport -->
            <div id="viewportContainer" class="relative flex-1 bg-black overflow-hidden flex items-center justify-center min-h-0">
                <video id="camera-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
                <canvas id="overlay-canvas" class="absolute inset-0 w-full h-full z-10"></canvas>

                <!-- Camera Fallback / Permission Modal -->
                <div id="cameraFallbackModal" class="hidden absolute inset-0 z-30 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
                        <div class="text-3xl">📷</div>
                        <h2 class="text-base font-extrabold text-white">カメラアクセスが必要です</h2>
                        <p id="cameraFallbackReason" class="text-xs text-slate-300 leading-relaxed">
                            カメラへのアクセスが許可されていないか、HTTPS/ローカル環境ではないため起動していません。
                        </p>
                        <div class="space-y-2 pt-1">
                            <button type="button" id="enableCameraBtn"
                                class="w-full py-3 px-4 rounded-xl bg-[#38bdf8] hover:bg-sky-300 text-slate-950 font-extrabold text-sm shadow-lg transition active:scale-95">
                                カメラを有効にする
                            </button>
                            <button type="button" id="dismissFallbackBtn"
                                class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition">
                                グリッド背景で操作を試す
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Compact Control Panel (260px right sidebar on PC, compact bottom bar on mobile) -->
            <div class="bg-[#1e293b] border-t md:border-t-0 md:border-l border-slate-700/80 p-2.5 sm:p-3 shrink-0 md:w-[260px] flex flex-col justify-between gap-2 z-20">

                <div class="space-y-2">
                    <!-- Compact Dimension Readout Cards (No unit labels or mode badges inside Measure tab) -->
                    <div class="grid grid-cols-3 md:grid-cols-1 gap-1.5">
                        <!-- Width (W) -->
                        <div class="bg-[#0f172a]/95 border border-[#22c55e]/40 rounded-xl px-2.5 py-1.5 md:py-2 flex flex-col md:flex-row md:items-center md:justify-between text-center md:text-left">
                            <span class="text-[10px] sm:text-xs text-slate-400 font-semibold">横 (W)</span>
                            <div id="readoutW" class="text-base sm:text-lg md:text-xl font-extrabold text-[#22c55e] tabular-nums leading-tight">
                                0.0
                            </div>
                        </div>

                        <!-- Height (H) -->
                        <div class="bg-[#0f172a]/95 border border-[#22c55e]/40 rounded-xl px-2.5 py-1.5 md:py-2 flex flex-col md:flex-row md:items-center md:justify-between text-center md:text-left">
                            <span class="text-[10px] sm:text-xs text-slate-400 font-semibold">縦 (H)</span>
                            <div id="readoutH" class="text-base sm:text-lg md:text-xl font-extrabold text-[#22c55e] tabular-nums leading-tight">
                                0.0
                            </div>
                        </div>

                        <!-- Depth (D) -->
                        <div class="bg-[#0f172a]/95 border border-[#38bdf8]/40 rounded-xl px-2.5 py-1.5 md:py-2 flex flex-col md:flex-row md:items-center md:justify-between text-center md:text-left">
                            <span class="text-[10px] sm:text-xs text-slate-400 font-semibold">高さ/奥行 (D)</span>
                            <div id="readoutD" class="text-base sm:text-lg md:text-xl font-extrabold text-[#38bdf8] tabular-nums leading-tight">
                                0.0
                            </div>
                        </div>
                    </div>

                    <!-- Independent Frame Lock Toggle Buttons -->
                    <div class="grid grid-cols-2 md:grid-cols-1 gap-1.5">
                        <button type="button" id="toggleRefLockBtn"
                            class="py-2 px-2.5 rounded-xl bg-[#0f172a] hover:bg-slate-800 border border-[#facc15]/50 text-[#facc15] text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                            <span id="refLockIcon">🔓</span>
                            <span id="refLockText">基準枠ロック: 解除中</span>
                        </button>
                        <button type="button" id="toggleObjLockBtn"
                            class="py-2 px-2.5 rounded-xl bg-[#0f172a] hover:bg-slate-800 border border-[#22c55e]/50 text-[#22c55e] text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                            <span id="objLockIcon">🔓</span>
                            <span id="objLockText">計測枠ロック: 解除中</span>
                        </button>
                    </div>

                    <!-- Compact 2-Step Measurement Toggle Bar (Shown ONLY when 2-step mode is selected in Settings) -->
                    <div id="measureTwoStepBar" class="hidden bg-[#0f172a] border border-slate-700 rounded-xl p-1.5">
                        <div class="grid grid-cols-2 md:grid-cols-1 gap-1">
                            <button type="button" id="quickStep1Btn"
                                class="py-1.5 px-2 rounded-lg text-[11px] font-bold bg-[#22c55e] text-slate-950 transition">
                                ステップ1: 正面W・H計測ロック
                            </button>
                            <button type="button" id="quickStep2Btn"
                                class="py-1.5 px-2 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                                ステップ2: 側面D計測
                            </button>
                        </div>
                    </div>

                    <!-- Guidance Toast -->
                    <p id="toastMessage" class="text-[10px] text-slate-400 text-center md:text-left truncate">
                        ドラッグ・2本指ピンチ/回転・上部ハンドルで調整
                    </p>
                </div>

                <!-- Two Primary Action Buttons -->
                <div class="grid grid-cols-2 md:grid-cols-1 gap-2">
                    <button type="button" id="autoFitBtn"
                        class="py-2.5 px-2.5 rounded-xl bg-[#22c55e] hover:bg-green-400 text-slate-950 font-extrabold text-xs shadow-md flex items-center justify-center gap-1 transition active:scale-95">
                        <span>✨</span>
                        <span class="truncate">枠を認識した物体に合わせる</span>
                    </button>

                    <button type="button" id="saveCaptureBtn"
                        class="py-2.5 px-2.5 rounded-xl bg-[#38bdf8] hover:bg-sky-300 text-slate-950 font-extrabold text-xs shadow-md flex items-center justify-center gap-1 transition active:scale-95">
                        <span>📸</span>
                        <span>記録保存</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- =====================================================================
             TAB 2: 履歴 (HISTORY)
        ====================================================================== -->
        <section id="viewHistory" class="hidden flex-1 overflow-y-auto p-3 sm:p-5">
            <div class="max-w-2xl mx-auto space-y-3 pb-8">
                <div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                            <span>🖼️</span>
                            <span>計測履歴</span>
                            <span id="historyCountTag" class="text-xs font-bold px-2 py-0.5 rounded-full bg-[#0f172a] text-slate-300">0件</span>
                        </h2>
                        <button type="button" id="clearAllHistoryBtn"
                            class="hidden px-2.5 py-1 rounded-lg bg-rose-950/70 hover:bg-rose-900 border border-rose-500/40 text-xs text-rose-300 font-bold transition">
                            すべて削除
                        </button>
                    </div>

                    <div id="historyContainer" class="space-y-2.5">
                        <div id="historyEmptyState" class="text-center py-8 px-3 border border-dashed border-slate-700 rounded-xl text-xs text-slate-400">
                            「計測」タブの<strong>「📸 記録保存」</strong>を押すと、カメラ映像と枠・寸法を合成したPNG画像がここに記録されます。
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- =====================================================================
             TAB 3: 設定 (SETTINGS) - Pure Settings Only
        ====================================================================== -->
        <section id="viewSettings" class="hidden flex-1 overflow-y-auto p-3 sm:p-5">
            <div class="max-w-2xl mx-auto space-y-4 pb-8">

                <!-- Setting 1: 基準物の選択 -->
                <div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 space-y-3">
                    <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-[#facc15]/20 text-[#facc15] flex items-center justify-center text-xs font-extrabold">1</span>
                        <span>基準物の選択</span>
                    </h2>

                    <div class="bg-[#0f172a]/80 border border-[#facc15]/30 rounded-xl px-3 py-2 text-xs text-[#facc15] flex items-center gap-2">
                        <span>💡</span>
                        <span>基準物は測りたい面と同じ距離に並べてください</span>
                    </div>

                    <div>
                        <label for="refObjectSelect" class="block text-xs font-semibold text-slate-300 mb-1.5">
                            比較する基準物:
                        </label>
                        <select id="refObjectSelect" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-[#38bdf8]">
                            <optgroup label="カード・定期券">
                                <option value="credit" data-w="85.6" data-h="53.9" data-shape="rect">クレジットカード (85.6 × 53.9 mm)</option>
                                <option value="ic" data-w="85.5" data-h="54.0" data-shape="rect">交通系ICカード Suica/PASMO (85.5 × 54.0 mm)</option>
                            </optgroup>
                            <optgroup label="日本円紙幣">
                                <option value="yen10000" data-w="160.0" data-h="76.0" data-shape="rect">一万円札 (160.0 × 76.0 mm)</option>
                                <option value="yen5000" data-w="156.0" data-h="76.0" data-shape="rect">五千円札 (156.0 × 76.0 mm)</option>
                                <option value="yen1000" data-w="150.0" data-h="76.0" data-shape="rect">千円札 (150.0 × 76.0 mm)</option>
                            </optgroup>
                            <optgroup label="日本円硬貨">
                                <option value="coin500" data-w="26.5" data-h="26.5" data-shape="circle">500円硬貨 (直径 26.5 mm)</option>
                                <option value="coin100" data-w="22.6" data-h="22.6" data-shape="circle">100円硬貨 (直径 22.6 mm)</option>
                                <option value="coin10" data-w="23.5" data-h="23.5" data-shape="circle">10円硬貨 (直径 23.5 mm)</option>
                                <option value="coin1" data-w="20.0" data-h="20.0" data-shape="circle">1円硬貨 (直径 20.0 mm)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <!-- Setting 2: 奥行計測スタイル -->
                <div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 space-y-3">
                    <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-[#22c55e]/20 text-[#22c55e] flex items-center justify-center text-xs font-extrabold">2</span>
                        <span>奥行計測スタイル</span>
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <button type="button" id="styleOneShotBtn"
                            class="p-3 rounded-xl border-2 border-[#22c55e] bg-[#22c55e]/10 text-left transition">
                            <div class="text-xs sm:text-sm font-bold text-white mb-0.5">🧊 ワンショット3D計測（センサー自動角度補正）</div>
                            <div class="text-[11px] text-slate-300">端末の傾きから遠近圧縮率を自動補正して3辺を同時計測</div>
                        </button>
                        <button type="button" id="styleTwoStepBtn"
                            class="p-3 rounded-xl border border-slate-700 bg-[#0f172a]/70 hover:border-slate-600 text-left transition">
                            <div class="text-xs sm:text-sm font-bold text-white mb-0.5">📐 高精度2ステップ計測（正面W・Hロック → 側面D計測）</div>
                            <div class="text-[11px] text-slate-400">正面でW・Hをロック後、側面から奥行Dを2D平面で正確に計測</div>
                        </button>
                    </div>

                    <div id="sensorStatusRow" class="bg-[#0f172a] border border-slate-700/80 rounded-xl p-2.5 flex items-center justify-between gap-2 text-xs">
                        <span class="text-slate-400">傾きセンサー見下ろし角: <strong id="sensorTiltLabel" class="text-[#38bdf8]">35° (標準値)</strong></span>
                        <button type="button" id="requestSensorBtn"
                            class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[11px] font-bold text-[#38bdf8] shrink-0 transition">
                            🧭 センサー連動
                        </button>
                    </div>
                </div>

                <!-- Setting 3: 表示単位 -->
                <div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 space-y-3">
                    <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-[#38bdf8]/20 text-[#38bdf8] flex items-center justify-center text-xs font-extrabold">3</span>
                        <span>表示単位</span>
                    </h2>

                    <div class="grid grid-cols-3 gap-2 bg-[#0f172a] p-1.5 rounded-xl border border-slate-700/80">
                        <button type="button" class="unit-btn py-2 text-xs sm:text-sm font-bold rounded-lg bg-[#38bdf8] text-slate-950 transition" data-unit="mm">mm (ミリメートル)</button>
                        <button type="button" class="unit-btn py-2 text-xs sm:text-sm font-bold rounded-lg text-slate-400 hover:text-slate-200 transition" data-unit="cm">cm (センチメートル)</button>
                        <button type="button" class="unit-btn py-2 text-xs sm:text-sm font-bold rounded-lg text-slate-400 hover:text-slate-200 transition" data-unit="inch">inch (インチ)</button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Offscreen Canvases for Auto Object Detection & PNG Snapshot Compositing -->
    <canvas id="detectCanvas" class="hidden"></canvas>
    <canvas id="snapshotCanvas" class="hidden"></canvas>

    <script>
        (() => {
            // --- DOM Elements ---
            const tabBtnMeasure = document.getElementById('tabBtnMeasure');
            const tabBtnHistory = document.getElementById('tabBtnHistory');
            const tabBtnSettings = document.getElementById('tabBtnSettings');
            const historyBadgeDot = document.getElementById('historyBadgeDot');

            const viewMeasure = document.getElementById('viewMeasure');
            const viewHistory = document.getElementById('viewHistory');
            const viewSettings = document.getElementById('viewSettings');

            const readoutW = document.getElementById('readoutW');
            const readoutH = document.getElementById('readoutH');
            const readoutD = document.getElementById('readoutD');

            const toggleRefLockBtn = document.getElementById('toggleRefLockBtn');
            const refLockIcon = document.getElementById('refLockIcon');
            const refLockText = document.getElementById('refLockText');

            const toggleObjLockBtn = document.getElementById('toggleObjLockBtn');
            const objLockIcon = document.getElementById('objLockIcon');
            const objLockText = document.getElementById('objLockText');

            const measureTwoStepBar = document.getElementById('measureTwoStepBar');
            const quickStep1Btn = document.getElementById('quickStep1Btn');
            const quickStep2Btn = document.getElementById('quickStep2Btn');

            const cameraVideo = document.getElementById('camera-video');
            const canvas = document.getElementById('overlay-canvas');
            const ctx = canvas.getContext('2d');
            const detectCanvas = document.getElementById('detectCanvas');
            const detectCtx = detectCanvas.getContext('2d', { willReadFrequently: true });
            const snapshotCanvas = document.getElementById('snapshotCanvas');
            const snapshotCtx = snapshotCanvas.getContext('2d');

            const cameraFallbackModal = document.getElementById('cameraFallbackModal');
            const cameraFallbackReason = document.getElementById('cameraFallbackReason');
            const enableCameraBtn = document.getElementById('enableCameraBtn');
            const dismissFallbackBtn = document.getElementById('dismissFallbackBtn');
            const toastMessage = document.getElementById('toastMessage');

            const autoFitBtn = document.getElementById('autoFitBtn');
            const saveCaptureBtn = document.getElementById('saveCaptureBtn');

            // History Tab Elements
            const historyCountTag = document.getElementById('historyCountTag');
            const clearAllHistoryBtn = document.getElementById('clearAllHistoryBtn');
            const historyContainer = document.getElementById('historyContainer');
            const historyEmptyState = document.getElementById('historyEmptyState');

            // Settings Tab Elements
            const refObjectSelect = document.getElementById('refObjectSelect');
            const styleOneShotBtn = document.getElementById('styleOneShotBtn');
            const styleTwoStepBtn = document.getElementById('styleTwoStepBtn');
            const sensorStatusRow = document.getElementById('sensorStatusRow');
            const sensorTiltLabel = document.getElementById('sensorTiltLabel');
            const requestSensorBtn = document.getElementById('requestSensorBtn');
            const unitBtns = document.querySelectorAll('.unit-btn');

            // --- Application State ---
            let activeTab = 'measure'; // 'measure' | 'history' | 'settings'
            let cameraActive = false;
            let mediaStream = null;
            let autoDetectedOnce = false;

            let unit = 'mm'; // 'mm' | 'cm' | 'inch'
            let measureStyle = 'oneshot'; // 'oneshot' | 'twostep'
            let twoStepStage = 1; // 1 = Front W & H, 2 = Side D
            let lockedFront = { w: 120, h: 90 };

            let baseMmPerPx = 0.58;
            let detectedTiltDeg = 35; // Default 35 deg downward tilt
            let sensorLive = false;

            // Center-based rotatable Reference Frame (Yellow)
            let refBox = {
                cx: 110,
                cy: 160,
                w: 145,
                h: 91.3,
                angle: 0, // radians (-PI to +PI)
                realW: 85.6,
                realH: 53.9,
                shape: 'rect',
                label: 'クレジットカード',
                locked: false
            };

            // Center-based rotatable 3D Measurement Frame (Green + Cyan)
            let objBox = {
                cx: 320,
                cy: 180,
                w: 180,
                h: 150,
                angle: 0, // radians (-PI to +PI)
                depthLocalX: 44,
                depthLocalY: -44,
                locked: false
            };

            // Track most recently interacted frame for 2-finger pinch/rotate gestures
            let lastActiveFrame = 'obj'; // 'obj' | 'ref'

            // Multi-touch & Pointer Tracking
            const activePointers = new Map();
            let singleDrag = null;
            let pinchState = null;

            // Saved Measurements History
            let savedRecords = [];

            // --- Geometry & Rotated Coordinate Helpers ---
            function normalizeAngle(rad) {
                while (rad > Math.PI) rad -= Math.PI * 2;
                while (rad < -Math.PI) rad += Math.PI * 2;
                return rad;
            }

            // Convert canvas world coordinates (px, py) to frame's local coordinates (origin at cx, cy)
            function worldToLocal(px, py, cx, cy, angle) {
                const dx = px - cx;
                const dy = py - cy;
                const cos = Math.cos(-angle);
                const sin = Math.sin(-angle);
                return {
                    x: dx * cos - dy * sin,
                    y: dx * sin + dy * cos
                };
            }

            // Convert frame's local coordinates (lx, ly) to canvas world coordinates
            function localToWorld(lx, ly, cx, cy, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return {
                    x: cx + (lx * cos - ly * sin),
                    y: cy + (lx * sin + ly * cos)
                };
            }

            // --- Initialization ---
            function init() {
                syncCanvasSize();
                initializeBoxPositions();
                bindEvents();
                initDeviceOrientationSensor();
                updateUnitDisplay();
                updateStyleUI();
                updateLockUI();
                startCamera(true);
                requestAnimationFrame(renderLoop);
            }

            function syncCanvasSize() {
                if (activeTab !== 'measure') return;
                const rect = canvas.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    const w = Math.round(rect.width);
                    const h = Math.round(rect.height);
                    if (canvas.width !== w || canvas.height !== h) {
                        canvas.width = w;
                        canvas.height = h;
                    }
                }
            }

            function initializeBoxPositions() {
                const cw = canvas.width || 640;
                const ch = canvas.height || 480;

                if (!refBox.locked) {
                    const ratio = refBox.realH / refBox.realW;
                    refBox.w = Math.min(cw * 0.28, 150);
                    refBox.h = refBox.w * ratio;
                    refBox.cx = Math.max(refBox.w / 2 + 20, cw * 0.22);
                    refBox.cy = ch * 0.54;
                    refBox.angle = 0;
                    recalculateReferenceScale();
                }

                if (!objBox.locked) {
                    objBox.w = Math.min(cw * 0.36, 210);
                    objBox.h = Math.min(ch * 0.34, 180);
                    objBox.cx = Math.max(refBox.cx + refBox.w / 2 + objBox.w / 2 + 24, cw * 0.62);
                    if (objBox.cx + objBox.w / 2 > cw - 20) {
                        objBox.cx = cw * 0.55;
                    }
                    objBox.cy = ch * 0.54;
                    objBox.angle = 0;
                    objBox.depthLocalX = 44;
                    objBox.depthLocalY = -44;
                }
            }

            // --- Tab Switching (1: 計測 / 2: 履歴 / 3: 設定) ---
            function switchTab(tabName) {
                activeTab = tabName;
                viewMeasure.classList.toggle('hidden', tabName !== 'measure');
                viewHistory.classList.toggle('hidden', tabName !== 'history');
                viewSettings.classList.toggle('hidden', tabName !== 'settings');

                const tabs = [
                    { btn: tabBtnMeasure, name: 'measure' },
                    { btn: tabBtnHistory, name: 'history' },
                    { btn: tabBtnSettings, name: 'settings' }
                ];

                tabs.forEach(t => {
                    const isActive = t.name === tabName;
                    t.btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    if (isActive) {
                        t.btn.className = 'tab-btn nav-tab flex items-center justify-center gap-1.5 px-2 rounded-lg font-extrabold bg-[#38bdf8] text-slate-950 shadow-sm transition-all relative';
                    } else {
                        t.btn.className = 'tab-btn nav-tab flex items-center justify-center gap-1.5 px-2 rounded-lg font-extrabold text-slate-300 hover:text-white transition-all relative';
                    }
                });

                if (tabName === 'measure') {
                    requestAnimationFrame(syncCanvasSize);
                } else if (tabName === 'history') {
                    historyBadgeDot.classList.add('hidden');
                }
            }

            // --- DeviceOrientation Sensor (Beta Tilt Angle) ---
            function handleOrientationEvent(event) {
                if (event && typeof event.beta === 'number') {
                    const rawDownwardTilt = 90 - Math.abs(event.beta);
                    detectedTiltDeg = Math.round(Math.max(12, Math.min(80, rawDownwardTilt)));
                    sensorLive = true;
                    sensorTiltLabel.textContent = `${detectedTiltDeg}° (センサー連動中)`;
                }
            }

            function initDeviceOrientationSensor() {
                if (typeof window !== 'undefined' && 'DeviceOrientationEvent' in window) {
                    if (typeof DeviceOrientationEvent.requestPermission !== 'function') {
                        window.addEventListener('deviceorientation', handleOrientationEvent, true);
                    }
                }
            }

            async function requestOrientationPermission() {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const res = await DeviceOrientationEvent.requestPermission();
                        if (res === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientationEvent, true);
                            requestSensorBtn.textContent = '✅ 連動中';
                        } else {
                            requestSensorBtn.textContent = '⚠️ 拒否されました';
                        }
                    } catch (e) {
                        requestSensorBtn.textContent = '⚠️ 取得不可';
                    }
                } else {
                    window.addEventListener('deviceorientation', handleOrientationEvent, true);
                    requestSensorBtn.textContent = sensorLive ? '✅ 連動中' : 'ℹ️ 標準値(35°)適用中';
                }
            }

            // --- Camera Access & Fallback ---
            async function startCamera(isInitial = false) {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    handleCameraError('お使いのブラウザはカメラアクセスに対応していないか、HTTPS / localhost 以外の環境で実行されています。', isInitial);
                    return;
                }

                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                    cameraVideo.srcObject = mediaStream;
                    await cameraVideo.play();

                    cameraActive = true;
                    autoDetectedOnce = false;
                    cameraFallbackModal.classList.add('hidden');
                    setToast('ドラッグ・2本指ピンチ/回転・上部ハンドルで調整');
                } catch (err) {
                    let reason = 'カメラのアクセス権限が拒否されたか、利用可能なカメラが見つかりません。「カメラを有効にする」をタップしてください。';
                    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                        reason = 'セキュリティ制限（非HTTPS環境）のためカメラがブロックされています。「カメラを有効にする」を押すか、グリッド背景でお試しください。';
                    }
                    handleCameraError(reason, isInitial);
                }
            }

            function handleCameraError(reason, isInitial) {
                cameraActive = false;
                cameraFallbackReason.textContent = reason;
                cameraFallbackModal.classList.remove('hidden');
                if (isInitial) {
                    setToast('「カメラを有効にする」を押してカメラを起動してください');
                }
            }

            // --- Auto Object Detection (Respects objBox.locked) ---
            function autoDetectObject() {
                if (objBox.locked) {
                    setToast('計測枠がロック中のため自動変更をスキップしました');
                    return;
                }

                const cw = canvas.width;
                const ch = canvas.height;
                if (cw <= 0 || ch <= 0) return;

                const pw = 160;
                const ph = Math.max(90, Math.round(pw * (ch / cw)));
                detectCanvas.width = pw;
                detectCanvas.height = ph;

                drawBackgroundLayer(detectCtx, pw, ph);
                const pixels = detectCtx.getImageData(0, 0, pw, ph).data;

                const luma = new Float32Array(pw * ph);
                for (let i = 0; i < pw * ph; i++) {
                    const idx = i * 4;
                    luma[i] = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
                }

                let weightSum = 0;
                let weightedX = 0;
                let weightedY = 0;
                const salGrid = new Float32Array(pw * ph);

                const padX = Math.floor(pw * 0.10);
                const padY = Math.floor(ph * 0.10);

                for (let y = padY; y < ph - padY; y++) {
                    for (let x = padX; x < pw - padX; x++) {
                        const i = y * pw + x;
                        const dx = Math.abs(luma[i + 1] - luma[i - 1]);
                        const dy = Math.abs(luma[i + pw] - luma[i - pw]);
                        const grad = dx + dy;

                        const nx = (x / pw) - 0.5;
                        const ny = (y / ph) - 0.5;
                        const centerBias = Math.exp(-(nx * nx + ny * ny) * 3.0);
                        const sal = grad * centerBias;
                        salGrid[i] = sal;

                        if (sal > 16) {
                            weightSum += sal;
                            weightedX += x * sal;
                            weightedY += y * sal;
                        }
                    }
                }

                if (weightSum > 85) {
                    const cx = weightedX / weightSum;
                    const cy = weightedY / weightSum;

                    let varX = 0;
                    let varY = 0;
                    for (let y = padY; y < ph - padY; y++) {
                        for (let x = padX; x < pw - padX; x++) {
                            const s = salGrid[y * pw + x];
                            if (s > 16) {
                                varX += s * (x - cx) * (x - cx);
                                varY += s * (y - cy) * (y - cy);
                            }
                        }
                    }

                    const stdX = Math.sqrt(varX / weightSum);
                    const stdY = Math.sqrt(varY / weightSum);

                    const scaleX = cw / pw;
                    const scaleY = ch / ph;

                    const detectedW = Math.min(cw * 0.78, Math.max(54, stdX * 3.6 * scaleX));
                    const detectedH = Math.min(ch * 0.74, Math.max(54, stdY * 3.6 * scaleY));

                    objBox.cx = Math.max(detectedW / 2 + 16, Math.min(cw - detectedW / 2 - 16, cx * scaleX));
                    objBox.cy = Math.max(detectedH / 2 + 44, Math.min(ch - detectedH / 2 - 20, cy * scaleY));
                    objBox.w = detectedW;
                    objBox.h = detectedH;
                    objBox.angle = 0;

                    const dLen = Math.min(detectedW, detectedH) * 0.28;
                    objBox.depthLocalX = dLen * 0.707;
                    objBox.depthLocalY = -dLen * 0.707;

                    lastActiveFrame = 'obj';
                    setToast('認識した物体に枠を合わせました');
                } else {
                    initializeBoxPositions();
                    setToast('中央に標準枠を配置しました');
                }
            }

            // --- Scale & 3D Dimensions Calculation ---
            function recalculateReferenceScale() {
                if (refBox.w > 5) {
                    baseMmPerPx = refBox.realW / refBox.w;
                }
            }

            function getCurrentDimensionsMm() {
                const mmPerPx = baseMmPerPx;

                if (measureStyle === 'twostep') {
                    if (twoStepStage === 1) {
                        const wMm = objBox.w * mmPerPx;
                        const hMm = objBox.h * mmPerPx;
                        lockedFront = { w: wMm, h: hMm };
                        return { w: wMm, h: hMm, d: 0 };
                    } else {
                        return {
                            w: lockedFront.w,
                            h: lockedFront.h,
                            d: objBox.w * mmPerPx
                        };
                    }
                } else {
                    const wMm = objBox.w * mmPerPx;
                    const hMm = objBox.h * mmPerPx;
                    const projectedDepthPx = Math.hypot(objBox.depthLocalX, objBox.depthLocalY);
                    const sinFactor = Math.sin((Math.max(15, detectedTiltDeg) * Math.PI) / 180);
                    const dMm = (projectedDepthPx * mmPerPx) / sinFactor;
                    return { w: wMm, h: hMm, d: dMm };
                }
            }

            // --- Canvas Rendering (Rotated Local Space) ---
            function drawBackgroundLayer(targetCtx, w, h) {
                if (cameraActive && cameraVideo.readyState >= cameraVideo.HAVE_CURRENT_DATA) {
                    const vw = cameraVideo.videoWidth || w;
                    const vh = cameraVideo.videoHeight || h;
                    const scale = Math.max(w / vw, h / vh);
                    const dw = vw * scale;
                    const dh = vh * scale;
                    targetCtx.drawImage(cameraVideo, (w - dw) / 2, (h - dh) / 2, dw, dh);
                } else {
                    targetCtx.fillStyle = '#0f172a';
                    targetCtx.fillRect(0, 0, w, h);
                    targetCtx.strokeStyle = '#1e293b';
                    targetCtx.lineWidth = 1;
                    const grid = 28;
                    for (let x = 0; x < w; x += grid) {
                        targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke();
                    }
                    for (let y = 0; y < h; y += grid) {
                        targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke();
                    }
                }
            }

            function renderCompositeFrame(targetCtx, w, h) {
                targetCtx.clearRect(0, 0, w, h);
                drawBackgroundLayer(targetCtx, w, h);

                drawReferenceOverlay(targetCtx);
                drawObjectOverlay(targetCtx);
            }

            function drawReferenceOverlay(targetCtx) {
                const { cx, cy, w, h, angle, shape, label, realW, realH, locked } = refBox;
                const hw = w / 2;
                const hh = h / 2;
                const rotStemLen = 26;

                targetCtx.save();
                targetCtx.translate(cx, cy);
                targetCtx.rotate(angle);

                targetCtx.strokeStyle = '#facc15';
                targetCtx.fillStyle = locked ? 'rgba(250, 204, 21, 0.08)' : 'rgba(250, 204, 21, 0.16)';
                targetCtx.lineWidth = locked ? 2 : 2.5;
                if (!locked) {
                    targetCtx.setLineDash([6, 4]);
                }

                if (shape === 'circle') {
                    targetCtx.beginPath();
                    targetCtx.arc(0, 0, hw, 0, Math.PI * 2);
                    targetCtx.fill();
                    targetCtx.stroke();
                    targetCtx.setLineDash([]);

                    if (!locked) {
                        // Top rotation stem & handle
                        drawRotationStem(targetCtx, 0, -hw, rotStemLen, '#facc15');
                        // Corner/radius resize handle
                        drawHandle(targetCtx, hw, 0, '#facc15', 8);
                    }
                } else {
                    targetCtx.beginPath();
                    targetCtx.roundRect(-hw, -hh, w, h, 6);
                    targetCtx.fill();
                    targetCtx.stroke();
                    targetCtx.setLineDash([]);

                    if (!locked) {
                        // Top rotation stem & handle
                        drawRotationStem(targetCtx, 0, -hh, rotStemLen, '#facc15');
                        // 4 corner resize handles
                        drawHandle(targetCtx, -hw, -hh, '#facc15', 7);
                        drawHandle(targetCtx, hw, -hh, '#facc15', 7);
                        drawHandle(targetCtx, hw, hh, '#facc15', 8);
                        drawHandle(targetCtx, -hw, hh, '#facc15', 7);
                    }
                }

                // Label Badge above frame (below rotation handle)
                const sizeText = shape === 'circle' ? `${realW}mm` : `${realW}×${realH}mm`;
                const lockPrefix = locked ? '🔒 ' : '';
                drawLocalBadge(targetCtx, `${lockPrefix}${label} (${sizeText})`, 0, hh + 15, '#facc15');

                targetCtx.restore();
            }

            function drawObjectOverlay(targetCtx) {
                const { cx, cy, w, h, angle, depthLocalX, depthLocalY, locked } = objBox;
                const dims = getCurrentDimensionsMm();
                const hw = w / 2;
                const hh = h / 2;
                const rotStemLen = 28;

                targetCtx.save();
                targetCtx.translate(cx, cy);
                targetCtx.rotate(angle);

                if (measureStyle === 'twostep') {
                    const accent = twoStepStage === 1 ? '#22c55e' : '#38bdf8';
                    const fillTint = twoStepStage === 1 ? 'rgba(34, 197, 94, 0.14)' : 'rgba(56, 189, 248, 0.15)';

                    targetCtx.fillStyle = fillTint;
                    targetCtx.fillRect(-hw, -hh, w, h);

                    targetCtx.strokeStyle = accent;
                    targetCtx.lineWidth = locked ? 2.2 : 3;
                    targetCtx.strokeRect(-hw, -hh, w, h);

                    if (!locked) {
                        drawRotationStem(targetCtx, 0, -hh, rotStemLen, accent);
                        drawHandle(targetCtx, -hw, -hh, accent, 8);
                        drawHandle(targetCtx, hw, -hh, accent, 8);
                        drawHandle(targetCtx, hw, hh, accent, 8);
                        drawHandle(targetCtx, -hw, hh, accent, 8);
                    }

                    const lockPrefix = locked ? '🔒 ' : '';
                    if (twoStepStage === 1) {
                        drawLocalBadge(targetCtx, `${lockPrefix}W: ${formatDim(dims.w)}`, 0, hh + 15, '#22c55e');
                        drawLocalBadge(targetCtx, `H: ${formatDim(dims.h)}`, -hw - 15, 0, '#22c55e', true);
                    } else {
                        drawLocalBadge(targetCtx, `${lockPrefix}D: ${formatDim(dims.d)}`, 0, hh + 15, '#38bdf8');
                        drawLocalBadge(targetCtx, `W:${formatDim(dims.w)} / H:${formatDim(dims.h)} ロック`, 0, hh + 38, '#94a3b8');
                    }
                } else {
                    const fTL = { x: -hw, y: -hh };
                    const fTR = { x: hw, y: -hh };
                    const fBR = { x: hw, y: hh };
                    const fBL = { x: -hw, y: hh };

                    const bTL = { x: -hw + depthLocalX, y: -hh + depthLocalY };
                    const bTR = { x: hw + depthLocalX, y: -hh + depthLocalY };
                    const bBR = { x: hw + depthLocalX, y: hh + depthLocalY };
                    const bBL = { x: -hw + depthLocalX, y: hh + depthLocalY };

                    // Translucent 3D volume hull
                    targetCtx.fillStyle = 'rgba(34, 197, 94, 0.10)';
                    targetCtx.beginPath();
                    targetCtx.moveTo(fTL.x, fTL.y);
                    targetCtx.lineTo(fTR.x, fTR.y);
                    targetCtx.lineTo(bTR.x, bTR.y);
                    targetCtx.lineTo(bBR.x, bBR.y);
                    targetCtx.lineTo(fBR.x, fBR.y);
                    targetCtx.lineTo(fBL.x, fBL.y);
                    targetCtx.closePath();
                    targetCtx.fill();

                    // Back face & side depth dashed edges
                    targetCtx.strokeStyle = '#38bdf8';
                    targetCtx.lineWidth = 1.8;
                    targetCtx.setLineDash([5, 4]);

                    targetCtx.beginPath();
                    targetCtx.moveTo(bTL.x, bTL.y);
                    targetCtx.lineTo(bTR.x, bTR.y);
                    targetCtx.lineTo(bBR.x, bBR.y);
                    targetCtx.lineTo(bBL.x, bBL.y);
                    targetCtx.closePath();
                    targetCtx.stroke();

                    targetCtx.beginPath();
                    targetCtx.moveTo(fTL.x, fTL.y); targetCtx.lineTo(bTL.x, bTL.y);
                    targetCtx.moveTo(fTR.x, fTR.y); targetCtx.lineTo(bTR.x, bTR.y);
                    targetCtx.moveTo(fBL.x, fBL.y); targetCtx.lineTo(bBL.x, bBL.y);
                    targetCtx.stroke();
                    targetCtx.setLineDash([]);

                    // Primary Depth axis line
                    targetCtx.strokeStyle = '#38bdf8';
                    targetCtx.lineWidth = 3;
                    targetCtx.beginPath();
                    targetCtx.moveTo(fBR.x, fBR.y);
                    targetCtx.lineTo(bBR.x, bBR.y);
                    targetCtx.stroke();

                    // Front face rectangle
                    targetCtx.strokeStyle = '#22c55e';
                    targetCtx.lineWidth = locked ? 2.2 : 2.8;
                    targetCtx.strokeRect(-hw, -hh, w, h);

                    if (!locked) {
                        // Top rotation stem & handle
                        drawRotationStem(targetCtx, 0, -hh, rotStemLen, '#22c55e');

                        // 4 corner resize handles
                        drawHandle(targetCtx, fTL.x, fTL.y, '#22c55e', 7.5);
                        drawHandle(targetCtx, fTR.x, fTR.y, '#22c55e', 7.5);
                        drawHandle(targetCtx, fBR.x, fBR.y, '#22c55e', 7.5);
                        drawHandle(targetCtx, fBL.x, fBL.y, '#22c55e', 7.5);

                        // Cyan Depth handle
                        drawHandle(targetCtx, bBR.x, bBR.y, '#38bdf8', 9);
                    }

                    const lockPrefix = locked ? '🔒 ' : '';
                    drawLocalBadge(targetCtx, `${lockPrefix}W: ${formatDim(dims.w)}`, 0, hh + 15, '#22c55e');
                    drawLocalBadge(targetCtx, `H: ${formatDim(dims.h)}`, -hw - 15, 0, '#22c55e', true);
                    drawLocalBadge(targetCtx, `D: ${formatDim(dims.d)}`, (fBR.x + bBR.x) / 2 + 16, (fBR.y + bBR.y) / 2, '#38bdf8');
                }

                targetCtx.restore();
            }

            function drawRotationStem(targetCtx, topX, topY, stemLen, color) {
                targetCtx.save();
                targetCtx.strokeStyle = color;
                targetCtx.lineWidth = 2;
                targetCtx.beginPath();
                targetCtx.moveTo(topX, topY);
                targetCtx.lineTo(topX, topY - stemLen);
                targetCtx.stroke();

                // Outer ring + inner dot for rotation handle
                targetCtx.fillStyle = '#0f172a';
                targetCtx.strokeStyle = color;
                targetCtx.lineWidth = 2.5;
                targetCtx.beginPath();
                targetCtx.arc(topX, topY - stemLen, 8.5, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.fillStyle = color;
                targetCtx.beginPath();
                targetCtx.arc(topX, topY - stemLen, 3, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.restore();
            }

            function drawHandle(targetCtx, hx, hy, color, radius) {
                targetCtx.fillStyle = color;
                targetCtx.strokeStyle = '#ffffff';
                targetCtx.lineWidth = 2;
                targetCtx.beginPath();
                targetCtx.arc(hx, hy, radius, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.stroke();
            }

            function drawLocalBadge(targetCtx, text, bx, by, borderColor, vertical = false) {
                targetCtx.save();
                targetCtx.font = 'bold 11px Inter, "Noto Sans JP", sans-serif';
                const textW = targetCtx.measureText(text).width;
                const boxW = textW + 12;
                const boxH = 20;

                targetCtx.translate(bx, by);
                if (vertical) targetCtx.rotate(-Math.PI / 2);

                targetCtx.fillStyle = 'rgba(15, 23, 42, 0.92)';
                targetCtx.strokeStyle = borderColor;
                targetCtx.lineWidth = 1.4;
                targetCtx.beginPath();
                targetCtx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 6);
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.fillStyle = '#f8fafc';
                targetCtx.textAlign = 'center';
                targetCtx.textBaseline = 'middle';
                targetCtx.fillText(text, 0, 0.5);
                targetCtx.restore();
            }

            function renderLoop() {
                if (activeTab === 'measure') {
                    syncCanvasSize();
                    if (cameraActive && !autoDetectedOnce && cameraVideo.readyState >= cameraVideo.HAVE_CURRENT_DATA && canvas.width > 0) {
                        autoDetectedOnce = true;
                        autoDetectObject();
                    }
                    renderCompositeFrame(ctx, canvas.width, canvas.height);
                }
                updateReadoutBar();
                requestAnimationFrame(renderLoop);
            }

            // --- Formatting ---
            function toCurrentUnit(mm) {
                if (unit === 'cm') return mm / 10;
                if (unit === 'inch') return mm / 25.4;
                return mm;
            }

            function formatDim(mm) {
                const decimals = unit === 'mm' ? 1 : 2;
                return `${toCurrentUnit(mm).toFixed(decimals)}${unit}`;
            }

            function updateReadoutBar() {
                const dims = getCurrentDimensionsMm();
                const decimals = unit === 'mm' ? 1 : 2;

                readoutW.textContent = toCurrentUnit(dims.w).toFixed(decimals);
                readoutH.textContent = toCurrentUnit(dims.h).toFixed(decimals);
                readoutD.textContent = (measureStyle === 'twostep' && twoStepStage === 1)
                    ? '-'
                    : toCurrentUnit(dims.d).toFixed(decimals);
            }

            // --- Multi-Touch (Pinch-to-Zoom & Twist Rotation) & Rotated Hit-Testing ---
            function getPointerCoords(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            function hitTestFrame(pt, frame, isObj) {
                if (frame.locked) return null;
                const local = worldToLocal(pt.x, pt.y, frame.cx, frame.cy, frame.angle);
                const hw = frame.w / 2;
                const hh = frame.h / 2;
                const hitRadius = 26;
                const stemLen = isObj ? 28 : 26;

                // 1. Check top rotation handle
                const rotHandleY = (frame.shape === 'circle' ? -hw : -hh) - stemLen;
                if (Math.hypot(local.x - 0, local.y - rotHandleY) <= hitRadius) {
                    return 'rotate';
                }

                // 2. Check cyan depth handle (Object frame in One-Shot 3D mode)
                if (isObj && measureStyle === 'oneshot') {
                    const dx = hw + frame.depthLocalX;
                    const dy = hh + frame.depthLocalY;
                    if (Math.hypot(local.x - dx, local.y - dy) <= hitRadius) {
                        return 'depth';
                    }
                }

                // 3. Check corners / radius
                if (!isObj && frame.shape === 'circle') {
                    if (Math.hypot(local.x - hw, local.y - 0) <= hitRadius) {
                        return 'resize-circle';
                    }
                    if (Math.hypot(local.x, local.y) <= hw) {
                        return 'move';
                    }
                    return null;
                }

                if (Math.hypot(local.x - (-hw), local.y - (-hh)) <= hitRadius) return 'resize-tl';
                if (Math.hypot(local.x - hw, local.y - (-hh)) <= hitRadius) return 'resize-tr';
                if (Math.hypot(local.x - hw, local.y - hh) <= hitRadius) return 'resize-br';
                if (Math.hypot(local.x - (-hw), local.y - hh) <= hitRadius) return 'resize-bl';

                // 4. Inside rotated bounding box -> move
                if (Math.abs(local.x) <= hw && Math.abs(local.y) <= hh) {
                    return 'move';
                }

                return null;
            }

            function pickTargetFrameForPinch(midPt) {
                // Prioritize whichever frame the midpoint is inside (if unlocked)
                if (!objBox.locked) {
                    const lObj = worldToLocal(midPt.x, midPt.y, objBox.cx, objBox.cy, objBox.angle);
                    if (Math.abs(lObj.x) <= objBox.w / 2 + 24 && Math.abs(lObj.y) <= objBox.h / 2 + 24) {
                        return 'obj';
                    }
                }
                if (!refBox.locked) {
                    const lRef = worldToLocal(midPt.x, midPt.y, refBox.cx, refBox.cy, refBox.angle);
                    if (Math.abs(lRef.x) <= refBox.w / 2 + 24 && Math.abs(lRef.y) <= refBox.h / 2 + 24) {
                        return 'ref';
                    }
                }
                // Fallback to lastActiveFrame if unlocked, otherwise whichever frame is unlocked
                if (lastActiveFrame === 'obj' && !objBox.locked) return 'obj';
                if (lastActiveFrame === 'ref' && !refBox.locked) return 'ref';
                if (!objBox.locked) return 'obj';
                if (!refBox.locked) return 'ref';
                return null;
            }

            canvas.addEventListener('pointerdown', (e) => {
                canvas.setPointerCapture(e.pointerId);
                const pt = getPointerCoords(e);
                activePointers.set(e.pointerId, pt);

                if (activePointers.size === 2) {
                    // Transition into 2-finger pinch + twist gesture
                    singleDrag = null;
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
                    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

                    const targetKey = pickTargetFrameForPinch(mid);
                    if (targetKey) {
                        lastActiveFrame = targetKey;
                        const frame = targetKey === 'obj' ? objBox : refBox;
                        pinchState = {
                            target: targetKey,
                            startDist: Math.max(10, dist),
                            startAngle: angle,
                            startMid: mid,
                            initCx: frame.cx,
                            initCy: frame.cy,
                            initW: frame.w,
                            initH: frame.h,
                            initFrameAngle: frame.angle,
                            initDepthX: frame.depthLocalX || 0,
                            initDepthY: frame.depthLocalY || 0
                        };
                    } else {
                        pinchState = null;
                    }
                    return;
                }

                if (activePointers.size === 1) {
                    pinchState = null;

                    // Hit-test objBox first, then refBox (or prioritize lastActiveFrame)
                    const order = lastActiveFrame === 'ref'
                        ? [{ key: 'ref', frame: refBox, isObj: false }, { key: 'obj', frame: objBox, isObj: true }]
                        : [{ key: 'obj', frame: objBox, isObj: true }, { key: 'ref', frame: refBox, isObj: false }];

                    for (const item of order) {
                        const action = hitTestFrame(pt, item.frame, item.isObj);
                        if (action) {
                            lastActiveFrame = item.key;
                            singleDrag = {
                                target: item.key,
                                action: action,
                                startPt: pt,
                                initCx: item.frame.cx,
                                initCy: item.frame.cy,
                                initW: item.frame.w,
                                initH: item.frame.h,
                                initAngle: item.frame.angle
                            };
                            return;
                        }
                    }
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!activePointers.has(e.pointerId)) return;
                const pt = getPointerCoords(e);
                activePointers.set(e.pointerId, pt);

                // 1. Two-finger Pinch-in / Pinch-out & Twist Rotation
                if (activePointers.size === 2 && pinchState) {
                    const frame = pinchState.target === 'obj' ? objBox : refBox;
                    if (frame.locked) return;

                    const pts = Array.from(activePointers.values());
                    const currDist = Math.max(10, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y));
                    const currAngle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
                    const currMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

                    const scaleFactor = currDist / pinchState.startDist;
                    const deltaAngle = currAngle - pinchState.startAngle;

                    const newW = Math.max(24, Math.min(canvas.width * 0.92, pinchState.initW * scaleFactor));
                    frame.w = newW;

                    if (pinchState.target === 'ref') {
                        frame.h = newW * (frame.realH / frame.realW);
                        recalculateReferenceScale();
                    } else {
                        frame.h = Math.max(24, Math.min(canvas.height * 0.90, pinchState.initH * scaleFactor));
                        frame.depthLocalX = pinchState.initDepthX * scaleFactor;
                        frame.depthLocalY = pinchState.initDepthY * scaleFactor;
                    }

                    frame.angle = normalizeAngle(pinchState.initFrameAngle + deltaAngle);
                    frame.cx = pinchState.initCx + (currMid.x - pinchState.startMid.x);
                    frame.cy = pinchState.initCy + (currMid.y - pinchState.startMid.y);
                    return;
                }

                // 2. Single-finger / Mouse Drag on Active Frame
                if (activePointers.size === 1 && singleDrag) {
                    const frame = singleDrag.target === 'obj' ? objBox : refBox;
                    if (frame.locked) return;

                    const action = singleDrag.action;

                    if (action === 'move') {
                        frame.cx = singleDrag.initCx + (pt.x - singleDrag.startPt.x);
                        frame.cy = singleDrag.initCy + (pt.y - singleDrag.startPt.y);
                    } else if (action === 'rotate') {
                        // Top stem points towards local -Y (angle - PI/2 in world space)
                        const pointerAngle = Math.atan2(pt.y - frame.cy, pt.x - frame.cx);
                        frame.angle = normalizeAngle(pointerAngle + Math.PI / 2);
                    } else if (action === 'depth' && singleDrag.target === 'obj') {
                        const local = worldToLocal(pt.x, pt.y, frame.cx, frame.cy, frame.angle);
                        frame.depthLocalX = local.x - (frame.w / 2);
                        frame.depthLocalY = local.y - (frame.h / 2);
                    } else if (action === 'resize-circle' && singleDrag.target === 'ref') {
                        const local = worldToLocal(pt.x, pt.y, frame.cx, frame.cy, frame.angle);
                        const newR = Math.max(12, Math.hypot(local.x, local.y));
                        frame.w = newR * 2;
                        frame.h = newR * 2;
                        recalculateReferenceScale();
                    } else if (action.startsWith('resize-')) {
                        // Symmetrical center-anchored local resizing in rotated coordinate space
                        const local = worldToLocal(pt.x, pt.y, frame.cx, frame.cy, frame.angle);
                        const newW = Math.max(24, Math.abs(local.x) * 2);

                        if (singleDrag.target === 'ref') {
                            frame.w = newW;
                            frame.h = newW * (frame.realH / frame.realW);
                            recalculateReferenceScale();
                        } else {
                            const newH = Math.max(24, Math.abs(local.y) * 2);
                            frame.w = newW;
                            frame.h = newH;
                        }
                    }
                }
            });

            function handlePointerEnd(e) {
                activePointers.delete(e.pointerId);
                if (activePointers.size < 2) {
                    pinchState = null;
                }
                if (activePointers.size === 0) {
                    singleDrag = null;
                }
            }

            canvas.addEventListener('pointerup', handlePointerEnd);
            canvas.addEventListener('pointercancel', handlePointerEnd);

            // --- Independent Frame Locking ---
            function updateLockUI() {
                if (refBox.locked) {
                    refLockIcon.textContent = '🔒';
                    refLockText.textContent = '基準枠ロック: ON';
                    toggleRefLockBtn.className = 'py-2 px-2.5 rounded-xl bg-[#facc15]/20 border-2 border-[#facc15] text-[#facc15] text-[11px] sm:text-xs font-extrabold flex items-center justify-center gap-1.5 transition active:scale-95';
                } else {
                    refLockIcon.textContent = '🔓';
                    refLockText.textContent = '基準枠ロック: 解除中';
                    toggleRefLockBtn.className = 'py-2 px-2.5 rounded-xl bg-[#0f172a] hover:bg-slate-800 border border-[#facc15]/50 text-[#facc15] text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95';
                }

                if (objBox.locked) {
                    objLockIcon.textContent = '🔒';
                    objLockText.textContent = '計測枠ロック: ON';
                    toggleObjLockBtn.className = 'py-2 px-2.5 rounded-xl bg-[#22c55e]/20 border-2 border-[#22c55e] text-[#22c55e] text-[11px] sm:text-xs font-extrabold flex items-center justify-center gap-1.5 transition active:scale-95';
                } else {
                    objLockIcon.textContent = '🔓';
                    objLockText.textContent = '計測枠ロック: 解除中';
                    toggleObjLockBtn.className = 'py-2 px-2.5 rounded-xl bg-[#0f172a] hover:bg-slate-800 border border-[#22c55e]/50 text-[#22c55e] text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95';
                }
            }

            // --- Snapshot Capture, Direct PNG Download & Individual Delete ---
            function captureAndSaveRecord() {
                const w = canvas.width || 640;
                const h = canvas.height || 480;
                snapshotCanvas.width = w;
                snapshotCanvas.height = h;

                renderCompositeFrame(snapshotCtx, w, h);

                const dims = getCurrentDimensionsMm();
                const dLabel = (measureStyle === 'twostep' && twoStepStage === 1) ? '未計測' : formatDim(dims.d);
                const summary = `W: ${formatDim(dims.w)} × H: ${formatDim(dims.h)} × D: ${dLabel}`;

                snapshotCtx.fillStyle = 'rgba(15, 23, 42, 0.92)';
                snapshotCtx.fillRect(0, h - 36, w, 36);
                snapshotCtx.fillStyle = '#38bdf8';
                snapshotCtx.font = 'bold 13px Inter, "Noto Sans JP", sans-serif';
                snapshotCtx.textAlign = 'center';
                snapshotCtx.textBaseline = 'middle';
                snapshotCtx.fillText(summary, w / 2, h - 18);

                const dataUrl = snapshotCanvas.toDataURL('image/png');
                const timestamp = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                savedRecords.unshift({
                    id: String(Date.now()) + '_' + Math.floor(Math.random() * 1000),
                    imageUrl: dataUrl,
                    wMm: dims.w,
                    hMm: dims.h,
                    dMm: dims.d,
                    isTwoStepPendingD: (measureStyle === 'twostep' && twoStepStage === 1),
                    time: timestamp
                });

                renderHistoryRecords();
                if (activeTab !== 'history') {
                    historyBadgeDot.classList.remove('hidden');
                }
                setToast('記録保存しました（「履歴」タブからPNG保存できます）');
            }

            function triggerPngDownload(dataUrl, filename) {
                try {
                    const parts = dataUrl.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const binary = atob(parts[1]);
                    const array = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        array[i] = binary.charCodeAt(i);
                    }
                    const blob = new Blob([array], { type: mime });
                    const blobUrl = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
                } catch (err) {
                    const link = document.createElement('a');
                    link.href = dataUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }

            function deleteHistoryItem(id) {
                savedRecords = savedRecords.filter(rec => rec.id !== id);
                renderHistoryRecords();
            }

            function renderHistoryRecords() {
                historyCountTag.textContent = `${savedRecords.length}件`;
                clearAllHistoryBtn.classList.toggle('hidden', savedRecords.length === 0);

                historyContainer.querySelectorAll('.record-card').forEach(el => el.remove());

                if (savedRecords.length === 0) {
                    historyEmptyState.classList.remove('hidden');
                    return;
                }
                historyEmptyState.classList.add('hidden');

                savedRecords.forEach((rec, index) => {
                    const dStr = rec.isTwoStepPendingD ? '未計測' : formatDim(rec.dMm);
                    const formattedSummary = `W: ${formatDim(rec.wMm)} × H: ${formatDim(rec.hMm)} × D: ${dStr}`;

                    const card = document.createElement('div');
                    card.className = 'record-card bg-[#0f172a] border border-slate-700/80 rounded-xl p-2.5 flex items-center gap-3';

                    const thumb = document.createElement('img');
                    thumb.src = rec.imageUrl;
                    thumb.alt = '計測スナップショット';
                    thumb.className = 'w-16 h-14 object-cover rounded-lg border border-slate-700 bg-black shrink-0';

                    const info = document.createElement('div');
                    info.className = 'flex-1 min-w-0';
                    info.innerHTML = `
                        <div class="text-[11px] text-slate-400 mb-0.5">🕒 ${rec.time}</div>
                        <div class="text-xs sm:text-sm font-extrabold text-white truncate">${formattedSummary}</div>
                    `;

                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'flex items-center gap-1.5 shrink-0';

                    const downloadBtn = document.createElement('button');
                    downloadBtn.type = 'button';
                    downloadBtn.className = 'px-2.5 py-2 rounded-xl bg-[#38bdf8] hover:bg-sky-300 text-slate-950 text-xs font-extrabold shadow transition active:scale-95';
                    downloadBtn.textContent = 'PNG保存';
                    downloadBtn.addEventListener('click', () => {
                        triggerPngDownload(rec.imageUrl, `measure_${savedRecords.length - index}_${rec.time.replace(/:/g, '')}.png`);
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.className = 'px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-rose-900/80 border border-slate-700 hover:border-rose-500/50 text-slate-300 hover:text-rose-200 text-xs font-bold transition active:scale-95';
                    deleteBtn.textContent = '削除';
                    deleteBtn.addEventListener('click', () => {
                        deleteHistoryItem(rec.id);
                    });

                    btnGroup.appendChild(downloadBtn);
                    btnGroup.appendChild(deleteBtn);

                    card.appendChild(thumb);
                    card.appendChild(info);
                    card.appendChild(btnGroup);
                    historyContainer.appendChild(card);
                });
            }

            // --- UI State Updaters ---
            function updateUnitDisplay() {
                unitBtns.forEach(btn => {
                    const isSelected = btn.dataset.unit === unit;
                    if (isSelected) {
                        btn.classList.add('bg-[#38bdf8]', 'text-slate-950');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('bg-[#38bdf8]', 'text-slate-950');
                        btn.classList.add('text-slate-400');
                    }
                });
                renderHistoryRecords();
            }

            function updateStyleUI() {
                const isTwoStep = measureStyle === 'twostep';
                measureTwoStepBar.classList.toggle('hidden', !isTwoStep);
                sensorStatusRow.classList.toggle('hidden', isTwoStep);

                if (isTwoStep) {
                    styleTwoStepBtn.className = 'p-3 rounded-xl border-2 border-[#22c55e] bg-[#22c55e]/10 text-left transition';
                    styleOneShotBtn.className = 'p-3 rounded-xl border border-slate-700 bg-[#0f172a]/70 hover:border-slate-600 text-left transition';

                    if (twoStepStage === 1) {
                        quickStep1Btn.className = 'py-1.5 px-2 rounded-lg text-[11px] font-bold bg-[#22c55e] text-slate-950 transition';
                        quickStep2Btn.className = 'py-1.5 px-2 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
                    } else {
                        quickStep1Btn.className = 'py-1.5 px-2 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
                        quickStep2Btn.className = 'py-1.5 px-2 rounded-lg text-[11px] font-bold bg-[#38bdf8] text-slate-950 transition';
                    }
                } else {
                    styleOneShotBtn.className = 'p-3 rounded-xl border-2 border-[#22c55e] bg-[#22c55e]/10 text-left transition';
                    styleTwoStepBtn.className = 'p-3 rounded-xl border border-slate-700 bg-[#0f172a]/70 hover:border-slate-600 text-left transition';
                }
            }

            // --- Event Bindings ---
            function bindEvents() {
                // 3-Tab Navigation: 1. 計測, 2. 履歴, 3. 設定
                tabBtnMeasure.addEventListener('click', () => switchTab('measure'));
                tabBtnHistory.addEventListener('click', () => switchTab('history'));
                tabBtnSettings.addEventListener('click', () => switchTab('settings'));

                // Independent Frame Lock Toggles
                toggleRefLockBtn.addEventListener('click', () => {
                    refBox.locked = !refBox.locked;
                    updateLockUI();
                    setToast(refBox.locked ? '基準枠をロックしました' : '基準枠のロックを解除しました');
                });

                toggleObjLockBtn.addEventListener('click', () => {
                    objBox.locked = !objBox.locked;
                    updateLockUI();
                    setToast(objBox.locked ? '計測枠をロックしました' : '計測枠のロックを解除しました');
                });

                // Measure Tab Primary Actions & 2-Step Toggles
                autoFitBtn.addEventListener('click', autoDetectObject);
                saveCaptureBtn.addEventListener('click', captureAndSaveRecord);

                quickStep1Btn.addEventListener('click', () => {
                    twoStepStage = 1;
                    updateStyleUI();
                    setToast('正面から幅(W)と高さ(H)を合わせてください');
                });

                quickStep2Btn.addEventListener('click', () => {
                    const dims = getCurrentDimensionsMm();
                    if (twoStepStage === 1) {
                        lockedFront = { w: dims.w, h: dims.h };
                    }
                    twoStepStage = 2;
                    updateStyleUI();
                    setToast('W・Hをロックしました。側面から奥行(D)を合わせてください');
                });

                enableCameraBtn.addEventListener('click', () => startCamera(false));
                dismissFallbackBtn.addEventListener('click', () => {
                    cameraFallbackModal.classList.add('hidden');
                    setToast('グリッド背景で枠の調整・回転・ピンチを試せます');
                });

                // Settings Tab: Reference Object Selection
                refObjectSelect.addEventListener('change', (e) => {
                    const opt = e.target.options[e.target.selectedIndex];
                    refBox.realW = Number(opt.dataset.w);
                    refBox.realH = Number(opt.dataset.h);
                    refBox.shape = opt.dataset.shape || 'rect';
                    refBox.label = opt.textContent.split('(')[0].trim();
                    refBox.h = refBox.w * (refBox.realH / refBox.realW);
                    recalculateReferenceScale();
                });

                // Settings Tab: Depth Measurement Style
                styleOneShotBtn.addEventListener('click', () => {
                    measureStyle = 'oneshot';
                    updateStyleUI();
                });

                styleTwoStepBtn.addEventListener('click', () => {
                    measureStyle = 'twostep';
                    twoStepStage = 1;
                    updateStyleUI();
                });

                requestSensorBtn.addEventListener('click', requestOrientationPermission);

                // Settings Tab: Display Unit
                unitBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        unit = btn.dataset.unit;
                        updateUnitDisplay();
                    });
                });

                // History Tab: Clear All
                clearAllHistoryBtn.addEventListener('click', () => {
                    savedRecords = [];
                    renderHistoryRecords();
                });

                window.addEventListener('resize', syncCanvasSize);
            }

            function setToast(msg) {
                toastMessage.textContent = msg;
            }

            // Boot Application
            init();
        })();
    </script>
</body>
